<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Revenue Cycle | Sulandra Health</title><link rel="icon" href="/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#edf3f7;color:#173b52}.top{display:flex;align-items:center;gap:14px;padding:11px 18px;background:#fff;border-bottom:1px solid #d5e1e8;position:sticky;top:0;z-index:40}.top img{width:220px;max-width:42vw}.top .spacer{flex:1}.top a{color:#075985;text-decoration:none;font-weight:900}.shell{width:min(1280px,calc(100% - 22px));margin:16px auto 50px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}.hero h1{margin:0;color:#0b4265;font-size:29px}.hero p{margin:5px 0;color:#667b88}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:900;cursor:pointer;text-decoration:none}.btn.primary{background:#0b6ea8;color:#fff}.btn.success{border-color:#45845a;background:#eff9f2;color:#306a43}.btn.warn{border-color:#ad792c;color:#7d5717}.btn.danger{border-color:#b5524a;color:#94362f}.notice{padding:10px 12px;border-radius:9px;background:#eef8fc;border:1px solid #c8e1ed;color:#42667a;margin-bottom:10px;font-size:12px;line-height:1.45}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border:1px solid #d5e1e8;border-radius:10px;padding:10px}.stat span{display:block;font-size:9px;text-transform:uppercase;font-weight:900;color:#7e8e98}.stat strong{font-size:21px;color:#23526c}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:11px}.tab{border:1px solid #cbd9e1;background:#fff;color:#557084;border-radius:9px;padding:8px 11px;font-size:11px;font-weight:900;cursor:pointer}.tab.active{background:#0b6ea8;color:#fff;border-color:#0b6ea8}.panel{display:none}.panel.active{display:block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}.toolbar select,.toolbar input{border:1px solid #c8d6df;border-radius:8px;padding:8px;background:#fff}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid #d4e1e8;border-radius:13px;box-shadow:0 7px 20px rgba(18,56,80,.05);overflow:hidden}.item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid #e4eaee}.item-head h2{margin:0;color:#174a69;font-size:16px}.item-head p{margin:4px 0 0;color:#718491;font-size:11px}.item-body{padding:13px}.facts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.fact{border:1px solid #e0e8ed;background:#f9fbfc;border-radius:8px;padding:7px}.fact span{display:block;font-size:8px;text-transform:uppercase;font-weight:900;color:#84919a}.fact strong{font-size:11px;color:#2c536b}.status{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:950;background:#edf3f7;color:#536c7d}.status.REVIEW_REQUIRED,.status.HELD{background:#fff0d0;color:#835b0c}.status.READY{background:#e4f7ea;color:#29633d}.status.BATCHED,.status.FINALIZED{background:#e8f1ff;color:#2e5f9a}.status.EXPORTED{background:#e9f6f6;color:#27676b}.status.NON_BILLABLE,.status.VOID{background:#f0f1f2;color:#59656c}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.exceptions{margin-top:8px;padding:8px;border:1px solid #ead095;background:#fff7e4;color:#74510e;border-radius:8px;font-size:10px}.history{margin-top:9px;border-top:1px solid #e7ecef;padding-top:7px}.history div{font-size:10px;color:#607886;padding:3px 0}.empty{padding:34px;text-align:center;color:#718491}.check{width:18px;height:18px}.error{display:none;padding:10px 12px;background:#fff0ef;border:1px solid #efb4af;color:#8b302a;border-radius:9px;margin-bottom:10px}.error.show{display:block}dialog{width:min(760px,calc(100vw - 22px));border:0;border-radius:16px;padding:0;box-shadow:0 30px 90px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(8,28,42,.55)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #e2e8ec}.modal-head h2{margin:0;color:#0b4265}.modal-body{padding:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:4px}.field.wide{grid-column:1/-1}.field label{font-size:11px;font-weight:900;color:#506b7d}.field input,.field select,.field textarea{width:100%;border:1px solid #c8d6df;border-radius:8px;padding:9px}.field textarea{min-height:80px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}@media(max-width:900px){.facts{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.summary,.facts{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.top a{display:none}}@media(max-width:430px){.summary,.facts{grid-template-columns:1fr}.hero{flex-direction:column}}</style></head><body><header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><a href="/company-compliance.html">Compliance</a><a href="/notifications.html">Notifications</a><a href="/admin.html#dashboard">Admin</a></header><main class="shell"><div class="hero"><div><h1>Revenue Cycle</h1><p>Completed service → billing readiness review → controlled batch → export. No electronic payer submission occurs here.</p></div><button id="refresh" class="btn primary">Refresh</button></div><div id="context" class="notice">Loading Revenue Cycle context…</div><div id="summary" class="summary"></div><div class="tabs"><button class="tab active" data-tab="events">Service Events</button><button class="tab" data-tab="batches">Batches</button></div><section id="events" class="panel active"><div class="toolbar"><select id="statusFilter"><option value="">All statuses</option><option>REVIEW_REQUIRED</option><option>HELD</option><option>READY</option><option>BATCHED</option><option>EXPORTED</option><option>NON_BILLABLE</option><option>VOID</option></select><select id="moduleFilter"><option value="">All sources</option><option>SCLS</option><option>HOME_HEALTH</option><option>NMT</option><option>MANUAL</option></select><input id="search" placeholder="Search client, MRN, code, source"><button id="createBatch" class="btn primary">Batch Selected Ready</button></div><div id="error" class="error"></div><div id="eventList" class="list"><div class="empty">Loading service events…</div></div></section><section id="batches" class="panel"><div id="batchList" class="list"><div class="empty">Loading batches…</div></div></section></main><dialog id="editDialog"><form id="editForm"><div class="modal-head"><h2>Review Service Event</h2><button type="button" class="btn" data-close="editDialog">Close</button></div><div class="modal-body"><div id="editError" class="error"></div><div class="grid"><div class="field"><label>Service Code</label><input id="eCode"></div><div class="field"><label>Units</label><input id="eUnits" type="number" step="0.001" min="0"></div><div class="field"><label>Unit Type</label><input id="eUnitType"></div><div class="field"><label>Unit Rate</label><input id="eRate" type="number" step="0.0001" min="0"></div><div class="field"><label>Payer Type</label><select id="ePayerType"><option value=""></option><option>MEDICAID</option><option>MEDICARE</option><option>COMMERCIAL</option><option>CONTRACT</option><option>SELF_PAY</option><option>OTHER</option></select></div><div class="field"><label>Payer Name</label><input id="ePayer"></div><div class="field"><label>Authorization ID</label><input id="eAuthId"></div><div class="field"><label>Authorization Number</label><input id="eAuthNumber"></div><div class="field wide"><label>Service Description</label><textarea id="eDescription"></textarea></div></div><div class="modal-actions"><button class="btn primary" type="submit">Save Review</button></div></div></form></dialog><script src="/assets/sulandra-entity-context.js?v=20260810-revenue-1"></script><script>(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEYS=['sulandra:employee:access-token','sulandra_token','token','accessToken'];const token=()=>KEYS.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>v==null?'—':Number(v).toLocaleString(undefined,{style:'currency',currency:'USD'});const date=v=>v?new Date(String(v)).toLocaleDateString():'—';const fmt=v=>v?new Date(String(v)).toLocaleString():'—';const state={context:null,events:[],batches:[],edit:null};async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',headers:{Accept:'application/json',Authorization:`Bearer ${token()}`,...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(p.error||p.message||`Request failed (${r.status})`);e.details=p.details||p.data||p;throw e}return p.data??p}function patient(e){return [e.preferredName||e.firstName,e.lastName].filter(Boolean).join(' ')||e.patientId||'Unlinked patient'}function renderEvents(){const q=$('search').value.trim().toLowerCase(),rows=state.events.filter(e=>!q||JSON.stringify(e).toLowerCase().includes(q));$('eventList').innerHTML=rows.length?rows.map(e=>`<article class="item"><div class="item-head"><div><label><input class="check" data-select-event="${esc(e.id)}" type="checkbox" ${e.status==='READY'&&e.billable===true&&!e.trainingOnly?'':'disabled'}> <span class="status ${esc(e.status)}">${esc(String(e.status).replaceAll('_',' '))}</span></label><h2>${esc(patient(e))}</h2><p>${esc(e.sourceModule)} · ${esc(e.sourceType)} · ${esc(e.sourceId)}</p></div><span class="status">${esc(date(e.serviceDate))}</span></div><div class="item-body"><div class="facts"><div class="fact"><span>Service Code</span><strong>${esc(e.serviceCode||'REVIEW')}</strong></div><div class="fact"><span>Units</span><strong>${esc(e.units??'—')} ${esc(e.unitType||'')}</strong></div><div class="fact"><span>Payer</span><strong>${esc(e.payerName||e.payerType||'—')}</strong></div><div class="fact"><span>Authorization</span><strong>${esc(e.authorizationNumber||e.authorizationId||'—')}</strong></div><div class="fact"><span>Estimated</span><strong>${money(e.estimatedAmount)}</strong></div></div>${Array.isArray(e.exceptions)&&e.exceptions.length?`<div class="exceptions"><strong>Source/readiness flags:</strong> ${e.exceptions.map(esc).join(' · ')}</div>`:''}<div class="actions">${state.context.write&&!['BATCHED','EXPORTED','VOID'].includes(e.status)?`<button class="btn" data-edit="${esc(e.id)}">Review Fields</button>${e.status!=='READY'&&!e.trainingOnly?`<button class="btn success" data-action="READY" data-id="${esc(e.id)}">Mark Ready</button>`:''}<button class="btn warn" data-action="HOLD" data-id="${esc(e.id)}">Hold</button><button class="btn" data-action="RETURN_REVIEW" data-id="${esc(e.id)}">Return Review</button><button class="btn" data-action="NON_BILLABLE" data-id="${esc(e.id)}">Non-Billable</button><button class="btn danger" data-action="VOID" data-id="${esc(e.id)}">Void</button>`:''}${e.patientId?`<a class="btn" href="/spire.html?patientId=${encodeURIComponent(e.patientId)}">Chart</a>`:''}</div>${Array.isArray(e.history)&&e.history.length?`<div class="history">${e.history.slice(0,5).map(h=>`<div>${esc(h.eventType)} · ${esc(fmt(h.createdAt))} · ${esc(h.actorUserId)}${h.comment?` — ${esc(h.comment)}`:''}</div>`).join('')}</div>`:''}</div></article>`).join(''):'<div class="empty">No revenue-cycle service events match this view.</div>';wireEventButtons()}function renderBatches(){$('batchList').innerHTML=state.batches.length?state.batches.map(b=>`<article class="item"><div class="item-head"><div><span class="status ${esc(b.status)}">${esc(b.status)}</span><h2>${esc(b.batchNumber)}</h2><p>${esc(date(b.periodStart))} – ${esc(date(b.periodEnd))}${b.payerName?` · ${esc(b.payerName)}`:''}</p></div><span class="status">${Number(b.totalEvents||0)} events</span></div><div class="item-body"><div class="facts"><div class="fact"><span>Total Events</span><strong>${Number(b.totalEvents||0)}</strong></div><div class="fact"><span>Total Units</span><strong>${esc(b.totalUnits||0)}</strong></div><div class="fact"><span>Estimated</span><strong>${money(b.estimatedAmount)}</strong></div><div class="fact"><span>Created</span><strong>${esc(date(b.createdAt))}</strong></div><div class="fact"><span>Exported</span><strong>${esc(date(b.exportedAt))}</strong></div></div><div class="actions">${state.context.write&&b.status==='DRAFT'?`<button class="btn success" data-batch-action="FINALIZE" data-id="${esc(b.id)}">Finalize</button><button class="btn danger" data-batch-action="VOID" data-id="${esc(b.id)}">Void Batch</button>`:''}${state.context.write&&['FINALIZED','EXPORTED'].includes(b.status)?`<button class="btn primary" data-export="${esc(b.id)}">${b.status==='EXPORTED'?'Download Export Again':'Export CSV'}</button>`:''}</div></div></article>`).join(''):'<div class="empty">No revenue batches yet.</div>';wireBatchButtons()}async function load(){const qs=new URLSearchParams();if($('statusFilter').value)qs.set('status',$('statusFilter').value);if($('moduleFilter').value)qs.set('sourceModule',$('moduleFilter').value);const [events,batches,summary]=await Promise.all([api(`/api/revenue-cycle/events?${qs}`),api('/api/revenue-cycle/batches'),api('/api/revenue-cycle/summary')]);state.events=events;state.batches=batches;const rows=summary.byStatus||[];$('summary').innerHTML=`<div class="stat"><span>Needs Review</span><strong>${Number(summary.reviewRequired||0)}</strong></div><div class="stat"><span>Held</span><strong>${Number(summary.held||0)}</strong></div><div class="stat"><span>Ready</span><strong>${Number(summary.ready||0)}</strong></div><div class="stat"><span>Ready Estimated</span><strong>${money(summary.estimatedReadyAmount||0)}</strong></div>`;renderEvents();renderBatches()}function wireEventButtons(){document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openEdit(b.dataset.edit));document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>actEvent(b.dataset.id,b.dataset.action))}function openEdit(id){const e=state.events.find(x=>String(x.id)===String(id));if(!e)return;state.edit=e;$('eCode').value=e.serviceCode||'';$('eDescription').value=e.serviceDescription||'';$('eUnits').value=e.units??'';$('eUnitType').value=e.unitType||'';$('ePayerType').value=e.payerType||'';$('ePayer').value=e.payerName||'';$('eAuthId').value=e.authorizationId||'';$('eAuthNumber').value=e.authorizationNumber||'';$('eRate').value=e.unitRate??'';$('editError').classList.remove('show');$('editDialog').showModal()}async function actEvent(id,action){let comment=null;if(action==='HOLD'){comment=prompt('Hold reason:');if(!comment)return}else if(['NON_BILLABLE','VOID'].includes(action))comment=prompt(`${action.replaceAll('_',' ')} reason (optional):`)||null;try{await api(`/api/revenue-cycle/events/${encodeURIComponent(id)}/action`,{method:'POST',body:JSON.stringify({action,comment})});await load()}catch(e){alert(e.message+(e.details?.readinessErrors?.length?`\n\n${e.details.readinessErrors.join('\n')}`:''))}}function selectedEvents(){return [...document.querySelectorAll('[data-select-event]:checked')].map(x=>x.dataset.selectEvent)}async function createBatch(){const ids=selectedEvents();if(!ids.length)return alert('Select at least one READY service event.');const periodStart=prompt('Batch period start (YYYY-MM-DD, optional):')||null,periodEnd=prompt('Batch period end (YYYY-MM-DD, optional):')||null,notes=prompt('Batch note (optional):')||null;try{const b=await api('/api/revenue-cycle/batches',{method:'POST',body:JSON.stringify({serviceEventIds:ids,periodStart,periodEnd,notes})});alert(`Revenue batch ${b.batchNumber} created in DRAFT status.`);await load()}catch(e){alert(e.message)}}function wireBatchButtons(){document.querySelectorAll('[data-batch-action]').forEach(b=>b.onclick=()=>batchAction(b.dataset.id,b.dataset.batchAction));document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>exportBatch(b.dataset.export))}async function batchAction(id,action){const comment=prompt(`${action} note (optional):`)||null;if(!confirm(`${action} this revenue batch?`))return;try{await api(`/api/revenue-cycle/batches/${encodeURIComponent(id)}/action`,{method:'POST',body:JSON.stringify({action,comment})});await load()}catch(e){alert(e.message)}}async function exportBatch(id){try{const r=await fetch(`${API}/api/revenue-cycle/batches/${encodeURIComponent(id)}/export.csv`,{cache:'no-store',headers:{Authorization:`Bearer ${token()}`}});if(!r.ok){const p=await r.json().catch(()=>({}));throw new Error(p.error||p.message||'Export failed')}const blob=await r.blob(),href=URL.createObjectURL(blob),a=document.createElement('a');a.href=href;const cd=r.headers.get('content-disposition')||'',m=cd.match(/filename="([^"]+)"/i);a.download=m?.[1]||'revenue-batch.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(href),1000);await load()}catch(e){alert(e.message)}}function activate(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===tab))}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>activate(b.dataset.tab));document.addEventListener('click',e=>{const close=e.target.closest('[data-close]');if(close)$(close.dataset.close)?.close()});$('refresh').onclick=load;$('statusFilter').onchange=load;$('moduleFilter').onchange=load;$('search').oninput=renderEvents;$('createBatch').onclick=createBatch;$('editForm').onsubmit=async e=>{e.preventDefault();const error=$('editError');error.classList.remove('show');try{await api(`/api/revenue-cycle/events/${encodeURIComponent(state.edit.id)}`,{method:'PATCH',body:JSON.stringify({serviceCode:$('eCode').value||null,serviceDescription:$('eDescription').value||null,units:$('eUnits').value?Number($('eUnits').value):null,unitType:$('eUnitType').value||null,payerType:$('ePayerType').value||null,payerName:$('ePayer').value||null,authorizationId:$('eAuthId').value||null,authorizationNumber:$('eAuthNumber').value||null,unitRate:$('eRate').value?Number($('eRate').value):null})});$('editDialog').close();await load()}catch(err){error.textContent=err.message;error.classList.add('show')}};window.addEventListener('sulandra:entity-context-changed',()=>location.reload());(async()=>{if(!token()){location.href='/employee-login.html?returnTo=/revenue-cycle.html';return}await window.SulandraEntityContext?.ready;try{state.context=await api('/api/revenue-cycle/context');$('context').innerHTML=`<strong>${esc(state.context.company?.displayName||'Selected Company')}</strong> · ${esc(state.context.disclaimer)} · ${state.context.write?'Billing review enabled':'Read-only access'}`;await load()}catch(e){$('eventList').innerHTML=`<div class="empty">${esc(e.message)}</div>`}})()})();</script></body></html>
