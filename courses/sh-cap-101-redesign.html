<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SH-CAP-101 Instructional Redesign | Sulandra Health</title>
<style>
html,body{height:100%;margin:0;background:#020617;font-family:Inter,system-ui,sans-serif}iframe{display:block;width:100%;height:100%;border:0;background:#fff}.load-error{display:none;position:fixed;inset:0;place-items:center;padding:24px;background:#0f172a;color:#fff;text-align:center}.load-error.show{display:grid}.load-error div{max-width:620px}.load-error a{color:#5eead4}
</style>
</head>
<body>
<iframe id="course" src="/courses/sh-cap-101.html" title="SH-CAP-101 Client Rights and Advocacy Masterclass"></iframe>
<div id="error" class="load-error"><div><h1>Course could not be loaded</h1><p>Open the standard SH-CAP-101 course and verify that both course files were deployed together.</p><a href="/courses/sh-cap-101.html">Open standard course</a></div></div>
<script>
const frame=document.getElementById('course');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    if(!doc) throw new Error('Course document unavailable');
    const script=doc.createElement('script');
    script.src='/courses/sh-cap-101-instructional-visuals.js';
    script.defer=true;
    doc.body.appendChild(script);
    doc.body.classList.add('presentation-ready');
  }catch(error){document.getElementById('error').classList.add('show');console.error(error);}
});
frame.addEventListener('error',()=>document.getElementById('error').classList.add('show'));
</script>
</body>
</html>
