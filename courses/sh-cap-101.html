<header><div><a class="return-link" href="/education-portal.html">← Education Portal</a><h1>Sulandra Health Training Academy</h1></div><span class="course-badge">SH-CAP-101: Client Rights & Advocacy Masterclass</span></header>

<div class="lms-footer"><button class="btn-primary" id="prev-btn" type="button">Previous Slide</button><span id="nav-status">Module 1: Foundations</span><button class="btn-primary" id="next-btn" type="button">Next Slide →</button></div>

<script>
const slidesData=[
{title:'Title Slide & Course Introduction',module:'Module 1: Foundations',content:`<h2>Slide 1: Title Slide & Course Introduction</h2><div class="visual-card"><span class="visual-icon">🏛️</span><div class="visual-text"><h4>Visual Illustration: Sulandra Health Academy Crest</h4><p>A warm residential living-room backdrop symbolizes dignity, safety, belonging, and personal independence.</p></div></div><h3>Course Identification</h3><p><strong>Course Code:</strong> SH-CAP-101 | <strong>Course Title:</strong> Client Rights & Advocacy Essentials Masterclass</p><p>Welcome to the foundational masterclass of Sulandra Health. This comprehensive curriculum is designed to transform caregiving from routine task execution into consistent, informed client advocacy on every shift.</p><div class="learner-note"><strong>What this means in practice:</strong> Every interaction, household routine, community activity, medication discussion, and documentation decision must protect the person’s dignity, voice, privacy, freedom, and right to make informed choices.</div>`},
{title:'Learning Objectives & Professional Competencies',module:'Module 1: Foundations',content:`<h2>Slide 2: Learning Objectives & Professional Competencies</h2><div class="visual-card"><span class="visual-icon">🎯</span><div class="visual-text"><h4>Visual Illustration: Four-Core Competency Grid</h4><p>Autonomy, dignity, safety, and active advocacy are the four pillars of this course.</p></div></div><h3>Core Competencies</h3><ul><li>Understand the historical evolution from institutional control to individual self-determination.</li><li>Apply statutory rights to ordinary residential routines.</li><li>Identify and eliminate implicit bias, ableism, and infantilizing care practices.</li><li>Use active advocacy and solution-focused conflict mitigation during operational challenges.</li></ul><p>By the conclusion of this course, learners should be able to recognize a rights concern, respond immediately and respectfully, document objectively, and escalate through the appropriate supervisory or reporting pathway.</p>`},
{title:'The Historical Evolution of Care – The Institutional Model',module:'Module 1: Foundations',content:`<h2>Slide 3: The Historical Evolution of Care – The Institutional Model</h2><div class="visual-card"><span class="visual-icon">📜</span><div class="visual-text"><h4>Visual Illustration: Historical Archive Graphic</h4><p>A rigid institutional hallway with uniform beds and scheduled lines illustrates loss of individuality.</p></div></div><h3>Key Institutional Characteristics</h3><p>For decades, residential services operated under an institutional model. Bureaucratic efficiency often overrode personal preference through mass waking, mass dining, standardized clothing, rigid activity schedules, and decisions made without meaningful input from the individual.</p><p>The central problem was not simply the size of the building. The deeper problem was a culture in which staff convenience and organizational control were treated as more important than the person’s freedom, identity, relationships, and choices.</p>`},
{title:'The Psychological Impact of Institutional Living',module:'Module 1: Foundations',content:`<h2>Slide 4: The Psychological Impact of Institutional Living</h2><div class="visual-card"><span class="visual-icon">📉</span><div class="visual-text"><h4>Visual Illustration: Agency Decline and Dependency Chart</h4><p>The chart maps the loss of confidence and decision-making when choices are repeatedly removed.</p></div></div><h3>Understanding Learned Helplessness</h3><p>When individuals are rarely asked what they want, their attempts to communicate are ignored, or every task is completed for them, they may stop initiating choices. This is sometimes called learned helplessness.</p><p>Staff can reverse this pattern by creating real opportunities to choose, waiting patiently for responses, teaching skills in manageable steps, and celebrating effort rather than taking over.</p>`},
{title:'The Sulandra Health Paradigm Shift',module:'Module 1: Foundations',content:`<h2>Slide 5: The Sulandra Health Paradigm Shift</h2><div class="visual-card"><span class="visual-icon">✨</span><div class="visual-text"><h4>Visual Illustration: Split-Screen Comparison</h4><p>Left: caretaker model—doing for. Right: facilitator model—doing with.</p></div></div><h3>Our Core Philosophy</h3><p>At Sulandra Health, we reject the institutional mindset. Every individual is an autonomous adult endowed with inherent worth, civil rights, and the right to self-determination. Staff do not “run” another person’s home; staff provide support in the person’s home.</p><div class="callout-box"><strong>Person-centered test:</strong> Before acting, ask: “Would I accept someone making this decision for me in my own home without asking?”</div>`},
{title:'Defining Autonomy in Daily Life',module:'Module 1: Foundations',content:`<h2>Slide 6: Defining Autonomy in Daily Life</h2><div class="visual-card"><span class="visual-icon">🧭</span><div class="visual-text"><h4>Visual Illustration: Open Hand Holding a Compass</h4><p>The compass represents self-direction and choices free from coercion.</p></div></div><h3>The Power of Self-Direction</h3><p>Autonomy includes choosing clothing, room decorations, meals, entertainment, sleep routines, friendships, community activities, and personal goals. Support may be needed to understand options and risks, but support must not become substituted control.</p><p>When a safety concern exists, explain the concern in plain language, offer reasonable alternatives, involve the individual in planning, and use the least restrictive response.</p>`},
{title:'From Caretaker to Independence Facilitator',module:'Module 1: Foundations',content:`<h2>Slide 7: From Caretaker to Independence Facilitator</h2><div class="visual-card"><span class="visual-icon">🤝</span><div class="visual-text"><h4>Visual Illustration: Step-by-Step Coaching</h4><p>A staff member coaches a resident to pour coffee rather than automatically doing it for them.</p></div></div><h3>The “Do With, Not For” Rule</h3><p>Doing a task for someone may be faster, but routinely taking over can weaken skills and confidence. Break activities into steps, provide the amount of assistance actually needed, and gradually reduce assistance as competence grows.</p><div class="learner-note"><strong>Example:</strong> Instead of preparing the entire meal, invite the person to choose the menu, gather ingredients, wash produce, stir, plate, or clean up according to their abilities and goals.</div>`},
{title:'The Person-Centered Support Progression Workflow',module:'Module 1: Foundations',content:`<h2>Slide 8: The Person-Centered Support Progression Workflow</h2><div class="visual-card"><span class="visual-icon">🔄</span><div class="visual-text"><h4>Visual Illustration: Four-Stage Process</h4><p>Observe and listen → honor autonomy → facilitate skills → advocate daily.</p></div></div><h3>Operationalizing Support</h3><ol><li><strong>Observe and listen:</strong> Identify preferences, communication signals, strengths, and discomfort.</li><li><strong>Honor autonomy:</strong> Present options and respect informed choices.</li><li><strong>Facilitate skills:</strong> Teach and support rather than automatically taking over.</li><li><strong>Advocate daily:</strong> Address barriers, challenge inappropriate restrictions, and ensure the person’s voice remains central.</li></ol>`},
{title:'Active Listening and Emotional Validation',module:'Module 1: Foundations',content:`<h2>Slide 9: Active Listening and Emotional Validation</h2><div class="visual-card"><span class="visual-icon">👂</span><div class="visual-text"><h4>Visual Illustration: Attentive Eye-Level Engagement</h4><p>Staff listen without interrupting and allow sufficient response time.</p></div></div><h3>Building Trust</h3><p>Listen to understand, not merely to reply. Reflect what the person communicated, ask clarifying questions, and validate feelings without necessarily agreeing with every conclusion.</p><p>Avoid dismissive phrases such as “You’ll be fine,” “Calm down,” or “It’s not a big deal.” A more respectful response is: “I can see this is upsetting. Tell me what happened and what would help right now.”</p>`},
{title:'Respecting Personal Routines and Lifestyle Rhythms',module:'Module 1: Foundations',content:`<h2>Slide 10: Respecting Personal Routines and Lifestyle Rhythms</h2><div class="visual-card"><span class="visual-icon">⏰</span><div class="visual-text"><h4>Visual Illustration: Flexible Calendar vs. Rigid Clock</h4><p>Support schedules should adapt to individual routines whenever safely possible.</p></div></div><h3>Honoring Individual Lifestyles</h3><p>Not every adult wakes, eats, showers, relaxes, or sleeps at the same time. Staffing routines should not become house rules that erase personal preference.</p><p>Document important routines in the service plan and communicate them during handoff so consistency follows the person rather than the preference of whichever employee is working.</p>`},
{title:'The Psychology of Choice and Dignity of Risk',module:'Module 1: Foundations',content:`<h2>Slide 11: The Psychology of Choice and Dignity of Risk</h2><div class="visual-card"><span class="visual-icon">⚖️</span><div class="visual-text"><h4>Visual Illustration: Balancing Safety and Freedom</h4><p>The scale represents reasonable safety support without eliminating normal adult experiences.</p></div></div><h3>Embracing Calculated Risk</h3><p>All adults encounter risk when cooking, traveling, forming relationships, spending money, exercising, or trying something new. Eliminating every possible risk can also eliminate growth, confidence, and meaningful life.</p><p>Dignity of risk means assessing the actual danger, teaching safer methods, providing appropriate support, and avoiding unnecessary restrictions.</p>`},
{title:'Eradicating Depersonalized Language',module:'Module 1: Foundations',content:`<h2>Slide 12: Eradicating Depersonalized Language</h2><div class="visual-card"><span class="visual-icon">💬</span><div class="visual-text"><h4>Visual Illustration: Replacing Institutional Labels</h4><p>Use preferred names and respectful person-first or identity-first language according to the individual’s preference.</p></div></div><h3>Language Shapes Culture</h3><p>Do not refer to people as “cases,” “feeders,” “behaviors,” “the wheelchair,” or by a diagnosis. Describe observable facts and support needs without reducing the person to a condition or task.</p><p>Respectful language also applies when the individual is not present. Team culture is revealed by how staff speak behind closed doors.</p>`},
{title:'Creating True Home Environments',module:'Module 1: Foundations',content:`<h2>Slide 13: Creating True Home Environments</h2><div class="visual-card"><span class="visual-icon">🏡</span><div class="visual-text"><h4>Visual Illustration: Warm Living Room</h4><p>Personal photographs, comfortable furniture, chosen décor, and ordinary household organization create belonging.</p></div></div><h3>Fostering Warmth and Pride</h3><p>A supported living residence should feel like the residents’ home, not a clinic or staff office. Avoid excessive institutional signage, staff belongings dominating shared spaces, and rules posted for employee convenience.</p><p>Residents should participate in décor, furniture arrangement, household purchases, celebrations, and decisions about shared space.</p>`},
{title:'The Power of Small Daily Choices',module:'Module 1: Foundations',content:`<h2>Slide 14: The Power of Small Daily Choices</h2><div class="visual-card"><span class="visual-icon">☕</span><div class="visual-text"><h4>Visual Illustration: Micro-Choice Grid</h4><p>Breakfast, clothing, music, seating, and leisure choices build personal agency.</p></div></div><h3>Building Personal Agency</h3><p>Large decisions are easier when people routinely practice small decisions. Offer meaningful options rather than false choices, and do not rush the person because staff are impatient.</p><p>For someone who communicates nonverbally, use photographs, objects, gestures, eye gaze, communication devices, or other methods identified in the person’s plan.</p>`},
{title:'Module 1 Summary & Integration Check',module:'Module 1: Foundations',content:`<h2>Slide 15: Module 1 Summary & Integration Check</h2><div class="visual-card"><span class="visual-icon">✅</span><div class="visual-text"><h4>Visual Illustration: Module Completion Shield</h4><p>Review the empowerment principles before advancing to legal rights.</p></div></div><h3>Integration Checkpoint</h3><ul><li>Support happens in the person’s home and life.</li><li>Autonomy must be visible in ordinary routines.</li><li>Staff facilitate skills instead of automatically taking over.</li><li>Respectful language, listening, and real choices are required every day.</li></ul>`},
{title:'Introduction to Statutory Client Rights',module:'Module 2: Legal Rights',content:`<h2>Slide 16: Introduction to Statutory Client Rights</h2><div class="visual-card"><span class="visual-icon">⚖️</span><div class="visual-text"><h4>Visual Illustration: Legal Document with Protective Shield</h4><p>Rights are anchored in law and organizational policy, including Ohio developmental-disability rights protections.</p></div></div><h3>Statutory Safeguards</h3><p>Client rights are not optional suggestions. They are enforceable protections that guide daily care, service planning, privacy, communication, community participation, and freedom from abuse or unnecessary restriction.</p><p>Employees are responsible for knowing the rights that apply to their role and for reporting suspected violations promptly.</p>`},
{title:'Right 1 – Dignity, Respect, and Individuality',module:'Module 2: Legal Rights',content:`<h2>Slide 17: Right 1 – Dignity, Respect, and Individuality</h2><div class="visual-card"><span class="visual-icon">🌟</span><div class="visual-text"><h4>Visual Illustration: Respect and Individuality</h4><p>Every person is addressed courteously and recognized as an individual.</p></div></div><h3>Upholding Human Worth</h3><p>Never use ridicule, threats, humiliation, intimidation, discriminatory language, or punishment disguised as “teaching a lesson.” Correct unsafe conduct while preserving dignity.</p><p>Respect includes preferred name, pronouns, culture, privacy, clothing, personal style, relationships, communication method, and adult status.</p>`},
{title:'Right 2 – Safe, Clean Living Environments & Privacy',module:'Module 2: Legal Rights',content:`<h2>Slide 18: Right 2 – Safe, Clean Living Environments and Privacy</h2><div class="visual-card"><span class="visual-icon">🚪</span><div class="visual-text"><h4>Visual Illustration: Bedroom Door with “Knock First” Plaque</h4><p>Knock, identify yourself, and wait for permission unless an emergency requires immediate entry.</p></div></div><h3>The Bedroom as a Sanctuary</h3><p>Maintain safe and sanitary spaces without treating bedrooms as staff-controlled areas. Do not search belongings, enter without cause, or leave doors open during personal care.</p><p>Privacy must also be protected during bathing, dressing, toileting, healthcare conversations, and telephone or video calls.</p>`},
{title:'Right 3 – Nutrition, Health Access, and Ancillary Care',module:'Module 2: Legal Rights',content:`<h2>Slide 19: Right 3 – Nutrition, Health Access, and Ancillary Care</h2><div class="visual-card"><span class="visual-icon">🥗</span><div class="visual-text"><h4>Visual Illustration: Balanced Meal and Medical Shield</h4><p>Access to nutritious food, healthcare, dental care, therapy, and follow-up is protected.</p></div></div><h3>Uncompromised Health Access</h3><p>Provide adequate nutrition while honoring preferences, culture, allergies, prescribed diets, and informed refusal. Report meaningful changes in intake, health, pain, behavior, or function.</p><p>Never delay a needed appointment or treatment merely because transportation or staffing is inconvenient. Escalate barriers so an alternative can be arranged.</p>`},
{title:'Right 4 – Communication and Personal Possessions',module:'Module 2: Legal Rights',content:`<h2>Slide 20: Right 4 – Communication and Personal Possessions</h2><div class="visual-card"><span class="visual-icon">📱</span><div class="visual-text"><h4>Visual Illustration: Secure Mail and Phone</h4><p>People have rights to private communication and protection of personal property.</p></div></div><h3>Protecting Communication and Property</h3><p>Do not open mail, read messages, monitor calls, borrow property, use a resident’s food or money, or control access to possessions without lawful and documented authority.</p><p>Provide reasonable assistance with devices, postage, contacts, and communication access when requested.</p>`},
{title:'Right 5 – Social Interaction, Religion, and Vocational Growth',module:'Module 2: Legal Rights',content:`<h2>Slide 21: Right 5 – Social Interaction, Religion, and Vocational Growth</h2><div class="visual-card"><span class="visual-icon">🤝</span><div class="visual-text"><h4>Visual Illustration: Diverse Community Circle</h4><p>Friendship, spirituality, education, employment, and meaningful community roles are part of a full life.</p></div></div><h3>Full Community Life</h3><p>Support the person to form and maintain relationships, practice or decline religion, pursue work or learning, vote when eligible, attend events, and develop talents.</p><p>Paid staff should not become the person’s only social network. Help build natural supports and ordinary community connections.</p>`},
{title:'Right 6 – Informed Consent and the Right to Refuse',module:'Module 2: Legal Rights',content:`<h2>Slide 22: Right 6 – Informed Consent and the Right to Refuse</h2><div class="visual-card"><span class="visual-icon">📋</span><div class="visual-text"><h4>Visual Illustration: Consent and Respectful Refusal</h4><p>Consent requires understandable information, voluntariness, and the ability to ask questions.</p></div></div><h3>Honoring Bodily Autonomy</h3><p>Explain what is proposed, why, possible benefits, material risks, alternatives, and what may happen if the person declines. Use the person’s communication method and allow time.</p><p>Do not threaten, shame, bribe improperly, or repeatedly pressure someone into agreement. Follow applicable medication-refusal, healthcare, and reporting procedures.</p>`},
{title:'Right 7 – Freedom from Restraint and Coercion',module:'Module 2: Legal Rights',content:`<h2>Slide 23: Right 7 – Freedom from Restraint and Coercion</h2><div class="visual-card"><span class="visual-icon">⛓️</span><div class="visual-text"><h4>Visual Illustration: Broken Chains</h4><p>Freedom from unauthorized physical, chemical, mechanical, and environmental restraint.</p></div></div><h3>Least Restrictive Support</h3><p>Restrictions cannot be created informally by staff. Any approved restrictive measure must meet legal and plan requirements, be individually justified, monitored, reviewed, and implemented only by trained personnel.</p><p>Convenience, punishment, staffing shortage, or frustration are never acceptable reasons for restraint or seclusion.</p>`},
{title:'Right 8 – Confidentiality and Record Safeguarding',module:'Module 2: Legal Rights',content:`<h2>Slide 24: Right 8 – Confidentiality and Record Safeguarding</h2><div class="visual-card"><span class="visual-icon">🔒</span><div class="visual-text"><h4>Visual Illustration: Secure Digital Vault and Medical Chart</h4><p>Protected information must be accessed and shared only for authorized purposes.</p></div></div><h3>Safeguarding Privacy</h3><p>Do not discuss individuals in public areas, post identifying information on social media, send records through unapproved channels, leave charts visible, or share passwords.</p><p>Use the minimum information needed for the task and verify authorization before disclosing information, including to relatives.</p>`},
{title:'Comparative Analysis – Restrictive Housekeeping vs. Rights',module:'Module 2: Legal Rights',content:`<h2>Slide 25: Restrictive Housekeeping vs. Rights-Driven Support</h2><div class="comparison-grid"><div class="comp-card bad"><h3>❌ Restrictive Practice</h3><p>Locking food, controlling television, setting universal bedtimes, or withholding outings because staff find it easier.</p></div><div class="comp-card good"><h3>✔ Rights-Driven Practice</h3><p>Teach skills, offer accessible alternatives, assess actual risk, and use the least restrictive individualized support.</p></div></div><h3>Auditing Operational Rules</h3><p>Administrative convenience often hides inside “house rules.” Ask whether the rule applies because of a documented individual need or merely because staff prefer control.</p>`},
{title:'Identifying Rights Restrictions in Daily Operations',module:'Module 2: Legal Rights',content:`<h2>Slide 26: Identifying Rights Restrictions in Daily Operations</h2><div class="visual-card"><span class="visual-icon">🔍</span><div class="visual-text"><h4>Visual Illustration: Operational Audit Checklist</h4><p>Review locked areas, schedules, access limits, supervision, and rules for hidden restrictions.</p></div></div><h3>Checking Authorization</h3><p>If a practice limits liberty, access, privacy, property, movement, communication, food, relationships, or bodily autonomy, determine whether it is legally authorized, individually assessed, documented in the plan, and reviewed through the required process.</p><p>When uncertain, stop and consult a supervisor rather than improvising a restriction.</p>`},
{title:'The Role of Legal Guardians and Advocates',module:'Module 2: Legal Rights',content:`<h2>Slide 27: The Role of Legal Guardians and Advocates</h2><div class="visual-card"><span class="visual-icon">👥</span><div class="visual-text"><h4>Visual Illustration: Collaborative Triangle</h4><p>The individual remains central while guardians, advocates, and professionals perform defined roles.</p></div></div><h3>Centering the Individual’s Voice</h3><p>Guardianship authority can be limited by the court and does not erase the person’s dignity, preferences, or participation. Verify the actual scope rather than assuming a guardian controls every decision.</p><p>Speak directly to the individual, include them in meetings, and document their expressed preferences.</p>`},
{title:'Grievance Procedures and Due Process',module:'Module 2: Legal Rights',content:`<h2>Slide 28: Grievance Procedures and Due Process</h2><div class="visual-card"><span class="visual-icon">📬</span><div class="visual-text"><h4>Visual Illustration: Open Grievance Box</h4><p>People must be able to raise concerns without retaliation.</p></div></div><h3>Facilitating Due Process</h3><p>Explain complaint options in an understandable way, help complete forms or contact advocates when requested, preserve confidentiality, and never punish someone for reporting dissatisfaction.</p><p>Retaliation includes threats, reduced privileges, hostile treatment, exclusion, or labeling the person as “difficult” after a complaint.</p>`},
{title:'Mandatory Reporting of Rights Violations',module:'Module 2: Legal Rights',content:`<h2>Slide 29: Mandatory Reporting of Rights Violations</h2><div class="visual-card"><span class="visual-icon">🚨</span><div class="visual-text"><h4>Visual Illustration: Alert Bell</h4><p>Immediate protection and prompt reporting are essential.</p></div></div><h3>Zero Tolerance for Silence</h3><p>If you witness or suspect abuse, neglect, exploitation, misappropriation, unauthorized restraint, or another serious rights violation, first address immediate safety and then follow required reporting procedures without delay.</p><p>Do not conduct your own secret investigation, pressure witnesses, alter documentation, or wait for the next shift.</p>`},
{title:'Module 2 Summary & Legal Compliance Check',module:'Module 2: Legal Rights',content:`<h2>Slide 30: Module 2 Summary & Legal Compliance Check</h2><div class="visual-card"><span class="visual-icon">✅</span><div class="visual-text"><h4>Visual Illustration: Legal Compliance Shield</h4><p>Review the rights framework before advancing.</p></div></div><ul><li>Rights apply during ordinary routines, not only formal meetings.</li><li>Restrictions require lawful individualized authorization.</li><li>Privacy, consent, communication, possessions, and community access must be protected.</li><li>Suspected violations require immediate safety action and prompt reporting.</li></ul>`},
{title:'Unpacking Implicit Bias in Direct Support',module:'Module 3: Bias & Ableism',content:`<h2>Slide 31: Unpacking Implicit Bias in Direct Support</h2><div class="visual-card"><span class="visual-icon">🧊</span><div class="visual-text"><h4>Visual Illustration: Iceberg Metaphor</h4><p>Conscious beliefs are visible above the water; automatic assumptions may operate below.</p></div></div><h3>Mental Shortcuts</h3><p>Implicit bias can influence whose pain is believed, who is offered choices, who is considered capable, and how behavior is interpreted. Good intentions do not eliminate bias.</p><p>Slow down, use objective information, seek the person’s perspective, and examine whether you would respond differently to someone without a disability.</p>`},
{title:'Identifying Ableism in Residential Care',module:'Module 3: Bias & Ableism',content:`<h2>Slide 32: Identifying Ableism in Residential Care</h2><div class="visual-card"><span class="visual-icon">🛑</span><div class="visual-text"><h4>Visual Illustration: Crossing Out Paternalistic Symbols</h4><p>Reject assumptions that disability makes an adult childlike or incapable of growth.</p></div></div><h3>Rejecting Infantilization</h3><p>Ableism includes baby talk, speaking over the person, assuming incompetence, excluding them from adult decisions, or treating independence as unsafe merely because support is needed.</p><p>Provide accessible information and opportunities before deciding what someone can or cannot learn.</p>`},
{title:'The Danger of Low Expectations',module:'Module 3: Bias & Ableism',content:`<h2>Slide 33: The Danger of Low Expectations</h2><div class="visual-card"><span class="visual-icon">📈</span><div class="visual-text"><h4>Visual Illustration: Expectations and Skill Growth</h4><p>Opportunities and support affect performance.</p></div></div><h3>Raising the Bar Responsibly</h3><p>If staff assume a person cannot cook, travel, communicate, work, or manage money, staff may never teach or offer the opportunity. Expectations should be hopeful, individualized, and paired with appropriate support.</p><p>Progress may require repetition, adaptation, assistive technology, visual prompts, or smaller steps.</p>`},
{title:'Cultural Humility vs. Cultural Competence',module:'Module 3: Bias & Ableism',content:`<h2>Slide 34: Cultural Humility vs. Cultural Competence</h2><div class="visual-card"><span class="visual-icon">🌱</span><div class="visual-text"><h4>Visual Illustration: Lifelong Learning</h4><p>Cultural humility is an ongoing posture, not a completed checklist.</p></div></div><h3>A Posture of Curiosity</h3><p>Ask respectful questions about food, spirituality, family, communication, celebrations, health beliefs, hair and skin care, gender identity, and other preferences. Do not assume one person represents an entire culture.</p><p>Recognize power differences and invite correction when you misunderstand.</p>`},
{title:'Case Study – Overcoming Ableist Communication',module:'Module 3: Bias & Ableism',content:`<h2>Slide 35: Case Study – Overcoming Ableist Communication</h2><div class="visual-card"><span class="visual-icon">🗣️</span><div class="visual-text"><h4>Visual Illustration: Direct Communication</h4><p>Address the person, not only the family member, interpreter, or staff companion.</p></div></div><h3>Empowering AAC Users</h3><p>When someone uses a communication board, device, signs, gestures, or an interpreter, speak directly to the individual and allow adequate response time. Do not pretend the person is absent.</p><div class="learner-note"><strong>Coaching language:</strong> “Please ask Sarah directly and give her time to use her device. Her family can help clarify, but the choice belongs to Sarah.”</div>`},
{title:'Recognizing Emotional and Behavioral Projections',module:'Module 3: Bias & Ableism',content:`<h2>Slide 36: Recognizing Emotional and Behavioral Projections</h2><div class="visual-card"><span class="visual-icon">🪞</span><div class="visual-text"><h4>Visual Illustration: Mirror Reflection</h4><p>Separate staff stress from the person’s behavior and needs.</p></div></div><h3>Emotional Regulation on Shift</h3><p>Fatigue, conflict, and frustration can change tone, body language, and interpretation. Pause before responding, lower your voice, maintain safe space, and request support when needed.</p><p>Personal stress never justifies sarcasm, intimidation, rough handling, neglect, or retaliatory treatment.</p>`},
{title:'Fostering Diversity and Inclusion in Group Homes',module:'Module 3: Bias & Ableism',content:`<h2>Slide 37: Fostering Diversity and Inclusion in Group Homes</h2><div class="visual-card"><span class="visual-icon">🌍</span><div class="visual-text"><h4>Visual Illustration: Mosaic Diversity Banner</h4><p>A home can hold different identities, beliefs, foods, languages, and traditions respectfully.</p></div></div><h3>Absolute Inclusion</h3><p>Support individual cultural and religious observances, dietary practices, relationships, identity expression, and chosen celebrations. Shared living does not require sameness.</p><p>Address discriminatory remarks and protect each resident from harassment.</p>`},
{title:'Self-Reflection and Accountability Workflows',module:'Module 3: Bias & Ableism',content:`<h2>Slide 38: Self-Reflection and Accountability Workflows</h2><div class="visual-card"><span class="visual-icon">📓</span><div class="visual-text"><h4>Visual Illustration: Reflective Journal</h4><p>Professional growth requires honest review of decisions and feedback.</p></div></div><h3>Continuous Growth</h3><p>After difficult interactions, ask: What did I observe? What assumption did I make? Did I offer real choice? Was my tone respectful? What could I do differently next time?</p><p>Use supervision, coaching, and training to improve rather than becoming defensive.</p>`},
{title:'Peer Intervention and Corrective Coaching',module:'Module 3: Bias & Ableism',content:`<h2>Slide 39: Peer Intervention and Corrective Coaching</h2><div class="visual-card"><span class="visual-icon">💬</span><div class="visual-text"><h4>Visual Illustration: Confidential Peer Coaching</h4><p>Protect the person immediately, then coach professionally when appropriate.</p></div></div><h3>Protecting Residents</h3><p>If a coworker speaks disrespectfully, ignores communication, or uses an improper restriction, intervene calmly. Serious or repeated concerns must also be reported through supervision and incident procedures.</p><p>Private coaching is useful for teachable moments, but privacy must never be used to conceal abuse or a reportable event.</p>`},
{title:'Module 3 Summary & Mindset Integration',module:'Module 3: Bias & Ableism',content:`<h2>Slide 40: Module 3 Summary & Mindset Integration</h2><div class="visual-card"><span class="visual-icon">✅</span><div class="visual-text"><h4>Visual Illustration: Mindset Shield</h4><p>Bias awareness must lead to changed behavior.</p></div></div><ul><li>Address the person directly.</li><li>Assume capacity for growth while individualizing support.</li><li>Practice cultural humility and examine power differences.</li><li>Regulate your emotions and intervene when peers act disrespectfully.</li></ul>`},
{title:'Defining Active Advocacy in Direct Care',module:'Module 4: Practical Advocacy',content:`<h2>Slide 41: Defining Active Advocacy in Direct Care</h2><div class="visual-card"><span class="visual-icon">🛡️</span><div class="visual-text"><h4>Visual Illustration: Shield and Megaphone</h4><p>Advocacy protects rights and removes barriers while preserving the person’s own voice.</p></div></div><h3>The Voice of the Resident</h3><p>Advocacy means noticing when systems, schedules, habits, or decisions conflict with the person’s rights and goals. It includes asking questions, documenting facts, proposing solutions, and escalating concerns appropriately.</p><p>Do not speak over the person in the name of advocacy. Support self-advocacy whenever possible.</p>`},
{title:'Transforming “We Cannot” into “How Can We?”',module:'Module 4: Practical Advocacy',content:`<h2>Slide 42: Transforming “We Cannot Do That” into “How Can We?”</h2><div class="visual-card"><span class="visual-icon">🌉</span><div class="visual-text"><h4>Visual Illustration: Barrier Becoming a Bridge</h4><p>Replace automatic rejection with safe, creative problem-solving.</p></div></div><h3>Creative Problem Solving</h3><p>When a person requests something new, first identify the actual barrier: transportation, staffing, money, accessibility, communication, scheduling, or risk. Then generate options with the individual and team.</p><p>Some requests may not be possible immediately, but the response should explain why, identify what can be done, and establish a next step rather than simply saying no.</p>`},
{title:'Case Study – The Community Art Class Challenge',module:'Module 4: Practical Advocacy',content:`<h2>Slide 43: Case Study – The Community Art Class Challenge</h2><div class="visual-card"><span class="visual-icon">🎨</span><div class="visual-text"><h4>Visual Illustration: Art Easel and Transportation</h4><p>Community access should not be denied solely because arrangements require effort.</p></div></div><h3>Upholding Community Rights</h3><p>Marcus wants to attend an evening art class. Staffing is tight and the usual vehicle is unavailable. An advocacy response explores schedule adjustment, another approved driver, accessible transit, family or natural support, rideshare policy, or enrollment in a different session chosen by Marcus.</p><p>The team must distinguish a genuine safety or resource limitation from avoidable inconvenience.</p>`},
{title:'Collaborative Problem-Solving with Management',module:'Module 4: Practical Advocacy',content:`<h2>Slide 44: Collaborative Problem-Solving with Management</h2><div class="visual-card"><span class="visual-icon">📊</span><div class="visual-text"><h4>Visual Illustration: Professional Team Meeting</h4><p>Present objective facts, the person’s preference, the barrier, and workable options.</p></div></div><h3>Bringing Solutions</h3><p>Use concise professional communication: “Marcus has identified this class as an important goal. Tonight’s vehicle is unavailable. Could we consider the approved rideshare process or a schedule swap? If neither is possible, can we confirm the next available class with Marcus?”</p><p>This approach keeps the discussion person-centered and action-oriented.</p>`},
{title:'Empowering Self-Advocacy in Residents',module:'Module 4: Practical Advocacy',content:`<h2>Slide 45: Empowering Self-Advocacy in Residents</h2><div class="visual-card"><span class="visual-icon">🌱</span><div class="visual-text"><h4>Visual Illustration: Growing Voice</h4><p>The strongest advocacy supports people in expressing and defending their own choices.</p></div></div><h3>Giving Individuals the Microphone</h3><p>Help the person prepare questions, practice statements, use visual supports, attend meetings, invite an advocate, and review decisions. Pause so the person can speak before staff answer.</p><p>Document the individual’s own words or communication as accurately as possible.</p>`},
{title:'Conflict Mitigation During Interdisciplinary Meetings',module:'Module 4: Practical Advocacy',content:`<h2>Slide 46: Conflict Mitigation During Interdisciplinary Meetings</h2><div class="visual-card"><span class="visual-icon">⚖️</span><div class="visual-text"><h4>Visual Illustration: Balanced Team Collaboration</h4><p>Use goals, rights, data, and the person’s preferences to guide disagreement.</p></div></div><h3>The Guiding Star</h3><p>When team members disagree, restate the shared goal, separate facts from assumptions, invite the individual’s perspective, and identify the least restrictive safe option.</p><p>Do not personalize disagreement or use authority to silence the person or frontline staff who raise legitimate concerns.</p>`},
{title:'Sustaining Passion and Preventing Advocacy Fatigue',module:'Module 4: Practical Advocacy',content:`<h2>Slide 47: Sustaining Passion and Preventing Advocacy Fatigue</h2><div class="visual-card"><span class="visual-icon">🏮</span><div class="visual-text"><h4>Visual Illustration: Lantern on a Steady Path</h4><p>Consistent advocacy requires teamwork, boundaries, reflection, and recovery.</p></div></div><h3>Recharging Responsibly</h3><p>Warning signs include cynicism, irritability, emotional numbness, cutting corners, resentment, or viewing people as tasks. Use supervision, peer support, time off, employee resources, and healthy boundaries.</p><p>Burnout is a reason to seek support, never a justification for unsafe or disrespectful care.</p>`},
{title:'Course Review & Synthesis',module:'Module 4: Practical Advocacy',content:`<h2>Slide 48: Course Review and Synthesis</h2><div class="visual-card"><span class="visual-icon">🗺️</span><div class="visual-text"><h4>Visual Illustration: Course Mind Map</h4><p>Person-centered support, legal rights, bias awareness, and active advocacy work together.</p></div></div><h3>Exam Preparation</h3><ul><li>Protect autonomy and dignity in everyday routines.</li><li>Recognize unauthorized restrictions and confidentiality risks.</li><li>Address bias, ableism, and infantilization.</li><li>Use solution-focused advocacy and support self-advocacy.</li><li>Report suspected rights violations promptly.</li></ul>`},
{title:'Post-Test Instructions & Exam Rules',module:'Module 4: Practical Advocacy',content:`<h2>Slide 49: Post-Test Instructions and Exam Rules</h2><div class="visual-card"><span class="visual-icon">📝</span><div class="visual-text"><h4>Visual Illustration: Exam Clipboard</h4><p>Fifteen questions, 80 percent required, and two permitted attempts.</p></div></div><h3>Examination Guidelines</h3><p>Read every question and select the best response based on rights-driven, person-centered practice. All questions must be answered before submission.</p><p>A passing result completes the course and generates a certificate. Scores are used to determine completion but are not printed on the certificate.</p>`},
{title:'Interactive Case Scenario Review',module:'Module 4: Practical Advocacy',content:`<h2>Slide 50: Interactive Case Scenario Review</h2><div class="scenario-box"><h3>🧠 Final Review Scenario: The Unannounced Visit</h3><p>An individual’s sibling arrives unannounced during dinner and asks to review the resident’s private medical binder and behavioral chart. What is the correct response?</p><div class="scenario-options"><button type="button" data-scenario="wrong">A) Hand over the binder because the visitor is family.</button><button type="button" data-scenario="right">B) Explain confidentiality, verify legal authorization or consent, and consult leadership before disclosure.</button></div><div class="scenario-feedback" id="final-scenario-feedback"></div></div><div class="learner-note"><strong>Key principle:</strong> Family relationship alone does not automatically authorize access to protected information.</div>`},
{title:'Masterclass Certification Post-Test',module:'Assessment',content:`<h2>Slide 51: SH-CAP-101 Certification Post-Test</h2><p><strong>Attempt:</strong> <span id="attempt-num">1</span> of 2. Passing requirement: 80 percent (12 of 15 correct).</p><p>Complete all questions, then select <strong>Submit Post-Test Assessment</strong>.</p><form id="post-test-form"><div id="quiz-container"></div></form>`},
{title:'Official Certificate of Completion',module:'Certification',content:`<div id="certificate-box"><h2 style="color:#0f766e;margin:0;font-size:1.7rem;letter-spacing:1px">CERTIFICATE OF COMPLETION</h2><p style="font-size:.85rem;color:#64748b;margin:5px 0">Sulandra Health Professional In-Service Training</p><p>This certifies that</p><h3 id="cert-staff-name" style="font-size:1.55rem;color:#115e59;margin:10px 0">Employee</h3><p>has successfully completed</p><p style="font-weight:bold;font-size:1.18rem;color:#00539f">Client Rights & Advocacy Essentials Masterclass</p><div class="callout-box" style="text-align:left;font-family:Inter,sans-serif"><strong>Competencies completed:</strong><ul><li>Person-centered support and dignity of risk</li><li>Client civil, privacy, consent, and community-access rights</li><li>Recognition of ableism, implicit bias, and institutional practices</li><li>Active advocacy, reporting, and solution-focused conflict mitigation</li></ul></div><p style="font-size:.85rem;color:#475569">Course Code: SH-CAP-101 | Completed: <span id="cert-date-disp"></span> | Valid Through: <span id="cert-valid-disp"></span></p><div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:45px;padding:0 20px;font-family:Inter,sans-serif;font-size:.8rem"><div><strong>Sulandra Health Education Administrator</strong><div style="border-top:1px solid #334155;margin-top:8px;padding-top:6px;color:#64748b">Educator / Authorized Representative</div></div><div><strong>Sulandra Health</strong><div style="border-top:1px solid #334155;margin-top:8px;padding-top:6px;color:#64748b">Organization</div></div></div><div style="margin-top:30px;font-size:.7rem;color:#64748b;border-top:1px solid #e2e8f0;padding-top:10px">Certificate ID: <span id="cert-id-disp"></span></div></div><div style="text-align:center;margin-top:25px"><button class="btn-primary" type="button" onclick="window.print()">Print / Save PDF Certificate</button> <a class="btn-primary" style="display:inline-block;text-decoration:none" href="/education-portal.html#completed">Return to Completed</a></div>`}
];
const quizData=[
{q:"1. What is the fundamental difference between an institutional model and Sulandra Health's person-centered model?",options:["Institutional models empower choice while person-centered models dictate schedules","Institutional models prioritize routines and control while person-centered support prioritizes self-determination and autonomy","There is no practical difference","Institutional models rely only on nursing supervision"],ans:1},
{q:"2. Which response best reflects the independence-facilitator approach?",options:["Completing every task for the person to save time","Supporting the person to perform meaningful parts of the task with the assistance actually needed","Avoiding support responsibilities","Allowing only family members to teach skills"],ans:1},
{q:"3. Which protection is a core residential right?",options:["Unannounced searches without cause","Freedom of movement, association, communication, and privacy consistent with lawful individualized safeguards","Mandatory staff-selected entertainment","Restriction of mail for discipline"],ans:1},
{q:"4. Locking food without an authorized individualized restriction is best described as:",options:["Routine housekeeping","A potentially serious violation of access, autonomy, and rights","Recommended weight management","Always permitted at staff discretion"],ans:1},
{q:"5. Implicit bias refers to:",options:["Only intentional insults","Automatic attitudes or stereotypes that can influence decisions without conscious awareness","A medical diagnosis","A nursing delegation protocol"],ans:1},
{q:"6. Cultural humility requires:",options:["Assuming all people from a group have the same preferences","Ongoing self-evaluation, respectful curiosity, and willingness to be corrected","Imposing staff beliefs","Ignoring cultural differences"],ans:1},
{q:"7. When a person uses an AAC device, staff should:",options:["Speak only to family","Address the person directly and allow time to communicate","Answer for the person immediately","Avoid asking choices"],ans:1},
{q:"8. When a requested community activity creates a logistical challenge, staff should:",options:["Deny it immediately","Explore safe transportation and scheduling solutions with the person and team","Ignore the request","Wait indefinitely without follow-up"],ans:1},
{q:"9. Active listening and emotional validation help:",options:["Manipulate compliance","Build trust, emotional safety, and accurate understanding","Replace medical treatment","Avoid documentation"],ans:1},
{q:"10. Rigid institutional routines can be harmful because they:",options:["Always improve independence","Can strip identity, reduce choice, and foster learned helplessness","Eliminate risk without cost","Are required in every home"],ans:1},
{q:"11. When a person refuses a scheduled activity, staff should:",options:["Use threats","Respect the refusal, explore the reason, offer alternatives, and follow applicable documentation procedures","Punish the person","Force participation"],ans:1},
{q:"12. Supporting self-determination generally builds:",options:["Operational chaos","Confidence, decision-making ability, and personal control","Dependence on staff","No meaningful benefit"],ans:1},
{q:"13. During team meetings, direct-support staff should:",options:["Remain silent","Share objective observations and advocate for the person’s preferences and rights","Sign unread documents","Make all decisions alone"],ans:1},
{q:"14. Ableism in residential support includes:",options:["Providing adaptive equipment","Treating disabled adults as perpetual children who cannot make adult choices","Supporting communication","Promoting inclusion"],ans:1},
{q:"15. The central mission of this training is to:",options:["Meet a paperwork quota","Equip staff to support safe, dignified, self-directed lives and protect rights","Make shifts more complicated","Enforce universal house rules"],ans:1}

let currentSlide=1;let highestUnlocked=1;let attemptCount=1;const totalSlides=52;
function employeeName(){const params=new URLSearchParams(location.search);return params.get('employeeName')||sessionStorage.getItem('employeeName')||'Employee';}
function initDeck(){const c=document.getElementById('slide-container');const s=document.getElementById('slide-jump');c.innerHTML=slidesData.map((x,i)=>`<section class="slide-pane ${i===0?'active':''}" id="slide-${i+1}">${x.content}</section>`).join('');s.innerHTML=slidesData.map((x,i)=>`<option value="${i+1}">Slide ${i+1}: ${x.title}</option>`).join('');buildQuiz();bindScenario();restoreProgress();updateDeckView();}
function buildQuiz(){const c=document.getElementById('quiz-container');if(!c)return;c.innerHTML=quizData.map((item,idx)=>`<div class="quiz-card"><p><strong>${item.q}</strong></p><div class="quiz-options">${item.options.map((o,j)=>`<label><input type="radio" name="q${idx}" value="${j}"> ${o}</label>`).join('')}</div></div>`).join('');}
function bindScenario(){document.querySelectorAll('[data-scenario]').forEach(b=>b.addEventListener('click',()=>{const f=document.getElementById('final-scenario-feedback');if(b.dataset.scenario==='right'){f.style.color='var(--success)';f.textContent='✔ Correct. Verify authorization or consent before any disclosure.';}else{f.style.color='var(--danger)';f.textContent='✖ Incorrect. Family relationship alone does not authorize access to confidential records.';}}));}
function saveProgress(){const state={currentSlide,highestUnlocked,attemptCount,updatedAt:new Date().toISOString()};sessionStorage.setItem('sh-cap-101-progress',JSON.stringify(state));window.parent?.postMessage({type:'SULANDRA_COURSE_PROGRESS',courseCode:'SH-CAP-101',slide:currentSlide,totalSlides,percent:Math.round(((currentSlide-1)/(totalSlides-1))*100),state},location.origin);}
function restoreProgress(){try{const state=JSON.parse(sessionStorage.getItem('sh-cap-101-progress')||'null');if(state){currentSlide=Math.min(Math.max(state.currentSlide||1,1),52);highestUnlocked=Math.max(state.highestUnlocked||currentSlide,currentSlide);attemptCount=state.attemptCount||1;}}catch(e){console.warn('Unable to restore session progress',e)}}
function changeSlide(dir){if(dir===1&&currentSlide===51){submitQuiz();return}const n=currentSlide+dir;if(n<1||n>totalSlides)return;if(n>highestUnlocked+1)return;currentSlide=n;highestUnlocked=Math.max(highestUnlocked,currentSlide);saveProgress();updateDeckView();}
function submitQuiz(){let score=0;let answered=0;quizData.forEach((item,idx)=>{const sel=document.querySelector(`input[name="q${idx}"]:checked`);if(sel){answered++;if(Number(sel.value)===item.ans)score++;}});if(answered<quizData.length){alert(`Please answer all 15 questions. ${quizData.length-answered} question(s) remain.`);return}const pct=Math.round(score/quizData.length*100);if(pct<80){if(attemptCount<2){attemptCount++;document.getElementById('attempt-num').textContent=attemptCount;alert(`You did not reach the required 80%. Review the material and use your remaining attempt.`);saveProgress();return}alert('The maximum of two attempts has been reached. The course will return to Slide 1 for review.');attemptCount=1;currentSlide=1;highestUnlocked=1;saveProgress();updateDeckView();return}currentSlide=52;highestUnlocked=52;populateCertificate();saveProgress();window.parent?.postMessage({type:'SULANDRA_COURSE_COMPLETED',courseCode:'SH-CAP-101',completedAt:new Date().toISOString(),expiresAt:new Date(new Date().setFullYear(new Date().getFullYear()+1)).toISOString()},location.origin);updateDeckView();}
function populateCertificate(){const name=document.getElementById('cert-staff-name');if(!name)return;name.textContent=employeeName();const today=new Date();const exp=new Date(today);exp.setFullYear(exp.getFullYear()+1);document.getElementById('cert-date-disp').textContent=today.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});document.getElementById('cert-valid-disp').textContent=exp.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});document.getElementById('cert-id-disp').textContent=`SH-CAP-101-${today.getFullYear()}-${crypto.randomUUID().slice(0,8).toUpperCase()}`;}
function jumpToSlide(n){n=Number(n);if(n>highestUnlocked){document.getElementById('slide-jump').value=currentSlide;alert('Complete earlier slides before jumping ahead.');return}currentSlide=n;saveProgress();updateDeckView();}
function updateDeckView(){document.querySelectorAll('.slide-pane').forEach(x=>x.classList.remove('active'));document.getElementById(`slide-${currentSlide}`)?.classList.add('active');const jump=document.getElementById('slide-jump');jump.value=String(currentSlide);[...jump.options].forEach((o,i)=>o.disabled=i+1>highestUnlocked);document.getElementById('slide-counter').innerHTML=`<strong>Slide ${currentSlide} of ${totalSlides}</strong>`;document.getElementById('progress-bar').style.width=`${Math.round(((currentSlide-1)/(totalSlides-1))*100)}%`;document.getElementById('prev-btn').disabled=currentSlide===1;const next=document.getElementById('next-btn');next.style.display=currentSlide===52?'none':'inline-block';next.textContent=currentSlide===51?'Submit Post-Test Assessment →':'Next Slide →';document.getElementById('nav-status').textContent=currentSlide===52?'Certification Issued':slidesData[currentSlide-1].module;if(currentSlide===52)populateCertificate();document.querySelector('.content-pane').scrollTop=0;}
document.getElementById('prev-btn').addEventListener('click',()=>changeSlide(-1));document.getElementById('next-btn').addEventListener('click',()=>changeSlide(1));document.getElementById('slide-jump').addEventListener('change',e=>jumpToSlide(e.target.value));initDeck();
</script>


<script data-enhancement="SH_CAP_101_ILLUSTRATIONS_V1">
(function(){
 const photoMap={
  communication:new Set([1,2,9,12,20,22,24,35,36]),
  teamwork:new Set([8,21,27,34,37,38,39,44,46]),
  meeting:new Set([16,17,28,29,30,41,42,45,48,49]),
  support:new Set([3,4,5,6,10,11,13,14,15,18,19,23,25,26,31,32,33]),
  learning:new Set([7,40]),
  coaching:new Set([43,47]),
  professional:new Set([]),
  advocacy:new Set([50])
 };
 function photoFor(n){for(const [name,set] of Object.entries(photoMap))if(set.has(n))return name;return ['support','communication','teamwork','meeting'][n%4];}
 function enhanceSlides(){
  for(let n=1;n<=50;n++){
   const slide=document.getElementById('slide-'+n);if(!slide||slide.dataset.photoEnhanced==='1')continue;
   const card=slide.querySelector('.visual-card');const h2=slide.querySelector('h2');
   const title=card?.querySelector('.visual-text h4')?.textContent?.replace(/^Visual Illustration:s*/,'')||h2?.textContent||('Slide '+n);
   const caption=card?.querySelector('.visual-text p')?.textContent||'A realistic human-centered support scene demonstrating this lesson in practice.';
   const fig=document.createElement('figure');fig.className='course-illustration';
   const img=document.createElement('img');img.src='/courses/assets/sh-cap-101/photos/'+photoFor(n)+'.jpg';img.alt=title;img.loading=n<=3?'eager':'lazy';img.decoding='async';
   const fc=document.createElement('figcaption');fc.innerHTML='<span class="photo-label">Real-world practice</span>'+caption;
   fig.append(img,fc);if(card){card.before(fig);card.classList.add('is-illustrated');}else if(h2){h2.after(fig);}else{slide.prepend(fig);}slide.dataset.photoEnhanced='1';
  }
 }
 function addPresentationControls(){
  const nav=document.querySelector('.deck-nav-bar');if(!nav||nav.querySelector('.deck-actions'))return;
  const actions=document.createElement('div');actions.className='deck-actions';
  const present=document.createElement('button');present.type='button';present.className='deck-action';present.textContent='Present';
  const auto=document.createElement('button');auto.type='button';auto.className='deck-action';auto.textContent='Auto Play';let timer=null;
  present.addEventListener('click',async()=>{document.body.classList.toggle('course-presenting');present.classList.toggle('active',document.body.classList.contains('course-presenting'));if(document.body.classList.contains('course-presenting')&&document.documentElement.requestFullscreen){try{await document.documentElement.requestFullscreen();}catch(e){}}else if(document.fullscreenElement){try{await document.exitFullscreen();}catch(e){}}});
  auto.addEventListener('click',()=>{if(timer){clearInterval(timer);timer=null;auto.classList.remove('active');auto.textContent='Auto Play';return;}auto.classList.add('active');auto.textContent='Stop Auto Play';timer=setInterval(()=>{const next=document.getElementById('next-btn');if(!next||next.style.display==='none'||next.disabled){clearInterval(timer);timer=null;auto.classList.remove('active');auto.textContent='Auto Play';return;}next.click();},10000);});
  document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement){document.body.classList.remove('course-presenting');present.classList.remove('active');}});
  actions.append(present,auto);nav.append(actions);
 }
 function enhance(){document.body.classList.add('presentation-ready');enhanceSlides();addPresentationControls();}
 document.addEventListener('DOMContentLoaded',()=>setTimeout(enhance,0));new MutationObserver(enhance).observe(document.documentElement,{childList:true,subtree:true});setTimeout(enhance,80);
})();
</script>
