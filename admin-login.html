<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Admin Sign In | Sulandra Health</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef4f8;color:#123b5a;font-family:"Segoe UI",Arial,sans-serif}.card{width:min(440px,calc(100vw - 32px));padding:28px;border:1px solid #d5e1e8;border-radius:16px;background:#fff;box-shadow:0 18px 50px rgba(20,58,84,.1);text-align:center}.logo{width:210px;max-width:70%;margin-bottom:18px}.spinner{width:34px;height:34px;margin:18px auto;border:4px solid #d9e8f0;border-top-color:#0b6ea8;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:24px;margin:0 0 8px}p{margin:0;color:#607789;line-height:1.5}
  </style>
</head>
<body>
  <main class="card" aria-live="polite">
    <img class="logo" src="/assets/mainlogo.png" alt="Sulandra Health">
    <h1>Opening secure sign in</h1>
    <p>Administrator access uses the unified Sulandra employee sign-in service.</p>
    <div class="spinner" aria-hidden="true"></div>
  </main>
  <script>
    (() => {
      'use strict';
      const params = new URLSearchParams(location.search);
      const requested = params.get('returnTo') || '/admin.html';
      let returnTo = '/admin.html';
      try {
        const target = new URL(requested, location.origin);
        if (target.origin === location.origin) returnTo = target.pathname + target.search + target.hash;
      } catch {}
      location.replace('/employee-login.html?returnTo=' + encodeURIComponent(returnTo));
    })();
  </script>
</body>
</html>
