<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>NMT Order Inbox | Sulandra Health</title><link rel="icon" href="/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;background:#edf3f7;color:#15384f;font-family:"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}.top{display:flex;align-items:center;gap:14px;padding:11px 18px;background:#fff;border-bottom:1px solid #d4e0e8;position:sticky;top:0;z-index:20}.top img{width:215px;max-width:42vw}.top .spacer{flex:1}.top a{color:#075985;text-decoration:none;font-weight:900}.banner{display:none;padding:9px 15px;background:#fff4dc;border-bottom:1px solid #e5cc8d;color:#73510e;text-align:center;font-weight:850}.banner.show{display:block}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);min-height:calc(100vh - 68px)}.rail{padding:14px;background:#f9fbfc;border-right:1px solid #d4e0e8;overflow:auto}.rail h2{margin:4px 0 10px;color:#0b4265;font-size:17px}.filter{width:100%;border:1px solid #c8d6df;border-radius:9px;padding:9px 10px;margin-bottom:8px}.order{width:100%;text-align:left;border:1px solid #d9e4ea;background:#fff;border-radius:10px;padding:10px;margin:5px 0;color:#2a4d63;cursor:pointer}.order.active{background:#e5f4fb;border-color:#0b73a8}.order strong{display:block;color:#0b4265}.order small{display:block;color:#718490;margin-top:3px}.status{display:inline-flex;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:950;background:#edf3f7;color:#536c7d}.status.RECEIVED{background:#e8f1ff;color:#305f94}.status.REVIEW_REQUIRED{background:#fff0cf;color:#825a0d}.status.ACCEPTED,.status.SCHEDULED,.status.COMPLETED{background:#e4f7ea;color:#28623d}.status.DECLINED,.status.CANCELLED{background:#fde8e6;color:#93372f}.main{padding:17px;min-width:0}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.hero h1{margin:0;color:#0b4265;font-size:28px}.hero p{margin:4px 0;color:#687b88}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:8px;padding:8px 10px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.btn.primary{background:#0b6ea8;color:#fff}.btn.success{border-color:#43865a;background:#eff9f2;color:#326d46}.btn.warn{border-color:#ab772c;color:#7d5617}.btn.danger{border-color:#b4514a;color:#94332e}.btn:disabled{opacity:.5;cursor:not-allowed}.card{background:#fff;border:1px solid #d4e0e8;border-radius:14px;box-shadow:0 8px 25px rgba(18,56,80,.06);margin-bottom:12px;overflow:hidden}.head{padding:13px 15px;border-bottom:1px solid #e2e9ed;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.head h2{margin:0;color:#174a69;font-size:18px}.body{padding:15px}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.fact{border:1px solid #e0e8ed;background:#f9fbfc;border-radius:8px;padding:8px 9px}.fact span{font-size:10px;font-weight:950;text-transform:uppercase;color:#788995;display:block}.fact strong{display:block;color:#31556b;margin-top:3px;word-break:break-word}.section{margin-top:13px}.section h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;color:#708491;letter-spacing:.04em}.note{white-space:pre-wrap;line-height:1.45;border:1px solid #e0e8ed;background:#f8fafb;border-radius:8px;padding:9px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.notice{padding:10px 12px;border:1px solid #cae1ec;background:#eff8fc;color:#416679;border-radius:9px;margin-bottom:11px;font-size:12px;line-height:1.45}.notice.warn{border-color:#e8cf94;background:#fff7e4;color:#74510e}.candidate,.doc,.event{border:1px solid #dbe5ea;border-radius:9px;padding:9px;margin:6px 0}.candidate{display:flex;gap:8px;align-items:flex-start}.candidate input{margin-top:3px}.doc strong,.event strong{color:#2a566f}.meta{font-size:11px;color:#758894;margin-top:3px}.event{border-left:3px solid #b7d8e7}.empty{text-align:center;padding:38px;color:#708491}dialog{width:min(560px,calc(100vw - 24px));border:0;border-radius:15px;padding:0;box-shadow:0 30px 90px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(8,29,43,.55)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #e1e8ec}.modal-head h2{margin:0;color:#0b4265}.modal-body{padding:16px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:900}.field textarea{border:1px solid #c7d6df;border-radius:9px;padding:9px;min-height:100px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}.rail{max-height:330px;border-right:0;border-bottom:1px solid #d4e0e8}.facts{grid-template-columns:1fr 1fr}}@media(max-width:620px){.facts{grid-template-columns:1fr}.main{padding:10px}.top a{display:none}}</style></head><body><header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><a href="/nmt-facilities.html">Referral Facilities</a><a href="/client-intake.html">Client Intake</a><a href="/spire-admin.html">SPIRE Admin</a></header><div class="banner" id="prelaunch">NMT is pre-launch. Training referrals can be reviewed, but operational order acceptance stays blocked until NMT is activated.</div><div class="layout"><aside class="rail"><select class="filter" id="status"><option value="">All statuses</option><option>RECEIVED</option><option>REVIEW_REQUIRED</option><option>ACCEPTED</option><option>DECLINED</option><option>CANCELLED</option></select><input class="filter" id="search" placeholder="Search rider, facility or order"><h2>Referral Inbox</h2><div id="list"><div class="empty">Loading…</div></div></aside><main class="main" id="main"><div class="empty">Choose an NMT referral order.</div></main></div><dialog id="decision"><div class="modal-head"><h2 id="decisionTitle">Order Decision</h2><button class="btn" id="closeDecision" type="button">Close</button></div><div class="modal-body"><div class="field"><label>Reason / review note</label><textarea id="reason"></textarea></div><div class="modal-actions"><button class="btn primary" id="submitDecision" type="button">Continue</button></div></div></dialog><script src="/assets/sulandra-entity-context.js?v=20260809-company-scope-1"></script><script>(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEYS=['sulandra:employee:access-token','sulandra_token','token','accessToken'];const token=()=>KEYS.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>v?new Date(String(v)).toLocaleString():'—',fmtDate=v=>v?new Date(String(v)).toLocaleDateString():'—';let context=null,orders=[],orderId='',detail=null,decisionAction='';async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',headers:{Accept:'application/json',Authorization:`Bearer ${token()}`,...(options.body?{'Content-Type':'application/json'}:{})}});const p=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(p.error||p.message||`Request failed (${r.status})`);e.details=p.details||p;throw e;}return p.data??p;}function renderList(){const q=$('search').value.trim().toLowerCase(),st=$('status').value;const rows=orders.filter(o=>(!st||o.status===st)&&(!q||JSON.stringify(o).toLowerCase().includes(q)));$('list').innerHTML=rows.length?rows.map(o=>`<button class="order ${String(o.id)===orderId?'active':''}" data-order="${esc(o.id)}"><span class="status ${esc(o.status)}">${esc(String(o.status).replaceAll('_',' '))}</span><strong>${esc(o.riderFirstName)} ${esc(o.riderLastName)}</strong><small>${esc(o.orderNumber)} · ${esc(o.facilityName)}</small><small>${esc(fmt(o.requestedPickupAt))} · ${esc(o.serviceLevel)} · ${esc(o.mode)}</small></button>`).join(''):'<div class="empty">No orders match this view.</div>';}function fact(label,value){return `<div class="fact"><span>${esc(label)}</span><strong>${esc(value??'—')}</strong></div>`;}function note(label,value){return value?`<div class="section"><h3>${esc(label)}</h3><div class="note">${esc(value)}</div></div>`:'';}function renderDetail(){if(!detail){$('main').innerHTML='<div class="empty">Choose an NMT referral order.</div>';return;}const o=detail.order,training=o.mode==='TRAINING_ONLY';$('main').innerHTML=`<div class="hero"><div><h1>${esc(o.riderFirstName)} ${esc(o.riderLastName)}</h1><p>${esc(o.orderNumber)} · ${esc(o.facilityName)}</p></div><button class="btn" id="refreshOrder">Refresh</button></div>${training?'<div class="notice warn"><strong>TRAINING ONLY.</strong> This referral cannot be accepted or scheduled as a live trip.</div>':''}${o.patientId?`<div class="notice"><strong>Shared SPIRE patient linked:</strong> ${esc(o.patientId)}</div>`:''}${o.intakeCaseId?`<div class="notice"><strong>NMT intake case created:</strong> ${esc(o.intakeCaseId)} · <a href="/client-intake.html">Open Client Intake</a></div>`:''}<section class="card"><div class="head"><h2>Transport Order</h2><span class="status ${esc(o.status)}">${esc(String(o.status).replaceAll('_',' '))}</span></div><div class="body"><div class="facts">${fact('Facility',o.facilityName)}${fact('Requested pickup',fmt(o.requestedPickupAt))}${fact('Appointment',fmt(o.appointmentAt))}${fact('Trip type',o.tripType)}${fact('Service level',o.serviceLevel)}${fact('Priority',o.priority)}${fact('DOB',fmtDate(o.riderDateOfBirth))}${fact('Rider phone',o.riderPhone)}${fact('Payer',o.payerName)}${fact('Medicaid ID',o.riderMedicaidId)}${fact('Authorization',o.authorizationNumber)}${fact('Facility order',o.externalOrderId)}</div><div class="section"><h3>Pickup</h3><div class="note">${esc([o.pickupName,o.pickupUnitRoom,o.pickupStreet,o.pickupCity,o.pickupState,o.pickupPostalCode].filter(Boolean).join(' · '))}</div></div><div class="section"><h3>Destination</h3><div class="note">${esc([o.dropoffName,o.dropoffUnitRoom,o.dropoffStreet,o.dropoffCity,o.dropoffState,o.dropoffPostalCode].filter(Boolean).join(' · '))}</div></div>${note('Pickup instructions',o.pickupInstructions)}${note('Destination instructions',o.dropoffInstructions)}${note('Mobility / transfers',o.mobility)}${note('Oxygen',o.oxygenRequired?`Required${o.oxygenFlow?` · ${o.oxygenFlow}`:''}`:'')}${note('Medical equipment',o.medicalEquipment)}${note('Infection precautions',o.infectionPrecautions)}${note('Behavior / safety needs',o.behaviorSafetyNeeds)}${note('Medical necessity',o.medicalNecessity)}${note('Clinical notes',o.clinicalNotes)}${note('Special instructions',o.specialInstructions)}<div class="section"><h3>Ordering contact</h3><div class="facts">${fact('Provider',o.orderingProviderName)}${fact('Department',o.orderingDepartment)}${fact('Contact',`${o.orderingContactName||''} ${o.orderingContactPhone||''}`)}</div></div><div class="actions">${!o.patientId?'<button class="btn" id="linkPatient">Link Verified Patient</button>':''}${!o.intakeCaseId?'<button class="btn" id="createIntake">Create NMT Intake</button>':''}<button class="btn warn" data-decision="REQUEST_REVIEW">Needs Review</button><button class="btn success" data-decision="ACCEPT" ${training||!context.operational?'disabled':''}>Accept Order</button><button class="btn danger" data-decision="DECLINE">Decline</button></div></div></section>${renderCandidates(detail.patientCandidates,o.patientId)}${renderDocs(detail.attachments)}${renderEvents(detail.events)}`;wireDetail();}function renderCandidates(rows,linked){if(linked)return'';return `<section class="card"><div class="head"><h2>Possible Shared SPIRE Patient Matches</h2></div><div class="body">${rows?.length?`<div class="notice warn">Confirm identity before linking. A name/date-of-birth match is a review aid only.</div>${rows.map(x=>`<label class="candidate"><input type="radio" name="candidate" value="${esc(x.id)}"><span><strong>${esc([x.preferredName||x.firstName,x.lastName].filter(Boolean).join(' '))}</strong><div class="meta">DOB ${esc(fmtDate(x.dateOfBirth))} · MRN ${esc(x.medicalRecordNumber||'—')} · ${Array.isArray(x.enrollments)?x.enrollments.length:0} active enrollment(s)</div></span></label>`).join('')}<div class="actions"><button class="btn primary" id="linkSelected">Link Selected Verified Patient</button></div>`:'<div class="empty">No exact matching patient was found. Create an NMT intake for identity review instead of creating a duplicate chart here.</div>'}</div></section>`;}function renderDocs(rows){return `<section class="card"><div class="head"><h2>Facility Documents</h2></div><div class="body">${rows?.length?rows.map(x=>`<div class="doc"><strong>${esc(x.title||x.documentType)}</strong><div class="meta">${esc(x.originalFileName)} · ${esc(fmt(x.uploadedAt))}</div><button class="btn" data-download="${esc(x.id)}">Download</button></div>`).join(''):'<div class="empty">No order documents attached.</div>'}</div></section>`;}function renderEvents(rows){return `<section class="card"><div class="head"><h2>Order Audit Timeline</h2></div><div class="body">${rows?.length?rows.map(e=>`<div class="event"><strong>${esc(String(e.eventType).replaceAll('_',' '))}</strong><div class="meta">${esc(fmt(e.createdAt))} · ${esc(e.actorType)}</div></div>`).join(''):'<div class="empty">No events recorded.</div>'}</div></section>`;}function wireDetail(){$('refreshOrder').onclick=()=>openOrder(orderId);$('createIntake')?.addEventListener('click',()=>review('CREATE_INTAKE'));$('linkPatient')?.addEventListener('click',()=>document.querySelector('[name="candidate"]')?.scrollIntoView({behavior:'smooth'}));$('linkSelected')?.addEventListener('click',()=>{const id=document.querySelector('[name="candidate"]:checked')?.value;if(!id)return alert('Select a verified matching patient first.');review('LINK_PATIENT',id);});document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>openDecision(b.dataset.decision));document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>download(b.dataset.download));}async function loadOrders(){orders=await api('/api/admin/nmt/orders');renderList();}async function openOrder(id){orderId=String(id);renderList();try{detail=await api(`/api/admin/nmt/orders/${encodeURIComponent(id)}`);renderDetail();}catch(e){$('main').innerHTML=`<div class="empty">${esc(e.message)}</div>`;}}async function review(action,patientId=null,reason=null){try{await api(`/api/admin/nmt/orders/${encodeURIComponent(orderId)}/review`,{method:'POST',body:JSON.stringify({action,patientId,reason})});await loadOrders();await openOrder(orderId);}catch(e){alert(e.message);}}function openDecision(action){decisionAction=action;$('decisionTitle').textContent=action==='ACCEPT'?'Accept Transport Order':action==='DECLINE'?'Decline Transport Order':'Mark Review Required';$('reason').value='';$('decision').showModal();}async function download(id){try{const r=await fetch(`${API}/api/admin/nmt/orders/${encodeURIComponent(orderId)}/attachments/${encodeURIComponent(id)}/download`,{cache:'no-store',headers:{Authorization:`Bearer ${token()}`}});if(!r.ok){const p=await r.json().catch(()=>({}));throw new Error(p.error||p.message||`Download failed (${r.status})`);}const blob=await r.blob(),cd=r.headers.get('content-disposition')||'',m=cd.match(/filename="([^"]+)"/i),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=m?.[1]||'nmt-order-document';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){alert(e.message);}}async function init(){if(!token()){location.href='/employee-login.html?returnTo=/nmt-order-inbox.html';return;}await window.SulandraEntityContext?.ready;context=await api('/api/admin/nmt/referral-context');$('prelaunch').classList.toggle('show',!context.operational);await loadOrders();if(orders.length)await openOrder(orders[0].id);}document.addEventListener('click',e=>{const o=e.target.closest('[data-order]');if(o)openOrder(o.dataset.order);});$('search').oninput=renderList;$('status').onchange=renderList;$('closeDecision').onclick=()=>$('decision').close();$('submitDecision').onclick=async()=>{await review(decisionAction,null,$('reason').value||null);$('decision').close();};window.addEventListener('sulandra:entity-context-changed',()=>location.reload());init().catch(e=>{$('main').innerHTML=`<div class="empty">${esc(e.message)}</div>`;});})();</script></body></html>
