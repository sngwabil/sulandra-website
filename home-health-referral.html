<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><title>Secure Home Health Referral | Sulandra Health</title><link rel="icon" href="/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;background:#eef4f7;color:#183b52;font-family:"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}.top{display:flex;align-items:center;gap:14px;padding:13px 19px;background:#fff;border-bottom:1px solid #d5e1e8}.top img{width:225px;max-width:50vw}.top .spacer{flex:1}.secure{font-size:12px;font-weight:900;color:#2d6b48}.banner{display:none;text-align:center;padding:9px 14px;font-weight:950}.banner.training{display:block;background:#7b2d25;color:#fff}.banner.operational{display:block;background:#eaf7ef;border-bottom:1px solid #add9bd;color:#27643e}.wrap{width:min(1050px,calc(100% - 24px));margin:17px auto 50px}.hero,.card{background:#fff;border:1px solid #d4e1e8;border-radius:16px;box-shadow:0 10px 28px rgba(17,55,79,.07)}.hero{padding:19px 21px;margin-bottom:13px}.hero h1{margin:4px 0;color:#0b4265;font-size:29px}.eyebrow{font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.09em;color:#0b73a8}.hero p{color:#657a88;line-height:1.5}.pill{display:inline-flex;padding:5px 8px;border:1px solid #c9dce7;background:#f3f9fc;border-radius:999px;font-size:11px;font-weight:900;margin:3px}.steps{display:flex;gap:6px;overflow:auto;margin-bottom:11px}.step{white-space:nowrap;border:1px solid #cbd9e1;background:#fff;color:#587083;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;cursor:pointer}.step.active{background:#0b6ea8;color:#fff;border-color:#0b6ea8}.card{overflow:hidden}.head{padding:15px 18px;border-bottom:1px solid #e3e9ed}.head h2{margin:0;color:#174b69;font-size:20px}.head p{margin:5px 0 0;color:#6a7d89;font-size:13px;line-height:1.45}.body{padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:5px}.field.wide{grid-column:1/-1}.field label{font-size:12px;font-weight:900;color:#496678}.field input,.field select,.field textarea{width:100%;border:1px solid #c7d6df;border-radius:9px;padding:10px 11px}.field textarea{min-height:95px;resize:vertical;line-height:1.45}.check{display:flex;align-items:flex-start;gap:8px;border:1px solid #dbe5eb;border-radius:9px;padding:10px;background:#fafcfd}.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}.actions .spacer{flex:1}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer}.btn.primary{background:#0b6ea8;color:#fff}.btn:disabled{opacity:.5}.notice{padding:10px 12px;border-radius:9px;background:#eef8fc;border:1px solid #c9e1ed;color:#42667a;font-size:12px;line-height:1.45;margin-bottom:11px}.notice.warn{background:#fff7e4;border-color:#ead095;color:#745212}.error{display:none;padding:10px 12px;border:1px solid #efb5b0;background:#fff0ef;color:#8c302a;border-radius:9px;margin-bottom:11px}.error.show{display:block}.order-line{border:1px solid #dce6eb;border-radius:10px;padding:11px;margin-top:8px}.success{text-align:center;padding:32px}.success .mark{width:62px;height:62px;border-radius:999px;background:#e4f7eb;color:#2a7045;display:grid;place-items:center;margin:0 auto 12px;font-size:30px;font-weight:950}.tracking{display:inline-block;padding:9px 12px;border:1px solid #bdd8c7;background:#f0faf3;border-radius:9px;font-weight:950;color:#27623e}.footer{text-align:center;color:#7b8c97;font-size:11px;line-height:1.5;margin-top:16px}@media(max-width:680px){.grid,.checks{grid-template-columns:1fr}.field.wide{grid-column:auto}.wrap{width:calc(100% - 14px);margin-top:8px}.top .secure{display:none}.hero h1{font-size:24px}}</style></head><body><header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><span class="secure">🔒 Secure Referral Source Session</span></header><div class="banner" id="banner"></div><main class="wrap" id="app"><section class="hero"><div class="empty">Validating referral invitation…</div></section></main><script>(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEY='sulandra:home-health:referral-token',DRAFT='sulandra:home-health:referral-draft';const token=()=>sessionStorage.getItem(KEY)||'';const state={session:null,step:0,result:null};const steps=['Patient & Home','Referral & Orders','Clinical Readiness','Review'];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',referrerPolicy:'no-referrer',headers:{Accept:'application/json',Authorization:`Bearer ${token()}`,...(options.body?{'Content-Type':'application/json'}:{})}});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||p.message||`Request failed (${r.status})`);return p.data??p;}const field=(id,label,type='text',req=false)=>`<div class="field"><label>${esc(label)}${req?' *':''}</label><input id="${id}" data-f type="${type}" ${req?'required':''}></div>`;const area=(id,label,req=false)=>`<div class="field wide"><label>${esc(label)}${req?' *':''}</label><textarea id="${id}" data-f ${req?'required':''}></textarea></div>`;function getDraft(){try{return JSON.parse(sessionStorage.getItem(DRAFT)||'{}');}catch{return{};}}function snap(){const d={...getDraft()};document.querySelectorAll('[data-f]').forEach(el=>{d[el.id]=el.type==='checkbox'?el.checked:el.value||null;});d.requestedDisciplines=[...document.querySelectorAll('[data-discipline]:checked')].map(x=>x.value);d.orderLines=[...document.querySelectorAll('.order-line')].map(row=>({discipline:row.querySelector('[data-line-discipline]').value,service:row.querySelector('[data-line-service]').value,frequency:row.querySelector('[data-line-frequency]').value||null,duration:row.querySelector('[data-line-duration]').value||null,startDate:row.querySelector('[data-line-start]').value||null,instructions:row.querySelector('[data-line-instructions]').value||null})).filter(x=>x.service);sessionStorage.setItem(DRAFT,JSON.stringify(d));return d;}function restore(){const d=getDraft();requestAnimationFrame(()=>{document.querySelectorAll('[data-f]').forEach(el=>{if(!(el.id in d))return;if(el.type==='checkbox')el.checked=Boolean(d[el.id]);else el.value=d[el.id]??'';});document.querySelectorAll('[data-discipline]').forEach(el=>el.checked=(d.requestedDisciplines||[]).includes(el.value));});}function hero(){return `<section class="hero"><div class="eyebrow">${esc(state.session.companyName)}</div><h1>Secure Home Health Referral</h1><p>Referral source: <strong>${esc(state.session.sourceName)}</strong>. Submit the hospital/physician referral and supporting orders for clinical/program review. This portal is not for emergency services.</p><span class="pill">${esc(state.session.sourceType.replaceAll('_',' '))}</span><span class="pill">Expires ${esc(new Date(state.session.expiresAt).toLocaleDateString())}</span><span class="pill">${esc(state.session.submissionsRemaining)} submission(s) remaining</span></section>`;}function nav(){return `<div class="steps">${steps.map((x,i)=>`<button class="step ${i===state.step?'active':''}" data-step="${i}">${i+1}. ${esc(x)}</button>`).join('')}</div>`;}function buttons(){return `<div class="actions">${state.step?'<button class="btn" id="prev">← Back</button>':''}<span class="spacer"></span><button class="btn primary" id="next">${state.step===steps.length-1?'Securely Submit Referral':'Continue →'}</button></div>`;}function disciplines(){return `<div class="field wide"><label>Requested disciplines *</label><div class="checks">${[['SN','Skilled Nursing'],['PT','Physical Therapy'],['OT','Occupational Therapy'],['ST','Speech Therapy'],['HHA','Home Health Aide'],['MSW','Medical Social Work'],['RT','Respiratory Therapy / Contracted'],['DIETITIAN','Dietitian'],['OTHER','Other']].map(([v,t])=>`<label class="check"><input type="checkbox" data-discipline value="${v}"><span>${t}</span></label>`).join('')}</div></div>`;}function content(){if(state.step===0)return `<div class="head"><h2>Patient & Home</h2><p>Patient identity, residence, caregiver and payer information.</p></div><div class="body"><div class="error" id="err"></div><div class="grid">${field('patientFirstName','First name','text',true)}${field('patientLastName','Last name','text',true)}${field('patientMiddleName','Middle name')}${field('patientDateOfBirth','Date of birth','date')}${field('patientSexAtBirth','Sex at birth')}${field('patientPhone','Patient phone','tel')}${field('patientEmail','Patient email','email')}${field('primaryLanguage','Primary language')}${field('streetAddress','Home street address','text',true)}${field('city','City','text',true)}${field('state','State','text',true)}${field('postalCode','ZIP','text',true)}${field('caregiverName','Caregiver / support person')}${field('caregiverRelationship','Relationship')}${field('caregiverPhone','Caregiver phone','tel')}<label class="check field wide"><input id="interpreterNeeded" data-f type="checkbox"><span>Interpreter needed</span></label>${state.session.purpose==='OPERATIONAL'?`${field('payerName','Payer / plan')}${field('memberId','Member ID')}${field('medicareId','Medicare ID')}${field('medicaidId','Medicaid ID')}${field('authorizationNumber','Authorization number')}`:'<div class="notice warn field wide">Training mode blocks payer/member/Medicare/Medicaid/authorization identifiers. Use simulated patients only.</div>'}</div>${buttons()}</div>`;if(state.step===1)return `<div class="head"><h2>Referral & Orders</h2><p>Referring provider, discharge/start-of-care dates, disciplines and ordered services.</p></div><div class="body"><div class="error" id="err"></div><div class="grid">${field('externalReferralId','Facility referral/order number')}${field('priority','Priority')}${field('referringProviderName','Referring / ordering provider','text',true)}${field('referringProviderNpi','Provider NPI')}${field('referringProviderPhone','Provider phone','tel')}${field('referringProviderFax','Provider fax')}${field('referringProviderEmail','Provider email','email')}${field('referringDepartment','Department / unit')}${field('hospitalFacility','Hospital / facility')}${field('hospitalUnit','Hospital unit')}${field('dischargeDate','Discharge date','date')}${field('requestedStartOfCareDate','Requested start of care','date')}${field('faceToFaceDate','Face-to-face date','date')}${field('faceToFaceStatus','Face-to-face status')}${field('homeboundStatus','Homebound status')}${area('homeboundRationale','Homebound rationale')}${disciplines()}${area('skilledNeed','Skilled need / reason for Home Health',true)}${area('orderSummary','Provider order summary',true)}<div class="field wide"><label>Structured discipline orders</label><div id="lines"></div><button class="btn" id="addLine" type="button">+ Add Ordered Service</button></div>${area('specialInstructions','Special order instructions')}</div>${buttons()}</div>`;if(state.step===2)return `<div class="head"><h2>Clinical & Start-of-Care Readiness</h2><p>Information needed to safely review the referral and prepare the intake/start-of-care assessment.</p></div><div class="body"><div class="error" id="err"></div><div class="grid">${field('primaryDiagnosis','Primary diagnosis')}${area('diagnoses','Other diagnoses')}${area('allergies','Allergies')}${area('medicationsSummary','Medication summary / reconciliation information')}${area('recentHospitalization','Recent hospitalization / course')}${area('woundCareNeeds','Wound / skin care needs')}${area('infusionNeeds','Infusion / IV needs')}${area('respiratoryNeeds','Respiratory / oxygen needs')}${area('dmeEquipment','DME / equipment')}${area('fallRisk','Falls / mobility risk')}${area('cognitiveBehavioralNeeds','Cognitive / behavioral needs')}${area('infectionPrecautions','Isolation / infection precautions')}${area('homeSafetyConcerns','Home safety concerns')}${area('socialDeterminants','Social / access barriers')}${field('submitterName','Person submitting referral','text',true)}${field('submitterTitle','Title / role')}${field('submitterPhone','Submitter phone','tel',true)}${field('submitterEmail','Submitter email','email')}${area('submitterAttestation','Referral-source attestation',true)}${state.session.purpose==='TRAINING_ONLY'?'<label class="check field wide"><input id="trainingAcknowledgment" data-f type="checkbox"><span><strong>Training data acknowledgment *</strong><br>I confirm all patient information is simulated and contains no real patient or payer identifiers.</span></label>':''}</div>${buttons()}</div>`;const d=getDraft();return `<div class="head"><h2>Review & Submit</h2><p>Confirm the referral summary before sending it to Sulandra Home Health.</p></div><div class="body"><div class="error" id="err"></div><div class="notice ${state.session.purpose==='TRAINING_ONLY'?'warn':''}">${state.session.purpose==='TRAINING_ONLY'?'<strong>TRAINING ONLY.</strong> This cannot become operational care.':'Submission sends the referral for review. It does not by itself confirm acceptance or a start-of-care visit.'}</div><div class="grid"><div class="notice"><strong>Patient</strong><br>${esc(`${d.patientFirstName||''} ${d.patientLastName||''}`)}<br>${esc(d.streetAddress||'')} ${esc(d.city||'')}</div><div class="notice"><strong>Provider</strong><br>${esc(d.referringProviderName||'')}<br>${esc(d.hospitalFacility||'')}</div><div class="notice"><strong>Requested disciplines</strong><br>${esc((d.requestedDisciplines||[]).join(', '))}</div><div class="notice"><strong>Start of care</strong><br>${esc(d.requestedStartOfCareDate||'Not specified')}<br>${esc(d.priority||'ROUTINE')}</div></div>${buttons()}</div>`;}function render(){snap();document.getElementById('app').innerHTML=hero()+nav()+`<section class="card">${content()}</section><div class="footer">Use this secure session only for information necessary to evaluate and coordinate Home Health services. For emergencies, use the appropriate emergency response system rather than this referral portal.</div>`;restore();wire();}function validate(){const err=document.getElementById('err'),missing=[];document.querySelectorAll('[required]').forEach(el=>{if(!String(el.value||'').trim())missing.push(el.previousElementSibling?.textContent||el.id);});if(state.step===1&&!document.querySelector('[data-discipline]:checked'))missing.push('Requested disciplines');if(state.step===2&&state.session.purpose==='TRAINING_ONLY'&&!document.getElementById('trainingAcknowledgment')?.checked)missing.push('Training data acknowledgment');if(missing.length){err.textContent=`Complete required items: ${missing.join(', ')}`;err.classList.add('show');return false;}return true;}function addLine(seed={}){const host=document.getElementById('lines');if(!host)return;const row=document.createElement('div');row.className='order-line';row.innerHTML=`<div class="grid"><div class="field"><label>Discipline</label><select data-line-discipline>${['SN','PT','OT','ST','HHA','MSW','RT','DIETITIAN','OTHER'].map(x=>`<option ${seed.discipline===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Service / order</label><input data-line-service value="${esc(seed.service||'')}"></div><div class="field"><label>Frequency</label><input data-line-frequency value="${esc(seed.frequency||'')}"></div><div class="field"><label>Duration</label><input data-line-duration value="${esc(seed.duration||'')}"></div><div class="field"><label>Start date</label><input data-line-start type="date" value="${esc(seed.startDate||'')}"></div><div class="field wide"><label>Instructions</label><textarea data-line-instructions>${esc(seed.instructions||'')}</textarea></div></div><div class="actions"><button class="btn" data-remove-line type="button">Remove</button></div>`;host.appendChild(row);row.querySelector('[data-remove-line]').onclick=()=>{row.remove();snap();};}function wire(){document.querySelectorAll('[data-f],[data-discipline]').forEach(el=>el.addEventListener('change',snap));document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{snap();state.step=Number(b.dataset.step);render();scrollTo({top:0,behavior:'smooth'});});document.getElementById('prev')?.addEventListener('click',()=>{snap();state.step=Math.max(0,state.step-1);render();});document.getElementById('next')?.addEventListener('click',()=>{if(!validate())return;snap();if(state.step===steps.length-1)submit();else{state.step++;render();scrollTo({top:0,behavior:'smooth'});}});document.getElementById('addLine')?.addEventListener('click',()=>addLine());if(document.getElementById('lines'))(getDraft().orderLines||[]).forEach(addLine);}async function submit(){const err=document.getElementById('err'),button=document.getElementById('next'),d=snap();button.disabled=true;button.textContent='Submitting…';if(!d.priority||!['ROUTINE','HIGH','URGENT'].includes(d.priority))d.priority='ROUTINE';try{const result=await api('/public/home-health/referrals',{method:'POST',body:JSON.stringify(d)});state.result=result;sessionStorage.removeItem(DRAFT);renderSuccess();}catch(e){err.textContent=e.message;err.classList.add('show');button.disabled=false;button.textContent='Securely Submit Referral';}}function fileBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||'').split(',').pop()||'');r.onerror=()=>reject(new Error('Unable to read file'));r.readAsDataURL(file);});}function renderSuccess(){document.getElementById('app').innerHTML=`${hero()}<section class="card"><div class="success"><div class="mark">✓</div><h2>${state.result.mode==='TRAINING_ONLY'?'Training Referral Received':'Referral Securely Received'}</h2><p>${esc(state.result.message||'Referral received for review.')}</p><div class="tracking">Tracking: ${esc(state.result.referralNumber)}</div><p>Attach the signed referral/order, face-to-face documentation, discharge summary, medication list, insurance/authorization or other records needed for review.</p><div id="uploads"></div><button class="btn" id="addUpload">+ Add Document</button><div class="actions"><span class="spacer"></span><button class="btn primary" id="finish">Finish Secure Session</button></div></div></section>`;document.getElementById('addUpload').onclick=()=>{const host=document.getElementById('uploads'),row=document.createElement('div');row.className='order-line';row.innerHTML=`<div class="grid"><div class="field"><label>Document type</label><select data-type><option>REFERRAL_ORDER</option><option>FACE_TO_FACE</option><option>DISCHARGE_SUMMARY</option><option>MEDICATION_LIST</option><option>INSURANCE_AUTHORIZATION</option><option>WOUND_RECORD</option><option>OTHER</option></select></div><div class="field"><label>File</label><input data-file type="file"></div><div class="field wide"><label>Title</label><input data-title></div></div><div class="actions"><button class="btn primary" data-upload>Upload</button></div><div class="error"></div>`;host.appendChild(row);row.querySelector('[data-upload]').onclick=async()=>{const f=row.querySelector('[data-file]').files?.[0],er=row.querySelector('.error'),b=row.querySelector('[data-upload]');if(!f)return;if(f.size>25*1024*1024){er.textContent='Files may not exceed 25 MB.';er.classList.add('show');return;}b.disabled=true;b.textContent='Uploading…';try{await api(`/public/home-health/referrals/${encodeURIComponent(state.result.id)}/attachments`,{method:'POST',body:JSON.stringify({documentType:row.querySelector('[data-type]').value,title:row.querySelector('[data-title]').value||f.name,originalFileName:f.name,mimeType:f.type||'application/octet-stream',contentBase64:await fileBase64(f)})});row.innerHTML=`<div class="notice"><strong>✓ Uploaded:</strong> ${esc(f.name)}</div>`;}catch(e){er.textContent=e.message;er.classList.add('show');b.disabled=false;b.textContent='Upload';}};};document.getElementById('finish').onclick=()=>{sessionStorage.removeItem(KEY);document.getElementById('app').innerHTML='<section class="hero"><div class="success"><div class="mark">✓</div><h2>Session Complete</h2><p>You may close this browser tab.</p></div></section>';};}async function init(){if(!token()){document.getElementById('app').innerHTML='<section class="hero"><div class="error show">A secure referral invitation is required.</div></section>';return;}try{state.session=await api('/public/home-health/referrals/session');const b=document.getElementById('banner');b.className=`banner ${state.session.purpose==='TRAINING_ONLY'?'training':'operational'}`;b.textContent=state.session.purpose==='TRAINING_ONLY'?'TRAINING ONLY — USE SIMULATED PATIENTS — DO NOT ENTER REAL PATIENT OR PAYER INFORMATION':'SECURE OPERATIONAL HOME HEALTH REFERRAL';render();}catch(e){sessionStorage.removeItem(KEY);document.getElementById('app').innerHTML=`<section class="hero"><div class="error show">${esc(e.message)}</div></section>`;}}init();})();</script></body></html>
