<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Company Compliance | Sulandra Health</title><link rel="icon" href="/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#edf3f7;color:#173b52}.top{display:flex;align-items:center;gap:14px;padding:11px 18px;background:#fff;border-bottom:1px solid #d5e1e8;position:sticky;top:0;z-index:40}.top img{width:220px;max-width:42vw}.top .spacer{flex:1}.top a{color:#075985;text-decoration:none;font-weight:900}.shell{width:min(1220px,calc(100% - 22px));margin:16px auto 50px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}.hero h1{margin:0;color:#0b4265;font-size:29px}.hero p{margin:5px 0;color:#667b88}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:900;cursor:pointer;text-decoration:none}.btn.primary{background:#0b6ea8;color:#fff}.btn.success{border-color:#45845a;background:#eff9f2;color:#306a43}.btn.warn{border-color:#ad792c;color:#7d5717}.btn.danger{border-color:#b5524a;color:#94362f}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border:1px solid #d5e1e8;border-radius:10px;padding:10px}.stat span{display:block;font-size:9px;text-transform:uppercase;font-weight:900;color:#7e8e98}.stat strong{font-size:21px;color:#23526c}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar select,.toolbar input{border:1px solid #c8d6df;border-radius:8px;padding:8px;background:#fff}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid #d4e1e8;border-radius:13px;box-shadow:0 7px 20px rgba(18,56,80,.05);overflow:hidden}.item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid #e4eaee}.item-head h2{margin:0;color:#174a69;font-size:16px}.item-head p{margin:4px 0 0;color:#718491;font-size:11px}.item-body{padding:13px}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.fact{border:1px solid #e0e8ed;background:#f9fbfc;border-radius:8px;padding:7px}.fact span{display:block;font-size:8px;text-transform:uppercase;font-weight:900;color:#84919a}.fact strong{font-size:11px;color:#2c536b}.status{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:950;background:#edf3f7;color:#536c7d}.status.EXPIRED,.status.SUSPENDED{background:#fde9e7;color:#92372f}.status.RENEWAL_IN_PROGRESS,.status.PENDING_VERIFICATION{background:#fff0d0;color:#835b0c}.status.ACTIVE{background:#e4f7ea;color:#29633d}.note{white-space:pre-wrap;line-height:1.45;background:#f8fafb;border:1px solid #e1e8ec;border-radius:8px;padding:9px;color:#4a6373;margin-top:8px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.events{margin-top:9px;border-top:1px solid #e7ecef;padding-top:7px}.event{font-size:10px;color:#607886;padding:4px 0}.empty{padding:34px;text-align:center;color:#718491}.error{display:none;padding:10px 12px;background:#fff0ef;border:1px solid #efb4af;color:#8b302a;border-radius:9px;margin-bottom:10px}.error.show{display:block}dialog{width:min(760px,calc(100vw - 22px));border:0;border-radius:16px;padding:0;box-shadow:0 30px 90px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(8,28,42,.55)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #e2e8ec}.modal-head h2{margin:0;color:#0b4265}.modal-body{padding:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:4px}.field.wide{grid-column:1/-1}.field label{font-size:11px;font-weight:900;color:#506b7d}.field input,.field select,.field textarea{width:100%;border:1px solid #c8d6df;border-radius:8px;padding:9px}.field textarea{min-height:90px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}@media(max-width:760px){.summary,.facts{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.field.wide{grid-column:auto}}@media(max-width:480px){.summary,.facts{grid-template-columns:1fr}.top a{display:none}.hero{flex-direction:column}}</style></head><body><header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><a href="/company-documents.html">Company Documents</a><a href="/notifications.html">Notifications</a><a href="/spire-admin.html">SPIRE Admin</a></header><main class="shell"><div class="hero"><div><h1>Company Compliance</h1><p>Licenses, provider credentials, insurance, registrations, contracts, policies, fleet, facilities and renewals.</p></div><button id="newItem" class="btn primary">+ Compliance Item</button></div><div id="summary" class="summary"></div><div class="toolbar"><select id="statusFilter"><option value="">All statuses</option><option>ACTIVE</option><option>RENEWAL_IN_PROGRESS</option><option>PENDING_VERIFICATION</option><option>EXPIRED</option><option>SUSPENDED</option><option>NOT_APPLICABLE</option><option>SUPERSEDED</option><option>CLOSED</option></select><select id="categoryFilter"><option value="">All categories</option></select><select id="daysFilter"><option value="30">Due within 30 days</option><option value="60">Due within 60 days</option><option value="90">Due within 90 days</option><option value="180">Due within 180 days</option><option value="730" selected>All tracked</option></select><input id="search" placeholder="Search compliance register"><button id="refresh" class="btn">Refresh</button></div><div id="error" class="error"></div><div id="list" class="list"><div class="empty">Loading compliance register…</div></div></main><dialog id="itemDialog"><form id="itemForm"><div class="modal-head"><h2 id="itemDialogTitle">Compliance Item</h2><button type="button" class="btn" data-close="itemDialog">Close</button></div><div class="modal-body"><div id="itemError" class="error"></div><div class="grid"><div class="field"><label>Category</label><select id="cCategory" required></select></div><div class="field"><label>Status</label><select id="cStatus"><option>ACTIVE</option><option>RENEWAL_IN_PROGRESS</option><option>PENDING_VERIFICATION</option><option>EXPIRED</option><option>SUSPENDED</option><option>NOT_APPLICABLE</option><option>SUPERSEDED</option><option>CLOSED</option></select></div><div class="field wide"><label>Requirement Name *</label><input id="cName" required></div><div class="field"><label>Authority / Issuer</label><input id="cAuthority"></div><div class="field"><label>Reference / License Number</label><input id="cReference"></div><div class="field"><label>Effective Date</label><input id="cEffective" type="date"></div><div class="field"><label>Expiration / Review Date</label><input id="cExpiration" type="date"></div><div class="field"><label>Renewal Lead Days</label><input id="cLead" type="number" min="0" max="730" value="60"></div><div class="field"><label>Responsible Employee User ID</label><input id="cOwner"></div><div class="field"><label>Linked Company Document ID</label><input id="cDocument"></div><div class="field"><label>Document Folder Hint</label><input id="cFolder"></div><div class="field wide"><label>Verification Method</label><textarea id="cVerification"></textarea></div><div class="field wide"><label>Notes</label><textarea id="cNotes"></textarea></div></div><div class="modal-actions"><button class="btn primary" type="submit">Save</button></div></div></form></dialog><script src="/assets/sulandra-entity-context.js?v=20260810-compliance-1"></script><script src="/assets/employee-directory-enhancer.js?v=20260810-3"></script><script>(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEYS=['sulandra:employee:access-token','sulandra_token','token','accessToken'];const token=()=>KEYS.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=v=>v?new Date(String(v)).toLocaleDateString():'—';const fmt=v=>v?new Date(String(v)).toLocaleString():'—';const state={context:null,items:[],editId:null};async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',headers:{Accept:'application/json',Authorization:`Bearer ${token()}`,...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||p.message||`Request failed (${r.status})`);return p.data??p}function health(i){const d=i.daysToExpiration;if(i.status==='EXPIRED'||Number(d)<0)return'EXPIRED';if(i.status==='SUSPENDED')return'SUSPENDED';if(d!=null&&Number(d)<=15)return'URGENT';if(d!=null&&Number(d)<=Number(i.renewalLeadDays||60))return'DUE';return i.status}function render(){const q=$('search').value.trim().toLowerCase(),rows=state.items.filter(i=>!q||JSON.stringify(i).toLowerCase().includes(q));$('list').innerHTML=rows.length?rows.map(i=>`<article class="item"><div class="item-head"><div><span class="status ${esc(i.status)}">${esc(String(i.status).replaceAll('_',' '))}</span><h2>${esc(i.requirementName)}</h2><p>${esc(i.category)}${i.authority?` · ${esc(i.authority)}`:''}</p></div><span class="status ${esc(health(i))}">${esc(health(i))}</span></div><div class="item-body"><div class="facts"><div class="fact"><span>Reference</span><strong>${esc(i.referenceNumber||'—')}</strong></div><div class="fact"><span>Expiration / Review</span><strong>${esc(date(i.expirationDate))}</strong></div><div class="fact"><span>Days Remaining</span><strong>${i.daysToExpiration==null?'—':esc(i.daysToExpiration)}</strong></div><div class="fact"><span>Owner</span><strong>${esc(i.responsibleUserId||'Management Queue')}</strong></div></div>${i.notes?`<div class="note">${esc(i.notes)}</div>`:''}<div class="actions">${state.context.write?`<button class="btn" data-edit="${esc(i.id)}">Edit</button><button class="btn" data-action="REVIEW" data-id="${esc(i.id)}">Review</button><button class="btn success" data-action="VERIFY" data-id="${esc(i.id)}">Verify</button><button class="btn warn" data-action="START_RENEWAL" data-id="${esc(i.id)}">Start Renewal</button><button class="btn primary" data-action="SUBMIT_RENEWAL" data-id="${esc(i.id)}">Submit Renewal</button><button class="btn success" data-action="RENEW" data-id="${esc(i.id)}">Record Renewal</button>`:''}${i.linkedDocumentId?`<a class="btn" href="/company-documents.html">Company Documents</a>`:''}</div>${Array.isArray(i.events)&&i.events.length?`<div class="events"><strong style="font-size:10px">Recent history</strong>${i.events.slice(0,6).map(e=>`<div class="event">${esc(String(e.eventType).replaceAll('_',' '))} · ${esc(fmt(e.createdAt))} · ${esc(e.actorUserId)}${e.comment?` — ${esc(e.comment)}`:''}</div>`).join('')}</div>`:''}</div></article>`).join(''):'<div class="empty">No compliance items match this view.</div>'}async function load(){const qs=new URLSearchParams();if($('statusFilter').value)qs.set('status',$('statusFilter').value);if($('categoryFilter').value)qs.set('category',$('categoryFilter').value);qs.set('days',$('daysFilter').value);const [items,summary]=await Promise.all([api(`/api/company-compliance/items?${qs}`),api('/api/company-compliance/summary')]);state.items=items;const statusMap=new Map((summary.byStatus||[]).map(x=>[x.status,Number(x.count||0)]));$('summary').innerHTML=`<div class="stat"><span>Expired</span><strong>${Number(summary.expired||statusMap.get('EXPIRED')||0)}</strong></div><div class="stat"><span>Due ≤15 Days</span><strong>${Number(summary.due15||0)}</strong></div><div class="stat"><span>Due 16–60 Days</span><strong>${Number(summary.due60||0)}</strong></div><div class="stat"><span>Unverified</span><strong>${Number(summary.unverified||0)}</strong></div>`;render()}function fill(i={}){const ids={cCategory:'category',cStatus:'status',cName:'requirementName',cAuthority:'authority',cReference:'referenceNumber',cEffective:'effectiveDate',cExpiration:'expirationDate',cLead:'renewalLeadDays',cOwner:'responsibleUserId',cDocument:'linkedDocumentId',cFolder:'documentFolderHint',cVerification:'verificationMethod',cNotes:'notes'};for(const [id,key] of Object.entries(ids)){const el=$(id);let v=i[key]??'';if(['effectiveDate','expirationDate'].includes(key)&&v)v=String(v).slice(0,10);el.value=v;}if(!i.renewalLeadDays)$('cLead').value='60';if(!i.status)$('cStatus').value='ACTIVE'}function openNew(){state.editId=null;$('itemDialogTitle').textContent='New Compliance Item';fill();$('itemDialog').showModal()}function openEdit(id){state.editId=id;const i=state.items.find(x=>String(x.id)===String(id));if(!i)return;$('itemDialogTitle').textContent='Edit Compliance Item';fill(i);$('itemDialog').showModal()}async function act(id,action){let comment=null,renewalConfirmation=null,newExpirationDate=null,newEffectiveDate=null;if(['REVIEW','VERIFY','START_RENEWAL','SUBMIT_RENEWAL','SUSPEND','SUPERSEDE','CLOSE'].includes(action))comment=prompt(`${action.replaceAll('_',' ')} note (optional):`)||null;if(action==='SUBMIT_RENEWAL')renewalConfirmation=prompt('Renewal submission / confirmation reference (optional):')||null;if(action==='RENEW'){newExpirationDate=prompt('New expiration date (YYYY-MM-DD):');if(!newExpirationDate)return;newEffectiveDate=prompt('New effective date (YYYY-MM-DD, optional):')||null;renewalConfirmation=prompt('Renewal confirmation/reference (optional):')||null;comment=prompt('Renewal note (optional):')||null}try{await api(`/api/company-compliance/items/${encodeURIComponent(id)}/action`,{method:'POST',body:JSON.stringify({action,comment,renewalConfirmation,newExpirationDate,newEffectiveDate})});await load()}catch(e){alert(e.message)}}document.addEventListener('click',e=>{const edit=e.target.closest('[data-edit]');if(edit)openEdit(edit.dataset.edit);const action=e.target.closest('[data-action]');if(action)act(action.dataset.id,action.dataset.action);const close=e.target.closest('[data-close]');if(close)$(close.dataset.close)?.close()});$('newItem').onclick=openNew;$('refresh').onclick=load;$('statusFilter').onchange=load;$('categoryFilter').onchange=load;$('daysFilter').onchange=load;$('search').oninput=render;$('itemForm').onsubmit=async e=>{e.preventDefault();const error=$('itemError');error.classList.remove('show');const body={category:$('cCategory').value,requirementName:$('cName').value,authority:$('cAuthority').value||null,referenceNumber:$('cReference').value||null,status:$('cStatus').value,effectiveDate:$('cEffective').value||null,expirationDate:$('cExpiration').value||null,renewalLeadDays:Number($('cLead').value||60),responsibleUserId:$('cOwner').value||null,linkedDocumentId:$('cDocument').value||null,documentFolderHint:$('cFolder').value||null,verificationMethod:$('cVerification').value||null,notes:$('cNotes').value||null};try{if(state.editId)await api(`/api/company-compliance/items/${encodeURIComponent(state.editId)}`,{method:'PATCH',body:JSON.stringify(body)});else await api('/api/company-compliance/items',{method:'POST',body:JSON.stringify(body)});$('itemDialog').close();await load()}catch(err){error.textContent=err.message;error.classList.add('show')}};window.addEventListener('sulandra:entity-context-changed',()=>location.reload());(async()=>{if(!token()){location.href='/employee-login.html?returnTo=/company-compliance.html';return}await window.SulandraEntityContext?.ready;try{state.context=await api('/api/company-compliance/context');const cats=state.context.categories||[];$('categoryFilter').innerHTML='<option value="">All categories</option>'+cats.map(x=>`<option>${esc(x)}</option>`).join('');$('cCategory').innerHTML=cats.map(x=>`<option>${esc(x)}</option>`).join('');$('newItem').hidden=!state.context.write;await load()}catch(e){$('error').textContent=e.message;$('error').classList.add('show')}})()})();</script></body></html>
