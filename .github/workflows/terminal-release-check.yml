name: Terminal Release Check Demo

on:
  pull_request:
    branches:
      - release/sulandra-1.0
    paths:
      - scripts/terminal-release-check.mjs
      - tests/terminal-release-check.test.mjs
      - .github/workflows/terminal-release-check.yml
  push:
    branches:
      - release/sulandra-1.0
    paths:
      - scripts/terminal-release-check.mjs
      - tests/terminal-release-check.test.mjs
      - .github/workflows/terminal-release-check.yml

permissions:
  contents: read

jobs:
  test-terminal-demo:
    name: Test terminal release checker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run automated tests
        run: node --test tests/terminal-release-check.test.mjs

      - name: Run healthy scenario
        run: node scripts/terminal-release-check.mjs

      - name: Verify degraded scenario blocks promotion
        shell: bash
        run: |
          set +e
          node scripts/terminal-release-check.mjs --scenario=degraded
          code=$?
          set -e
          test "$code" -eq 2
