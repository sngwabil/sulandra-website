name: Register education routes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/register-education-routes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Register production education routes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('spire/api/src/careers-routes.ts')
          source = path.read_text(encoding='utf-8')

          import_line = "import { registerEducationRoutes } from './education-routes.js';\n"
          if import_line not in source:
              anchor = "import { z } from 'zod';\n"
              if anchor not in source:
                  raise SystemExit('Import anchor not found; no changes made')
              source = source.replace(anchor, anchor + import_line, 1)

          call_line = "  registerEducationRoutes(app, prisma, helpers);\n"
          if call_line not in source:
              anchor = "  const { authOf, requireRoles, audit } = helpers;\n"
              if anchor not in source:
                  raise SystemExit('Registration anchor not found; no changes made')
              source = source.replace(anchor, anchor + "\n" + call_line, 1)

          path.write_text(source, encoding='utf-8')
          PY
          git config user.name "Sulandra Production Automation"
          git config user.email "admin@sulandrahealth.com"
          git add spire/api/src/careers-routes.ts
          if git diff --cached --quiet; then
            echo "Education routes already registered"
            exit 0
          fi
          git commit -m "Wire education assignment routes into API"
          git push origin main
