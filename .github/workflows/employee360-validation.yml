name: Employee 360 Validation

on:
  push:
    branches:
      - feature/spire-ehr-platform
  pull_request:
    branches:
      - feature/spire-ehr-platform
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check backend
        run: npm run typecheck

      - name: Build backend
        run: npm run build

      - name: Build static frontend
        run: npm run build:web

      - name: Verify Careers static frontend routing
        run: node scripts/verify-careers-static-routing.mjs

      - name: Verify Employee 360 permissions
        run: node scripts/verify-employee-360-permissions.mjs

      - name: Verify Employee 360 compliance engine
        run: node scripts/verify-employee-compliance.mjs

      - name: Verify Employee 360 collaboration workflows
        run: node scripts/verify-employee-collaboration.mjs

      - name: Verify Employee 360 performance management
        run: node scripts/verify-employee-performance.mjs

      - name: Verify Employee 360 compensation payroll and benefits
        run: node scripts/verify-employee-compensation.mjs

      - name: Verify Employee 360 leave and offboarding
        run: node scripts/verify-employee-leave-offboarding.mjs

      - name: Verify Employee 360 assets facilities and access
        run: node scripts/verify-employee-assets-access.mjs

      - name: Verify Employee 360 analytics and reporting
        run: node scripts/verify-employee-analytics.mjs

      - name: Verify Employee 360 documents and e-signatures
        run: node scripts/verify-employee-documents.mjs

      - name: Verify Employee 360 bulk data and quality
        run: node scripts/verify-employee-bulk-data.mjs

      - name: Verify Employee 360 workflow automation
        run: node scripts/verify-employee-workflows.mjs

      - name: Verify Employee 360 communications and notifications
        run: node scripts/verify-employee-communications.mjs

      - name: Verify Employee 360 engagement surveys and recognition
        run: node scripts/verify-employee-engagement.mjs

      - name: Verify Employee 360 learning and development
        run: node scripts/verify-employee-learning.mjs

      - name: Verify Employee 360 health safety and wellness
        run: node scripts/verify-employee-health-safety.mjs

      - name: Verify Employee 360 enterprise gap controls
        run: node scripts/verify-employee360-enterprise-gaps.mjs

      - name: Verify secure storage authentication and first-class source
        run: node scripts/verify-employee360-enterprise-completion.mjs

      - name: Run API and database integration test contract
        run: node --test tests/employee360-enterprise.integration.test.mjs

      - name: Install Playwright test runtime
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run Employee 360 browser and mobile tests
        run: npx playwright test --config=playwright.config.mjs
