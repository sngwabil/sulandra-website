name: SPIRE Intake ISP Sleep Regression

on:
  push:
    branches:
      - feature/spire-ehr-platform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spire-intake-isp-sleep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  intake-isp-sleep:
    name: Validate intake, ISP logs and Sleep/Wake
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Wait for exact live wiring
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            html="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/spire.html || true)"
            loader="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-home-care-redesign-loader.js?v=20260812-user-master-template-7' || true)"
            wiring="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-intake-isp-sleep-wiring.js?v=20260812-user-master-template-7' || true)"
            style="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-intake-isp-sleep-wiring.css?v=20260812-user-master-template-7' || true)"
            flowsheet="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/spire/flowsheets.html?patientId=deployment-check' || true)"
            if grep -q 'spire-home-care-redesign-loader.js?v=20260812-user-master-template-7' <<<"$html" \
              && grep -q "VERSION='20260812-user-master-template-7'" <<<"$loader" \
              && grep -q 'spire-intake-isp-sleep-wiring.js' <<<"$loader" \
              && grep -q 'spire-intake-isp-sleep-wiring.css' <<<"$loader" \
              && grep -q '20260812-spire-intake-isp-sleep-2' <<<"$wiring" \
              && grep -q 'ISP Outcomes / Progress' <<<"$wiring" \
              && grep -q 'Sleep / Wake' <<<"$wiring" \
              && grep -q 'spireAdmissionHistoryTab' <<<"$wiring" \
              && grep -q 'button.hidden=true' <<<"$wiring" \
              && grep -q '#spireAdmissionHistoryTab' <<<"$style" \
              && grep -q 'spire-flowsheet-master.js?v=20260812-spire-flowsheet-master-1' <<<"$flowsheet"; then
              echo 'SPIRE intake/ISP/sleep generation is live.'
              exit 0
            fi
            echo "Waiting for live SPIRE intake wiring (${attempt}/60)..."
            sleep 10
          done
          exit 1

      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run intake and flowsheet wiring UAT
        env:
          UAT_BASE_URL: https://www.sulandrahealth.com
        run: npx playwright test tests/01-spire-intake-isp-sleep-wiring.spec.mjs --config=playwright.spire-regression.config.mjs --workers=1 --retries=0

      - name: Upload failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spire-intake-isp-sleep-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
