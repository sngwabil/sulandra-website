name: Terminal Chrome Regression

on:
  pull_request:
    branches:
      - release/sulandra-1.0
    paths:
      - assets/it-agent-real-terminal.js
      - assets/it-agent-xterm-production-stack.js
      - assets/it-agent-terminal-wheel-scrollback.js
      - assets/it-agent-terminal-session-resilience.js
      - assets/it-agent-terminal-caret-clock.js
      - assets/it-agent-xterm-emulator.css
      - assets/it-agent-workspace-preview.css
      - assets/it-agent-workspace-preview.js
      - assets/sulandra-codebase.css
      - assets/sulandra-codebase.js
      - scripts/install-workspace-ide-ui.mjs
      - scripts/install-it-agent-xterm-emulator.mjs
      - terminal-browser/**
      - Dockerfile.frontend
      - .github/workflows/terminal-browser-chrome.yml
  push:
    branches:
      - release/sulandra-1.0
    paths:
      - assets/it-agent-real-terminal.js
      - assets/it-agent-xterm-production-stack.js
      - assets/it-agent-terminal-wheel-scrollback.js
      - assets/it-agent-terminal-session-resilience.js
      - assets/it-agent-terminal-caret-clock.js
      - assets/it-agent-xterm-emulator.css
      - assets/it-agent-workspace-preview.css
      - assets/it-agent-workspace-preview.js
      - assets/sulandra-codebase.css
      - assets/sulandra-codebase.js
      - scripts/install-workspace-ide-ui.mjs
      - scripts/install-it-agent-xterm-emulator.mjs
      - terminal-browser/**
      - Dockerfile.frontend
      - .github/workflows/terminal-browser-chrome.yml

permissions:
  contents: read

jobs:
  chrome-terminal-regression:
    name: Chrome terminal regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build xterm browser runtime
        run: |
          npm --prefix terminal-browser install --omit=dev --no-audit --no-fund
          npm --prefix terminal-browser run build

      - name: Verify Restart shell only replaces active terminal
        run: node terminal-browser/tests/restart-active-terminal-regression.mjs

      - name: Install Playwright library
        run: npm --prefix terminal-browser install --no-save --no-audit --no-fund playwright@1.55.0

      - name: Verify Google Chrome is available
        run: google-chrome --version

      - name: Run fresh-load and interaction regression in Chrome
        run: node terminal-browser/tests/chrome-regression.mjs

      - name: Verify mouse wheel stays in browser scrollback
        run: node terminal-browser/tests/wheel-scrollback-regression.mjs

      - name: Verify terminal survives auth navigation
        run: node terminal-browser/tests/session-resilience-regression.mjs

      - name: Verify IDE and Preview stay inside the workspace rail
        run: node terminal-browser/tests/workspace-panel-regression.mjs

      - name: Verify Sulandra Codebase workspace
        run: node terminal-browser/tests/codebase-regression.mjs
