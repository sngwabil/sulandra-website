name: Add custom course dropdown

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-custom-course-dropdown.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add custom course dropdown only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('education-portal.html')
          s = p.read_text(encoding='utf-8')

          css_anchor = ".automation h3{margin:0 0 8px;font-size:15px;color:#256f8f}.toast{position:fixed;right:20px;bottom:20px;background:#24343e;color:#fff;padding:12px 16px;border-radius:4px;display:none;z-index:20}"
          css_replacement = ".automation h3{margin:0 0 8px;font-size:15px;color:#256f8f}.custom-course-field{grid-column:1/-1}.custom-course-field select{width:100%}.toast{position:fixed;right:20px;bottom:20px;background:#24343e;color:#fff;padding:12px 16px;border-radius:4px;display:none;z-index:20}"
          if css_anchor not in s:
              raise SystemExit('CSS anchor not found; no changes made')
          s = s.replace(css_anchor, css_replacement, 1)

          people_anchor = '<div class="field"><label>Education package</label><select id="packageSelect"><option value="INITIAL">Initial certification catalog</option><option value="ANNUAL">Annual renewal catalog</option><option value="CUSTOM">Custom course selection</option></select></div><div class="field"><label>Due date</label>'
          people_replacement = '<div class="field"><label>Education package</label><select id="packageSelect"><option value="INITIAL">Initial certification catalog</option><option value="ANNUAL">Annual renewal catalog</option><option value="CUSTOM">Custom course selection</option></select></div><div id="customCourseField" class="field custom-course-field hidden"><label>Course</label><select id="customCourseSelect"><option value="">Select a course</option></select></div><div class="field"><label>Due date</label>'
          if people_anchor not in s:
              raise SystemExit('Employee package anchor not found; no changes made')
          s = s.replace(people_anchor, people_replacement, 1)

          catalog_anchor = "catalog=(p.courses||[]).filter(c=>c.active===true);$('catalogList').innerHTML="
          catalog_replacement = "catalog=(p.courses||[]).filter(c=>c.active===true);$('customCourseSelect').innerHTML='<option value=\"\">Select a course</option>'+catalog.map(c=>`<option value=\"${esc(c.code)}\">${esc(c.code)} — ${esc(c.title)}</option>`).join('');$('catalogList').innerHTML="
          if catalog_anchor not in s:
              raise SystemExit('Catalog anchor not found; no changes made')
          s = s.replace(catalog_anchor, catalog_replacement, 1)

          listener_anchor = "$('employeeSearch').oninput=renderEmployees;$('roleFilter').onchange=renderEmployees;"
          listener_replacement = "$('employeeSearch').oninput=renderEmployees;$('roleFilter').onchange=renderEmployees;$('packageSelect').onchange=()=>{$('customCourseField').classList.toggle('hidden',$('packageSelect').value!=='CUSTOM')};"
          if listener_anchor not in s:
              raise SystemExit('Listener anchor not found; no changes made')
          s = s.replace(listener_anchor, listener_replacement, 1)

          assign_anchor = "$('assignSelectedBtn').onclick=async()=>{if(!selected.size)return toast('Select at least one employee.');try{await req('/api/admin/education/bulk-assign',{method:'POST',body:JSON.stringify({employeeIds:[...selected],packageCode:$('packageSelect').value,dueDate:$('bulkDueDate').value||null,reason:$('bulkReason').value})});toast('Education package assigned to '+selected.size+' employees.')}catch{toast('Bulk assignment endpoint is not connected yet.')}}"
          assign_replacement = "$('assignSelectedBtn').onclick=async()=>{if(!selected.size)return toast('Select at least one employee.');const packageCode=$('packageSelect').value,courseCode=packageCode==='CUSTOM'?$('customCourseSelect').value:'';if(packageCode==='CUSTOM'&&!courseCode)return toast('Select a course.');try{await req('/api/admin/education/bulk-assign',{method:'POST',body:JSON.stringify({employeeIds:[...selected],packageCode,courseCode:courseCode||null,courseCodes:courseCode?[courseCode]:[],dueDate:$('bulkDueDate').value||null,reason:$('bulkReason').value})});toast((packageCode==='CUSTOM'?'Selected course':'Education package')+' assigned to '+selected.size+' employees.')}catch{toast('Bulk assignment endpoint is not connected yet.')}}"
          if assign_anchor not in s:
              raise SystemExit('Assignment anchor not found; no changes made')
          s = s.replace(assign_anchor, assign_replacement, 1)

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "Sulandra Production Automation"
          git config user.email "admin@sulandrahealth.com"
          git add education-portal.html
          git commit -m "Show course dropdown for custom education assignments"
          git push origin main
