name: Codebase Source Regression

on:
  pull_request:
    branches:
      - release/sulandra-1.0
    paths:
      - Codebase.html
      - assets/codebase-backend-adapter.js
      - assets/codebase-preview-terminal-input-fix.js
      - assets/codebase-ipad-terminal-keyboard-bridge.js
      - assets/codebase-terminal-session-durability.js
      - assets/sulandra-codebase.js
      - assets/sulandra-codebase-api-bridge.js
      - assets/sulandra-codebase-nav-entry.js
      - scripts/install-codebase-backend-adapter.mjs
      - scripts/install-codebase-pty-session-resume.mjs
      - scripts/fix-codebase-async-pty-startup.mjs
      - scripts/install-workspace-ide-ui.mjs
      - scripts/install-it-solutions-ipad-visible-codebase-hotfix.mjs
      - terminal-browser/tests/codebase-session-durability-regression.mjs
      - terminal-session-agent/tmux.conf
      - tests/sulandra-codebase-api-bridge.regression.mjs
      - Dockerfile.frontend
      - Dockerfile.coding-terminal
      - .github/workflows/codebase-source-regression.yml

permissions:
  contents: read

jobs:
  verify:
    name: Verify standalone Codebase and authenticated source routing
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Codebase sources
        run: |
          set -euo pipefail
          node --check assets/sulandra-codebase-api-bridge.js
          node --check assets/codebase-backend-adapter.js
          node --check assets/codebase-preview-terminal-input-fix.js
          node --check assets/codebase-ipad-terminal-keyboard-bridge.js
          node --check assets/codebase-terminal-session-durability.js
          node --check scripts/install-codebase-backend-adapter.mjs
          node --check scripts/install-codebase-pty-session-resume.mjs
          node --check scripts/fix-codebase-async-pty-startup.mjs
          node --check assets/sulandra-codebase-nav-entry.js
          node --check scripts/install-workspace-ide-ui.mjs
          node --check scripts/install-it-solutions-ipad-visible-codebase-hotfix.mjs
          node --check tests/sulandra-codebase-api-bridge.regression.mjs
          node --check terminal-browser/tests/codebase-session-durability-regression.mjs

      - name: Exercise authenticated API bridge
        run: node tests/sulandra-codebase-api-bridge.regression.mjs

      - name: Exercise terminal session durability contract
        run: node terminal-browser/tests/codebase-session-durability-regression.mjs

      - name: Verify standalone publication boundary and executable bootstrap
        run: |
          set -euo pipefail
          node scripts/install-codebase-backend-adapter.mjs Codebase.html
          node scripts/install-workspace-ide-ui.mjs
          node scripts/install-it-solutions-ipad-visible-codebase-hotfix.mjs

          grep -Fq '/assets/codebase-backend-adapter.js?v=20260906-async-pty-startup-1' Codebase.html
          grep -Fq '/assets/codebase-preview-terminal-input-fix.js?v=20260904-terminal-live-input-3' Codebase.html
          grep -Fq '/assets/codebase-ipad-terminal-keyboard-bridge.js?v=20260904-ipad-keyboard-4' Codebase.html
          grep -Fq '/assets/codebase-terminal-session-durability.js?v=20260904-session-durability-1' Codebase.html
          grep -Fq 'SULANDRA_CODEBASE_STANDALONE_CONTROLS_V1' assets/codebase-backend-adapter.js
          grep -Fq 'CODEBASE_VISIBLE_REGRESSIONS_V1' assets/codebase-backend-adapter.js
          grep -Fq "type==='terminal-starting'" assets/codebase-backend-adapter.js
          grep -Fq "type==='terminal-error'" assets/codebase-backend-adapter.js
          grep -Fq 'installSafeWorkspaceRenderer' assets/codebase-backend-adapter.js
          grep -Fq 'reattachTerminal' assets/codebase-backend-adapter.js
          grep -Fq 'setGridMode(modes[index],{currentTarget:gridButton})' assets/codebase-backend-adapter.js
          grep -Fq 'CODEBASE_PREVIEW_TERMINAL_INPUT_V2' assets/codebase-preview-terminal-input-fix.js
          grep -Fq 'CODEBASE_PREVIEW_TERMINAL_INPUT_V3' assets/codebase-preview-terminal-input-fix.js
          grep -Fq 'codebase-preview-toolbar' assets/codebase-preview-terminal-input-fix.js
          grep -Fq "surface:'codebase'" assets/codebase-preview-terminal-input-fix.js
          grep -Fq 'setPreviewDark' assets/codebase-preview-terminal-input-fix.js
          grep -Fq 'previewIntent' assets/codebase-preview-terminal-input-fix.js
          grep -Fq 'terminalDataFromKey' assets/codebase-preview-terminal-input-fix.js
          grep -Fq 'editorFallbackKey' assets/codebase-preview-terminal-input-fix.js
          grep -Fq 'codebaseKeyboardBound' assets/codebase-preview-terminal-input-fix.js
          grep -Fq 'preserveLiveTerminalNodes' assets/codebase-preview-terminal-input-fix.js
          grep -Fq 'canonicalResetPacket' assets/codebase-preview-terminal-input-fix.js
          grep -Fq "addEventListener('paste'" assets/codebase-preview-terminal-input-fix.js
          grep -Fq 'term.focus' assets/codebase-preview-terminal-input-fix.js
          grep -Fq 'CODEBASE_IPAD_TERMINAL_KEYBOARD_V4' assets/codebase-ipad-terminal-keyboard-bridge.js
          grep -Fq "addEventListener('beforeinput'" assets/codebase-ipad-terminal-keyboard-bridge.js
          grep -Fq "addEventListener('input'" assets/codebase-ipad-terminal-keyboard-bridge.js
          grep -Fq "addEventListener('touchend'" assets/codebase-ipad-terminal-keyboard-bridge.js
          grep -Fq 'CODEBASE_TERMINAL_SESSION_DURABILITY_V1' assets/codebase-terminal-session-durability.js
          grep -Fq 'sulandra:codebase:terminal-session-state:v1' assets/codebase-terminal-session-durability.js
          grep -Fq 'freshestToken' assets/codebase-terminal-session-durability.js
          grep -Fq 'ResumeWebSocket' assets/codebase-terminal-session-durability.js
          grep -Fq 'data-codebase-active-terminal' assets/codebase-terminal-session-durability.js
          grep -Fq 'set -g status off' terminal-session-agent/tmux.conf
          grep -Fq 'sulandra-website-production-5fc4.up.railway.app' assets/sulandra-codebase-api-bridge.js
          grep -Fq 'Authorization' assets/sulandra-codebase-api-bridge.js

          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('Codebase.html', 'utf8');
          const adapterTag = '<script src="/assets/codebase-backend-adapter.js?v=20260906-async-pty-startup-1"></script>';
          const previewTag = '<script src="/assets/codebase-preview-terminal-input-fix.js?v=20260904-terminal-live-input-3"></script>';
          const ipadKeyboardTag = '<script src="/assets/codebase-ipad-terminal-keyboard-bridge.js?v=20260904-ipad-keyboard-4"></script>';
          const durabilityTag = '<script src="/assets/codebase-terminal-session-durability.js?v=20260904-session-durability-1"></script>';
          const adapterIndex = html.indexOf(adapterTag);
          const previewIndex = html.indexOf(previewTag);
          const ipadKeyboardIndex = html.indexOf(ipadKeyboardTag);
          const durabilityIndex = html.indexOf(durabilityTag);
          const bodyIndex = html.toLowerCase().lastIndexOf('</body>');
          if (adapterIndex < 0 || previewIndex <= adapterIndex || ipadKeyboardIndex <= previewIndex || durabilityIndex <= ipadKeyboardIndex || durabilityIndex >= bodyIndex) throw new Error('Standalone Codebase runtime order is invalid');
          if (html.indexOf(adapterTag, adapterIndex + adapterTag.length) !== -1) throw new Error('Standalone adapter published more than once');
          if (html.indexOf(previewTag, previewIndex + previewTag.length) !== -1) throw new Error('Preview/input repair published more than once');
          if (html.indexOf(ipadKeyboardTag, ipadKeyboardIndex + ipadKeyboardTag.length) !== -1) throw new Error('iPad keyboard bridge published more than once');
          if (html.indexOf(durabilityTag, durabilityIndex + durabilityTag.length) !== -1) throw new Error('Terminal durability runtime published more than once');
          if (html.slice(durabilityIndex + durabilityTag.length, bodyIndex).trim()) throw new Error('Executable content appears after terminal durability runtime');
          const before = html.slice(0, adapterIndex).toLowerCase();
          if (before.lastIndexOf('<script') > before.lastIndexOf('</script>')) throw new Error('Standalone adapter was injected inside inline JavaScript');
          const inlineScripts = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
          for (const [index, match] of inlineScripts.entries()) {
            try { new Function(match[1]); }
            catch (error) { throw new Error(`Published inline script ${index + 1} is not executable: ${error.message}`); }
          }
          const repair = fs.readFileSync('assets/codebase-preview-terminal-input-fix.js','utf8');
          const ipadKeyboard = fs.readFileSync('assets/codebase-ipad-terminal-keyboard-bridge.js','utf8');
          const durability = fs.readFileSync('assets/codebase-terminal-session-durability.js','utf8');
          if (!html.includes('function rightPanelMaxWidth()') || !html.includes("addEventListener('pointerdown'")) throw new Error('Standalone Preview dock must use pointer-captured resize handling');
          if (!html.includes('codebase-panel-resizing') || !html.includes('pointer-events: none')) throw new Error('Standalone Preview drag must keep the iframe from taking the pointer');
          if (!repair.includes("if(!requested){setPreviewDark")) throw new Error('Preview must remain dark for non-user terminal-triggered preview calls');
          if (!repair.includes("event.target!==container&&!container.contains(event.target)")) throw new Error('Terminal keyboard/paste fallback must remain scoped to the selected terminal and its xterm descendants');
          if (!repair.includes("if(event.target!==wrapper)return")) throw new Error('Editor keyboard fallback must remain scoped to the focused editor wrapper');
          if (!ipadKeyboard.includes("addEventListener('input'")) throw new Error('iPad software keyboard input fallback is missing');
          if (!ipadKeyboard.includes("container.addEventListener('click',activate,false)")) throw new Error('iPad terminal tap must focus the rendered keyboard bridge after xterm pointer handling');
          if (!durability.includes("searchParams.set('sessionId'")) throw new Error('Refreshed terminal must reconnect using the existing sessionId');
          if (!durability.includes('term.options.cursorBlink=selected')) throw new Error('Only the selected terminal may own the blinking cursor');
          console.log(`Standalone Codebase bootstrap placement and ${inlineScripts.length} inline script(s) are executable.`);
          NODE

          grep -Fq '/assets/sulandra-codebase-nav-entry.js?v=20260904-standalone-launcher-10' it-solutions.html
          grep -Fq "CODEBASE_URL='/Codebase.html?v=20260904-ipad-keyboard-4'" assets/sulandra-codebase-nav-entry.js
          grep -Fq 'SULANDRA_CODEBASE_IT_VISIBLE_NAV_V8' assets/sulandra-codebase-nav-entry.js
          grep -Fq 'window.open' assets/sulandra-codebase-nav-entry.js

          if grep -Fq '/assets/sulandra-codebase-api-bridge.js' it-solutions.html; then
            echo 'IT Solutions must not publish the Codebase API bridge runtime' >&2
            exit 1
          fi
          if grep -Fq 'itwsSulandraCodebaseFrame' it-solutions.html; then
            echo 'IT Solutions must not publish an embedded Codebase iframe' >&2
            exit 1
          fi
