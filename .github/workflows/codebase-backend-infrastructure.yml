name: Codebase Backend Infrastructure

on:
  pull_request:
    paths:
      - 'Codebase.html'
      - 'assets/codebase-backend-adapter.js'
      - 'codebase-e2e-api/**'
      - 'codebase-e2e-web/**'
      - 'coding-terminal-worker/**'
      - 'Dockerfile.coding-terminal'
      - 'Dockerfile.frontend'
      - 'scripts/install-codebase-pty-compat.mjs'
      - 'scripts/install-codebase-backend-adapter.mjs'
      - '.github/workflows/codebase-backend-infrastructure.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript sources
        run: |
          set -euo pipefail
          node --check codebase-e2e-api/bootstrap.mjs
          node --check codebase-e2e-api/server.mjs
          node --check codebase-e2e-web/server.mjs
          node --check assets/codebase-backend-adapter.js
          node --check scripts/install-codebase-pty-compat.mjs
          node --check scripts/install-codebase-backend-adapter.mjs
      - name: Install service dependencies
        run: |
          set -euo pipefail
          npm install --prefix codebase-e2e-api --ignore-scripts --no-audit --no-fund
          npm install --prefix codebase-e2e-web --ignore-scripts --no-audit --no-fund
          npm run check --prefix codebase-e2e-api
          npm run check --prefix codebase-e2e-web
      - name: Verify standalone Codebase HTML contract publication
        run: |
          set -euo pipefail
          cp Codebase.html /tmp/Codebase.html
          node scripts/install-codebase-backend-adapter.mjs /tmp/Codebase.html
          grep -Fq '/assets/codebase-backend-adapter.js?v=20260903-standalone-controls-3' /tmp/Codebase.html
          grep -Fq 'SULANDRA_CODEBASE_STANDALONE_CONTROLS_V1' assets/codebase-backend-adapter.js
          grep -Fq 'sameOriginOpener' assets/codebase-backend-adapter.js
          grep -Fq "window.location.assign('/it-solutions.html')" assets/codebase-backend-adapter.js
          grep -Fq 'codebase-e2e-api-production.up.railway.app' /tmp/Codebase.html
          grep -Fq 'sulandra-coding-terminal-worker-production.up.railway.app' /tmp/Codebase.html
          grep -Fq 'codebase-e2e-web-production.up.railway.app' /tmp/Codebase.html
          ! grep -Fq "|| 'test-token'" /tmp/Codebase.html
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/Codebase.html', 'utf8');
          const tag = '<script src="/assets/codebase-backend-adapter.js?v=20260903-standalone-controls-3"></script>';
          const adapterIndex = html.indexOf(tag);
          const bodyIndex = html.toLowerCase().lastIndexOf('</body>');
          if (adapterIndex < 0 || adapterIndex >= bodyIndex) throw new Error('Standalone adapter is not before the final document body close');
          if (html.indexOf(tag, adapterIndex + tag.length) !== -1) throw new Error('Standalone adapter published more than once');
          if (html.slice(adapterIndex + tag.length, bodyIndex).trim()) throw new Error('Standalone adapter must be the final executable element');
          const before = html.slice(0, adapterIndex).toLowerCase();
          if (before.lastIndexOf('<script') > before.lastIndexOf('</script>')) throw new Error('Standalone adapter was injected inside inline JavaScript');
          const inlineScripts = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)];
          for (const [index, match] of inlineScripts.entries()) {
            try { new Function(match[1]); }
            catch (error) { throw new Error(`Published inline script ${index + 1} is not executable: ${error.message}`); }
          }
          NODE
      - name: Verify PTY compatibility can be installed
        run: |
          set -euo pipefail
          cp coding-terminal-worker/server.mjs /tmp/codebase-terminal-gateway.mjs
          node scripts/install-codebase-pty-compat.mjs /tmp/codebase-terminal-gateway.mjs
          node --check /tmp/codebase-terminal-gateway.mjs
          grep -Fq 'CODEBASE_PTY_COMPAT_V1' /tmp/codebase-terminal-gateway.mjs
          grep -Fq "url.pathname === '/pty'" /tmp/codebase-terminal-gateway.mjs
      - name: Build dedicated Codebase service images
        run: |
          set -euo pipefail
          docker build -f codebase-e2e-api/Dockerfile -t sulandra-codebase-api:test .
          docker build -f codebase-e2e-web/Dockerfile -t sulandra-codebase-web:test .
