name: CI

on:
  push:
    branches:
      - main
      - release/sulandra-1.0
      - release/sulandra-1.1
      - sulandra-1.1
      - feature/spire-ehr-platform
      - feature/spire-1.1
  pull_request:
    branches:
      - main
      - release/sulandra-1.1
      - sulandra-1.1
      - feature/spire-ehr-platform
      - feature/spire-1.1

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate API and website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://user:password@127.0.0.1:5432/spire

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run OASIS-E2 contract regressions
        run: npx --no-install tsx --test tests/oasis-e2-contract.regression.test.ts

      - name: Validate Prisma and API
        run: npm run check

      - name: Verify compiled SPIRE route registration
        run: node scripts/verify-spire-route-registration.mjs

      - name: Validate browser workflow modules
        run: |
          node --check careers-admin-workflow.js
          node --check admin-railway.js
          node --check employee-login-railway.js
          node --check employee-portal-railway.js

      - name: Build static website
        run: npm run build:web

      - name: Verify public output
        run: |
          test -f dist-web/index.html
          test -f dist-web/services/community-living/index.html
          test -f dist-web/careers.html
          test -f dist-web/applydsp.html
          test -f dist-web/applydriver.html
          test -f dist-web/applylpn.html
          test -f dist-web/applygeneral.html
          test -f dist-web/applicant-portal.html
          test -f dist-web/careers-admin-workflow.js
          test -f dist-web/admin-railway.js
          test -f dist-web/employee-login-railway.js
          test -f dist-web/employee-portal-railway.js
          test ! -e dist-web/package.json
          test ! -e dist-web/package-lock.json
          test ! -e dist-web/railway.json
          test ! -e dist-web/railway.frontend.json
          test ! -e dist-web/api
          test ! -e dist-web/prisma
          unexpected_json="$(find dist-web -maxdepth 1 -type f -name '*.json' ! -name 'education-catalog.json' ! -name 'vercel.json' -print -quit)"
          test -z "$unexpected_json"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  migration-smoke:
    name: Apply migrations and run intake admission DB regression
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spire
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d spire"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/spire?schema=public
      PSQL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/spire

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Bootstrap legacy SPIRE base schema
        run: psql "$PSQL_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci-bootstrap-legacy-base.sql

      - name: Verify deployment prerequisites
        run: npm run db:check-prerequisites

      - name: Apply migration SQL in repository order
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r migration; do
            echo "===== Applying ${migration} ====="
            psql "$PSQL_DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
          done < <(find prisma/migrations -mindepth 2 -maxdepth 2 -type f -name migration.sql | sort)

      - name: Verify expected platform tables exist
        shell: bash
        run: |
          set -euo pipefail
          required_tables=(
            LegalEntity
            SpirePatient
            EnterpriseWorkNotification
            CompanyComplianceItem
            RevenueCycleServiceEvent
            EnterpriseDataQualityIssue
            SecurityAccessReviewCampaign
            CompanyComplianceEvidence
            HomeHealthOasisSpecImport
          )

          for table in "${required_tables[@]}"; do
            exists="$(psql "$PSQL_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "
              SELECT EXISTS (
                SELECT 1
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public'
                  AND c.relname = '${table}'
                  AND c.relkind IN ('r', 'p')
              );
            ")"

            if [[ "$exists" != "t" ]]; then
              echo "Missing expected platform table: ${table}" >&2
              exit 1
            fi

            echo "Verified platform table: ${table}"
          done

      - name: Verify OASIS-E2 spec-ingestion hard stops
        shell: bash
        run: |
          set -euo pipefail
          required_columns="$(psql "$PSQL_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*)
            FROM information_schema.columns
            WHERE table_schema='public'
              AND (table_name,column_name) IN (
                ('HomeHealthOasisSpecVersion','sourcePackageSha256'),
                ('HomeHealthOasisSpecVersion','normalizedDefinitionSha256'),
                ('HomeHealthOasisSpecVersion','submissionDefinition'),
                ('HomeHealthOasisAssessment','transactionMode'),
                ('HomeHealthIqiesSubmission','payloadBytes'),
                ('HomeHealthIqiesSubmission','specDefinitionSha256')
              );
          ")"
          test "$required_columns" = "6"

          trigger_count="$(psql "$PSQL_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "
            SELECT count(*) FROM pg_trigger
            WHERE NOT tgisinternal
              AND tgrelid='public.\"HomeHealthOasisSpecImport\"'::regclass
              AND tgname IN ('HomeHealthOasisSpecImport_no_update','HomeHealthOasisSpecImport_no_delete');
          ")"
          test "$trigger_count" = "2"

          registered_state="$(psql "$PSQL_DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "
            SELECT \"status\" || ':' || jsonb_array_length(\"itemDefinitions\") || ':' || jsonb_array_length(\"editRules\")
            FROM \"HomeHealthOasisSpecVersion\"
            WHERE \"itemSetVersionCode\"='E2-042026' AND \"submissionSpecVersion\"='3.02'
            LIMIT 1;
          ")"
          if [[ "$registered_state" != "REGISTERED:0:0" ]]; then
            echo "OASIS-E2 3.02 must remain REGISTERED with empty official definitions until the verified CMS package is imported; got ${registered_state}" >&2
            exit 1
          fi

      - name: Install production Client Intake transforms
        shell: bash
        run: |
          set -euo pipefail
          node scripts/install-client-intake-automatic-promotion.mjs
          node scripts/verify-client-intake-automatic-promotion.mjs
          node scripts/install-client-intake-master-data-normalization.mjs
          node scripts/verify-client-intake-master-data-normalization.mjs
          node scripts/install-client-intake-legal-consent-normalization.mjs
          node scripts/verify-client-intake-legal-consent-normalization.mjs

      - name: Run database-backed Client Intake to SPIRE admission regression
        run: npx --no-install tsx tests/client-intake-spire-admission.database.regression.ts
