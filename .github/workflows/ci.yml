name: CI

on:
  push:
    branches:
      - main
      - feature/spire-ehr-platform
  pull_request:
    branches:
      - main
      - feature/spire-ehr-platform

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate API and website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://user:password@127.0.0.1:5432/spire

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate Prisma and API
        run: npm run check

      - name: Validate browser workflow modules
        run: |
          node --check careers-admin-workflow.js
          node --check admin-railway.js
          node --check employee-login-railway.js
          node --check employee-portal-railway.js

      - name: Build static website
        run: npm run build:web

      - name: Verify public output
        run: |
          test -f dist-web/index.html
          test -f dist-web/services/community-living/index.html
          test -f dist-web/careers.html
          test -f dist-web/applydsp.html
          test -f dist-web/applydriver.html
          test -f dist-web/applylpn.html
          test -f dist-web/applygeneral.html
          test -f dist-web/applicant-portal.html
          test -f dist-web/careers-admin-workflow.js
          test -f dist-web/admin-railway.js
          test -f dist-web/employee-login-railway.js
          test -f dist-web/employee-portal-railway.js
          test ! -e dist-web/package.json
          test ! -e dist-web/package-lock.json
          test ! -e dist-web/railway.json
          test ! -e dist-web/railway.frontend.json
          test ! -e dist-web/api
          test ! -e dist-web/prisma
          unexpected_json="$(find dist-web -maxdepth 1 -type f -name '*.json' ! -name 'education-catalog.json' ! -name 'vercel.json' -print -quit)"
          test -z "$unexpected_json"

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  migration-smoke:
    name: Apply all Prisma migrations on supported legacy baseline
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spire
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d spire"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/spire?schema=public

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Bootstrap legacy SPIRE base schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/ci-bootstrap-legacy-base.sql

      - name: Verify deployment prerequisites
        run: npm run db:check-prerequisites

      - name: Apply complete migration history
        run: npm run db:migrate:deploy

      - name: Verify no unapplied migrations remain
        run: npx prisma migrate status
