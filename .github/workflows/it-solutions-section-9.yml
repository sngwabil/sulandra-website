name: Section 9 IT Solutions Verification

on:
  push:
    branches:
      - backport/section-9-it-solutions
      - backport/section-9b-it-agent-workbench
      - backport/section-9c-trusted-coding-worker
      - release/sulandra-1.0
    paths:
      - 'IT_SOLUTIONS_ARCHITECTURE.md'
      - 'api/src/it-solutions-routes.ts'
      - 'api/src/it-agent-workbench-routes.ts'
      - 'api/src/it-coding-worker.ts'
      - 'it-solutions.html'
      - 'assets/admin-it-solutions-hero-launcher.js'
      - 'assets/it-coding-worker-ui.js'
      - 'scripts/install-it-solutions-*.mjs'
      - 'scripts/install-it-agent-workbench.mjs'
      - 'scripts/install-it-coding-worker.mjs'
      - 'scripts/install-it-coding-worker-ui.mjs'
      - 'scripts/verify-it-solutions-powerhouse.mjs'
      - 'scripts/verify-it-agent-workbench.mjs'
      - 'scripts/verify-it-coding-worker.mjs'
      - 'scripts/install-employee-support.mjs'
      - 'scripts/install-intranet-control-link.mjs'
      - '.github/workflows/it-solutions-section-9.yml'
  pull_request:
    branches:
      - release/sulandra-1.0

permissions:
  contents: read

concurrency:
  group: it9-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: IT Solutions runtime, SIA, agent, coding worker, login, and portal safety
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Validate section 9 scripts
        run: |
          node --check scripts/install-it-solutions-powerhouse.mjs
          node --check scripts/install-it-solutions-navigation.mjs
          node --check scripts/verify-it-solutions-powerhouse.mjs
          node --check scripts/install-it-agent-workbench.mjs
          node --check scripts/verify-it-agent-workbench.mjs
          node --check scripts/install-it-coding-worker.mjs
          node --check scripts/install-it-coding-worker-ui.mjs
          node --check scripts/verify-it-coding-worker.mjs
          node --check assets/admin-it-solutions-hero-launcher.js
          node --check assets/it-coding-worker-ui.js

      - name: Verify IT operations, agent, and coding-worker safety contracts
        run: |
          node scripts/verify-it-solutions-powerhouse.mjs
          node scripts/verify-it-agent-workbench.mjs
          node scripts/install-employee-support.mjs
          node scripts/verify-it-coding-worker.mjs

      - name: Preserve separate Employee and Admin login doors
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Administrator sign in' admin-login.html
          grep -Fq 'AUTHORIZED ACCESS ONLY' admin-login.html
          grep -Fq '/admin-login.html' employee-login.html
          grep -Fq 'Employee Sign In' employee-login.html
          ! grep -Fq 'access the employee or administrative tools permitted by your assigned role' employee-login.html

      - name: Preserve richer 1.0 SIA surface
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Sulandra Intelligent Assistant' sia.html
          grep -Fq 'Ask SIA anything' sia.html
          grep -Fq 'System Health' sia.html
          grep -Fq 'My Requests' sia.html
          grep -Fq 'SIA Knowledge' sia.html

      - name: Build canonical API chain
        run: npm run build

      - name: Verify compiled IT route order
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-it-solutions-powerhouse.mjs
          node scripts/verify-it-agent-workbench.mjs
          node scripts/verify-it-coding-worker.mjs
          node - <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('api/dist/onboarding-bootstrap.js','utf8');
          const sia=s.indexOf('registerSIARoutes({ app, prisma, authOf, requireRoles });');
          const it=s.indexOf('registerITSolutionsRoutes({ app, prisma, authOf, requireRoles });');
          const agent=s.indexOf('registerITAgentWorkbenchRoutes({ app, prisma, authOf, requireRoles });');
          const worker=s.indexOf('registerITCodingWorkerRoutes({ app, prisma, authOf, requireRoles');
          if(sia<0||it<0||agent<0||worker<0||it<sia||agent<it||worker<agent) throw new Error('Compiled route order must remain SIA -> IT Solutions -> privileged IT Agent -> trusted coding worker');
          NODE

      - name: Build and verify static Admin launchers
        run: npm run build:web

      - name: Verify published IT Agent portal, coding-worker controls, and buttons
        shell: bash
        run: |
          set -euo pipefail
          test -f dist-web/it-solutions.html
          test -f dist-web/assets/admin-it-solutions-hero-launcher.js
          test -f dist-web/assets/it-coding-worker-ui.js
          grep -Fq 'Sulandra IT Solutions' dist-web/it-solutions.html
          grep -Fq 'Resolved Compliance Archive' dist-web/it-solutions.html
          grep -Fq 'data-view="agent"' dist-web/it-solutions.html
          grep -Fq 'Sulandra IT Agent' dist-web/it-solutions.html
          grep -Fq 'Action Center' dist-web/it-solutions.html
          grep -Fq 'Ask IT Agent' dist-web/it-solutions.html
          grep -Fq 'Post a news card to the intranet' dist-web/it-solutions.html
          grep -Fq 'original Friday safety meme' dist-web/it-solutions.html
          grep -Fq 'Email all employees' dist-web/it-solutions.html
          grep -Fq 'Add a new button next to Operations' dist-web/it-solutions.html
          grep -Fq '/assets/it-coding-worker-ui.js?v=20260828-worker-1' dist-web/it-solutions.html
          grep -Fq 'Approve &amp; Run' dist-web/assets/it-coding-worker-ui.js
          grep -Fq '/api/it-solutions/coding-worker/remediations/' dist-web/assets/it-coding-worker-ui.js
          grep -Fq 'PR-only Codex coding worker' dist-web/assets/it-coding-worker-ui.js
          grep -Fq 'ownerOperationsLauncher' dist-web/assets/admin-it-solutions-hero-launcher.js
          grep -Fq 'ownerITSolutionsLauncher' dist-web/assets/admin-it-solutions-hero-launcher.js
          grep -Fq "href = '/it-solutions.html'" dist-web/assets/admin-it-solutions-hero-launcher.js
          grep -Fq "insertAdjacentElement('afterend', link)" dist-web/assets/admin-it-solutions-hero-launcher.js
          grep -Fq '/assets/admin-it-solutions-hero-launcher.js?v=20260827-it-solutions-hero-1' dist-web/admin.html
          for f in dist-web/admin.html dist-web/admin-operations.html; do
            grep -Fq 'href="/it-solutions.html"' "$f"
            grep -Fq "window.location.href='/it-solutions.html'" "$f"
            grep -Fq '>IT Solutions<' "$f"
          done
