name: Terminal VPS Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - release/sulandra-1.0
    paths:
      - Dockerfile.terminal-executor
      - Dockerfile.terminal-session
      - Dockerfile.terminal-egress
      - terminal-execution-plane/**
      - terminal-session-agent/**
      # Every script copied by Dockerfile.terminal-executor is listed here.
      # Keeping this list aligned means Codebase project lifecycle repairs reach
      # the execution plane instead of stopping at the Railway gateway.
      - scripts/fix-codebase-independent-workspace.mjs
      - scripts/fix-codebase-project-session-recovery.mjs
      - scripts/fix-terminal-resource-monitor.mjs
      - scripts/fix-workspace-ide-agent-transport.mjs
      - scripts/fix-workspace-proxy-abort.mjs
      - scripts/fix-workspace-proxy-streaming.mjs
      - scripts/install-codebase-project-control.mjs
      - scripts/install-codebase-workspace-reuse.mjs
      - scripts/install-terminal-executor-ha-reconcile.mjs
      - scripts/install-terminal-history-proxy.mjs
      - scripts/install-terminal-industry-hardening.mjs
      - scripts/install-terminal-prompt-cursor.mjs
      - scripts/install-terminal-security-audit.mjs
      - scripts/install-terminal-session-recovery.mjs
      - scripts/install-terminal-unrestricted-dev.mjs
      - scripts/install-workspace-ide-live-preview.mjs
      - infra/terminal-vps/**
      - .github/workflows/terminal-vps-deploy.yml

permissions:
  contents: read

jobs:
  deploy-terminal-vps:
    name: Deploy terminal execution plane
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VPS_HOST: ${{ secrets.TERMINAL_VPS_HOST }}
      VPS_USER: ${{ secrets.TERMINAL_VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.TERMINAL_VPS_SSH_KEY }}
    steps:
      - name: Check out release
        uses: actions/checkout@v4

      - name: Check deployment credentials
        id: gate
        shell: bash
        run: |
          if [[ -n "$VPS_HOST" && -n "$VPS_USER" && -n "$VPS_SSH_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Terminal VPS deploy skipped because TERMINAL_VPS_HOST, TERMINAL_VPS_USER, or TERMINAL_VPS_SSH_KEY is not configured."
          fi

      - name: Configure SSH
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          KEY_FILE="$HOME/.ssh/terminal-vps"
          if grep -q 'BEGIN OPENSSH PRIVATE KEY' <<<"$VPS_SSH_KEY"; then
            printf '%s\n' "$VPS_SSH_KEY" | tr -d '\r' > "$KEY_FILE"
          else
            printf '%s' "$VPS_SSH_KEY" | tr -d '\r\n ' | base64 --decode > "$KEY_FILE"
          fi
          chmod 0600 "$KEY_FILE"
          if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "::error::TERMINAL_VPS_SSH_KEY is not a valid OpenSSH private key. Store either the full multiline private key or its base64 encoding."
            exit 1
          fi
          if ! ssh-keyscan -T 10 -t ed25519 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null; then
            ssh-keyscan -T 10 -t rsa -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Package execution-plane release
        if: steps.gate.outputs.enabled == 'true'
        run: |
          tar -czf /tmp/sulandra-terminal-release.tgz \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./api/node_modules' \
            --exclude='./dist-web' \
            --exclude='./coverage' \
            --exclude='./infra/terminal-vps/.env' \
            .

      - name: Upload release
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          for attempt in 1 2 3 4 5; do
            if scp \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -i ~/.ssh/terminal-vps \
              /tmp/sulandra-terminal-release.tgz \
              "$VPS_USER@$VPS_HOST:/tmp/sulandra-terminal-release.tgz"; then
              ok=true
              break
            fi
            echo "SCP attempt $attempt failed; retrying after backoff..." >&2
            sleep $((attempt * 5))
          done
          if [[ "$ok" != true ]]; then
            echo "::error::Unable to upload terminal release after 5 SSH attempts."
            exit 1
          fi

      - name: Deploy and verify HA terminal stack
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/terminal-vps-remote-deploy.sh <<'REMOTE'
          set -euo pipefail
          SOURCE=/srv/sulandra-terminal/source
          ARCHIVE=/tmp/sulandra-terminal-release.tgz

          if [[ ! -f "$ARCHIVE" ]]; then
            echo "Terminal release archive is missing on the VPS." >&2
            exit 1
          fi

          sudo mkdir -p "$SOURCE"
          sudo tar -xzf "$ARCHIVE" -C "$SOURCE"

          if [[ ! -f "$SOURCE/infra/terminal-vps/.env" ]]; then
            echo "Existing terminal VPS .env is missing; refusing to rotate the execution token automatically." >&2
            exit 1
          fi
          if [[ ! -f "$SOURCE/infra/terminal-vps/deploy.sh" ]]; then
            echo "Release does not contain infra/terminal-vps/deploy.sh; refusing deployment." >&2
            sudo find "$SOURCE" -maxdepth 4 -type f -print | sort | head -200 >&2 || true
            exit 1
          fi

          DOMAIN="$(sudo awk -F= '/^TERMINAL_EXECUTION_DOMAIN=/{print substr($0,index($0,"=")+1); exit}' "$SOURCE/infra/terminal-vps/.env")"
          EMAIL="$(sudo awk -F= '/^ACME_EMAIL=/{print substr($0,index($0,"=")+1); exit}' "$SOURCE/infra/terminal-vps/.env")"
          test -n "$DOMAIN"
          test -n "$EMAIL"

          cd "$SOURCE"
          sudo bash "$SOURCE/infra/terminal-vps/deploy.sh" "$DOMAIN" "$EMAIL"

          # Delete the uploaded release only after the full deploy and health check succeed.
          sudo rm -f "$ARCHIVE"
          REMOTE

          sleep 5
          ok=false
          for attempt in 1 2 3 4 5; do
            if ssh \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=3 \
              -i ~/.ssh/terminal-vps \
              "$VPS_USER@$VPS_HOST" \
              'bash -se' < /tmp/terminal-vps-remote-deploy.sh; then
              ok=true
              break
            fi
            echo "Remote deploy SSH attempt $attempt failed; retrying after backoff..." >&2
            sleep $((attempt * 5))
          done
          if [[ "$ok" != true ]]; then
            echo "::error::Unable to run terminal VPS deployment after 5 SSH attempts."
            exit 1
          fi

      - name: Verify execution edge from outside the VPS
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          for attempt in $(seq 1 10); do
            code="$(curl -4 -sS --connect-timeout 3 --max-time 6 -o /dev/null -w '%{http_code}' https://terminal-exec.sulandrahealth.com/healthz || true)"
            echo "External execution edge attempt ${attempt}: HTTP ${code:-transport-failure}"
            [[ "$code" == "401" ]] || failures=$((failures + 1))
            sleep 1
          done
          if (( failures > 0 )); then
            echo "::error::Execution plane passed its VPS-local check but failed ${failures}/10 public IPv4 probes."
            exit 1
          fi

      - name: Verify Railway gateway readiness after promotion
        if: steps.gate.outputs.enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 30); do
            code="$(curl -sS --connect-timeout 3 --max-time 7 -o /tmp/gateway-health.json -w '%{http_code}' https://sulandra-coding-terminal-worker-production.up.railway.app/health || true)"
            body="$(cat /tmp/gateway-health.json 2>/dev/null || true)"
            if [[ "$code" == "200" ]] && grep -Fq '"ready":true' <<<"$body" && grep -Fq '"healthy":true' <<<"$body"; then
              echo "Railway gateway reached the promoted execution plane on attempt ${attempt}."
              ready=true
              break
            fi
            echo "Railway gateway readiness attempt ${attempt}: HTTP ${code:-transport-failure}; waiting..."
            sleep 4
          done
          if [[ "$ready" != true ]]; then
            echo '::error::Promoted execution plane is not reachable from the Railway gateway after two minutes.'
            cat /tmp/gateway-health.json 2>/dev/null || true
            exit 1
          fi
