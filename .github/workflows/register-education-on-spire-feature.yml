name: Register education routes on SPIRE feature branch

on:
  push:
    branches:
      - feature/spire-ehr-platform
    paths:
      - '.github/workflows/register-education-on-spire-feature.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spire-ehr-platform
          fetch-depth: 0
      - name: Register education API routes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('api/src/careers-routes.ts')
          text = path.read_text(encoding='utf-8')

          import_line = "import { registerEducationRoutes } from './education-routes.js';"
          import_anchor = "import { z } from 'zod';"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('zod import anchor not found; no changes made')
              text = text.replace(import_anchor, import_anchor + '\n' + import_line, 1)

          call_line = '  registerEducationRoutes(app, prisma, helpers);'
          call_anchor = '  const { authOf, requireRoles, audit } = helpers;'
          if call_line not in text:
              if call_anchor not in text:
                  raise SystemExit('careers route helper anchor not found; no changes made')
              text = text.replace(call_anchor, call_anchor + '\n\n' + call_line, 1)

          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "Sulandra Production Automation"
          git config user.email "admin@sulandrahealth.com"
          git add api/src/careers-routes.ts
          if git diff --cached --quiet; then
            echo "Education routes are already registered."
          else
            git commit -m "Wire education assignment routes into SPIRE feature branch"
            git push origin feature/spire-ehr-platform
          fi
