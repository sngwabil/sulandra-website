name: SPIRE Break Glass Race Hotfix

on:
  push:
    branches:
      - feature/spire-ehr-platform

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spire-ehr-platform
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Make break-glass temporary assignment insert atomic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('api/src/spire-enterprise-parity-routes.ts')
          source = path.read_text()
          old = '''const glass=active[0];if(glass&&!glass.temporaryAssignmentId){const exists=await prisma.$queryRawUnsafe<Array<{id:string}>>(`SELECT "id" FROM "SpireEmployeeClientAssignment" WHERE "organizationId"=$1 AND "legalEntityId"=$2 AND "userId"=$3 AND "clientId"=$4 LIMIT 1`,a.organizationId,eid,a.userId,patientId).catch(()=>[]);if(!exists[0]){const bridgeId=randomUUID();await prisma.$transaction(async tx=>{await tx.$executeRawUnsafe(`INSERT INTO "SpireEmployeeClientAssignment"("id","organizationId","legalEntityId","userId","clientId","assignedByUserId","createdAt") VALUES($1,$2,$3,$4,$5,$4,NOW())`,bridgeId,a.organizationId,eid,a.userId,patientId);await tx.$executeRawUnsafe(`UPDATE "SpireBreakGlassAccess" SET "temporaryAssignmentId"=$1 WHERE "id"=$2 AND "status"='ACTIVE'`,bridgeId,glass.id);});}}'''
          new = '''const glass=active[0];if(glass&&!glass.temporaryAssignmentId){const exists=await prisma.$queryRawUnsafe<Array<{id:string}>>(`SELECT "id" FROM "SpireEmployeeClientAssignment" WHERE "organizationId"=$1 AND "legalEntityId"=$2 AND "userId"=$3 AND "clientId"=$4 LIMIT 1`,a.organizationId,eid,a.userId,patientId).catch(()=>[]);if(!exists[0]){const bridgeId=randomUUID();await prisma.$transaction(async tx=>{const inserted=await tx.$queryRawUnsafe<Array<{id:string}>>(`INSERT INTO "SpireEmployeeClientAssignment"("id","organizationId","legalEntityId","userId","clientId","assignedByUserId","createdAt") VALUES($1,$2,$3,$4,$5,$4,NOW()) ON CONFLICT ("organizationId","legalEntityId","userId","clientId") WHERE "legalEntityId" IS NOT NULL DO NOTHING RETURNING "id"`,bridgeId,a.organizationId,eid,a.userId,patientId);if(inserted[0]){const linked=await tx.$executeRawUnsafe(`UPDATE "SpireBreakGlassAccess" SET "temporaryAssignmentId"=$1 WHERE "id"=$2 AND "status"='ACTIVE' AND "temporaryAssignmentId" IS NULL`,bridgeId,glass.id);if(!linked)await tx.$executeRawUnsafe(`DELETE FROM "SpireEmployeeClientAssignment" WHERE "id"=$1 AND "organizationId"=$2 AND "legalEntityId"=$3 AND "userId"=$4 AND "clientId"=$5`,bridgeId,a.organizationId,eid,a.userId,patientId);}});}}'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one vulnerable break-glass bridge block, found {count}')
          path.write_text(source.replace(old, new))
          PY

      - name: Type-check patched backend
        run: npx tsc -p api/tsconfig.json --noEmit

      - name: Commit hotfix to SPIRE branch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/src/spire-enterprise-parity-routes.ts
          git diff --cached --quiet && { echo 'No source change required'; exit 0; }
          git commit -m "Fix SPIRE break-glass assignment race"
          git push origin HEAD:feature/spire-ehr-platform
