name: Codebase Project Manager

on:
  pull_request:
    paths:
      - 'assets/codebase-project-manager.js'
      - 'scripts/install-codebase-project-manager-ui.mjs'
      - 'scripts/install-codebase-project-control.mjs'
      - 'scripts/install-codebase-project-gateway.mjs'
      - 'Dockerfile.frontend'
      - 'Dockerfile.coding-terminal'
      - 'Dockerfile.terminal-executor'
      - '.github/workflows/codebase-project-manager.yml'
  push:
    branches:
      - release/sulandra-1.0
    paths:
      - 'assets/codebase-project-manager.js'
      - 'scripts/install-codebase-project-manager-ui.mjs'
      - 'scripts/install-codebase-project-control.mjs'
      - 'scripts/install-codebase-project-gateway.mjs'
      - 'Dockerfile.frontend'
      - 'Dockerfile.coding-terminal'
      - 'Dockerfile.terminal-executor'
      - '.github/workflows/codebase-project-manager.yml'

permissions:
  contents: read

jobs:
  project-control-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify browser project manager syntax
        run: |
          set -euo pipefail
          node --check assets/codebase-project-manager.js
          node --check scripts/install-codebase-project-manager-ui.mjs
          node --check scripts/install-codebase-project-control.mjs
          node --check scripts/install-codebase-project-gateway.mjs

      - name: Build patched executor contract
        run: |
          set -euo pipefail
          cp terminal-execution-plane/server.mjs /tmp/executor.mjs
          node scripts/install-terminal-industry-hardening.mjs /tmp/executor.mjs
          node scripts/fix-terminal-resource-monitor.mjs /tmp/executor.mjs
          node scripts/install-workspace-ide-live-preview.mjs /tmp/executor.mjs
          node scripts/fix-workspace-proxy-abort.mjs /tmp/executor.mjs
          node scripts/fix-workspace-ide-agent-transport.mjs /tmp/executor.mjs
          node scripts/fix-workspace-proxy-streaming.mjs /tmp/executor.mjs
          node scripts/install-terminal-security-audit.mjs /tmp/executor.mjs
          node scripts/install-terminal-history-proxy.mjs /tmp/executor.mjs
          node scripts/install-terminal-session-recovery.mjs /tmp/executor.mjs
          node scripts/install-terminal-executor-ha-reconcile.mjs /tmp/executor.mjs
          node scripts/install-codebase-workspace-reuse.mjs /tmp/executor.mjs
          node scripts/install-terminal-unrestricted-dev.mjs /tmp/executor.mjs executor
          node scripts/fix-codebase-independent-workspace.mjs /tmp/executor.mjs
          node scripts/install-codebase-project-control.mjs /tmp/executor.mjs
          node --check /tmp/executor.mjs
          grep -Fq 'CODEBASE_PROJECT_CONTROL_V1' /tmp/executor.mjs
          grep -Fq "app.post('/v1/workspaces/:workspaceId/codebase/projects/clone'" /tmp/executor.mjs
          grep -Fq "app.put('/v1/workspaces/:workspaceId/codebase/projects/:project/file'" /tmp/executor.mjs
          grep -Fq "app.post('/v1/workspaces/:workspaceId/codebase/projects/:project/git/commit'" /tmp/executor.mjs
          grep -Fq "app.post('/v1/workspaces/:workspaceId/codebase/projects/:project/railway/deploy'" /tmp/executor.mjs
          grep -Fq '.sulandra-projects' /tmp/executor.mjs

      - name: Build patched terminal gateway contract
        run: |
          set -euo pipefail
          cp coding-terminal-worker/server.mjs /tmp/gateway.mjs
          node scripts/install-terminal-gateway-ha.mjs /tmp/gateway.mjs
          node scripts/install-workspace-ide-live-preview.mjs /tmp/gateway.mjs
          node scripts/fix-workspace-proxy-abort.mjs /tmp/gateway.mjs
          node scripts/fix-workspace-proxy-streaming.mjs /tmp/gateway.mjs
          node scripts/fix-workspace-browser-session.mjs /tmp/gateway.mjs
          node scripts/fix-workspace-ticket-cors.mjs /tmp/gateway.mjs
          node scripts/install-terminal-history-proxy.mjs /tmp/gateway.mjs
          node scripts/install-codebase-pty-compat.mjs /tmp/gateway.mjs
          node scripts/install-codebase-pty-session-resume.mjs /tmp/gateway.mjs
          node scripts/fix-codebase-preview-owner-namespace.mjs /tmp/gateway.mjs
          node scripts/install-codebase-project-gateway.mjs /tmp/gateway.mjs
          node --check /tmp/gateway.mjs
          node scripts/verify-workspace-browser-session.mjs /tmp/gateway.mjs
          node scripts/verify-workspace-ticket-cors.mjs /tmp/gateway.mjs
          grep -Fq 'CODEBASE_PROJECT_GATEWAY_V1' /tmp/gateway.mjs
          grep -Fq "app.get('/codebase/projects'" /tmp/gateway.mjs
          grep -Fq "app.post('/codebase/projects/clone'" /tmp/gateway.mjs
          grep -Fq "app.post('/codebase/projects/:project/railway/deploy'" /tmp/gateway.mjs

      - name: Publish and inspect production Codebase document
        run: |
          set -euo pipefail
          cp Codebase.html /tmp/Codebase.html
          node scripts/install-codebase-backend-adapter.mjs /tmp/Codebase.html
          node scripts/install-codebase-project-manager-ui.mjs /tmp/Codebase.html
          node scripts/fix-codebase-independent-branding.mjs /tmp/Codebase.html
          grep -Fq '<div class="brand-sub">Independent workspace</div>' /tmp/Codebase.html
          grep -Fq '/assets/codebase-project-manager.js?v=20260905-project-manager-1' /tmp/Codebase.html
          grep -Fq 'Deploy as New Railway Project' assets/codebase-project-manager.js
          grep -Fq 'Connect Existing + Deploy' assets/codebase-project-manager.js
          ! grep -Fq 'base/sulandra-1.0' /tmp/Codebase.html
          echo 'Codebase project manager publication contract verified.'
