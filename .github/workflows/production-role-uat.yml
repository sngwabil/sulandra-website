name: Production Role UAT

on:
  push:
    branches:
      - feature/spire-ehr-platform
  pull_request:
    branches:
      - feature/spire-ehr-platform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-role-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  role-uat:
    name: Login-first role-by-role production UAT
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Verify role UAT source contract
        run: npm run verify:role-uat

      - name: Wait for exact production role-UAT deployment
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          contract='20260810-role-uat-1'
          for attempt in $(seq 1 60); do
            portal="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/employee-portal.html || true)"
            runtime="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/employee-portal-railway.js || true)"
            login="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/assets/employee-login-railway.js || true)"
            guard="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/assets/employee-role-navigation-guard.js || true)"
            admin="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/admin-railway.js || true)"
            roles="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/assets/role-workspace.js || true)"
            doo="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/doo.html || true)"
            ceo="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/ceo.html || true)"
            home_manager="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/home-manager.html || true)"
            residential="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/scls-residential.html || true)"
            if grep -q "$contract" <<<"$portal" \
              && grep -q "$contract" <<<"$runtime" \
              && grep -q "$contract" <<<"$guard" \
              && grep -q 'ADMIN_LANDING_ROLES' <<<"$login" \
              && grep -q 'function landingForRole(role)' <<<"$login" \
              && grep -Fq 'if (role === "DOO") return "doo.html";' <<<"$login" \
              && grep -Fq 'if (role === "CEO") return "ceo.html";' <<<"$login" \
              && grep -Fq 'role !== "ADMINISTRATOR"' <<<"$admin" \
              && grep -Fq 'role === "DOO" ? "doo.html"' <<<"$admin" \
              && grep -Fq 'Manage My Home Team' <<<"$roles" \
              && grep -Fq 'ownerMain: "/admin.html"' <<<"$roles" \
              && grep -Fq 'data-role-workspace="DOO"' <<<"$doo" \
              && grep -Fq 'data-role-workspace="CEO"' <<<"$ceo" \
              && grep -Fq 'data-role-workspace="HOUSE_MANAGER"' <<<"$home_manager" \
              && grep -Fq 'canManageStaff' <<<"$residential" \
              && grep -Fq "const validTabs=new Set(['residents','staff','tasks','handoff','log'])" <<<"$residential" \
              && grep -Fq "history.replaceState(null,'','#'+state.tab)" <<<"$residential"; then
              echo "Exact dedicated role-workspace and assigned-home manager production contract is live."
              exit 0
            fi
            echo "Waiting for dedicated role-workspace production deployment (${attempt}/60)..."
            sleep 15
          done
          echo "Timed out waiting for the exact dedicated role-workspace production deployment." >&2
          exit 1

      - name: Install Playwright browser runtime
        if: github.event_name != 'pull_request'
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run live production role-by-role UAT
        if: github.event_name != 'pull_request'
        env:
          UAT_BASE_URL: https://www.sulandrahealth.com
        run: npx playwright test --config=playwright.role-uat.config.mjs
