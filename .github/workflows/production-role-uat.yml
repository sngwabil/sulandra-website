name: Production Role UAT

on:
  push:
    branches:
      - release/sulandra-1.0
  pull_request:
    branches:
      - release/sulandra-1.0
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-role-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  role-uat:
    name: Two-door role-by-role production UAT
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Verify role UAT source contract
        run: npm run verify:role-uat

      - name: Wait for exact production two-door deployment
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          contract='20260810-role-uat-1'
          for attempt in $(seq 1 60); do
            portal="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/employee-portal.html || true)"
            runtime="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/employee-portal-railway.js || true)"
            employee_login_html="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/employee-login.html || true)"
            employee_login="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/assets/employee-login-railway.js || true)"
            admin_login_html="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/admin-login.html || true)"
            admin_login="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/admin-login-railway.js || true)"
            guard="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/assets/employee-role-navigation-guard.js || true)"
            cross="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/assets/admin-cross-workspace-launcher.js || true)"
            roles="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/assets/role-workspace.js || true)"
            residential="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/scls-residential.html || true)"
            if grep -q "$contract" <<<"$portal" \
              && grep -Fq 'Employee Portal is a' <<<"$runtime" \
              && grep -Fq 'Employee username' <<<"$employee_login_html" \
              && grep -Fq 'Administrator Sign In' <<<"$employee_login_html" \
              && grep -Fq 'portal: "EMPLOYEE"' <<<"$employee_login" \
              && grep -Fq 'username.includes("@")' <<<"$employee_login" \
              && grep -Fq 'Sulandra work email' <<<"$admin_login_html" \
              && grep -Fq 'portal: "ADMIN"' <<<"$admin_login" \
              && grep -Fq 'adminAllowed(session)' <<<"$admin_login" \
              && grep -Fq "managementAdminRoles" <<<"$guard" \
              && grep -Fq "/admin-login.html?returnTo=/admin.html" <<<"$guard" \
              && grep -Fq "employeeLogin: '/employee-login.html?returnTo=/employee-portal.html'" <<<"$cross" \
              && grep -Fq 'opensNewTab: true' <<<"$cross" \
              && grep -Fq 'Manage My Home Team' <<<"$roles" \
              && grep -Fq 'canManageStaff' <<<"$residential"; then
              echo "Exact two-door Employee/Admin authentication contract is live."
              exit 0
            fi
            echo "Waiting for two-door production deployment (${attempt}/60)..."
            sleep 15
          done
          echo "Timed out waiting for the exact two-door production deployment." >&2
          exit 1

      - name: Install Playwright browser runtime
        if: github.event_name != 'pull_request'
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run live production role-by-role UAT
        if: github.event_name != 'pull_request'
        env:
          UAT_BASE_URL: https://www.sulandrahealth.com
        run: npx playwright test --config=playwright.role-uat.config.mjs