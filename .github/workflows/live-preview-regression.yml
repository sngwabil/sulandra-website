name: Live Preview Regression

on:
  pull_request:
    branches:
      - release/sulandra-1.0
    paths:
      - Dockerfile.terminal-session
      - Dockerfile.terminal-executor
      - terminal-execution-plane/**
      - terminal-session-agent/**
      - scripts/install-workspace-ide-live-preview.mjs
      - scripts/install-session-agent-ide-bridge.mjs
      - scripts/fix-workspace-ide-agent-transport.mjs
      - .github/workflows/live-preview-regression.yml

permissions:
  contents: read

jobs:
  verify-live-preview:
    name: Verify IDE health and port proxy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TOKEN: ci-preview-token-0123456789abcdef0123456789abcdef
      OWNER: ci-org:ci-user
      SESSION_IMAGE: sulandra-terminal-session:preview-ci
      EXECUTOR_IMAGE: sulandra-terminal-executor:preview-ci
      PROXY_NETWORK: sulandra-preview-ci-proxy
      INTERNAL_NETWORK: sulandra-preview-ci-internal
      CI_ROOT: /tmp/sulandra-preview-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build session and executor images
        run: |
          set -euo pipefail
          docker build -f Dockerfile.terminal-session -t "$SESSION_IMAGE" .
          docker build -f Dockerfile.terminal-executor -t "$EXECUTOR_IMAGE" .

      - name: Start production-shaped execution plane
        run: |
          set -euo pipefail
          rm -rf "$CI_ROOT"
          mkdir -p "$CI_ROOT/seed" "$CI_ROOT/workspaces" "$CI_ROOT/state"
          printf 'preview regression seed\n' > "$CI_ROOT/seed/README.txt"
          sudo chown -R 10001:10001 "$CI_ROOT/workspaces" "$CI_ROOT/state"
          docker network create "$PROXY_NETWORK"
          docker network create --internal "$INTERNAL_NETWORK"
          DOCKER_GID="$(stat -c '%g' /var/run/docker.sock)"
          docker run -d --name sulandra-preview-executor-ci \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --group-add "$DOCKER_GID" \
            -e PORT=8081 \
            -e TERMINAL_EXECUTION_TOKEN="$TOKEN" \
            -e DOCKER_SOCKET_PATH=/var/run/docker.sock \
            -e TERMINAL_SESSION_IMAGE="$SESSION_IMAGE" \
            -e TERMINAL_SEED_PATH=/seed \
            -e TERMINAL_GIT_REPOSITORY=https://github.com/octocat/Hello-World.git \
            -e TERMINAL_GIT_BASE_BRANCH=master \
            -e TERMINAL_WORKSPACE_ROOT=/workspaces \
            -e TERMINAL_WORKSPACE_HOST_ROOT="$CI_ROOT/workspaces" \
            -e TERMINAL_STATE_ROOT=/state \
            -e TERMINAL_DOCKER_NETWORK="$INTERNAL_NETWORK" \
            -e TERMINAL_IDLE_MINUTES=15 \
            -e TERMINAL_MEMORY_BYTES=4294967296 \
            -e TERMINAL_NANO_CPUS=2000000000 \
            -e TERMINAL_PIDS_LIMIT=256 \
            -e TERMINAL_IDE_PORT=13337 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$CI_ROOT/seed:/seed:ro" \
            -v "$CI_ROOT/workspaces:/workspaces" \
            -v "$CI_ROOT/state:/state" \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --network "$PROXY_NETWORK" \
            -p 127.0.0.1:18081:8081 \
            "$EXECUTOR_IMAGE"
          docker network connect "$INTERNAL_NETWORK" sulandra-preview-executor-ci
          ready=0
          for i in {1..60}; do
            if curl -fsS -H "Authorization: Bearer $TOKEN" http://127.0.0.1:18081/healthz >/tmp/preview-health.json 2>/dev/null; then
              if grep -q '"docker":true' /tmp/preview-health.json; then
                ready=1
                break
              fi
            fi
            if ! docker inspect -f '{{.State.Running}}' sulandra-preview-executor-ci 2>/dev/null | grep -q true; then
              echo 'Preview executor exited before becoming healthy.' >&2
              docker logs sulandra-preview-executor-ci >&2 || true
              exit 1
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            echo 'Preview executor did not become healthy within 60 seconds.' >&2
            docker logs sulandra-preview-executor-ci >&2 || true
            exit 1
          fi

      - name: Create real workspace session
        run: |
          set -euo pipefail
          headers=(-H "Authorization: Bearer $TOKEN" -H "x-sulandra-terminal-owner: $OWNER" -H 'Content-Type: application/json')
          workspace_response="$(curl -sS -w $'\n%{http_code}' "${headers[@]}" -X POST http://127.0.0.1:18081/v1/workspaces -d '{}')"
          workspace_status="${workspace_response##*$'\n'}"
          workspace_json="${workspace_response%$'\n'*}"
          if [[ "$workspace_status" != "201" ]]; then
            echo "Workspace creation failed with HTTP $workspace_status: $workspace_json" >&2
            docker logs sulandra-preview-executor-ci >&2 || true
            exit 1
          fi
          workspace_id="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x.workspaceId)' "$workspace_json")"
          session_response="$(curl -sS -w $'\n%{http_code}' "${headers[@]}" -X POST "http://127.0.0.1:18081/v1/workspaces/${workspace_id}/sessions" -d '{"cols":100,"rows":30}')"
          session_status="${session_response##*$'\n'}"
          session_json="${session_response%$'\n'*}"
          if [[ "$session_status" != "201" ]]; then
            echo "Session creation failed with HTTP $session_status: $session_json" >&2
            docker logs sulandra-preview-executor-ci >&2 || true
            exit 1
          fi
          session_id="$(node -e 'const x=JSON.parse(process.argv[1]);process.stdout.write(x.sessionId)' "$session_json")"
          printf '%s' "$workspace_id" >/tmp/preview-workspace-id
          printf '%s' "$session_id" >/tmp/preview-session-id
          cid="$(docker ps -q --filter "label=com.sulandra.session-id=${session_id}" | head -n1)"
          test -n "$cid"
          printf '%s' "$cid" >/tmp/preview-container-id

      - name: Verify code-server is actually ready
        run: |
          set -euo pipefail
          session_id="$(cat /tmp/preview-session-id)"
          cid="$(cat /tmp/preview-container-id)"
          headers=(-H "Authorization: Bearer $TOKEN" -H "x-sulandra-terminal-owner: $OWNER")

          local_ready=0
          local_body=''
          for i in {1..30}; do
            if local_body="$(docker exec "$cid" curl -fsS --max-time 2 http://127.0.0.1:13337/healthz 2>/dev/null)"; then
              local_ready=1
              break
            fi
            sleep 1
          done
          if [[ "$local_ready" != "1" ]]; then
            echo 'code-server is not reachable on loopback inside its own session container' >&2
            docker exec "$cid" sh -lc 'echo "=== processes ==="; ps aux | grep -E "code-server|node" | grep -v grep || true; echo "=== tcp listeners ==="; cat /proc/net/tcp || true; echo "=== code-server log ==="; cat /tmp/sulandra-code-server.log 2>/dev/null || true' >&2 || true
            docker exec "$cid" node -e "const http=require('http');const r=http.get('http://127.0.0.1:13337/healthz',res=>{let b='';res.on('data',d=>b+=d);res.on('end',()=>console.log(res.statusCode,b))});r.on('error',e=>{console.error(e);process.exitCode=1});" >&2 || true
            exit 1
          fi
          echo "Direct session health: $local_body"

          ready=0
          route_status=''
          route_body=''
          for i in {1..30}; do
            response="$(curl -sS --max-time 3 -w $'\n%{http_code}' "${headers[@]}" "http://127.0.0.1:18081/v1/ide/${session_id}/healthz" 2>/tmp/preview-route-curl.err || true)"
            route_status="${response##*$'\n'}"
            route_body="${response%$'\n'*}"
            if [[ "$route_status" == "200" ]] && node -e 'const x=JSON.parse(process.argv[1]);process.exit(["alive","expired"].includes(x.status)?0:1)' "$route_body" 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            echo "Executor IDE health route failed with HTTP ${route_status:-unknown}: ${route_body:-<empty>}" >&2
            echo '=== curl error ===' >&2
            cat /tmp/preview-route-curl.err >&2 || true
            echo '=== session networks ===' >&2
            docker inspect "$cid" --format '{{json .NetworkSettings.Networks}}' >&2 || true
            echo '=== code-server log ===' >&2
            docker exec "$cid" sh -lc 'cat /tmp/sulandra-code-server.log 2>/dev/null || true' >&2 || true
            echo '=== session-agent log ===' >&2
            docker logs "$cid" >&2 || true
            echo '=== executor log ===' >&2
            docker logs sulandra-preview-executor-ci >&2 || true
            exit 1
          fi

      - name: Verify port 3000 preview through exact production proxy path
        run: |
          set -euo pipefail
          session_id="$(cat /tmp/preview-session-id)"
          cid="$(cat /tmp/preview-container-id)"
          docker exec -d "$cid" node -e "require('http').createServer((req,res)=>{res.setHeader('content-type','application/json');res.end(JSON.stringify({ok:true,path:req.url}))}).listen(3000,'127.0.0.1')"
          headers=(-H "Authorization: Bearer $TOKEN" -H "x-sulandra-terminal-owner: $OWNER")
          preview=''
          for i in {1..30}; do
            if preview="$(curl -fsS "${headers[@]}" "http://127.0.0.1:18081/v1/ide/${session_id}/proxy/3000/test" 2>/dev/null)"; then
              if node -e 'const x=JSON.parse(process.argv[1]);process.exit(x.ok===true&&x.path==="/test"?0:1)' "$preview"; then
                exit 0
              fi
            fi
            sleep 0.5
          done
          echo "Preview proxy failed: $preview" >&2
          docker exec "$cid" sh -lc 'cat /tmp/sulandra-code-server.log 2>/dev/null || true' >&2 || true
          docker logs sulandra-preview-executor-ci >&2 || true
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker ps -aq --filter label=com.sulandra.terminal=true | xargs -r docker rm -f || true
          docker rm -f sulandra-preview-executor-ci 2>/dev/null || true
          docker network rm "$INTERNAL_NETWORK" "$PROXY_NETWORK" 2>/dev/null || true
          sudo rm -rf "$CI_ROOT"
