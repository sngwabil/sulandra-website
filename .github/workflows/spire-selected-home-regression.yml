name: SPIRE Selected Home Regression

on:
  push:
    branches:
      - feature/spire-ehr-platform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spire-selected-home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selected-home-chart:
    name: Open selected-home patient chart without freeze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Wait for exact SPIRE frontend runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            html="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/spire.html || true)"
            app="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-app-v2.js?v=20260811-business-uat-9&startup=20260811-domready-1' || true)"
            guard="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-patient-open-guard.js?v=20260811-spire-patient-open-guard-4' || true)"
            chart="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-chart-review-v2.js?v=20260811-spire-chart-review-v2-2' || true)"
            pre="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-workspace-loop-guard.js?v=20260811-workspace-observer-suppression-2' || true)"
            post="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-workspace-loop-restore.js?v=20260811-workspace-observer-suppression-2' || true)"
            if grep -q 'spire-app-v2.js?v=20260811-business-uat-9&startup=20260811-domready-1' <<<"$html" \
              && grep -q 'spire-patient-open-guard.js?v=20260811-spire-patient-open-guard-4' <<<"$html" \
              && grep -q 'spire-workspace-loop-guard.js?v=20260811-workspace-observer-suppression-2' <<<"$html" \
              && grep -q 'spire-workspace-loop-restore.js?v=20260811-workspace-observer-suppression-2' <<<"$html" \
              && grep -q 'BUSINESS_UAT_DEFER_DEEPLINK_UNTIL_DOM_READY' <<<"$app" \
              && grep -q '20260811-spire-patient-open-guard-4' <<<"$guard" \
              && grep -q 'renderedFor' <<<"$chart" \
              && grep -q 'spireWorkspaceObserverSuppressed' <<<"$pre" \
              && grep -q 'spireWorkspaceObserverRestored' <<<"$post"; then
              HTML="$html" python - <<'PY'
          import os
          html=os.environ['HTML']
          names=[
            'spire-workspace-loop-guard.js?v=20260811-workspace-observer-suppression-2',
            'spire-workspace-completion.js?v=20260810-spire-workspaces-1',
            'spire-workspace-loop-restore.js?v=20260811-workspace-observer-suppression-2',
            'spire-workspace-stability.js?v=20260810-spire-workspaces-1',
          ]
          positions=[html.find(name) for name in names]
          if not all(p >= 0 for p in positions) or positions != sorted(positions):
              raise SystemExit(f'unsafe SPIRE runtime order: {positions}')
          PY
              echo 'Exact DOM-ready freeze-safe SPIRE selected-home runtime is live in safe observer order.'
              exit 0
            fi
            echo "Waiting for SPIRE frontend deployment (${attempt}/60)..."
            sleep 10
          done
          echo 'Timed out waiting for DOM-ready freeze-safe SPIRE runtime.' >&2
          exit 1

      - name: Validate freeze-safe runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            spire-app-v2.js \
            spire-patient-open-guard.js \
            spire-workspace-loop-guard.js \
            spire-workspace-loop-restore.js \
            spire-chart-review-v2.js; do
            curl -fsSL --max-time 20 "https://www.sulandrahealth.com/assets/${asset}" -o "/tmp/${asset}"
            node --check "/tmp/${asset}"
          done

      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run selected-home chart regression
        env:
          UAT_BASE_URL: https://www.sulandrahealth.com
        run: npx playwright test tests/00-spire-selected-home-regression.spec.mjs --config=playwright.spire-regression.config.mjs --workers=1 --retries=0

      - name: Upload SPIRE regression trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spire-selected-home-trace-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
