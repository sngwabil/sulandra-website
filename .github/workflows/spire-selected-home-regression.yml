name: SPIRE Selected Home Regression

on:
  push:
    branches:
      - feature/spire-ehr-platform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spire-selected-home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selected-home-chart:
    name: Open selected-home patient chart without freeze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Wait for exact live SPIRE generation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            html="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/spire.html || true)"
            loader="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-home-care-redesign-loader.js?v=20260812-user-master-template-8' || true)"
            chart_owner="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-chart-review-ownership.js?v=20260812-user-master-template-8' || true)"
            chart="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-chart-review-v2.js?v=20260812-spire-chart-review-v2-3' || true)"
            guard="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-patient-open-guard.js?v=20260811-spire-patient-open-guard-7' || true)"
            flowsheet="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/spire/flowsheets.html?patientId=deployment-check' || true)"
            if grep -q 'spire-home-care-redesign-loader.js?v=20260812-user-master-template-8' <<<"$html" \
              && grep -q "VERSION='20260812-user-master-template-8'" <<<"$loader" \
              && grep -q 'spire-chart-review-ownership.js' <<<"$loader" \
              && grep -q '20260812-spire-chart-review-ownership-1' <<<"$chart_owner" \
              && grep -q 'stopImmediatePropagation' <<<"$chart_owner" \
              && grep -q '20260812-chart-review-selected-tab-1' <<<"$chart" \
              && grep -q '20260811-spire-patient-open-guard-7' <<<"$guard" \
              && grep -q 'spire-flowsheet-master.js?v=20260812-spire-flowsheet-master-1' <<<"$flowsheet"; then
              echo 'Exact master-template SPIRE generation is live.'
              exit 0
            fi
            echo "Waiting for SPIRE deployment (${attempt}/60)..."
            sleep 10
          done
          echo 'Timed out waiting for the exact SPIRE generation.' >&2
          exit 1

      - name: Validate live runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            spire-app-v2.js \
            spire-patient-open-guard.js \
            spire-chart-review-v2.js \
            spire-home-care-redesign-loader.js \
            spire-user-template-integration.js \
            spire-chart-review-ownership.js \
            spire-intake-isp-sleep-wiring.js \
            spire-flowsheet-master.js; do
            curl -fsSL --max-time 20 "https://www.sulandrahealth.com/assets/${asset}" -o "/tmp/${asset}"
            node --check "/tmp/${asset}"
          done

      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run selected-home chart regression
        env:
          UAT_BASE_URL: https://www.sulandrahealth.com
        run: npx playwright test tests/00-spire-selected-home-regression.spec.mjs --config=playwright.spire-regression.config.mjs --workers=1 --retries=0

      - name: Upload SPIRE regression trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spire-selected-home-trace-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 3