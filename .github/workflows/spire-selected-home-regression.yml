name: SPIRE Selected Home Regression

on:
  push:
    branches:
      - feature/spire-ehr-platform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spire-selected-home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selected-home-chart:
    name: Open selected-home patient chart without freeze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Wait for exact SPIRE frontend runtime
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            html="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/spire.html || true)"
            flowsheet_html="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/spire/flowsheets.html?patientId=deployment-check' || true)"
            app="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-app-v2.js?v=20260811-business-uat-9&startup=20260811-domready-1' || true)"
            guard="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-patient-open-guard.js?v=20260811-spire-patient-open-guard-7' || true)"
            results="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-results-workspace.js?v=20260811-spire-results-workspace-2' || true)"
            chart="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-chart-review-v2.js?v=20260812-spire-chart-review-v2-3' || true)"
            workstation="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-clinical-workstation.css?v=20260811-spire-clinical-workstation-2' || true)"
            pre="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-workspace-loop-guard.js?v=20260811-workspace-observer-suppression-2' || true)"
            post="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-workspace-loop-restore.js?v=20260811-workspace-observer-suppression-2' || true)"
            master_loader="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-home-care-redesign-loader.js?v=20260812-user-master-template-5' || true)"
            master_runtime="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-user-template-integration.js?v=20260812-user-master-template-5' || true)"
            master_style="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-user-template-integration.css?v=20260812-user-master-template-5' || true)"
            master_layout="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-user-template-layout-fix.css?v=20260812-user-master-template-5' || true)"
            master_final="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-user-template-final-lock.css?v=20260812-user-master-template-5' || true)"
            flowsheet_style="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-flowsheet-master.css?v=20260812-spire-flowsheet-master-1' || true)"
            flowsheet_runtime="$(curl -fsSL --max-time 20 'https://www.sulandrahealth.com/assets/spire-flowsheet-master.js?v=20260812-spire-flowsheet-master-1' || true)"
            if grep -q 'spire-app-v2.js?v=20260811-business-uat-9&startup=20260811-domready-1' <<<"$html" \
              && grep -q 'spire-patient-open-guard.js?v=20260811-spire-patient-open-guard-7' <<<"$html" \
              && grep -q 'spire-results-workspace.js?v=20260811-spire-results-workspace-2' <<<"$html" \
              && grep -q 'spire-chart-review-v2.js?v=20260812-spire-chart-review-v2-3' <<<"$html" \
              && grep -q 'spire-clinical-workstation.css?v=20260811-spire-clinical-workstation-2' <<<"$html" \
              && grep -q 'spire-workspace-loop-guard.js?v=20260811-workspace-observer-suppression-2' <<<"$html" \
              && grep -q 'spire-workspace-loop-restore.js?v=20260811-workspace-observer-suppression-2' <<<"$html" \
              && grep -q 'spire-home-care-redesign-loader.js?v=20260812-user-master-template-5' <<<"$html" \
              && grep -q 'spire-flowsheet-master.css?v=20260812-spire-flowsheet-master-1' <<<"$flowsheet_html" \
              && grep -q 'spire-flowsheet-master.js?v=20260812-spire-flowsheet-master-1' <<<"$flowsheet_html" \
              && grep -q 'BUSINESS_UAT_DEFER_DEEPLINK_UNTIL_DOM_READY' <<<"$app" \
              && grep -q '20260811-spire-patient-open-guard-7' <<<"$guard" \
              && grep -q 'spire:chart-tab-selected' <<<"$guard" \
              && grep -q 'callbackCount > 250' <<<"$guard" \
              && grep -q 'SPIRE_RESULTS_IDEMPOTENT_TAB_LAYOUT' <<<"$results" \
              && grep -q '20260812-chart-review-selected-tab-1' <<<"$chart" \
              && grep -q 'spire:chart-tab-selected' <<<"$chart" \
              && grep -q -- '--sp-ref-ribbon' <<<"$workstation" \
              && grep -q 'grid-template-columns:clamp(230px,13.2vw,270px)' <<<"$workstation" \
              && grep -q 'flex-direction:row!important' <<<"$workstation" \
              && grep -q 'spireWorkspaceObserverSuppressed' <<<"$pre" \
              && grep -q 'spireWorkspaceObserverRestored' <<<"$post" \
              && grep -q "VERSION='20260812-user-master-template-5'" <<<"$master_loader" \
              && grep -q 'spireUserMasterTemplateFinalLock' <<<"$master_loader" \
              && grep -q 'SpireMasterTemplate' <<<"$master_runtime" \
              && grep -q 'spireMasterToolbar' <<<"$master_runtime" \
              && grep -q -- '--spmt-toolbar:#990000' <<<"$master_style" \
              && grep -q 'grid-template-rows:40px 36px minmax(0,1fr)' <<<"$master_layout" \
              && grep -q 'background:linear-gradient(135deg,#050811 0%,#0f172a 100%)' <<<"$master_layout" \
              && grep -q 'border-radius:3px!important' <<<"$master_final" \
              && grep -q 'background:#990000!important' <<<"$flowsheet_style" \
              && grep -q 'spire:flowsheet:preferred-group' <<<"$flowsheet_runtime"; then
              HTML="$html" python - <<'PY'
          import os
          html=os.environ['HTML']
          names=[
            'spire-workspace-loop-guard.js?v=20260811-workspace-observer-suppression-2',
            'spire-workspace-completion.js?v=20260810-spire-workspaces-1',
            'spire-workspace-loop-restore.js?v=20260811-workspace-observer-suppression-2',
            'spire-workspace-stability.js?v=20260810-spire-workspaces-1',
          ]
          positions=[html.find(name) for name in names]
          if not all(p >= 0 for p in positions) or positions != sorted(positions):
              raise SystemExit(f'unsafe SPIRE runtime order: {positions}')
          screen=html.find('spire-screen-controls.css?v=20260811-spire-screen-controls-3')
          workstation=html.find('spire-clinical-workstation.css?v=20260811-spire-clinical-workstation-2')
          master=html.find('spire-home-care-redesign-loader.js?v=20260812-user-master-template-5')
          if screen < 0 or workstation < 0 or workstation < screen:
              raise SystemExit(f'unsafe SPIRE stylesheet order: screen={screen}, workstation={workstation}')
          if master < 0:
              raise SystemExit('user master-template loader missing from deployed SPIRE')
          PY
              echo 'Exact freeze-safe SPIRE runtime, deterministic Chart Review, and master-styled flowsheets are live.'
              exit 0
            fi
            echo "Waiting for SPIRE master-template frontend deployment (${attempt}/60)..."
            sleep 10
          done
          echo 'Timed out waiting for user master-template SPIRE runtime.' >&2
          exit 1

      - name: Validate freeze-safe runtime syntax
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            spire-app-v2.js \
            spire-patient-open-guard.js \
            spire-results-workspace.js \
            spire-workspace-loop-guard.js \
            spire-workspace-loop-restore.js \
            spire-chart-review-v2.js \
            spire-home-care-redesign-loader.js \
            spire-user-template-integration.js \
            spire-flowsheet-master.js; do
            curl -fsSL --max-time 20 "https://www.sulandrahealth.com/assets/${asset}" -o "/tmp/${asset}"
            node --check "/tmp/${asset}"
          done

      - name: Install Chromium
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run selected-home chart regression
        env:
          UAT_BASE_URL: https://www.sulandrahealth.com
        run: npx playwright test tests/00-spire-selected-home-regression.spec.mjs --config=playwright.spire-regression.config.mjs --workers=1 --retries=0

      - name: Upload SPIRE regression trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: spire-selected-home-trace-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 3
