name: Production Business Path UAT

on:
  push:
    branches:
      - feature/spire-ehr-platform
  pull_request:
    branches:
      - feature/spire-ehr-platform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-business-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  business-uat:
    name: Complete end-to-end production business-path UAT
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Verify business UAT source contract
        run: npm run verify:business-uat

      - name: Wait for exact production business-UAT deployment
        shell: bash
        run: |
          set -euo pipefail
          contract='20260810-business-uat-1'
          home_health_rail_generation='20260810-home-health-rail-stability-2'
          canonical='sulandra-website-production-5fc4.up.railway.app'
          stale='sulandra-website-production.up.railway.app'

          for attempt in $(seq 1 80); do
            portal="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/employee-portal.html || true)"
            portal_js="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/employee-portal-railway.js || true)"
            application="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/applydsp.html || true)"
            applicant="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/applicant-portal.html || true)"
            interview="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/interview-admin-scheduler.js || true)"
            offer="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/offer-acceptance.html || true)"
            scls="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/scls-residential.html || true)"
            workforce="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/workforce-admin.html || true)"
            payroll="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/assets/workforce-payroll-readiness.js || true)"

            # Current SPIRE production contract: login/SSO shell -> Client Station -> explicit client chart.
            spire_entry="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/spire.html || true)"
            spire_login="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/spire/login.html || true)"
            spire_station="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/spire/client-station.html || true)"
            spire_preferences="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/assets/spire-user-preferences.js || true)"
            spire_screen="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/assets/spire-screen-controls.js || true)"
            spire_navigation="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/assets/spire-master-navigation.js || true)"

            hh_referral="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/home-health-referral.html || true)"
            home_health="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/home-health.html || true)"
            home_health_rail="$(curl -fsSL --max-time 20 "https://www.sulandrahealth.com/assets/home-health-rail-stability.js?v=${home_health_rail_generation}" || true)"
            company_docs="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/company-documents.html || true)"

            if grep -q "$contract" <<<"$portal" \
              && grep -q 'employee-role-navigation-guard.js' <<<"$portal" \
              && grep -q 'employeeHomeHealthReferralInboxLauncher' <<<"$portal_js" \
              && grep -q "$canonical" <<<"$application" && ! grep -q "$stale" <<<"$application" \
              && grep -q "$canonical" <<<"$applicant" && ! grep -q "$stale" <<<"$applicant" \
              && grep -q "$canonical" <<<"$interview" && ! grep -q "$stale" <<<"$interview" \
              && grep -q "$canonical" <<<"$offer" && ! grep -q "$stale" <<<"$offer" \
              && grep -q 'sclsTaskBoardLink' <<<"$scls" \
              && grep -q 'sclsTasksWorkflowLink' <<<"$scls" \
              && grep -q 'workforce-payroll-readiness.js' <<<"$workforce" \
              && grep -q "$contract" <<<"$payroll" \
              && grep -q 'SPIRE_CANONICAL_LOGIN_ENTRY_V3' <<<"$spire_entry" \
              && grep -q '/spire/login.html' <<<"$spire_entry" \
              && grep -q 'SPIRE_AUTHENTICATED_FULLSCREEN_SHELL_V1' <<<"$spire_login" \
              && grep -q 'spireWorkspaceFrame' <<<"$spire_login" \
              && grep -q 'SPIRE_CLIENT_STATION_LISTS_V2' <<<"$spire_station" \
              && grep -q 'Client Station' <<<"$spire_station" \
              && grep -q 'Available Homes' <<<"$spire_station" \
              && grep -q 'SPIRE_USER_WORKSPACE_PREFERENCES_V3' <<<"$spire_preferences" \
              && grep -q 'clientStation:' <<<"$spire_preferences" \
              && grep -q 'spire:accessibility:fullscreen' <<<"$spire_preferences" \
              && grep -q 'SPIRE_SCREEN_CONTROLS_LIVE_V2' <<<"$spire_screen" \
              && grep -q '/api/spire/inbasket-v2?status=OPEN' <<<"$spire_screen" \
              && grep -q '/spire/secure-chat.html' <<<"$spire_screen" \
              && grep -q 'SPIRE_MASTER_EXPLICIT_CLIENT_GATE_V2' <<<"$spire_navigation" \
              && grep -q '/spire/client-station.html' <<<"$spire_navigation" \
              && grep -q 'home-health-referral-token-bootstrap.js' <<<"$hh_referral" \
              && grep -q 'homeHealthReferralInboxLink' <<<"$home_health" \
              && grep -q "home-health-rail-stability.js?v=${home_health_rail_generation}" <<<"$home_health" \
              && grep -q "$home_health_rail_generation" <<<"$home_health_rail" \
              && grep -q 'DETERMINISTIC_HOME_HEALTH_RAIL_RESTORE' <<<"$home_health_rail" \
              && grep -q 'sulandra:home-health:active-rail' <<<"$home_health_rail" \
              && grep -q 'companyComplianceLink' <<<"$company_docs"; then
              echo "Exact production business contract is live with authenticated SPIRE login, Client Station, user-scoped theme/preferences, live Secure Chat/In Basket and Home Health rail stability v2."
              exit 0
            fi
            echo "Waiting for business-UAT production deployment (${attempt}/80)..."
            sleep 15
          done
          echo "Timed out waiting for the exact production business-UAT deployment." >&2
          exit 1

      - name: Validate live SPIRE JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            /assets/spire-login.js
            /assets/spire-client-station.js
            /assets/spire-user-preferences.js
            /assets/spire-screen-controls.js
            /assets/spire-master-navigation.js
            /assets/spire-master-flowsheet-grid.js
            /assets/spire-secure-chat.js
          )
          index=0
          for src in "${scripts[@]}"; do
            index=$((index+1))
            url="https://www.sulandrahealth.com${src}"
            target="/tmp/spire-live-${index}.js"
            curl -fsSL --max-time 20 "$url" -o "$target"
            if ! node --check "$target"; then
              echo "Live SPIRE JavaScript syntax failure: $url" >&2
              exit 1
            fi
          done
          echo "Live SPIRE JavaScript syntax verified across ${#scripts[@]} current runtimes."

      - name: Install Playwright browser runtime
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run all nine live production business paths
        env:
          UAT_BASE_URL: https://www.sulandrahealth.com
        run: npx playwright test --config=playwright.business-uat.config.mjs
