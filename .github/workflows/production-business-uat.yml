name: Production Business Path UAT

on:
  push:
    branches:
      - feature/spire-ehr-platform
  pull_request:
    branches:
      - feature/spire-ehr-platform
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-business-uat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  business-uat:
    name: Complete end-to-end production business-path UAT
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm ci

      - name: Verify business UAT source contract
        run: npm run verify:business-uat

      - name: Wait for exact production business-UAT deployment
        shell: bash
        run: |
          set -euo pipefail
          contract='20260810-business-uat-1'
          spire_app_generation='20260810-business-uat-8'
          shell_resilience_generation='20260810-spire-shell-resilience-4'
          chart_ready_generation='20260810-spire-chart-ready-2'
          deep_link_generation='20260810-business-uat-5'
          chart_recovery_generation='20260810-spire-chart-recovery-1'
          home_health_rail_generation='20260810-home-health-rail-stability-1'
          canonical='sulandra-website-production-5fc4.up.railway.app'
          stale='sulandra-website-production.up.railway.app'
          for attempt in $(seq 1 80); do
            portal="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/employee-portal.html || true)"
            portal_js="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/employee-portal-railway.js || true)"
            application="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/applydsp.html || true)"
            applicant="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/applicant-portal.html || true)"
            interview="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/interview-admin-scheduler.js || true)"
            offer="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/offer-acceptance.html || true)"
            scls="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/scls-residential.html || true)"
            workforce="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/workforce-admin.html || true)"
            payroll="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/assets/workforce-payroll-readiness.js || true)"
            spire="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/spire.html || true)"
            spire_app="$(curl -fsSL --max-time 20 "https://www.sulandrahealth.com/assets/spire-app-v2.js?v=${spire_app_generation}" || true)"
            shell_resilience="$(curl -fsSL --max-time 20 "https://www.sulandrahealth.com/assets/spire-shell-resilience.js?v=${shell_resilience_generation}" || true)"
            chart_ready="$(curl -fsSL --max-time 20 "https://www.sulandrahealth.com/assets/spire-chart-ready.js?v=${chart_ready_generation}" || true)"
            deep_link="$(curl -fsSL --max-time 20 "https://www.sulandrahealth.com/assets/spire-deep-link.js?v=${deep_link_generation}" || true)"
            chart_recovery="$(curl -fsSL --max-time 20 "https://www.sulandrahealth.com/assets/spire-chart-recovery-v1.js?v=${chart_recovery_generation}" || true)"
            hh_referral="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/home-health-referral.html || true)"
            home_health="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/home-health.html || true)"
            home_health_rail="$(curl -fsSL --max-time 20 "https://www.sulandrahealth.com/assets/home-health-rail-stability.js?v=${contract}" || true)"
            company_docs="$(curl -fsSL --max-time 20 https://www.sulandrahealth.com/company-documents.html || true)"
            if grep -q "$contract" <<<"$portal" \
              && grep -q 'employee-role-navigation-guard.js' <<<"$portal" \
              && grep -q 'employeeHomeHealthReferralInboxLauncher' <<<"$portal_js" \
              && grep -q "$canonical" <<<"$application" && ! grep -q "$stale" <<<"$application" \
              && grep -q "$canonical" <<<"$applicant" && ! grep -q "$stale" <<<"$applicant" \
              && grep -q "$canonical" <<<"$interview" && ! grep -q "$stale" <<<"$interview" \
              && grep -q "$canonical" <<<"$offer" && ! grep -q "$stale" <<<"$offer" \
              && grep -q 'sclsTaskBoardLink' <<<"$scls" \
              && grep -q 'sclsTasksWorkflowLink' <<<"$scls" \
              && grep -q 'workforce-payroll-readiness.js' <<<"$workforce" \
              && grep -q "$contract" <<<"$payroll" \
              && grep -q "spire-app-v2.js?v=${spire_app_generation}" <<<"$spire" \
              && grep -q "spire-shell-resilience.js?v=${shell_resilience_generation}" <<<"$spire" \
              && grep -q "spire-chart-ready.js?v=${chart_ready_generation}" <<<"$spire" \
              && grep -q "spire-deep-link.js?v=${deep_link_generation}" <<<"$spire" \
              && grep -q "spire-chart-recovery-v1.js?v=${chart_recovery_generation}" <<<"$spire" \
              && grep -q 'BUSINESS_UAT_NATIVE_DEEPLINK' <<<"$spire_app" \
              && grep -q 'BUSINESS_UAT_ASYNC_WORKSPACE_REFRESH' <<<"$spire_app" \
              && grep -q 'BUSINESS_UAT_CHART_FIRST' <<<"$spire_app" \
              && grep -q 'BUSINESS_UAT_CHART_STABILIZED' <<<"$spire_app" \
              && grep -q 'BUSINESS_UAT_CHART_WORKSPACE_STATE' <<<"$spire_app" \
              && grep -q 'BUSINESS_UAT_CANONICAL_SHELL_REPAIR' <<<"$spire_app" \
              && grep -q 'BUSINESS_UAT_IDEMPOTENT_SHELL_BOOTSTRAP' <<<"$spire_app" \
              && grep -q 'BUSINESS_UAT_IMMEDIATE_SHELL_BOOTSTRAP' <<<"$spire_app" \
              && grep -q 'SpireEnsureShell' <<<"$spire_app" \
              && grep -q 'SpireOpenPatient' <<<"$spire_app" \
              && grep -q "$shell_resilience_generation" <<<"$shell_resilience" \
              && grep -q 'SpireShellResilience' <<<"$shell_resilience" \
              && grep -q 'NON_DESTRUCTIVE_SHELL_RECOVERY' <<<"$shell_resilience" \
              && grep -q 'CANONICAL_SINGLE_RUNTIME_REPAIR' <<<"$shell_resilience" \
              && grep -q 'SpireEnsureShell' <<<"$shell_resilience" \
              && grep -q 'PRESERVE_ACTIVE_PATIENT_CHART' <<<"$shell_resilience" \
              && grep -q "$chart_ready_generation" <<<"$chart_ready" \
              && grep -q 'BUSINESS_UAT_IDEMPOTENT_CHART_ACTIVE' <<<"$chart_ready" \
              && grep -q 'SpireChartReady' <<<"$chart_ready" \
              && grep -q 'ensurePatientChart' <<<"$chart_ready" \
              && grep -q 'forceChartActive' <<<"$chart_ready" \
              && grep -q 'spireChartReady' <<<"$chart_ready" \
              && grep -q 'waitForAuthorizedPatient' <<<"$deep_link" \
              && grep -q 'fallbackOpenRequestedChart' <<<"$deep_link" \
              && grep -q 'directOpenRequestedChart' <<<"$deep_link" \
              && grep -q 'BUSINESS_UAT_DIRECT_CHART_OPEN' <<<"$deep_link" \
              && grep -q 'BUSINESS_UAT_PATIENT_CLICK_RECOVERY' <<<"$deep_link" \
              && grep -q 'SpireChartReady' <<<"$deep_link" \
              && grep -q "$chart_recovery_generation" <<<"$chart_recovery" \
              && grep -q 'SpireChartRecovery' <<<"$chart_recovery" \
              && grep -q 'markReady' <<<"$chart_recovery" \
              && grep -q 'home-health-referral-token-bootstrap.js' <<<"$hh_referral" \
              && grep -q 'homeHealthReferralInboxLink' <<<"$home_health" \
              && grep -q 'home-health-rail-stability.js' <<<"$home_health" \
              && grep -q "$home_health_rail_generation" <<<"$home_health_rail" \
              && grep -q 'sulandra:home-health:active-rail' <<<"$home_health_rail" \
              && grep -q 'companyComplianceLink' <<<"$company_docs"; then
              echo "Exact business-UAT production contract, idempotent canonical SPIRE shell, resilience v4, and stable Home Health referral rail are live."
              exit 0
            fi
            echo "Waiting for business-UAT production deployment (${attempt}/80)..."
            sleep 15
          done
          echo "Timed out waiting for the exact production business-UAT deployment." >&2
          exit 1

      - name: Validate live SPIRE JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 20 https://www.sulandrahealth.com/spire.html -o /tmp/spire-live.html
          mapfile -t scripts < <(grep -oE 'src="[^"]+\.js[^"]*"' /tmp/spire-live.html | sed -E 's/^src="//;s/"$//')
          test "${#scripts[@]}" -gt 0
          index=0
          for src in "${scripts[@]}"; do
            index=$((index+1))
            if [[ "$src" == http* ]]; then url="$src"; else url="https://www.sulandrahealth.com${src}"; fi
            target="/tmp/spire-live-${index}.js"
            curl -fsSL --max-time 20 "$url" -o "$target"
            if ! node --check "$target"; then
              echo "Live SPIRE JavaScript syntax failure: $url" >&2
              exit 1
            fi
          done
          echo "Live SPIRE JavaScript syntax verified across ${#scripts[@]} scripts."

      - name: Install Playwright browser runtime
        run: |
          npm install --no-save @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Run all nine live production business paths
        env:
          UAT_BASE_URL: https://www.sulandrahealth.com
        run: npx playwright test --config=playwright.business-uat.config.mjs
