name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate public website files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s privacy.html
          test -s accessibility.html
          test -s robots.txt
          test -s sitemap.xml
          grep -q '<main id="main-content">' index.html
          grep -q 'Skip to main content' index.html
          grep -q 'prefers-reduced-motion' index.html
          grep -q 'application/ld+json' index.html
          grep -q 'Sitemap:' robots.txt

      - name: Detect API workspace
        id: api-workspace
        shell: bash
        run: |
          if [[ -s package.json && -s package-lock.json && -d api ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Static-site branch detected; API checks are not required for this checkout."
          fi

      - name: Set up Node.js
        if: steps.api-workspace.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install API dependencies
        if: steps.api-workspace.outputs.present == 'true'
        run: npm ci

      - name: Generate Prisma client
        if: steps.api-workspace.outputs.present == 'true'
        run: npm run db:generate

      - name: Type-check API
        if: steps.api-workspace.outputs.present == 'true'
        run: npm run typecheck

      - name: Build API
        if: steps.api-workspace.outputs.present == 'true'
        run: npm run build

      - name: Run API tests
        if: steps.api-workspace.outputs.present == 'true'
        run: npm test --if-present
