name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate public website files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s privacy.html
          test -s accessibility.html
          test -s robots.txt
          test -s sitemap.xml
          grep -q '<main id="main-content">' index.html
          grep -q 'Skip to main content' index.html
          grep -q 'prefers-reduced-motion' index.html
          grep -q 'application/ld+json' index.html
          grep -q 'Sitemap:' robots.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: spire/api/package-lock.json

      - name: Install API dependencies
        working-directory: spire/api
        run: npm ci

      - name: Generate Prisma client
        working-directory: spire/api
        run: npx prisma generate

      - name: Type-check API
        working-directory: spire/api
        run: npm run typecheck --if-present

      - name: Run API tests
        working-directory: spire/api
        run: npm test --if-present
