name: Codebase Preview Environments

on:
  pull_request:
    branches:
      - release/sulandra-1.0
    paths:
      - 'assets/codebase-preview-environments.js'
      - 'scripts/install-codebase-preview-environments-ui.mjs'
      - 'scripts/install-codebase-preview-control.mjs'
      - 'scripts/install-codebase-preview-gateway.mjs'
      - 'terminal-session-agent/bashrc'
      - 'Dockerfile.frontend'
      - 'Dockerfile.coding-terminal'
      - 'Dockerfile.terminal-executor'
      - '.github/workflows/codebase-preview-environments.yml'
  push:
    branches:
      - release/sulandra-1.0
    paths:
      - 'assets/codebase-preview-environments.js'
      - 'scripts/install-codebase-preview-environments-ui.mjs'
      - 'scripts/install-codebase-preview-control.mjs'
      - 'scripts/install-codebase-preview-gateway.mjs'
      - 'terminal-session-agent/bashrc'
      - 'Dockerfile.frontend'
      - 'Dockerfile.coding-terminal'
      - 'Dockerfile.terminal-executor'
      - '.github/workflows/codebase-preview-environments.yml'

permissions:
  contents: read

jobs:
  preview-environments:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify preview browser runtime
        run: |
          set -euo pipefail
          node --check assets/codebase-preview-environments.js
          node --check scripts/install-codebase-preview-environments-ui.mjs
          node --check scripts/install-codebase-preview-control.mjs
          node --check scripts/install-codebase-preview-gateway.mjs
          grep -Fq 'CODEBASE_PREVIEW_ENVIRONMENTS_V2' assets/codebase-preview-environments.js
          grep -Fq 'Railway Production' assets/codebase-preview-environments.js
          grep -Fq 'LOCAL' assets/codebase-preview-environments.js
          grep -Fq "'/api/preview-ticket'" assets/codebase-preview-environments.js
          grep -Fq "surface:'codebase'" assets/codebase-preview-environments.js
          grep -Fq 'reserved by Codebase internals' assets/codebase-preview-environments.js
          grep -Fq "'/railway/preview'" assets/codebase-preview-environments.js
          grep -Fq 'not linked to a Railway service' assets/codebase-preview-environments.js
          grep -Fq 'no public domain' assets/codebase-preview-environments.js
          if grep -Fq "searchParams.set('port',port())" assets/codebase-preview-environments.js; then
            echo 'Local Preview must use authenticated preview tickets, not direct broker GET routing.' >&2
            exit 1
          fi

      - name: Verify local shell port isolation
        run: |
          set -euo pipefail
          grep -Fq 'unset PORT SULANDRA_IDE_PORT' terminal-session-agent/bashrc
          env PORT=9000 SULANDRA_IDE_PORT=13337 HOME=/tmp/sulandra-preview-shell-test \
            bash --noprofile --rcfile terminal-session-agent/bashrc -ic \
            'test -z "${PORT+x}"; test -z "${SULANDRA_IDE_PORT+x}"'

      - name: Verify executor production-domain route
        run: |
          set -euo pipefail
          cp terminal-execution-plane/server.mjs /tmp/executor.mjs
          node scripts/install-terminal-industry-hardening.mjs /tmp/executor.mjs
          node scripts/fix-terminal-resource-monitor.mjs /tmp/executor.mjs
          node scripts/install-workspace-ide-live-preview.mjs /tmp/executor.mjs
          node scripts/fix-workspace-proxy-abort.mjs /tmp/executor.mjs
          node scripts/fix-workspace-ide-agent-transport.mjs /tmp/executor.mjs
          node scripts/fix-workspace-proxy-streaming.mjs /tmp/executor.mjs
          node scripts/install-terminal-security-audit.mjs /tmp/executor.mjs
          node scripts/install-terminal-history-proxy.mjs /tmp/executor.mjs
          node scripts/install-terminal-session-recovery.mjs /tmp/executor.mjs
          node scripts/install-terminal-executor-ha-reconcile.mjs /tmp/executor.mjs
          node scripts/install-codebase-workspace-reuse.mjs /tmp/executor.mjs
          node scripts/install-terminal-unrestricted-dev.mjs /tmp/executor.mjs executor
          node scripts/fix-codebase-independent-workspace.mjs /tmp/executor.mjs
          node scripts/harden-codebase-project-persistence.mjs /tmp/executor.mjs
          node scripts/install-codebase-project-control.mjs /tmp/executor.mjs
          node scripts/install-codebase-preview-control.mjs /tmp/executor.mjs
          node --check /tmp/executor.mjs
          grep -Fq 'CODEBASE_PREVIEW_ENVIRONMENTS_CONTROL_V1' /tmp/executor.mjs
          grep -Fq "app.get('/v1/workspaces/:workspaceId/codebase/projects/:project/railway/preview'" /tmp/executor.mjs
          grep -Fq "['domain','list','--json']" /tmp/executor.mjs
          grep -Fq "domain.endsWith('.up.railway.app')" /tmp/executor.mjs
          grep -Fq "productionUrl:domain?'https://'+domain:''" /tmp/executor.mjs

      - name: Verify authenticated gateway route
        run: |
          set -euo pipefail
          cp coding-terminal-worker/server.mjs /tmp/gateway.mjs
          node scripts/install-terminal-gateway-ha.mjs /tmp/gateway.mjs
          node scripts/install-workspace-ide-live-preview.mjs /tmp/gateway.mjs
          node scripts/fix-workspace-proxy-abort.mjs /tmp/gateway.mjs
          node scripts/fix-workspace-proxy-streaming.mjs /tmp/gateway.mjs
          node scripts/fix-workspace-browser-session.mjs /tmp/gateway.mjs
          node scripts/fix-workspace-ticket-cors.mjs /tmp/gateway.mjs
          node scripts/install-terminal-history-proxy.mjs /tmp/gateway.mjs
          node scripts/install-codebase-pty-compat.mjs /tmp/gateway.mjs
          node scripts/install-codebase-pty-session-resume.mjs /tmp/gateway.mjs
          node scripts/fix-codebase-async-pty-startup.mjs /tmp/gateway.mjs
          node scripts/fix-codebase-preview-owner-namespace.mjs /tmp/gateway.mjs
          node scripts/install-codebase-project-gateway.mjs /tmp/gateway.mjs
          node scripts/install-codebase-preview-gateway.mjs /tmp/gateway.mjs
          node --check /tmp/gateway.mjs
          grep -Fq 'CODEBASE_PREVIEW_ENVIRONMENTS_GATEWAY_V1' /tmp/gateway.mjs
          grep -Fq "app.get('/codebase/projects/:project/railway/preview'" /tmp/gateway.mjs
          grep -Fq "projectSuffix(req) + '/railway/preview'" /tmp/gateway.mjs
          grep -Fq 'authenticateCodebaseBrowser' /tmp/gateway.mjs

      - name: Verify production Codebase publication
        run: |
          set -euo pipefail
          cp Codebase.html /tmp/Codebase.html
          node scripts/install-codebase-backend-adapter.mjs /tmp/Codebase.html
          node scripts/install-codebase-project-manager-ui.mjs /tmp/Codebase.html
          node scripts/install-codebase-public-git-clone-ui.mjs /tmp/Codebase.html
          node scripts/install-codebase-preview-environments-ui.mjs /tmp/Codebase.html
          node scripts/fix-codebase-independent-branding.mjs /tmp/Codebase.html
          grep -Fq '/assets/codebase-preview-environments.js?v=20260907-preview-environments-2' /tmp/Codebase.html
          test "$(grep -Fc '/assets/codebase-preview-environments.js?v=20260907-preview-environments-2' /tmp/Codebase.html)" = 1
          grep -Fq 'cp assets/codebase-preview-environments.js dist-web/assets/codebase-preview-environments.js' Dockerfile.frontend
          grep -Fq 'install-codebase-preview-control.mjs' Dockerfile.terminal-executor
          grep -Fq 'install-codebase-preview-gateway.mjs' Dockerfile.coding-terminal
          echo 'Codebase Local | Railway Production Preview contract verified.'
