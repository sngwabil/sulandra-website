name: Terminal Gateway HA

on:
  pull_request:
    branches:
      - release/sulandra-1.0
    paths:
      - coding-terminal-worker/**
      - Dockerfile.coding-terminal
      - scripts/install-terminal-gateway-ha.mjs
      - scripts/install-workspace-ide-live-preview.mjs
      - scripts/fix-workspace-proxy-abort.mjs
      - scripts/fix-workspace-ticket-cors.mjs
      - scripts/verify-workspace-ticket-cors.mjs
      - railway.terminal-worker.json
      - .github/workflows/terminal-gateway-ha.yml
  push:
    branches:
      - release/sulandra-1.0
    paths:
      - coding-terminal-worker/**
      - Dockerfile.coding-terminal
      - scripts/install-terminal-gateway-ha.mjs
      - scripts/install-workspace-ide-live-preview.mjs
      - scripts/fix-workspace-proxy-abort.mjs
      - scripts/fix-workspace-ticket-cors.mjs
      - scripts/verify-workspace-ticket-cors.mjs
      - railway.terminal-worker.json
      - .github/workflows/terminal-gateway-ha.yml

permissions:
  contents: read

jobs:
  gateway-ha:
    name: Verify liveness and graceful drain
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify terminal Railway config isolation
        run: |
          set -euo pipefail
          grep -Fq '"dockerfilePath": "Dockerfile.coding-terminal"' railway.terminal-worker.json
          grep -Fq '"startCommand": "node /gateway/server.mjs"' railway.terminal-worker.json
          for path in \
            'coding-terminal-worker/**' \
            'Dockerfile.coding-terminal' \
            'scripts/install-terminal-gateway-ha.mjs' \
            'scripts/install-workspace-ide-live-preview.mjs' \
            'scripts/fix-workspace-proxy-abort.mjs' \
            'scripts/fix-workspace-ticket-cors.mjs' \
            'scripts/verify-workspace-ticket-cors.mjs'; do
            grep -Fq "\"$path\"" railway.terminal-worker.json
          done

      - name: Build hardened gateway image
        run: docker build -f Dockerfile.coding-terminal -t sulandra-terminal-gateway:ci .

      - name: Start gateway with unavailable execution plane
        run: |
          execution_token="$(printf 'execution-ci-%s-run-%s-execution-ci' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          jwt_secret="$(printf 'gateway-ci-%s-attempt-%s-gateway-ci' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT")"
          docker run -d --name sulandra-terminal-gateway-ci \
            -p 127.0.0.1:18080:8080 \
            -e TERMINAL_AUTH_TOKEN=ci-internal-token \
            -e TERMINAL_EXECUTION_BASE_URL=https://127.0.0.1:65535 \
            -e TERMINAL_EXECUTION_TOKEN="$execution_token" \
            -e TERMINAL_WS_AUTH_PROVIDER=sulandra \
            -e JWT_SECRET="$jwt_secret" \
            sulandra-terminal-gateway:ci
          healthy=0
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:18080/health >/tmp/gateway-health.json; then healthy=1; break; fi
            sleep 0.5
          done
          if [[ "$healthy" != "1" ]]; then
            docker logs sulandra-terminal-gateway-ci >&2 || true
            exit 1
          fi
          node -e 'const x=require("/tmp/gateway-health.json");if(x.ok!==true||x.gateway!==true||x.ready!==false||x.executionPlane?.healthy!==false)throw new Error(JSON.stringify(x))'

      - name: Verify graceful SIGTERM drain
        run: |
          started=$(date +%s)
          docker stop -t 30 sulandra-terminal-gateway-ci >/dev/null
          elapsed=$(( $(date +%s) - started ))
          if (( elapsed >= 30 )); then
            echo "Gateway did not drain before Docker timeout" >&2
            exit 1
          fi
          docker logs sulandra-terminal-gateway-ci | grep -q 'graceful shutdown requested by SIGTERM'

      - name: Cleanup
        if: always()
        run: docker rm -f sulandra-terminal-gateway-ci 2>/dev/null || true
