name: Terminal tmux Scrollback Regression

on:
  pull_request:
    branches:
      - release/sulandra-1.0
    paths:
      - terminal-session-agent/**
      - Dockerfile.terminal-session
      - .github/workflows/terminal-tmux-scrollback.yml
  push:
    branches:
      - release/sulandra-1.0
    paths:
      - terminal-session-agent/**
      - Dockerfile.terminal-session
      - .github/workflows/terminal-tmux-scrollback.yml

permissions:
  contents: read

jobs:
  verify-tmux-scrollback:
    name: Verify server scrollback backstop
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      IMAGE: sulandra-terminal-session:scrollback-ci
      TOKEN: ci-session-token-0123456789abcdef0123456789abcdef
      CONTAINER: sulandra-terminal-scrollback-ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build real terminal session image
        run: docker build -f Dockerfile.terminal-session -t "$IMAGE" .

      - name: Start real PTY session
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name "$CONTAINER" \
            -e SESSION_TOKEN="$TOKEN" \
            -e WORKSPACE_ID=scrollback-ci \
            -e TMUX_SESSION=scrollback-ci \
            -e TERMINAL_COLS=100 \
            -e TERMINAL_ROWS=30 \
            -p 127.0.0.1:19000:9000 \
            "$IMAGE"
          for i in {1..45}; do
            if curl -fsS -H "x-sulandra-session-token: $TOKEN" http://127.0.0.1:19000/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$CONTAINER"
          exit 1

      - name: Verify browser-owned scrollback contract
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker exec "$CONTAINER" tmux show-options -gv mouse)" = "off"
          test "$(docker exec "$CONTAINER" tmux show-options -gv history-limit)" = "100000"

          curl -fsS -H "x-sulandra-session-token: $TOKEN" http://127.0.0.1:19000/snapshot -o /tmp/fresh-snapshot.json
          node -e 'const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));const d=String(x.data||"");if(/^\s*\n/.test(d)||/^\r?\n/.test(d))throw new Error("fresh canonical snapshot starts with artificial blank rows")' /tmp/fresh-snapshot.json

          command=$'for i in $(seq 1 1050); do printf "DENSE_%04d [INFO] [System Diagnostics] Execution thread initialized. Performing deep buffer trace across memory banks to simulate a high-volume output stream. Validating terminal multiplexer scrollback capabilities and historical timeline preservation under heavy load.\\n" "$i"; done\r'
          payload="$(node -e 'process.stdout.write(JSON.stringify({data:process.argv[1]}))' "$command")"
          curl -fsS \
            -H "x-sulandra-session-token: $TOKEN" \
            -H 'Content-Type: application/json' \
            -X POST http://127.0.0.1:19000/input \
            -d "$payload" >/dev/null

          ready=false
          for i in {1..80}; do
            curl -fsS -H "x-sulandra-session-token: $TOKEN" http://127.0.0.1:19000/snapshot -o /tmp/dense-snapshot.json
            if node -e '
              const x=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")),d=String(x.data||"");
              const values=[...d.matchAll(/DENSE_(\d{4})/g)].map(m=>Number(m[1])).filter(n=>n>=1&&n<=1050);
              const unique=new Set(values);
              if(unique.size!==1050||!unique.has(1)||!unique.has(1050))process.exit(1);
              for(let n=1;n<=1050;n++)if(!unique.has(n))process.exit(1);
            ' /tmp/dense-snapshot.json; then
              ready=true
              break
            fi
            sleep 0.15
          done
          test "$ready" = true

          cp /tmp/dense-snapshot.json /tmp/before-snapshot.json
          before_prompts="$(node -e 'const d=String(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).data||"");process.stdout.write(String((d.match(/bash-5\.2\$/g)||[]).length))' /tmp/before-snapshot.json)"
          resize_result="$(curl -fsS -H "x-sulandra-session-token: $TOKEN" -H 'Content-Type: application/json' -X POST http://127.0.0.1:19000/resize -d '{"cols":100,"rows":30}')"
          node -e 'const x=JSON.parse(process.argv[1]);if(x.changed!==false)throw new Error("identical refresh resize must be a no-op")' "$resize_result"
          sleep 0.3
          curl -fsS -H "x-sulandra-session-token: $TOKEN" http://127.0.0.1:19000/snapshot -o /tmp/after-snapshot.json
          after_prompts="$(node -e 'const d=String(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")).data||"");process.stdout.write(String((d.match(/bash-5\.2\$/g)||[]).length))' /tmp/after-snapshot.json)"
          test "$after_prompts" = "$before_prompts"
          test "$(docker exec "$CONTAINER" tmux display-message -p -t scrollback-ci '#{pane_in_mode}')" = "0"

      - name: Show logs on failure
        if: failure()
        run: docker logs "$CONTAINER" || true

      - name: Stop test session
        if: always()
        run: docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
