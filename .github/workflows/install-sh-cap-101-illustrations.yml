name: Install SH-CAP-101 illustrations

on:
  push:
    branches: [main]
    paths:
      - scripts/install-sh-cap-101-illustrations.mjs
      - .github/workflows/install-sh-cap-101-illustrations.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate and link course illustrations
        run: node scripts/install-sh-cap-101-illustrations.mjs

      - name: Commit generated assets and course integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add courses/sh-cap-101.html courses/assets/sh-cap-101
          if git diff --cached --quiet; then
            echo "No illustration changes to commit."
            exit 0
          fi
          git commit -m "Add illustrated visuals to SH-CAP-101"
          git push origin main

# Updated to trigger the installation workflow.
