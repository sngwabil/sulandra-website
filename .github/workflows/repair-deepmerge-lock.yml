name: Repair deepmerge lock

on:
  push:
    branches:
      - feature/spire-1.1

permissions:
  contents: write

jobs:
  repair-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spire-1.1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate package lock for patched deepmerge-ts
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const wanted = String(pkg.overrides?.['deepmerge-ts'] || '');
          const actual = String(lock.packages?.['node_modules/deepmerge-ts']?.version || '');
          if (!/^\^?8\./.test(wanted)) throw new Error(`Expected deepmerge-ts 8.x override, found ${wanted}`);
          if (!/^8\./.test(actual)) throw new Error(`Expected deepmerge-ts 8.x lock entry, found ${actual}`);
          console.log(`deepmerge-ts ${wanted} -> ${actual}`);
          NODE

      - name: Verify clean install
        run: npm ci --include=dev --ignore-scripts

      - name: Commit regenerated lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name 'Sulandra CI'
          git config user.email 'admin@sulandrahealth.com'
          git add package-lock.json
          git commit -m 'fix(deps): resolve patched deepmerge-ts lock'
          git push origin HEAD:feature/spire-1.1
