name: Repair deepmerge lock

on:
  push:
    branches:
      - feature/spire-1.1

permissions:
  contents: write

concurrency:
  group: repair-deepmerge-lock-feature-spire-1-1
  cancel-in-progress: true

jobs:
  repair-lock:
    if: ${{ !contains(github.event.head_commit.message, 'fix(deps): resolve patched deepmerge-ts') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/spire-1.1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lock from the declared patched override
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const wanted = String(pkg.overrides?.['deepmerge-ts'] || '');
          const actual = String(lock.packages?.['node_modules/deepmerge-ts']?.version || '');
          if (!/^\^?8\./.test(wanted) || !/^8\./.test(actual)) {
            throw new Error(`deepmerge-ts lock mismatch: wanted ${wanted}, actual ${actual}`);
          }
          console.log(`Verified deepmerge-ts override ${wanted} resolved to ${actual}`);
          NODE
          npm ci --include=dev --ignore-scripts

      - name: Commit regenerated dependency lock
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Dependency lock already matches package.json."
            exit 0
          fi
          git config user.name 'Sulandra CI'
          git config user.email 'admin@sulandrahealth.com'
          git add package-lock.json
          git commit -m 'fix(deps): resolve patched deepmerge-ts'
          git push origin HEAD:feature/spire-1.1
