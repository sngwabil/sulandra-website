<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Platform Readiness | Sulandra Health</title><link rel="icon" href="/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#edf3f7;color:#173b52}.top{display:flex;align-items:center;gap:14px;padding:11px 18px;background:#fff;border-bottom:1px solid #d5e1e8;position:sticky;top:0;z-index:40}.top img{width:220px;max-width:42vw}.top .spacer{flex:1}.top a{color:#075985;text-decoration:none;font-weight:900}.shell{width:min(1280px,calc(100% - 22px));margin:16px auto 50px}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:12px}.hero h1{margin:0;color:#0b4265;font-size:29px}.hero p{margin:5px 0;color:#667b88}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:900;cursor:pointer;text-decoration:none}.btn.primary{background:#0b6ea8;color:#fff}.notice{padding:10px 12px;border-radius:9px;background:#eef8fc;border:1px solid #c8e1ed;color:#42667a;margin-bottom:10px;font-size:12px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border:1px solid #d5e1e8;border-radius:10px;padding:10px}.stat span{display:block;font-size:9px;text-transform:uppercase;font-weight:900;color:#7e8e98}.stat strong{font-size:22px;color:#23526c}.stat.blocked strong{color:#9a332c}.stat.warn strong{color:#855e16}.entities{display:grid;gap:11px}.entity{background:#fff;border:1px solid #d4e1e8;border-radius:14px;box-shadow:0 8px 24px rgba(18,56,80,.05);overflow:hidden}.entity-head{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid #e3e9ed}.entity-head h2{margin:0;color:#174a69;font-size:18px}.entity-head p{margin:4px 0 0;color:#728591;font-size:11px}.badges{display:flex;gap:5px;flex-wrap:wrap}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:950}.badge.PASS{background:#e4f7ea;color:#29633d}.badge.WARN{background:#fff0d0;color:#835b0c}.badge.BLOCKED{background:#fde9e7;color:#92372f}.entity-body{padding:12px}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.check{border:1px solid #dfe7ec;border-radius:9px;padding:9px;background:#fbfdfe}.check h3{margin:0;color:#315970;font-size:11px}.check p{margin:5px 0 0;color:#667b88;font-size:10px;line-height:1.4}.check .topline{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.empty{padding:30px;text-align:center;color:#718491}@media(max-width:760px){.checks{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}@media(max-width:450px){.summary{grid-template-columns:1fr}.top a{display:none}.hero{flex-direction:column}}</style></head><body><header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><a href="/enterprise-analytics.html">Analytics</a><a href="/data-quality.html">Data Quality</a><a href="/security-audit.html">Security</a><a href="/admin.html#dashboard">Admin</a></header><main class="shell"><div class="hero"><div><h1>Platform Readiness</h1><p>Structural, legal-entity, compliance, operational, security, data-quality and revenue readiness from live system state.</p></div><button id="refresh" class="btn primary">Recheck Now</button></div><div id="context" class="notice">Loading readiness checks…</div><div id="summary" class="summary"></div><div id="entities" class="entities"><div class="empty">Checking platform…</div></div></main><script src="/assets/sulandra-entity-context.js?v=20260810-readiness-1"></script><script>(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEYS=['sulandra:employee:access-token','sulandra_token','token','accessToken'];const token=()=>KEYS.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){try{const r=await fetch(`${API}/api/platform-readiness`,{cache:'no-store',headers:{Accept:'application/json',Authorization:`Bearer ${token()}`}}),p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||p.message||`Request failed (${r.status})`);const d=p.data??p;$('context').innerHTML=`Generated ${esc(new Date(d.generatedAt).toLocaleString())} · ${d.enterpriseOwner?'Enterprise view':'Selected-company view'} · Operational readiness requires zero BLOCKED checks; warnings remain visible for managed work queues.`;$('summary').innerHTML=`<div class="stat blocked"><span>Blocked Checks</span><strong>${Number(d.totals?.blocked||0)}</strong></div><div class="stat warn"><span>Warnings</span><strong>${Number(d.totals?.warnings||0)}</strong></div><div class="stat"><span>Passing Checks</span><strong>${Number(d.totals?.passed||0)}</strong></div>`;$('entities').innerHTML=(d.entities||[]).map(e=>`<article class="entity"><div class="entity-head"><div><h2>${esc(e.entity.displayName)}</h2><p>${esc(e.entity.code)} · ${esc(e.entity.legalName)}</p></div><div class="badges"><span class="badge ${e.structuralReady?'PASS':'BLOCKED'}">${e.structuralReady?'STRUCTURE READY':'STRUCTURE BLOCKED'}</span><span class="badge ${e.operationalReady?'PASS':'BLOCKED'}">${e.operationalReady?'OPERATIONALLY READY':'OPERATION BLOCKED'}</span>${e.warnings?`<span class="badge WARN">${e.warnings} WARNING${e.warnings===1?'':'S'}</span>`:''}</div></div><div class="entity-body"><div class="checks">${(e.checks||[]).map(c=>`<div class="check"><div class="topline"><div><span class="badge ${esc(c.status)}">${esc(c.status)}</span><h3>${esc(c.label)}</h3></div>${c.metric!==undefined?`<strong>${esc(c.metric)}</strong>`:''}</div><p>${esc(c.details)}</p>${c.actionPath?`<div class="actions"><a class="btn" href="${esc(c.actionPath)}">Open Work</a></div>`:''}</div>`).join('')}</div></div></article>`).join('')||'<div class="empty">No readiness data available.</div>';}catch(e){$('entities').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}$('refresh').onclick=load;window.addEventListener('sulandra:entity-context-changed',()=>location.reload());(async()=>{if(!token()){location.href='/employee-login.html?returnTo=/platform-readiness.html';return}await window.SulandraEntityContext?.ready;await load()})()})();</script></body></html>
