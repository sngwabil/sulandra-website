<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Data Quality | Sulandra Health</title><link rel="icon" href="/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#edf3f7;color:#173b52}.top{display:flex;align-items:center;gap:14px;padding:11px 18px;background:#fff;border-bottom:1px solid #d5e1e8;position:sticky;top:0;z-index:40}.top img{width:220px;max-width:42vw}.top .spacer{flex:1}.top a{color:#075985;text-decoration:none;font-weight:900}.shell{width:min(1240px,calc(100% - 22px));margin:16px auto 50px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}.hero h1{margin:0;color:#0b4265;font-size:29px}.hero p{margin:5px 0;color:#667b88}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:900;cursor:pointer;text-decoration:none}.btn.primary{background:#0b6ea8;color:#fff}.btn.success{border-color:#45845a;background:#eff9f2;color:#306a43}.btn.warn{border-color:#ad792c;color:#7d5717}.btn.danger{border-color:#b5524a;color:#94362f}.notice{padding:10px 12px;border-radius:9px;background:#eef8fc;border:1px solid #c8e1ed;color:#42667a;margin-bottom:10px;font-size:12px;line-height:1.45}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border:1px solid #d5e1e8;border-radius:10px;padding:10px}.stat span{display:block;font-size:9px;text-transform:uppercase;font-weight:900;color:#7e8e98}.stat strong{font-size:21px;color:#23526c}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px}.toolbar select,.toolbar input{border:1px solid #c8d6df;border-radius:8px;padding:8px;background:#fff}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid #d4e1e8;border-radius:13px;box-shadow:0 7px 20px rgba(18,56,80,.05);overflow:hidden}.item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid #e4eaee}.item-head h2{margin:0;color:#174a69;font-size:16px}.item-head p{margin:4px 0 0;color:#718491;font-size:11px}.item-body{padding:13px}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.fact{border:1px solid #e0e8ed;background:#f9fbfc;border-radius:8px;padding:7px}.fact span{display:block;font-size:8px;text-transform:uppercase;font-weight:900;color:#84919a}.fact strong{font-size:11px;color:#2c536b}.badge{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:950;background:#edf3f7;color:#536c7d}.badge.CRITICAL{background:#fde2df;color:#8f2821}.badge.HIGH{background:#fff0d0;color:#835b0c}.badge.MEDIUM{background:#eef5fb;color:#3f647d}.badge.OPEN{background:#e8f1ff;color:#2e5f9a}.badge.ACKNOWLEDGED{background:#fff0d0;color:#835b0c}.badge.RESOLVED{background:#e4f7ea;color:#29633d}.details{margin-top:8px;padding:9px;border:1px solid #e0e8ed;background:#f9fbfc;border-radius:8px;white-space:pre-wrap;line-height:1.45;color:#4e6879;font-size:11px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.history{margin-top:9px;border-top:1px solid #e7ecef;padding-top:7px}.history div{font-size:10px;color:#607886;padding:3px 0}.empty{padding:34px;text-align:center;color:#718491}.error{display:none;padding:10px 12px;background:#fff0ef;border:1px solid #efb4af;color:#8b302a;border-radius:9px;margin-bottom:10px}.error.show{display:block}@media(max-width:760px){.summary,.facts{grid-template-columns:1fr 1fr}}@media(max-width:480px){.summary,.facts{grid-template-columns:1fr}.top a{display:none}.hero{flex-direction:column}}</style></head><body><header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><a href="/notifications.html">Notifications</a><a href="/company-compliance.html">Compliance</a><a href="/revenue-cycle.html">Revenue Cycle</a><a href="/admin.html#dashboard">Admin</a></header><main class="shell"><div class="hero"><div><h1>Enterprise Data Quality</h1><p>Persistent findings across intake, care, workforce, compliance, SCLS, Home Health, NMT and revenue-cycle workflows.</p></div><button id="scan" class="btn primary">Run Full Scan</button></div><div id="context" class="notice">Loading Data Quality context…</div><div id="summary" class="summary"></div><div class="toolbar"><select id="status"><option value="OPEN">Open</option><option value="ACKNOWLEDGED">Acknowledged</option><option value="">All statuses</option><option value="RESOLVED">Resolved</option><option value="IGNORED">Ignored</option></select><select id="severity"><option value="">All severities</option><option>CRITICAL</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select><select id="module"><option value="">All modules</option><option>CLIENT_INTAKE</option><option>COMPLIANCE</option><option>WORKFORCE</option><option>SCLS</option><option>HOME_HEALTH</option><option>NMT</option><option>REVENUE_CYCLE</option><option>SPIRE</option></select><input id="search" placeholder="Search issue, resource, detail"><button id="refresh" class="btn">Refresh</button></div><div id="error" class="error"></div><div id="list" class="list"><div class="empty">Loading issues…</div></div></main><script src="/assets/sulandra-entity-context.js?v=20260810-dq-1"></script><script src="/assets/employee-directory-enhancer.js?v=20260810-5"></script><script>(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEYS=['sulandra:employee:access-token','sulandra_token','token','accessToken'];const token=()=>KEYS.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(String(v)).toLocaleString():'—';const state={context:null,issues:[]};async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',headers:{Accept:'application/json',Authorization:`Bearer ${token()}`,...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(p.error||p.message||`Request failed (${r.status})`);e.details=p.details||p.data||p;throw e}return p.data??p}function render(){const q=$('search').value.trim().toLowerCase(),rows=state.issues.filter(i=>!q||JSON.stringify(i).toLowerCase().includes(q));$('list').innerHTML=rows.length?rows.map(i=>`<article class="item"><div class="item-head"><div><span class="badge ${esc(i.severity)}">${esc(i.severity)}</span> <span class="badge ${esc(i.status)}">${esc(String(i.status).replaceAll('_',' '))}</span><h2>${esc(i.title)}</h2><p>${esc(i.module)} · ${esc(i.resourceType)}${i.resourceId?` · ${esc(i.resourceId)}`:''}</p></div><span class="badge">${esc(fmt(i.lastSeenAt))}</span></div><div class="item-body"><div class="facts"><div class="fact"><span>First Seen</span><strong>${esc(fmt(i.firstSeenAt))}</strong></div><div class="fact"><span>Last Seen</span><strong>${esc(fmt(i.lastSeenAt))}</strong></div><div class="fact"><span>Assigned</span><strong>${esc(i.assignedUserId||'Management Queue')}</strong></div><div class="fact"><span>Detection</span><strong>${esc(i.detectedBy||'SYSTEM_SCAN')}</strong></div></div>${i.details?`<div class="details">${esc(i.details)}</div>`:''}<div class="actions">${i.actionPath?`<a class="btn primary" href="${esc(i.actionPath)}">Open Source</a>`:''}${state.context.write&&i.status==='OPEN'?`<button class="btn" data-action="ACKNOWLEDGE" data-id="${esc(i.id)}">Acknowledge</button>`:''}${state.context.write&&['OPEN','ACKNOWLEDGED'].includes(i.status)?`<button class="btn success" data-action="RESOLVE" data-id="${esc(i.id)}">Resolve</button><button class="btn warn" data-action="IGNORE" data-id="${esc(i.id)}">Ignore</button><button class="btn" data-action="ASSIGN" data-id="${esc(i.id)}">Assign</button><button class="btn" data-action="COMMENT" data-id="${esc(i.id)}">Comment</button>`:''}${state.context.write&&['RESOLVED','IGNORED'].includes(i.status)?`<button class="btn" data-action="REOPEN" data-id="${esc(i.id)}">Reopen</button>`:''}</div>${Array.isArray(i.history)&&i.history.length?`<div class="history"><strong style="font-size:10px">Issue history</strong>${i.history.slice(0,7).map(h=>`<div>${esc(String(h.eventType).replaceAll('_',' '))} · ${esc(fmt(h.createdAt))} · ${esc(h.actorUserId)}${h.comment?` — ${esc(h.comment)}`:''}</div>`).join('')}</div>`:''}</div></article>`).join(''):'<div class="empty">No data-quality issues match this view.</div>';wireActions()}async function load(){const qs=new URLSearchParams();if($('status').value)qs.set('status',$('status').value);if($('severity').value)qs.set('severity',$('severity').value);if($('module').value)qs.set('module',$('module').value);const [issues,summary]=await Promise.all([api(`/api/data-quality/issues?${qs}`),api('/api/data-quality/summary')]);state.issues=issues;$('summary').innerHTML=`<div class="stat"><span>Open / Acknowledged</span><strong>${Number(summary.open||0)}</strong></div><div class="stat"><span>Critical</span><strong>${Number(summary.critical||0)}</strong></div><div class="stat"><span>High</span><strong>${Number(summary.high||0)}</strong></div><div class="stat"><span>Last Scan</span><strong style="font-size:12px">${esc(fmt(summary.lastRun?.completedAt||summary.lastRun?.startedAt))}</strong></div>`;render()}async function scan(){if(!state.context.write)return;const button=$('scan');button.disabled=true;button.textContent='Scanning…';try{const result=await api('/api/data-quality/scan',{method:'POST',body:'{}'});alert(`Data Quality scan complete. ${result.issuesFound} issue(s) detected: ${result.critical} critical, ${result.high} high, ${result.medium} medium, ${result.low} low.`);await load()}catch(e){alert(e.message)}finally{button.disabled=false;button.textContent='Run Full Scan'}}function wireActions(){document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>act(b.dataset.id,b.dataset.action))}async function act(id,action){let comment=null,assignedUserId=null;if(action==='RESOLVE'){comment=prompt('Resolution note (required):');if(!comment)return}if(action==='IGNORE'){comment=prompt('Ignore rationale (required):');if(!comment)return}if(action==='COMMENT'){comment=prompt('Comment:');if(!comment)return}if(action==='ACKNOWLEDGE'||action==='REOPEN')comment=prompt('Note (optional):')||null;if(action==='ASSIGN'){assignedUserId=prompt('Employee User ID:');if(!assignedUserId)return;comment=prompt('Assignment note (optional):')||null}try{await api(`/api/data-quality/issues/${encodeURIComponent(id)}/action`,{method:'POST',body:JSON.stringify({action,comment,assignedUserId})});await load()}catch(e){alert(e.message)}}$('scan').onclick=scan;$('refresh').onclick=load;$('status').onchange=load;$('severity').onchange=load;$('module').onchange=load;$('search').oninput=render;window.addEventListener('sulandra:entity-context-changed',()=>location.reload());(async()=>{if(!token()){location.href='/employee-login.html?returnTo=/data-quality.html';return}await window.SulandraEntityContext?.ready;try{state.context=await api('/api/data-quality/context');$('context').innerHTML=`<strong>${esc(state.context.company?.displayName||'Selected Company')}</strong> · Full-scope cross-module scan version ${esc(state.context.scanVersion)} · ${state.context.write?'Issue management enabled':'Read-only access'}`;$('scan').hidden=!state.context.write;await load()}catch(e){$('error').textContent=e.message;$('error').classList.add('show')}})()})();</script></body></html>
