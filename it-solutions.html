<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sulandra IT Solutions</title></head><body><main>
<div>
  <h2>Sulandra IT Agent</h2>
  <div id="agentChat"></div>
  <textarea id="agentPrompt"></textarea><button id="agentSend">Ask IT Agent</button>
  <div>
    <h3>Secure attachment upload</h3>
    <input id="agentFile" type="file" />
    <button id="uploadFileBtn">Upload Attachment</button>
    <small id="uploadStatus"></small>
  </div>
  <div>
    <h3>External email (admin only)</h3>
    <input id="extRecipients" placeholder="name@example.com, other@example.com" />
    <input id="extSubject" placeholder="Subject" />
    <textarea id="extMessage" placeholder="Message"></textarea>
    <button id="sendExternalEmailBtn">Send External Email</button>
    <small id="extEmailStatus"></small>
  </div>
</div>
</main><script>
const API='https://sulandra-website-production-5fc4.up.railway.app';
const token=()=>sessionStorage.getItem('sulandra:employee:access-token')||localStorage.getItem('sulandra:employee:access-token')||sessionStorage.getItem('sulandra:admin:access-token')||localStorage.getItem('sulandra:admin:access-token')||localStorage.getItem('token')||'';
let conversationId=sessionStorage.getItem('sulandra:it-agent:conversation')||'';
async function api(path,options={}){const response=await fetch(API+path,{...options,headers:{Accept:'application/json',Authorization:'Bearer '+token(),...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const payload=await response.json().catch(()=>({}));if(!response.ok)throw new Error(payload.error||payload.message||`Request failed (${response.status})`);return payload.data??payload}
function bubble(t){const d=document.createElement('div');d.textContent=t;agentChat.appendChild(d)}
async function sendAgent(){const message=agentPrompt.value.trim();if(!message)return;const data=await api('/api/it-solutions/agent/chat',{method:'POST',body:JSON.stringify({conversationId:conversationId||undefined,message})});conversationId=data.conversationId||conversationId;if(conversationId)sessionStorage.setItem('sulandra:it-agent:conversation',conversationId);bubble(data.reply||'Done')}
agentSend.onclick=()=>sendAgent().catch(e=>bubble(e.message));
uploadFileBtn.onclick=async()=>{try{if(!conversationId)throw new Error('Start an IT Agent conversation first.');const f=agentFile.files&&agentFile.files[0];if(!f)throw new Error('Choose a file first.');const b=await f.arrayBuffer();const base64=btoa(String.fromCharCode(...new Uint8Array(b)));const data=await api('/api/it-solutions/agent/upload',{method:'POST',body:JSON.stringify({conversationId,fileName:f.name,mimeType:f.type||'application/octet-stream',fileDataBase64:base64})});uploadStatus.textContent=`Uploaded: ${data.reference} (${data.status})`;bubble(`Attachment reference ready: ${data.reference}`);}catch(e){uploadStatus.textContent=e.message;}};
sendExternalEmailBtn.onclick=async()=>{try{const recipients=extRecipients.value.split(',').map(x=>x.trim()).filter(Boolean);const subject=extSubject.value.trim();const message=extMessage.value.trim();const data=await api('/api/it-solutions/agent/email/external',{method:'POST',body:JSON.stringify({conversationId:conversationId||undefined,recipients,subject,message})});extEmailStatus.textContent=`Sent to ${data.recipientCount} recipient(s).`;bubble(`External email sent. Accepted: ${data.acceptedCount}, Rejected: ${data.rejectedCount}`);}catch(e){extEmailStatus.textContent=e.message;}};
</script></body></html>
