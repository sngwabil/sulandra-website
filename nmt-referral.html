<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><title>Secure NMT Referral | Sulandra Health</title><link rel="icon" href="/favicon.ico">
<style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#eef4f7;color:#173b52}button,input,select,textarea{font:inherit}.top{display:flex;align-items:center;padding:14px 20px;background:#fff;border-bottom:1px solid #d5e1e8}.top img{width:230px;max-width:55vw}.top span{margin-left:auto;font-size:12px;font-weight:900;color:#2d6b48}.banner{display:none;text-align:center;padding:10px 14px;font-weight:950}.banner.training{display:block;background:#7b2d25;color:#fff}.banner.operational{display:block;background:#e8f7ee;color:#28643e;border-bottom:1px solid #add9bd}.shell{width:min(1020px,calc(100% - 22px));margin:18px auto 50px}.hero,.card{background:#fff;border:1px solid #d4e1e8;border-radius:16px;box-shadow:0 10px 28px rgba(17,55,79,.07)}.hero{padding:20px 22px;margin-bottom:13px}.eyebrow{font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.09em;color:#0b73a8}.hero h1{margin:6px 0 4px;color:#0b4265}.hero p{margin:5px 0;color:#667b89;line-height:1.5}.pills{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.pill{padding:5px 8px;border:1px solid #c9dce7;background:#f4f9fc;border-radius:999px;font-size:11px;font-weight:900}.steps{display:flex;gap:6px;overflow:auto;margin-bottom:11px}.step{border:1px solid #cbd9e1;background:#fff;color:#577084;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;white-space:nowrap}.step.active{background:#0b6ea8;color:#fff;border-color:#0b6ea8}.card{overflow:hidden}.head{padding:15px 18px;border-bottom:1px solid #e2e9ed}.head h2{margin:0;color:#174b69;font-size:20px}.head p{margin:5px 0 0;color:#6a7d89;font-size:13px}.body{padding:18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field.wide{grid-column:1/-1}.field label{font-size:12px;font-weight:900;color:#496678}.field input,.field select,.field textarea{width:100%;border:1px solid #c7d6df;border-radius:9px;padding:10px 11px;background:#fff;color:#173c54}.field textarea{min-height:96px;resize:vertical}.required{color:#a33c35}.check{display:flex;align-items:flex-start;gap:9px;border:1px solid #dbe5eb;border-radius:10px;padding:11px;background:#fafcfd}.check input{width:18px;height:18px;margin-top:2px}.actions{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:17px;flex-wrap:wrap}.actions .spacer{flex:1}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:9px;padding:10px 13px;font-weight:900;cursor:pointer}.btn.primary{background:#0b6ea8;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.notice,.error{padding:11px 13px;border-radius:10px;margin-bottom:12px;font-size:13px;line-height:1.45}.notice{background:#eff8fc;border:1px solid #c9dfeb;color:#42677c}.notice.warn{background:#fff7e4;border-color:#ead195;color:#745212}.error{display:none;background:#fff0ef;border:1px solid #efb3ae;color:#8c302b}.error.show{display:block}.review{border:1px solid #dbe5ea;border-radius:9px;padding:10px;background:#fafcfd}.review strong{color:#214f6b}.success{text-align:center;padding:34px 22px}.success .mark{width:62px;height:62px;border-radius:999px;background:#e4f7eb;color:#2a7045;display:grid;place-items:center;margin:0 auto 12px;font-size:30px;font-weight:950}.tracking{display:inline-block;padding:9px 13px;border-radius:9px;border:1px solid #bdd8c7;background:#f0faf3;font-weight:950;color:#27623e}.upload{border:1px solid #dce6eb;border-radius:10px;padding:11px;margin-top:10px}.footer{text-align:center;color:#7b8d98;font-size:11px;margin-top:16px}.hidden{display:none!important}@media(max-width:680px){.grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.shell{width:calc(100% - 14px);margin-top:8px}.top span{display:none}.body{padding:14px}.actions .spacer{display:none}.actions .btn{flex:1}}
</style>
</head><body>
<header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span>🔒 Secure Facility Referral Session</span></header><div id="modeBanner" class="banner"></div><main id="app" class="shell"><section class="hero"><div class="eyebrow">Sulandra NMT Services</div><h1>Secure Transportation Referral</h1><p>Validating facility invitation…</p></section></main>
<script>
(()=>{'use strict';
const API='https://sulandra-website-production-5fc4.up.railway.app',TOKEN_KEY='sulandra:nmt:facility-referral-token',DRAFT_KEY='sulandra:nmt:referral-draft';
const state={session:null,step:0,order:null};const steps=['Rider','Trip','Mobility & Safety','Order Details','Review'];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const urlToken=new URL(location.href).searchParams.get('token')||'';if(urlToken){sessionStorage.setItem(TOKEN_KEY,urlToken);history.replaceState({},document.title,location.pathname);}const token=()=>sessionStorage.getItem(TOKEN_KEY)||'';
async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',referrerPolicy:'no-referrer',headers:{Accept:'application/json',Authorization:`Bearer ${token()}`,...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||p.message||`Request failed (${r.status})`);return p.data??p;}
function draft(){try{return JSON.parse(sessionStorage.getItem(DRAFT_KEY)||'{}');}catch{return{}}}function saveDraft(){const d={...draft()};document.querySelectorAll('[data-field]').forEach(el=>{d[el.id]=el.type==='checkbox'?el.checked:el.type==='number'&&el.value!==''?Number(el.value):el.value||null;});sessionStorage.setItem(DRAFT_KEY,JSON.stringify(d));return d;}
function restore(){const d=draft();document.querySelectorAll('[data-field]').forEach(el=>{if(!(el.id in d))return;if(el.type==='checkbox')el.checked=Boolean(d[el.id]);else el.value=d[el.id]??'';});renderReturnFields(false);}
const field=(id,label,type='text',wide=false,required=false,extra='')=>`<div class="field ${wide?'wide':''}"><label>${esc(label)}${required?' <span class="required">*</span>':''}</label><input id="${id}" data-field type="${type}" ${required?'required':''} ${extra}></div>`;
const area=(id,label,required=false)=>`<div class="field wide"><label>${esc(label)}${required?' <span class="required">*</span>':''}</label><textarea id="${id}" data-field ${required?'required':''}></textarea></div>`;
const select=(id,label,opts)=>`<div class="field"><label>${esc(label)}</label><select id="${id}" data-field>${opts.map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join('')}</select></div>`;
const check=(id,label)=>`<label class="check field wide"><input id="${id}" data-field type="checkbox"><span><strong>${esc(label)}</strong></span></label>`;
function hero(){return `<section class="hero"><div class="eyebrow">${esc(state.session.companyName)}</div><h1>Secure Transportation Referral</h1><p>Submitting facility: <strong>${esc(state.session.facilityName)}</strong>. Complete only the information needed for safe transportation review and scheduling.</p><div class="pills"><span class="pill">${esc(state.session.facilityType.replaceAll('_',' '))}</span><span class="pill">Expires ${esc(new Date(state.session.expiresAt).toLocaleDateString())}</span><span class="pill">${esc(state.session.submissionsRemaining)} submission(s) remaining</span></div></section>`;}
function nav(){return `<div class="steps">${steps.map((s,i)=>`<button class="step ${i===state.step?'active':''}" data-step="${i}" type="button">${i+1}. ${esc(s)}</button>`).join('')}</div>`;}
function actions(){return `<div class="actions">${state.step?'<button class="btn" data-prev type="button">← Back</button>':''}<span class="spacer"></span><button class="btn primary" data-next type="button">Continue →</button></div>`;}
function body(){if(state.step===0)return `<div class="head"><h2>Rider Identification</h2><p>Enter the individual named on the transportation order.</p></div><div class="body"><div id="formError" class="error"></div><div class="grid">${field('riderFirstName','First name','text',false,true)}${field('riderLastName','Last name','text',false,true)}${field('riderMiddleName','Middle name')}${field('riderDateOfBirth','Date of birth','date')}${field('riderPhone','Rider phone','tel')}${field('externalOrderId','Facility order / referral number')}${state.session.purpose==='OPERATIONAL'?`${field('riderMedicaidId','Medicaid ID')}${field('riderMemberId','Member ID')}${field('payerName','Payer / health plan')}${field('authorizationNumber','Authorization number')}`:'<div class="notice warn field wide"><strong>Training mode:</strong> use simulated rider data only. Do not enter payer, Medicaid, member, or authorization identifiers.</div>'}</div>${actions()}</div>`;
if(state.step===1)return `<div class="head"><h2>Trip Request</h2><p>Pickup, destination, timing, and return details.</p></div><div class="body"><div id="formError" class="error"></div><div class="grid">${select('tripType','Trip type',[['ONE_WAY','One way'],['ROUND_TRIP','Round trip'],['RECURRING','Recurring']])}${select('priority','Priority',[['ROUTINE','Routine'],['HIGH','High'],['URGENT','Urgent']])}${field('requestedPickupAt','Requested pickup','datetime-local',false,true)}${field('appointmentAt','Appointment / required arrival','datetime-local')}${field('pickupWindowMinutes','Pickup window (minutes)','number',false,false,'min="0" max="240" value="15"')}${field('pickupName','Pickup location name')}${field('pickupStreet','Pickup street','text',false,true)}${field('pickupUnitRoom','Pickup unit / room')}${field('pickupCity','Pickup city','text',false,true)}${field('pickupState','Pickup state','text',false,true)}${field('pickupPostalCode','Pickup ZIP','text',false,true)}${area('pickupInstructions','Pickup / handoff instructions')}${field('dropoffName','Destination name')}${field('dropoffUnitRoom','Destination unit / suite')}${field('dropoffStreet','Destination street','text',false,true)}${field('dropoffCity','Destination city','text',false,true)}${field('dropoffState','Destination state','text',false,true)}${field('dropoffPostalCode','Destination ZIP','text',false,true)}${area('dropoffInstructions','Destination / handoff instructions')}${check('returnTripNeeded','Return trip needed')}<div id="returnFields" class="field wide"></div>${area('recurrenceText','Recurring schedule / frequency')}</div>${actions()}</div>`;
if(state.step===2)return `<div class="head"><h2>Mobility, Equipment & Safety</h2><p>Transportation accommodations required for a safe trip.</p></div><div class="body"><div id="formError" class="error"></div><div class="grid">${select('serviceLevel','Transportation level',[['AMBULATORY','Ambulatory'],['WHEELCHAIR','Wheelchair'],['BARIATRIC_WHEELCHAIR','Bariatric wheelchair'],['STRETCHER','Stretcher'],['OTHER','Other']])}${field('wheelchairType','Wheelchair / mobility device')}${field('wheelchairWeightLbs','Device weight (lb)','number')}${area('mobility','Mobility, transfer, lift, or assistance needs')}${check('bariatric','Bariatric accommodation required')}${check('stairAssistance','Stair assistance required')}${check('oxygenRequired','Oxygen required during transport')}${field('oxygenFlow','Oxygen flow / delivery details')}${check('escortRequired','Escort / attendant required')}${field('escortName','Escort / attendant name')}${area('medicalEquipment','Other medical equipment / personal items')}${area('infectionPrecautions','Infection-control / PPE precautions')}${area('behaviorSafetyNeeds','Behavioral, cognitive, elopement, or safety needs')}${area('specialInstructions','Other transportation instructions')}</div>${actions()}</div>`;
if(state.step===3)return `<div class="head"><h2>Ordering Facility & Medical Necessity</h2><p>Identify the ordering contact and referral context.</p></div><div class="body"><div id="formError" class="error"></div><div class="grid">${field('orderingProviderName','Ordering physician / provider')}${field('orderingProviderNpi','Provider NPI')}${field('orderingDepartment','Department / unit')}${field('orderingContactName','Ordering contact name','text',false,true)}${field('orderingContactPhone','Ordering contact phone','tel',false,true)}${field('orderingContactEmail','Ordering contact email','email')}${area('medicalNecessity','Medical necessity / reason transportation is requested')}${area('clinicalNotes','Pertinent clinical / functional information')}${field('submitterName','Person submitting referral','text',false,true)}${area('submitterAttestation','Facility attestation',true)}${state.session.purpose==='TRAINING_ONLY'?`<label class="check field wide"><input id="trainingAcknowledgment" data-field type="checkbox"><span><strong>Training data acknowledgment <span class="required">*</span></strong><br><small>I confirm this submission uses simulated people and contains no real patient or payer information.</small></span></label>`:''}</div>${actions()}</div>`;
const d=draft();return `<div class="head"><h2>Review & Submit</h2><p>Confirm the referral before securely sending it to Sulandra NMT.</p></div><div class="body"><div id="formError" class="error"></div><div class="notice ${state.session.purpose==='TRAINING_ONLY'?'warn':''}">${state.session.purpose==='TRAINING_ONLY'?'<strong>TRAINING ONLY.</strong> This referral cannot become an operational trip.':'Submission places this referral into Sulandra NMT’s protected internal review queue. It does not itself confirm transportation.'}</div><div class="grid"><div class="review"><strong>Rider</strong><br>${esc(`${d.riderFirstName||''} ${d.riderLastName||''}`)}<br><small>DOB ${esc(d.riderDateOfBirth||'not provided')}</small></div><div class="review"><strong>Pickup</strong><br>${esc(d.pickupName||d.pickupStreet||'')}<br><small>${esc(d.requestedPickupAt||'')}</small></div><div class="review"><strong>Destination</strong><br>${esc(d.dropoffName||d.dropoffStreet||'')}<br><small>${esc(d.appointmentAt||'')}</small></div><div class="review"><strong>Ordering Contact</strong><br>${esc(d.orderingContactName||'')}<br><small>${esc(d.orderingContactPhone||'')}</small></div></div><div class="actions"><button class="btn" data-prev type="button">← Back</button><span class="spacer"></span><button id="submitReferral" class="btn primary" type="button">Securely Submit Referral</button></div></div>`;}
function render(){saveDraft();$('app').innerHTML=hero()+nav()+`<section class="card">${body()}</section><div class="footer">Use this secure session only for information necessary to arrange transportation. A trip is not confirmed until Sulandra reviews and accepts the order.</div>`;restore();wire();}
function renderReturnFields(persist=true){const cb=$('returnTripNeeded'),host=$('returnFields');if(!cb||!host)return;if(persist)saveDraft();if(!cb.checked){host.innerHTML='';return;}const d=draft();host.innerHTML=`<div class="grid">${select('returnTripMode','Return trip type',[['SCHEDULED','Scheduled'],['WILL_CALL','Will call']])}${field('returnPickupAt','Return pickup','datetime-local')}</div>`;const mode=$('returnTripMode'),time=$('returnPickupAt');if(mode&&d.returnTripMode)mode.value=d.returnTripMode;if(time&&d.returnPickupAt)time.value=d.returnPickupAt;[mode,time].forEach(el=>el&&el.addEventListener('change',saveDraft));}
function validate(){const box=$('formError'),missing=[];document.querySelectorAll('[required]').forEach(el=>{if(!String(el.value||'').trim())missing.push(el.previousElementSibling?.textContent?.replace('*','').trim()||el.id)});if(state.session.purpose==='TRAINING_ONLY'&&state.step===3&&!$('trainingAcknowledgment')?.checked)missing.push('Training data acknowledgment');if(missing.length){box.textContent=`Complete required fields: ${missing.join(', ')}`;box.classList.add('show');return false}return true}
function wire(){document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('change',saveDraft));$('returnTripNeeded')?.addEventListener('change',()=>renderReturnFields(true));document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{if(!validate())return;saveDraft();state.step=Math.min(4,state.step+1);render();scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>{saveDraft();state.step=Math.max(0,state.step-1);render();scrollTo({top:0,behavior:'smooth'})});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{saveDraft();state.step=Number(b.dataset.step);render();scrollTo({top:0,behavior:'smooth'})});$('submitReferral')?.addEventListener('click',submit)}
const iso=v=>{if(!v)return null;const d=new Date(v);return Number.isNaN(d.getTime())?null:d.toISOString()};
async function submit(){const b=$('submitReferral'),box=$('formError');b.disabled=true;b.textContent='Submitting…';try{const d=saveDraft(),payload={...d,requestedPickupAt:iso(d.requestedPickupAt),appointmentAt:iso(d.appointmentAt),returnPickupAt:iso(d.returnPickupAt),recurrence:{description:d.recurrenceText||null},pickupWindowMinutes:Number(d.pickupWindowMinutes||15),wheelchairWeightLbs:d.wheelchairWeightLbs?Number(d.wheelchairWeightLbs):null};delete payload.recurrenceText;const out=await api('/public/nmt/referrals/orders',{method:'POST',body:JSON.stringify(payload)});state.order=out;sessionStorage.removeItem(DRAFT_KEY);success()}catch(e){box.textContent=e.message;box.classList.add('show');b.disabled=false;b.textContent='Securely Submit Referral'}}
function success(){$('app').innerHTML=hero()+`<section class="card"><div class="success"><div class="mark">✓</div><h2>${state.order.mode==='TRAINING_ONLY'?'Training Referral Received':'Referral Securely Received'}</h2><p>${esc(state.order.message||'Referral received for review.')}</p><div class="tracking">Tracking: ${esc(state.order.orderNumber)}</div><p>You may attach the facility order, medical-necessity form, authorization, facesheet, or discharge/transfer order.</p><div id="uploads"></div><button id="addUpload" class="btn">+ Add Document</button><div class="actions"><span class="spacer"></span><button id="finish" class="btn primary">Finish Secure Session</button></div></div></section>`;$('addUpload').onclick=addUpload;$('finish').onclick=()=>{sessionStorage.removeItem(TOKEN_KEY);$('app').innerHTML='<section class="hero"><div class="success"><div class="mark">✓</div><h2>Session Complete</h2><p>You may close this browser tab.</p></div></section>'}}
function addUpload(){const w=document.createElement('div');w.className='upload';w.innerHTML=`<div class="grid"><div class="field"><label>Document type</label><select data-type><option value="TRANSPORT_ORDER">Transportation Order</option><option value="MEDICAL_NECESSITY">Medical Necessity</option><option value="AUTHORIZATION">Authorization</option><option value="FACESHEET">Facesheet</option><option value="DISCHARGE_ORDER">Discharge / Transfer Order</option><option value="OTHER">Other</option></select></div><div class="field"><label>File</label><input data-file type="file"></div><div class="field wide"><label>Title</label><input data-title></div></div><div class="actions"><button data-send class="btn primary">Upload</button></div><div class="error"></div>`;$('uploads').appendChild(w);w.querySelector('[data-send]').onclick=()=>upload(w)}
const b64=file=>new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||'').split(',').pop()||'');r.onerror=()=>reject(new Error('Unable to read file'));r.readAsDataURL(file)});
async function upload(w){const file=w.querySelector('[data-file]').files?.[0],box=w.querySelector('.error'),b=w.querySelector('[data-send]');if(!file)return;if(file.size>25*1024*1024){box.textContent='Files may not exceed 25 MB.';box.classList.add('show');return}b.disabled=true;b.textContent='Uploading…';try{await api(`/public/nmt/referrals/orders/${encodeURIComponent(state.order.id)}/attachments`,{method:'POST',body:JSON.stringify({documentType:w.querySelector('[data-type]').value,title:w.querySelector('[data-title]').value||file.name,originalFileName:file.name,mimeType:file.type||'application/octet-stream',contentBase64:await b64(file)})});w.innerHTML=`<div class="notice"><strong>✓ Uploaded:</strong> ${esc(file.name)}</div>`}catch(e){box.textContent=e.message;box.classList.add('show');b.disabled=false;b.textContent='Upload'}}
async function init(){if(!token()){$('app').innerHTML='<section class="hero"><div class="error show"><strong>Secure invitation required.</strong><br>Open this page using a valid facility invitation issued by Sulandra NMT Services.</div></section>';return}try{state.session=await api('/public/nmt/referrals/session');const banner=$('modeBanner');banner.className=`banner ${state.session.purpose==='TRAINING_ONLY'?'training':'operational'}`;banner.textContent=state.session.purpose==='TRAINING_ONLY'?'TRAINING ONLY — USE SIMULATED RIDERS — DO NOT ENTER REAL PATIENT OR PAYER INFORMATION':'SECURE OPERATIONAL FACILITY REFERRAL';render()}catch(e){sessionStorage.removeItem(TOKEN_KEY);$('app').innerHTML=`<section class="hero"><div class="error show"><strong>Unable to open referral session.</strong><br>${esc(e.message)}</div></section>`}}
init();})();
</script></body></html>
