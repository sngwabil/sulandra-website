<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <title>Secure NMT Referral | Sulandra Health</title><link rel="icon" href="/favicon.ico">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Segoe UI",Arial,sans-serif;background:#eef4f7;color:#183b52}button,input,select,textarea{font:inherit}.top{background:#fff;border-bottom:1px solid #d5e1e8;padding:14px 20px;display:flex;align-items:center;gap:16px}.top img{width:230px;max-width:50vw}.top .spacer{flex:1}.secure{font-size:12px;font-weight:900;color:#2d6b48}.banner{display:none;text-align:center;padding:10px 16px;font-weight:950;letter-spacing:.04em}.banner.training{display:block;background:#7b2d25;color:#fff}.banner.operational{display:block;background:#eaf7ef;border-bottom:1px solid #add9bd;color:#27643e}.shell{width:min(1050px,calc(100% - 24px));margin:18px auto 50px}.hero,.card{background:#fff;border:1px solid #d4e1e8;border-radius:16px;box-shadow:0 10px 28px rgba(17,55,79,.07)}.hero{padding:20px 22px;margin-bottom:14px}.eyebrow{font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.1em;color:#0b73a8}.hero h1{margin:6px 0 4px;color:#0b4265;font-size:30px}.hero p{margin:4px 0;color:#657a88;line-height:1.55}.session{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}.pill{display:inline-flex;padding:5px 9px;border:1px solid #c9dce7;background:#f3f9fc;border-radius:999px;font-size:11px;font-weight:900;color:#41677d}.steps{display:flex;gap:6px;overflow:auto;margin:0 0 12px;padding:2px}.step{white-space:nowrap;border:1px solid #cbd9e1;background:#fff;color:#587083;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900}.step.active{background:#0b6ea8;color:#fff;border-color:#0b6ea8}.card{overflow:hidden}.card-head{padding:16px 19px;border-bottom:1px solid #e3e9ed}.card-head h2{margin:0;color:#174b69;font-size:20px}.card-head p{margin:5px 0 0;color:#6a7d89;font-size:13px;line-height:1.45}.card-body{padding:19px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field.wide{grid-column:1/-1}.field label{font-size:12px;font-weight:900;color:#496678}.required{color:#a33c35}.field input,.field select,.field textarea{width:100%;border:1px solid #c7d6df;border-radius:9px;padding:10px 11px;background:#fff;color:#173c54}.field textarea{min-height:96px;resize:vertical;line-height:1.45}.field small{color:#7a8c98}.check{display:flex;align-items:flex-start;gap:9px;border:1px solid #dbe5eb;border-radius:10px;padding:11px;background:#fafcfd}.check input{width:18px;height:18px;margin-top:2px}.actions{display:flex;gap:9px;justify-content:flex-end;align-items:center;margin-top:18px;flex-wrap:wrap}.actions .spacer{flex:1}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:9px;padding:10px 13px;font-weight:900;cursor:pointer}.btn.primary{background:#0b6ea8;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.error{display:none;padding:11px 13px;margin-bottom:13px;border:1px solid #efb3ae;border-radius:10px;background:#fff0ef;color:#8c302b}.error.show{display:block}.notice{padding:11px 13px;margin-bottom:13px;border:1px solid #c9dfeb;border-radius:10px;background:#eff8fc;color:#42677c;font-size:13px;line-height:1.45}.notice.warning{border-color:#ead195;background:#fff7e4;color:#745212}.success{padding:34px 24px;text-align:center}.success .mark{width:62px;height:62px;border-radius:999px;background:#e4f7eb;color:#2a7045;display:grid;place-items:center;margin:0 auto 13px;font-size:30px;font-weight:900}.success h2{color:#245c3b}.tracking{display:inline-block;padding:9px 13px;border:1px solid #bdd8c7;background:#f0faf3;border-radius:9px;font-weight:950;color:#27623e;margin:8px 0}.upload-row{border:1px solid #dce6eb;border-radius:10px;padding:11px;margin-top:9px}.hidden{display:none!important}.loading{opacity:.58;pointer-events:none}.footer{text-align:center;color:#7a8b96;font-size:11px;margin-top:18px;line-height:1.55}
    @media(max-width:680px){.grid{grid-template-columns:1fr}.field.wide{grid-column:auto}.hero h1{font-size:24px}.top{padding:11px 13px}.secure{display:none}.shell{width:calc(100% - 14px);margin-top:8px}.card-body{padding:14px}.actions .spacer{display:none}.actions .btn{flex:1}}
  </style>
</head>
<body>
<header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><span class="secure">🔒 Secure Facility Referral Session</span></header>
<div class="banner" id="modeBanner"></div>
<main class="shell" id="app"><section class="hero"><div class="eyebrow">Sulandra NMT Services</div><h1>Secure Transportation Referral</h1><p>Validating your facility invitation…</p></section></main>
<script>
(() => {
 'use strict';
 const API='https://sulandra-website-production-5fc4.up.railway.app';
 const TOKEN_KEY='sulandra:nmt:facility-referral-token';
 const state={session:null,step:0,order:null,attachments:[]};
 const steps=['Rider','Trip','Mobility & Safety','Order Details','Review'];
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const tokenFromUrl=new URL(location.href).searchParams.get('token')||'';
 if(tokenFromUrl){sessionStorage.setItem(TOKEN_KEY,tokenFromUrl);history.replaceState({},document.title,location.pathname);}
 const token=()=>sessionStorage.getItem(TOKEN_KEY)||'';
 async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',referrerPolicy:'no-referrer',headers:{Accept:'application/json',Authorization:`Bearer ${token()}`,...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(p.error||p.message||`Request failed (${r.status})`);e.status=r.status;throw e;}return p.data??p;}
 const field=(id,label,type='text',wide=false,required=false,extra='')=>`<div class="field ${wide?'wide':''}"><label for="${id}">${label}${required?' <span class="required">*</span>':''}</label><input id="${id}" data-referral type="${type}" ${required?'required':''} ${extra}></div>`;
 const textarea=(id,label,wide=true,required=false,help='')=>`<div class="field ${wide?'wide':''}"><label for="${id}">${label}${required?' <span class="required">*</span>':''}</label><textarea id="${id}" data-referral ${required?'required':''}></textarea>${help?`<small>${help}</small>`:''}</div>`;
 const select=(id,label,options,wide=false)=>`<div class="field ${wide?'wide':''}"><label for="${id}">${label}</label><select id="${id}" data-referral>${options.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('')}</select></div>`;
 function snapshot(){const out={};document.querySelectorAll('[data-referral]').forEach(el=>{out[el.id]=el.type==='checkbox'?el.checked:el.type==='number'&&el.value!==''?Number(el.value):el.value||null;});return out;}
 function restore(data){requestAnimationFrame(()=>{Object.entries(data||{}).forEach(([k,v])=>{const el=document.getElementById(k);if(!el)return;if(el.type==='checkbox')el.checked=Boolean(v);else el.value=v??'';});wireDynamic();});}
 function draft(){try{return JSON.parse(sessionStorage.getItem('sulandra:nmt:referral-draft')||'{}');}catch{return{};}}
 function saveDraft(){sessionStorage.setItem('sulandra:nmt:referral-draft',JSON.stringify({...draft(),...snapshot()}));}
 function hero(){return `<section class="hero"><div class="eyebrow">${esc(state.session.companyName)}</div><h1>Secure Transportation Referral</h1><p>Submitting facility: <strong>${esc(state.session.facilityName)}</strong>. Complete the referral accurately so Sulandra can review rider identity, pickup requirements, transportation level, safety needs, payer/order details, and scheduling.</p><div class="session"><span class="pill">${esc(state.session.facilityType.replaceAll('_',' '))}</span><span class="pill">Invitation expires ${esc(new Date(state.session.expiresAt).toLocaleDateString())}</span><span class="pill">${esc(state.session.submissionsRemaining)} submission(s) remaining</span></div></section>`;}
 function stepNav(){return `<div class="steps">${steps.map((s,i)=>`<button class="step ${i===state.step?'active':''}" data-go-step="${i}" type="button">${i+1}. ${esc(s)}</button>`).join('')}</div>`;}
 function stepBody(){if(state.step===0)return `<div class="card-head"><h2>Rider Identification</h2><p>Enter the individual named on the transportation order/referral.</p></div><div class="card-body"><div class="error" id="formError"></div><div class="grid">${field('riderFirstName','First name','text',false,true)}${field('riderLastName','Last name','text',false,true)}${field('riderMiddleName','Middle name')}${field('riderDateOfBirth','Date of birth','date')}${field('riderPhone','Rider phone','tel')}${field('externalOrderId','Your facility order / referral number')}${state.session.purpose==='OPERATIONAL'?`${field('riderMedicaidId','Medicaid ID')}${field('riderMemberId','Member ID')}${field('payerName','Payer / health plan')}${field('authorizationNumber','Authorization number')}`:'<div class="notice warning field wide">Training mode blocks Medicaid/member/authorization identifiers. Use simulated rider data only.</div>'}</div>${navActions()}</div>`;
 if(state.step===1)return `<div class="card-head"><h2>Trip Request</h2><p>Pickup, destination, timing and return-trip information.</p></div><div class="card-body"><div class="error" id="formError"></div><div class="grid">${select('tripType','Trip type',[['ONE_WAY','One way'],['ROUND_TRIP','Round trip'],['RECURRING','Recurring']])}${select('priority','Priority',[['ROUTINE','Routine'],['HIGH','High'],['URGENT','Urgent']])}${field('requestedPickupAt','Requested pickup','datetime-local',false,true)}${field('appointmentAt','Appointment / required arrival','datetime-local')}${field('pickupWindowMinutes','Pickup window (minutes)','number',false,false,'min="0" max="240" value="15"')}${field('pickupName','Pickup facility / location name')}${field('pickupStreet','Pickup street','text',false,true)}${field('pickupUnitRoom','Pickup unit / room')}${field('pickupCity','Pickup city','text',false,true)}${field('pickupState','Pickup state','text',false,true)}${field('pickupPostalCode','Pickup ZIP','text',false,true)}${textarea('pickupInstructions','Pickup / handoff instructions')}${field('dropoffName','Destination name')}${field('dropoffUnitRoom','Destination unit / suite')}${field('dropoffStreet','Destination street','text',false,true)}${field('dropoffCity','Destination city','text',false,true)}${field('dropoffState','Destination state','text',false,true)}${field('dropoffPostalCode','Destination ZIP','text',false,true)}${textarea('dropoffInstructions','Destination / handoff instructions')}<label class="check field wide"><input id="returnTripNeeded" data-referral type="checkbox"><span><strong>Return trip needed</strong><br><small>Use for a scheduled return or will-call return.</small></span></label><div id="returnFields" class="field wide"></div>${textarea('recurrenceText','Recurring schedule / days / frequency',true,false,'For recurring trips, describe the requested pattern. Sulandra will verify the final schedule.')}</div>${navActions()}</div>`;
 if(state.step===2)return `<div class="card-head"><h2>Mobility, Equipment & Safety</h2><p>Provide the transportation accommodations needed for a safe trip.</p></div><div class="card-body"><div class="error" id="formError"></div><div class="grid">${select('serviceLevel','Transportation level',[['AMBULATORY','Ambulatory'],['WHEELCHAIR','Wheelchair'],['BARIATRIC_WHEELCHAIR','Bariatric wheelchair'],['STRETCHER','Stretcher'],['OTHER','Other']])}${field('wheelchairType','Wheelchair / mobility device type')}${field('wheelchairWeightLbs','Wheelchair/device weight (lb)','number')}${textarea('mobility','Mobility, transfer, lift or assistance needs')}${checkbox('bariatric','Bariatric accommodation required')}${checkbox('stairAssistance','Stair assistance / stairs at pickup or destination')}${checkbox('oxygenRequired','Oxygen required during transport')}${field('oxygenFlow','Oxygen flow / delivery details')}${checkbox('escortRequired','Escort / attendant required')}${field('escortName','Escort / attendant name')}${textarea('medicalEquipment','Other medical equipment / personal items')}${textarea('infectionPrecautions','Infection-control / PPE precautions')}${textarea('behaviorSafetyNeeds','Behavioral, cognitive, elopement or other safety needs')}${textarea('specialInstructions','Other transportation instructions')}</div>${navActions()}</div>`;
 if(state.step===3)return `<div class="card-head"><h2>Ordering Facility & Medical Necessity</h2><p>Identify the ordering contact and provide the transportation order context.</p></div><div class="card-body"><div class="error" id="formError"></div><div class="grid">${field('orderingProviderName','Ordering physician / provider')}${field('orderingProviderNpi','Provider NPI')}${field('orderingDepartment','Department / unit')}${field('orderingContactName','Ordering contact name','text',false,true)}${field('orderingContactPhone','Ordering contact phone','tel',false,true)}${field('orderingContactEmail','Ordering contact email','email')}${textarea('medicalNecessity','Medical necessity / reason transportation is requested',true,false)}${textarea('clinicalNotes','Pertinent clinical / functional information for transportation',true,false,'Include only information needed to arrange safe transportation.')}${field('submitterName','Person submitting this referral','text',false,true)}${textarea('submitterAttestation','Facility attestation',true,true)}${state.session.purpose==='TRAINING_ONLY'?`<label class="check field wide"><input id="trainingAcknowledgment" data-referral type="checkbox"><span><strong>Training data acknowledgment <span class="required">*</span></strong><br><small>I confirm this submission uses simulated people and contains no real patient, payer, Medicaid, member or authorization information.</small></span></label>`:''}</div>${navActions()}</div>`;
 const d={...draft(),...snapshot()};return `<div class="card-head"><h2>Review & Submit</h2><p>Confirm the referral before securely sending it to Sulandra NMT.</p></div><div class="card-body"><div class="error" id="formError"></div><div class="notice ${state.session.purpose==='TRAINING_ONLY'?'warning':''}">${state.session.purpose==='TRAINING_ONLY'?'<strong>TRAINING ONLY.</strong> This referral cannot become an operational trip.':'This sends the order into Sulandra NMT’s protected internal review queue. Submission does not itself confirm transportation.'}</div><div class="grid">${reviewBlock('Rider',`${d.riderFirstName||''} ${d.riderLastName||''}`,`DOB ${d.riderDateOfBirth||'not provided'} · ${d.serviceLevel||''}`)}${reviewBlock('Pickup',d.pickupName||d.pickupStreet||'',`${d.requestedPickupAt||''} · ${d.pickupCity||''}, ${d.pickupState||''}`)}${reviewBlock('Destination',d.dropoffName||d.dropoffStreet||'',`${d.appointmentAt||'No appointment time'} · ${d.dropoffCity||''}, ${d.dropoffState||''}`)}${reviewBlock('Ordering Contact',d.orderingContactName||'',`${d.orderingContactPhone||''} · ${d.orderingContactEmail||''}`)}</div><div class="actions"><button class="btn" data-prev type="button">← Back</button><span class="spacer"></span><button class="btn primary" id="submitReferral" type="button">Securely Submit Referral</button></div></div>`;}
 function checkbox(id,label){return `<label class="check field wide"><input id="${id}" data-referral type="checkbox"><span><strong>${esc(label)}</strong></span></label>`;}
 function reviewBlock(title,primary,secondary){return `<div class="field"><div class="notice"><strong>${esc(title)}</strong><br>${esc(primary)}<br><small>${esc(secondary)}</small></div></div>`;}
 function navActions(){return `<div class="actions">${state.step>0?'<button class="btn" data-prev type="button">← Back</button>':''}<span class="spacer"></span><button class="btn primary" data-next type="button">Continue →</button></div>`;}
 function render(){saveDraft();document.getElementById('app').innerHTML=hero()+stepNav()+`<section class="card">${stepBody()}</section><div class="footer">Use this secure referral session only for information necessary to arrange transportation. Do not reuse or share the invitation beyond the authorized referring facility. Sulandra Health does not confirm a trip until the order is reviewed and accepted.</div>`;restore(draft());wire();}
 function requiredValid(){const box=document.getElementById('formError');const missing=[];document.querySelectorAll('[required]').forEach(el=>{if(!String(el.value||'').trim())missing.push(el.previousElementSibling?.textContent?.replace('*','').trim()||el.id);});if(state.session.purpose==='TRAINING_ONLY'&&state.step===3&&!document.getElementById('trainingAcknowledgment')?.checked)missing.push('Training data acknowledgment');if(missing.length){box.textContent=`Complete required fields: ${missing.join(', ')}`;box.classList.add('show');return false;}return true;}
 function wireDynamic(){const ret=document.getElementById('returnTripNeeded'),host=document.getElementById('returnFields');if(ret&&host){const draw=()=>{host.innerHTML=ret.checked?`<div class="grid">${select('returnTripMode','Return trip type',[['SCHEDULED','Scheduled'],['WILL_CALL','Will call']])}${field('returnPickupAt','Return pickup','datetime-local')}</div>`:'';restore(draft());};ret.onchange=()=>{saveDraft();draw();};draw();}}
 function wire(){document.querySelectorAll('[data-referral]').forEach(el=>el.addEventListener('change',saveDraft));document.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{if(!requiredValid())return;saveDraft();state.step=Math.min(steps.length-1,state.step+1);render();scrollTo({top:0,behavior:'smooth'});});document.querySelectorAll('[data-prev]').forEach(b=>b.onclick=()=>{saveDraft();state.step=Math.max(0,state.step-1);render();scrollTo({top:0,behavior:'smooth'});});document.querySelectorAll('[data-go-step]').forEach(b=>b.onclick=()=>{saveDraft();state.step=Number(b.dataset.goStep);render();scrollTo({top:0,behavior:'smooth'});});wireDynamic();document.getElementById('submitReferral')?.addEventListener('click',submit);}
 function toIso(local){if(!local)return null;const d=new Date(local);return Number.isNaN(d.getTime())?null:d.toISOString();}
 async function submit(){if(!requiredValid())return;saveDraft();const d=draft(),button=document.getElementById('submitReferral'),error=document.getElementById('formError');button.disabled=true;button.textContent='Submitting…';try{const payload={...d,requestedPickupAt:toIso(d.requestedPickupAt),appointmentAt:toIso(d.appointmentAt),returnPickupAt:toIso(d.returnPickupAt),recurrence:{description:d.recurrenceText||null},pickupWindowMinutes:Number(d.pickupWindowMinutes||15),wheelchairWeightLbs:d.wheelchairWeightLbs?Number(d.wheelchairWeightLbs):null};delete payload.recurrenceText;const result=await api('/public/nmt/referrals/orders',{method:'POST',body:JSON.stringify(payload)});state.order=result;sessionStorage.removeItem('sulandra:nmt:referral-draft');renderSuccess();}catch(e){error.textContent=e.message;error.classList.add('show');button.disabled=false;button.textContent='Securely Submit Referral';}}
 function renderSuccess(){document.getElementById('app').innerHTML=`${hero()}<section class="card"><div class="success"><div class="mark">✓</div><h2>${state.order.mode==='TRAINING_ONLY'?'Training Referral Received':'Referral Securely Received'}</h2><p>${esc(state.order.message||'The referral has been received for review.')}</p><div class="tracking">Tracking: ${esc(state.order.orderNumber)}</div><p>Attach the hospital/facility order, medical-necessity form, authorization, facesheet, or other transportation documents needed for review.</p><div id="uploads"></div><button class="btn" id="addUpload">+ Add Document</button><div class="actions"><span class="spacer"></span><button class="btn primary" id="finish">Finish Secure Session</button></div></div></section>`;document.getElementById('addUpload').onclick=addUpload;document.getElementById('finish').onclick=()=>{sessionStorage.removeItem(TOKEN_KEY);document.getElementById('app').innerHTML='<section class="hero"><div class="success"><div class="mark">✓</div><h2>Session Complete</h2><p>You may close this browser tab.</p></div></section>';};}
 function addUpload(){const host=document.getElementById('uploads'),id=`upload_${Date.now()}`,wrap=document.createElement('div');wrap.className='upload-row';wrap.id=id;wrap.innerHTML=`<div class="grid"><div class="field"><label>Document type</label><select data-u-type><option value="TRANSPORT_ORDER">Transportation Order</option><option value="MEDICAL_NECESSITY">Medical Necessity</option><option value="AUTHORIZATION">Authorization</option><option value="FACESHEET">Facesheet</option><option value="DISCHARGE_ORDER">Discharge / Transfer Order</option><option value="OTHER">Other</option></select></div><div class="field"><label>File</label><input data-u-file type="file" required></div><div class="field wide"><label>Title</label><input data-u-title></div></div><div class="actions"><button class="btn primary" data-u-send type="button">Upload</button></div><div class="error"></div>`;host.appendChild(wrap);wrap.querySelector('[data-u-send]').onclick=()=>uploadFile(wrap);}
 function fileBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||'').split(',').pop()||'');r.onerror=()=>reject(new Error('Unable to read file'));r.readAsDataURL(file);});}
 async function uploadFile(wrap){const file=wrap.querySelector('[data-u-file]').files?.[0],error=wrap.querySelector('.error'),button=wrap.querySelector('[data-u-send]');if(!file)return;if(file.size>25*1024*1024){error.textContent='Files may not exceed 25 MB.';error.classList.add('show');return;}button.disabled=true;button.textContent='Uploading…';try{await api(`/public/nmt/referrals/orders/${encodeURIComponent(state.order.id)}/attachments`,{method:'POST',body:JSON.stringify({documentType:wrap.querySelector('[data-u-type]').value,title:wrap.querySelector('[data-u-title]').value||file.name,originalFileName:file.name,mimeType:file.type||'application/octet-stream',contentBase64:await fileBase64(file)})});wrap.innerHTML=`<div class="notice"><strong>✓ Uploaded:</strong> ${esc(file.name)}</div>`;}catch(e){error.textContent=e.message;error.classList.add('show');button.disabled=false;button.textContent='Upload';}}
 async function init(){if(!token()){document.getElementById('app').innerHTML='<section class="hero"><div class="error show"><strong>Secure invitation required.</strong><br>This referral page must be opened using a valid facility invitation issued by Sulandra NMT Services.</div></section>';return;}try{state.session=await api('/public/nmt/referrals/session');const banner=document.getElementById('modeBanner');banner.className=`banner ${state.session.purpose==='TRAINING_ONLY'?'training':'operational'}`;banner.textContent=state.session.purpose==='TRAINING_ONLY'?'TRAINING ONLY — USE SIMULATED RIDERS — DO NOT ENTER REAL PATIENT OR PAYER INFORMATION':'SECURE OPERATIONAL FACILITY REFERRAL';render();}catch(e){sessionStorage.removeItem(TOKEN_KEY);document.getElementById('app').innerHTML=`<section class="hero"><div class="error show"><strong>Unable to open referral session.</strong><br>${esc(e.message)}</div></section>`;}}
 init();
})();
</script>
</body>
</html>
