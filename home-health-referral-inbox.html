<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Home Health Referral Inbox | Sulandra Health</title><link rel="icon" href="/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;background:#edf3f7;color:#15384f;font-family:"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}.top{display:flex;align-items:center;gap:14px;padding:11px 18px;background:#fff;border-bottom:1px solid #d4e0e8;position:sticky;top:0;z-index:20}.top img{width:215px;max-width:42vw}.top .spacer{flex:1}.top a{color:#075985;text-decoration:none;font-weight:900}.banner{display:none;padding:9px 15px;background:#fff4dc;border-bottom:1px solid #e5cc8d;color:#73510e;text-align:center;font-weight:850}.banner.show{display:block}.layout{display:grid;grid-template-columns:340px minmax(0,1fr);min-height:calc(100vh - 68px)}.rail{padding:14px;background:#f9fbfc;border-right:1px solid #d4e0e8;overflow:auto}.filter{width:100%;border:1px solid #c8d6df;border-radius:9px;padding:9px 10px;margin-bottom:8px}.rail h2{margin:4px 0 10px;color:#0b4265;font-size:17px}.ref{width:100%;text-align:left;border:1px solid #d9e4ea;background:#fff;border-radius:10px;padding:10px;margin:5px 0;color:#2a4d63;cursor:pointer}.ref.active{background:#e5f4fb;border-color:#0b73a8}.ref strong{display:block;color:#0b4265}.ref small{display:block;color:#718490;margin-top:3px}.status{display:inline-flex;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:950;background:#edf3f7;color:#536c7d}.status.RECEIVED{background:#e8f1ff;color:#305f94}.status.REVIEW_REQUIRED,.status.INTAKE_CREATED{background:#fff0cf;color:#825a0d}.status.ACCEPTED,.status.SOC_SCHEDULED,.status.ACTIVE{background:#e4f7ea;color:#28623d}.status.DECLINED,.status.CANCELLED{background:#fde8e6;color:#93372f}.main{padding:17px;min-width:0}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}.hero h1{margin:0;color:#0b4265;font-size:28px}.hero p{margin:4px 0;color:#687b88}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:8px;padding:8px 10px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block}.btn.primary{background:#0b6ea8;color:#fff}.btn.success{border-color:#43865a;background:#eff9f2;color:#326d46}.btn.warn{border-color:#ab772c;color:#7d5617}.btn.danger{border-color:#b4514a;color:#94332e}.btn:disabled{opacity:.5;cursor:not-allowed}.card{background:#fff;border:1px solid #d4e0e8;border-radius:14px;box-shadow:0 8px 25px rgba(18,56,80,.06);margin-bottom:12px;overflow:hidden}.head{padding:13px 15px;border-bottom:1px solid #e2e9ed;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.head h2{margin:0;color:#174a69;font-size:18px}.body{padding:15px}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.fact{border:1px solid #e0e8ed;background:#f9fbfc;border-radius:8px;padding:8px 9px}.fact span{font-size:10px;font-weight:950;text-transform:uppercase;color:#788995;display:block}.fact strong{display:block;color:#31556b;margin-top:3px;word-break:break-word}.section{margin-top:13px}.section h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;color:#708491;letter-spacing:.04em}.note{white-space:pre-wrap;line-height:1.45;border:1px solid #e0e8ed;background:#f8fafb;border-radius:8px;padding:9px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.notice{padding:10px 12px;border:1px solid #cae1ec;background:#eff8fc;color:#416679;border-radius:9px;margin-bottom:11px;font-size:12px;line-height:1.45}.notice.warn{border-color:#e8cf94;background:#fff7e4;color:#74510e}.candidate,.doc,.event,.orderline{border:1px solid #dbe5ea;border-radius:9px;padding:9px;margin:6px 0}.candidate{display:flex;gap:8px;align-items:flex-start}.candidate input{margin-top:3px}.doc strong,.event strong,.orderline strong{color:#2a566f}.meta{font-size:11px;color:#758894;margin-top:3px}.event{border-left:3px solid #b7d8e7}.empty{text-align:center;padding:38px;color:#708491}dialog{width:min(560px,calc(100vw - 24px));border:0;border-radius:15px;padding:0;box-shadow:0 30px 90px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(8,29,43,.55)}.modal-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid #e1e8ec}.modal-head h2{margin:0;color:#0b4265}.modal-body{padding:16px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:900}.field textarea{border:1px solid #c7d6df;border-radius:9px;padding:9px;min-height:100px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}@media(max-width:900px){.layout{grid-template-columns:1fr}.rail{max-height:330px;border-right:0;border-bottom:1px solid #d4e0e8}.facts{grid-template-columns:1fr 1fr}}@media(max-width:620px){.facts{grid-template-columns:1fr}.main{padding:10px}.top a{display:none}}</style></head><body><header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><a href="/home-health-sources.html">Referral Sources</a><a href="/client-intake.html">Client Intake</a><a href="/spire-admin.html">SPIRE Admin</a></header><div class="banner" id="prelaunch">Home Health is pre-launch. Training referrals can be reviewed, but operational acceptance/start-of-care remains blocked until the company is activated.</div><div class="layout"><aside class="rail"><select class="filter" id="status"><option value="">All statuses</option><option>RECEIVED</option><option>REVIEW_REQUIRED</option><option>INTAKE_CREATED</option><option>ACCEPTED</option><option>DECLINED</option><option>CANCELLED</option></select><input class="filter" id="search" placeholder="Search patient, source or referral"><h2>Referral Inbox</h2><div id="list"><div class="empty">Loading…</div></div></aside><main class="main" id="main"><div class="empty">Choose a Home Health referral.</div></main></div><dialog id="decision"><div class="modal-head"><h2 id="decisionTitle">Referral Decision</h2><button class="btn" id="closeDecision" type="button">Close</button></div><div class="modal-body"><div class="field"><label>Reason / review note</label><textarea id="reason"></textarea></div><div class="modal-actions"><button class="btn primary" id="submitDecision" type="button">Continue</button></div></div></dialog><script src="/assets/sulandra-entity-context.js?v=20260809-company-scope-1"></script><script>(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEYS=['sulandra:employee:access-token','sulandra_token','token','accessToken'];const token=()=>KEYS.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=v=>v?new Date(String(v)).toLocaleString():'—',fmtDate=v=>v?new Date(String(v)).toLocaleDateString():'—';let context=null,referrals=[],referralId='',detail=null,decisionAction='';async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',headers:{Accept:'application/json',Authorization:`Bearer ${token()}`,...(options.body?{'Content-Type':'application/json'}:{})}});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||p.message||`Request failed (${r.status})`);return p.data??p;}function renderList(){const q=$('search').value.trim().toLowerCase(),st=$('status').value;const rows=referrals.filter(r=>(!st||r.status===st)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));$('list').innerHTML=rows.length?rows.map(r=>`<button class="ref ${String(r.id)===referralId?'active':''}" data-ref="${esc(r.id)}"><span class="status ${esc(r.status)}">${esc(String(r.status).replaceAll('_',' '))}</span><strong>${esc(r.patientFirstName)} ${esc(r.patientLastName)}</strong><small>${esc(r.referralNumber)} · ${esc(r.sourceName)}</small><small>SOC ${esc(fmtDate(r.requestedStartOfCareDate))} · ${esc(r.priority)} · ${esc(r.mode)}</small></button>`).join(''):'<div class="empty">No referrals match this view.</div>';}function fact(label,value){return `<div class="fact"><span>${esc(label)}</span><strong>${esc(value??'—')}</strong></div>`;}function note(label,value){return value?`<div class="section"><h3>${esc(label)}</h3><div class="note">${esc(value)}</div></div>`:'';}function renderDetail(){if(!detail){$('main').innerHTML='<div class="empty">Choose a Home Health referral.</div>';return;}const r=detail.referral,training=r.mode==='TRAINING_ONLY';$('main').innerHTML=`<div class="hero"><div><h1>${esc(r.patientFirstName)} ${esc(r.patientLastName)}</h1><p>${esc(r.referralNumber)} · ${esc(r.sourceName)}</p></div><button class="btn" id="refreshReferral">Refresh</button></div>${training?'<div class="notice warn"><strong>TRAINING ONLY.</strong> This referral cannot become operational care.</div>':''}${r.patientId?`<div class="notice"><strong>Shared SPIRE patient linked:</strong> ${esc(r.patientPreferredName||r.linkedFirstName||r.patientId)} ${esc(r.linkedLastName||'')}</div>`:''}${r.intakeCaseId?`<div class="notice"><strong>Home Health intake:</strong> ${esc(r.intakeCaseId)} · <a href="/client-intake.html">Open Client Intake</a></div>`:''}<section class="card"><div class="head"><h2>Referral Summary</h2><span class="status ${esc(r.status)}">${esc(String(r.status).replaceAll('_',' '))}</span></div><div class="body"><div class="facts">${fact('Source',r.sourceName)}${fact('Submitted',fmt(r.submittedAt))}${fact('Priority',r.priority)}${fact('DOB',fmtDate(r.patientDateOfBirth))}${fact('Phone',r.patientPhone)}${fact('Payer',r.payerName)}${fact('Medicare ID',r.medicareId)}${fact('Medicaid ID',r.medicaidId)}${fact('Authorization',r.authorizationNumber)}${fact('Discharge',fmtDate(r.dischargeDate))}${fact('Requested SOC',fmtDate(r.requestedStartOfCareDate))}${fact('Disciplines',Array.isArray(r.requestedDisciplines)?r.requestedDisciplines.join(', '):r.requestedDisciplines)}</div><div class="section"><h3>Home Address</h3><div class="note">${esc([r.streetAddress,r.city,r.state,r.postalCode].filter(Boolean).join(', '))}</div></div><div class="section"><h3>Referring Provider</h3><div class="facts">${fact('Provider',r.referringProviderName)}${fact('NPI',r.referringProviderNpi)}${fact('Facility',r.hospitalFacility)}${fact('Unit',r.hospitalUnit)}${fact('Phone',r.referringProviderPhone)}${fact('Fax',r.referringProviderFax)}</div></div>${note('Skilled Need',r.skilledNeed)}${note('Order Summary',r.orderSummary)}${note('Face-to-Face', [r.faceToFaceStatus,r.faceToFaceDate?fmtDate(r.faceToFaceDate):''].filter(Boolean).join(' · '))}${note('Homebound Status', [r.homeboundStatus,r.homeboundRationale].filter(Boolean).join(' — '))}${note('Diagnoses',r.diagnoses)}${note('Allergies',r.allergies)}${note('Medication Summary',r.medicationsSummary)}${note('Recent Hospitalization',r.recentHospitalization)}${note('Wound Care',r.woundCareNeeds)}${note('Infusion Needs',r.infusionNeeds)}${note('Respiratory Needs',r.respiratoryNeeds)}${note('DME / Equipment',r.dmeEquipment)}${note('Falls / Mobility',r.fallRisk)}${note('Cognitive / Behavioral',r.cognitiveBehavioralNeeds)}${note('Infection Precautions',r.infectionPrecautions)}${note('Home Safety',r.homeSafetyConcerns)}${note('Social / Access Barriers',r.socialDeterminants)}<div class="actions">${!r.patientId?'<button class="btn" id="linkPatient">Link Verified Patient</button>':''}${!r.intakeCaseId?'<button class="btn" id="createIntake">Create Home Health Intake</button>':''}<button class="btn warn" data-decision="REQUEST_REVIEW">Needs Review</button><button class="btn success" data-decision="ACCEPT" ${training||!context.operational?'disabled':''}>Accept Referral</button><button class="btn danger" data-decision="DECLINE">Decline</button></div></div></section>${orders(detail.orderLines)}${candidates(detail.patientCandidates,r.patientId)}${docs(detail.attachments)}${events(detail.events)}`;wireDetail();}function orders(rows){return `<section class="card"><div class="head"><h2>Structured Orders</h2></div><div class="body">${rows?.length?rows.map(x=>`<div class="orderline"><strong>${esc(x.discipline)} · ${esc(x.service)}</strong><div class="meta">Frequency ${esc(x.frequency||'—')} · Duration ${esc(x.duration||'—')} · Start ${esc(fmtDate(x.startDate))}</div>${x.instructions?`<div style="margin-top:6px">${esc(x.instructions)}</div>`:''}</div>`).join(''):'<div class="empty">No structured discipline lines were submitted.</div>'}</div></section>`;}function candidates(rows,linked){if(linked)return'';return `<section class="card"><div class="head"><h2>Possible Shared SPIRE Patient Matches</h2></div><div class="body">${rows?.length?`<div class="notice warn">Confirm identity before linking. Name/date-of-birth matching is a review aid only.</div>${rows.map(x=>`<label class="candidate"><input type="radio" name="candidate" value="${esc(x.id)}"><span><strong>${esc([x.preferredName||x.firstName,x.lastName].filter(Boolean).join(' '))}</strong><div class="meta">DOB ${esc(fmtDate(x.dateOfBirth))} · MRN ${esc(x.medicalRecordNumber||'—')} · ${Array.isArray(x.enrollments)?x.enrollments.length:0} active enrollment(s)</div></span></label>`).join('')}<div class="actions"><button class="btn primary" id="linkSelected">Link Selected Verified Patient</button></div>`:'<div class="empty">No exact matching patient was found. Create a Home Health intake for identity review instead of making a duplicate chart here.</div>'}</div></section>`;}function docs(rows){return `<section class="card"><div class="head"><h2>Referral Documents</h2></div><div class="body">${rows?.length?rows.map(x=>`<div class="doc"><strong>${esc(x.title||x.documentType)}</strong><div class="meta">${esc(x.originalFileName)} · ${esc(fmt(x.uploadedAt))}</div><button class="btn" data-download="${esc(x.id)}">Download</button></div>`).join(''):'<div class="empty">No referral documents attached.</div>'}</div></section>`;}function events(rows){return `<section class="card"><div class="head"><h2>Referral Audit Timeline</h2></div><div class="body">${rows?.length?rows.map(e=>`<div class="event"><strong>${esc(String(e.eventType).replaceAll('_',' '))}</strong><div class="meta">${esc(fmt(e.createdAt))} · ${esc(e.actorType)}</div></div>`).join(''):'<div class="empty">No events recorded.</div>'}</div></section>`;}function wireDetail(){$('refreshReferral').onclick=()=>openReferral(referralId);$('createIntake')?.addEventListener('click',()=>review('CREATE_INTAKE'));$('linkPatient')?.addEventListener('click',()=>document.querySelector('[name="candidate"]')?.scrollIntoView({behavior:'smooth'}));$('linkSelected')?.addEventListener('click',()=>{const id=document.querySelector('[name="candidate"]:checked')?.value;if(!id)return alert('Select a verified matching patient first.');review('LINK_PATIENT',id);});document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>openDecision(b.dataset.decision));document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>download(b.dataset.download));}async function loadReferrals(){referrals=await api('/api/admin/home-health/referrals');renderList();}async function openReferral(id){referralId=String(id);renderList();try{detail=await api(`/api/admin/home-health/referrals/${encodeURIComponent(id)}`);renderDetail();}catch(e){$('main').innerHTML=`<div class="empty">${esc(e.message)}</div>`;}}async function review(action,patientId=null,reason=null){try{await api(`/api/admin/home-health/referrals/${encodeURIComponent(referralId)}/review`,{method:'POST',body:JSON.stringify({action,patientId,reason})});await loadReferrals();await openReferral(referralId);}catch(e){alert(e.message);}}function openDecision(action){decisionAction=action;$('decisionTitle').textContent=action==='ACCEPT'?'Accept Home Health Referral':action==='DECLINE'?'Decline Home Health Referral':'Mark Referral for Review';$('reason').value='';$('decision').showModal();}async function download(id){try{const r=await fetch(`${API}/api/admin/home-health/referrals/${encodeURIComponent(referralId)}/attachments/${encodeURIComponent(id)}/download`,{cache:'no-store',headers:{Authorization:`Bearer ${token()}`}});if(!r.ok){const p=await r.json().catch(()=>({}));throw new Error(p.error||p.message||`Download failed (${r.status})`);}const blob=await r.blob(),cd=r.headers.get('content-disposition')||'',m=cd.match(/filename="([^"]+)"/i),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=m?.[1]||'home-health-referral-document';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){alert(e.message);}}async function init(){if(!token()){location.href='/employee-login.html?returnTo=/home-health-referral-inbox.html';return;}await window.SulandraEntityContext?.ready;context=await api('/api/admin/home-health/referral-context');$('prelaunch').classList.toggle('show',!context.operational);await loadReferrals();if(referrals.length)await openReferral(referrals[0].id);}document.addEventListener('click',e=>{const r=e.target.closest('[data-ref]');if(r)openReferral(r.dataset.ref);});$('search').oninput=renderList;$('status').onchange=renderList;$('closeDecision').onclick=()=>$('decision').close();$('submitDecision').onclick=async()=>{await review(decisionAction,null,$('reason').value||null);$('decision').close();};window.addEventListener('sulandra:entity-context-changed',()=>location.reload());init().catch(e=>{$('main').innerHTML=`<div class="empty">${esc(e.message)}</div>`;});})();</script></body></html>
