<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>S.P.I.R.E. Assessments & Flowsheets</title>
<style>
:root{--navy:#073f69;--blue:#0878b9;--sky:#d8effc;--ice:#eef7fc;--line:#aec9d8;--ink:#16384f;--muted:#657d8d;--gold:#e4b62f;--green:#20865d;--red:#b33a34;--purple:#6655a8;--white:#fff}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);background:#e7f0f6;overflow:hidden}button,input,select,textarea{font:inherit}.top{height:40px;background:linear-gradient(90deg,#073f69,#0878b9);color:#fff;display:flex;align-items:center;gap:12px;padding:0 10px;border-bottom:3px solid var(--gold)}.brand{font-weight:950;letter-spacing:.04em;font-size:18px}.brand small{font-size:10px;font-weight:700;opacity:.85;margin-left:5px}.top button{border:1px solid #ffffff66;background:#ffffff17;color:#fff;border-radius:4px;padding:5px 10px;font-weight:800;cursor:pointer}.patient{height:48px;background:#aee1fb;border-bottom:1px solid #78b8da;display:grid;grid-template-columns:minmax(200px,1.2fr) repeat(5,minmax(100px,.8fr));align-items:center;padding:4px 10px;gap:8px;font-size:11px}.patient strong{display:block;font-size:16px;color:#082f4c}.patient span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolbar{height:43px;background:#f4f9fc;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:5px;padding:5px 8px;overflow-x:auto}.tool{border:0;border-right:1px solid #cbdce6;background:transparent;padding:6px 9px;color:#234f6c;font-weight:750;white-space:nowrap;cursor:pointer}.tool:hover{background:#e7f4fb}.tool.primary{background:#0878b9;color:#fff;border-radius:5px;border-right:0}.tool.warn{color:#8a5c00}.date-input{height:30px;border:1px solid #a8c2d1;border-radius:4px;background:#fff;padding:3px 6px}.workspace{height:calc(100vh - 131px);display:grid;grid-template-columns:265px minmax(0,1fr) 320px;background:#fff}.left{border-right:1px solid var(--line);background:#f8fbfd;display:flex;flex-direction:column;min-width:0}.search{padding:8px;border-bottom:1px solid #cbdde7}.search input{width:100%;height:31px;border:1px solid #a9c2d2;border-radius:4px;padding:5px 8px}.groups{overflow:auto;padding:5px 0}.group-title{padding:8px 10px 4px;font-size:11px;font-weight:950;letter-spacing:.05em;text-transform:uppercase;color:#536f82}.row-toggle{display:grid;grid-template-columns:18px 1fr;gap:7px;align-items:start;width:100%;text-align:left;border:0;background:transparent;padding:6px 10px;color:#1a384c;cursor:pointer}.row-toggle:hover,.row-toggle.active{background:#cfeafb}.row-toggle input{margin-top:2px}.row-toggle small{display:block;color:#708594;font-size:9px;margin-top:1px}.center{min-width:0;overflow:hidden;display:flex;flex-direction:column}.subtabs{height:37px;background:#eff5f9;border-bottom:1px solid var(--line);display:flex;align-items:end;gap:1px;overflow-x:auto}.subtabs button{height:36px;border:1px solid transparent;border-bottom:0;background:transparent;padding:7px 12px;color:#35586e;white-space:nowrap;cursor:pointer}.subtabs button.active{background:#fff;border-color:var(--line);color:#076ca4;font-weight:900}.grid-wrap{flex:1;overflow:auto;position:relative;background:#fff}.grid{border-collapse:separate;border-spacing:0;min-width:100%;font-size:11px}.grid th,.grid td{border-right:1px solid #a9c8d9;border-bottom:1px solid #b9d0dd;min-width:126px;height:31px;padding:4px 7px}.grid thead th{position:sticky;top:0;background:#f7fbfd;z-index:5;color:#173c55}.grid .rowname{position:sticky;left:0;z-index:4;min-width:260px;max-width:260px;background:#fff;font-weight:800}.grid thead .rowname{z-index:7;background:#f0f6fa}.grid .section-row td{background:#edf5f9;color:#05699f;font-weight:950;font-size:12px;text-align:center;height:27px}.grid .section-row .rowname{background:#edf5f9}.time-head{text-align:center}.time-head strong{display:block;color:#082e48}.time-head small{display:block;color:#6a8090;font-weight:600}.grid-cell{background:#e8f4fb;cursor:pointer;position:relative}.grid-cell:hover{background:#d2ebf9;outline:2px solid #51a7d5;outline-offset:-2px}.grid-cell.has{background:#d8edf8}.grid-cell.mine{box-shadow:inset 0 -3px 0 #1a8a61}.grid-cell .val{font-weight:850;color:#183f58}.grid-cell .comment{display:block;color:#687f8e;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:112px}.grid-cell .edit-dot{position:absolute;right:3px;top:2px;color:#16835e;font-size:9px}.right{border-left:1px solid var(--line);background:#f9fbfc;display:flex;flex-direction:column}.right-head{padding:10px 12px;border-bottom:1px solid var(--line);background:#fff}.right-head strong{display:block;color:#075f91;font-size:14px}.right-head small{color:#6c8190}.editor{padding:10px 12px;overflow:auto;display:grid;gap:9px}.field{display:grid;gap:3px}.field label{font-size:10px;font-weight:900;color:#49687d;text-transform:uppercase;letter-spacing:.04em}.field input,.field select,.field textarea{width:100%;border:1px solid #a9c2d1;border-radius:4px;padding:7px;background:#fff}.field textarea{min-height:78px;resize:vertical}.choices{display:grid;gap:4px}.choice{border:1px solid #c5d8e4;background:#fff;padding:7px;text-align:left;border-radius:4px;cursor:pointer}.choice:hover{background:#e9f5fb}.editor-actions{display:flex;gap:7px;flex-wrap:wrap}.save{border:0;border-radius:5px;background:#0878b9;color:#fff;padding:8px 12px;font-weight:900;cursor:pointer}.secondary{border:1px solid #b6cad6;border-radius:5px;background:#fff;color:#31576f;padding:8px 12px;font-weight:800;cursor:pointer}.ownership{padding:8px;border-radius:5px;background:#eef7f2;color:#276a4d;font-size:10px}.ownership.locked{background:#f3f4f6;color:#67717a}.notice{padding:9px 12px;background:#fff4d6;border-bottom:1px solid #e3cf93;color:#73560a;font-size:10px;display:none}.notice.show{display:block}.empty{padding:25px;color:#6a7f8e;text-align:center}.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#163a52;color:#fff;padding:9px 14px;border-radius:7px;box-shadow:0 10px 28px #0003;z-index:50}.status.error{background:#8e302d}@media(max-width:1000px){.workspace{grid-template-columns:220px minmax(520px,1fr) 290px}}
</style>
</head>
<body>
<header class="top"><div class="brand">S.P.I.R.E. <small>ASSESSMENTS & FLOWSHEETS</small></div><button id="backSpire">← Patient Chart</button><button id="refresh">↻ Refresh</button></header>
<section class="patient" id="patientBanner"><div><strong>Loading patient…</strong><span>Continuous home health / waiver documentation</span></div></section>
<nav class="toolbar"><button class="tool primary" id="currentColumn">+ Current Time</button><button class="tool" id="insertColumn">＋ Insert Time</button><button class="tool" id="addHour">+ Next Hour</button><button class="tool" id="prevHour">← Earlier</button><button class="tool" id="nextHour">Later →</button><button class="tool" id="lastFiled">Last Filed</button><button class="tool" id="graph">Graph / Trend</button><button class="tool" id="valuesBy">Values By</button><button class="tool" id="today">Today</button><input class="date-input" id="goDate" type="date" title="Go to date"><button class="tool" id="goDateButton">Go to Date</button><button class="tool warn" id="legend">Legend</button></nav>
<div class="notice" id="notice"></div>
<main class="workspace">
<aside class="left"><div class="search"><input id="rowSearch" type="search" placeholder="Search flowsheet rows"></div><div class="groups" id="rowGroups"></div></aside>
<section class="center"><nav class="subtabs" id="subtabs"></nav><div class="grid-wrap"><table class="grid" id="flowGrid"></table></div></section>
<aside class="right"><div class="right-head"><strong id="editorTitle">Select a flowsheet cell</strong><small id="editorMeta">Choose a row and time to document.</small></div><div class="editor" id="editor"><div class="empty">Use the continuous grid to open a documentation cell.</div></div></aside>
</main>
<script>
(()=>{'use strict';
const API='https://sulandra-website-production-5fc4.up.railway.app',keys=['sulandra:employee:access-token','sulandra_token','token','accessToken'];
const token=()=>keys.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';
const qs=new URLSearchParams(location.search),patientId=qs.get('patientId')||qs.get('patient')||sessionStorage.getItem('spire:patientId')||'';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={data:null,columns:[],selected:null,group:'All',valuesBy:'value'};
async function api(path,opt={}){const r=await fetch(API+path,{...opt,cache:'no-store',headers:{Accept:'application/json',...(token()?{Authorization:`Bearer ${token()}`}:{}) ,...(opt.body?{'Content-Type':'application/json'}:{}),...(opt.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||p.message||`Request failed (${r.status})`);return p.data??p}
function localInput(d=new Date()){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function roundMinute(d=new Date()){const x=new Date(d);x.setSeconds(0,0);return x}
function fmtTime(v){return new Date(v).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function fmtDate(v){return new Date(v).toLocaleDateString([],{month:'2-digit',day:'2-digit',year:'2-digit'})}
function toast(m,e=false){document.querySelector('.status')?.remove();const n=document.createElement('div');n.className='status'+(e?' error':'');n.textContent=m;document.body.append(n);setTimeout(()=>n.remove(),3000)}
function patientName(p){return [p?.preferredName||p?.firstName,p?.lastName].filter(Boolean).join(' ')||p?.displayName||'Patient'}
function baseDate(){return state.columns[0]?new Date(state.columns[0]):new Date()}
function windowRange(){const d=baseDate(),from=new Date(d);from.setHours(0,0,0,0);const to=new Date(from);to.setDate(to.getDate()+1);return{from:from.toISOString(),to:to.toISOString()}}
function makeInitialColumns(entries=[]){const now=roundMinute();const vals=[];for(let h=-2;h<=2;h++){const d=new Date(now);d.setHours(now.getHours()+h,0,0,0);vals.push(d.toISOString())}entries.slice(-60).forEach(e=>vals.push(new Date(e.recordedAt).toISOString()));return [...new Set(vals)].sort((a,b)=>new Date(a)-new Date(b))}
async function load(keepColumns=false){if(!patientId){document.body.innerHTML='<div class="empty">Open a patient chart in S.P.I.R.E. first.</div>';return}try{if(!keepColumns||!state.columns.length)state.columns=[new Date().toISOString()];const range=windowRange();state.data=await api(`/api/spire/patients/${encodeURIComponent(patientId)}/flowsheet-workspace?from=${encodeURIComponent(range.from)}&to=${encodeURIComponent(range.to)}`);if(!keepColumns)state.columns=makeInitialColumns(state.data.entries||[]);render()}catch(e){toast(e.message,true)}}
function render(){renderPatient();renderTabs();renderRows();renderGrid();if(state.selected)renderEditor()}
function renderPatient(){const p=state.data?.patient||{};document.getElementById('patientBanner').innerHTML=`<div><strong>${esc(patientName(p))}</strong><span>${esc(p.sex||p.gender||'')} ${p.dateOfBirth?'· DOB '+esc(new Date(p.dateOfBirth).toLocaleDateString()):''}</span></div><div><b>MRN</b><span>${esc(p.medicalRecordNumber||p.mrn||'—')}</span></div><div><b>Preferred</b><span>${esc(p.preferredName||'—')}</span></div><div><b>Language</b><span>${esc(p.preferredLanguage||'—')}</span></div><div><b>Active ISP Goals</b><span>${(state.data.goals||[]).length}</span></div><div><b>Viewer</b><span>${esc(state.data.viewer?.role||'')}</span></div>`}
function groups(){return [...new Set((state.data?.rows||[]).map(r=>r.groupName||'General'))]}
function renderTabs(){const all=['All',...groups()];document.getElementById('subtabs').innerHTML=all.map(g=>`<button class="${state.group===g?'active':''}" data-g="${esc(g)}">${esc(g)}</button>`).join('');document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{state.group=b.dataset.g;renderTabs();renderGrid()})}
function filteredRows(){const q=String(document.getElementById('rowSearch')?.value||'').toLowerCase();return(state.data?.rows||[]).filter(r=>(state.group==='All'||r.groupName===state.group)&&(!q||`${r.groupName} ${r.name} ${r.description||''}`.toLowerCase().includes(q)))}
function renderRows(){const by={};(state.data?.rows||[]).forEach(r=>(by[r.groupName||'General']??=[]).push(r));document.getElementById('rowGroups').innerHTML=Object.entries(by).map(([g,rows])=>`<div class="group-title">${esc(g)}</div>${rows.map(r=>`<label class="row-toggle"><input type="checkbox" checked data-row-check="${esc(r.id)}"><span>${esc(r.name)}<small>${esc(r.description||'')}</small></span></label>`).join('')}`).join('');document.querySelectorAll('[data-row-check]').forEach(c=>c.onchange=renderGrid)}
function activeRows(){const checked=new Set([...document.querySelectorAll('[data-row-check]:checked')].map(x=>x.dataset.rowCheck));return filteredRows().filter(r=>checked.has(r.id))}
function entryFor(rowId,col){const target=new Date(col).getTime();const candidates=(state.data?.entries||[]).filter(e=>e.rowId===rowId);return candidates.find(e=>Math.abs(new Date(e.recordedAt).getTime()-target)<30000)||null}
function displayEntry(e){if(!e)return'';const v=state.valuesBy==='comment'?(e.comment||''):(e.numericValue??e.value??'');return `<span class="val">${esc(v)} ${state.valuesBy==='value'?esc(e.unit||''):''}</span>${e.comment&&state.valuesBy==='value'?`<span class="comment">${esc(e.comment)}</span>`:''}${e.canEdit?'<span class="edit-dot">●</span>':''}`}
function renderGrid(){const rows=activeRows(),cols=state.columns.slice().sort((a,b)=>new Date(a)-new Date(b));let html='<thead><tr><th class="rowname">Flowsheet row</th>'+cols.map(c=>`<th class="time-head"><strong>${fmtTime(c)}</strong><small>${fmtDate(c)}</small></th>`).join('')+'</tr></thead><tbody>';let last='';for(const r of rows){if(r.groupName!==last){last=r.groupName;html+=`<tr class="section-row"><td class="rowname">${esc(last)}</td><td colspan="${Math.max(1,cols.length)}">${esc(last)}</td></tr>`}html+=`<tr><td class="rowname">${esc(r.name)}${r.unit?` <small>(${esc(r.unit)})</small>`:''}</td>${cols.map(c=>{const e=entryFor(r.id,c);return`<td class="grid-cell ${e?'has':''} ${e?.canEdit?'mine':''}" data-row="${esc(r.id)}" data-time="${esc(c)}" ${e?`data-entry="${esc(e.id)}"`:''}>${displayEntry(e)}</td>`}).join('')}</tr>`}html+='</tbody>';document.getElementById('flowGrid').innerHTML=html;document.querySelectorAll('.grid-cell').forEach(cell=>cell.onclick=()=>selectCell(cell.dataset.row,cell.dataset.time,cell.dataset.entry||''))}
function selectCell(rowId,time,entryId){const row=(state.data.rows||[]).find(r=>r.id===rowId),entry=(state.data.entries||[]).find(e=>e.id===entryId)||null;state.selected={row,time,entry};renderEditor()}
function renderEditor(){const s=state.selected;if(!s?.row)return;const e=s.entry,canEdit=!e||e.canEdit;document.getElementById('editorTitle').textContent=s.row.name;document.getElementById('editorMeta').textContent=`${fmtDate(s.time)} ${fmtTime(s.time)} · ${s.row.groupName||'General'}`;const options=Array.isArray(s.row.options)?s.row.options:[];document.getElementById('editor').innerHTML=`${e?`<div class="ownership ${e.canEdit?'':'locked'}">${e.canEdit?'You documented this entry and may edit it.':'This entry belongs to another documenter and is read-only.'}</div>`:''}<div class="field"><label>Clinical event time</label><input id="edTime" type="datetime-local" value="${localInput(new Date(e?.recordedAt||s.time))}" ${canEdit?'':'disabled'}></div>${s.row.dataType==='NUMBER'?`<div class="field"><label>Numeric value ${s.row.unit?'('+esc(s.row.unit)+')':''}</label><input id="edNumeric" type="number" step="any" value="${esc(e?.numericValue??'')}" ${canEdit?'':'disabled'}></div>`:`<div class="field"><label>Value</label>${options.length?`<select id="edValue" ${canEdit?'':'disabled'}><option value="">Select</option>${options.map(o=>`<option ${String(e?.value||'')===String(o)?'selected':''}>${esc(o)}</option>`).join('')}</select>`:`<input id="edValue" value="${esc(e?.value||'')}" ${canEdit?'':'disabled'}>`}</div>`}${options.length&&canEdit?`<div class="choices">${options.map(o=>`<button class="choice" data-choice="${esc(o)}">${esc(o.replaceAll('_',' '))}</button>`).join('')}</div>`:''}<div class="field"><label>Comment / supporting note</label><textarea id="edComment" ${canEdit?'':'disabled'}>${esc(e?.comment||'')}</textarea></div><div class="editor-actions">${canEdit?`<button class="save" id="edSave">${e?'Save My Edit':'File Entry'}</button>`:''}<button class="secondary" id="edClose">Close</button></div>${e?`<small>Recorded by: ${esc(e.recordedById||'')} · ${esc(new Date(e.recordedAt).toLocaleString())}</small>`:''}`;document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{const el=document.getElementById('edValue');if(el)el.value=b.dataset.choice});document.getElementById('edClose').onclick=()=>{state.selected=null;document.getElementById('editor').innerHTML='<div class="empty">Use the continuous grid to open a documentation cell.</div>';document.getElementById('editorTitle').textContent='Select a flowsheet cell';document.getElementById('editorMeta').textContent='Choose a row and time to document.'};document.getElementById('edSave')?.addEventListener('click',saveEntry)}
async function saveEntry(){const s=state.selected;if(!s)return;const payload={recordedAt:new Date(document.getElementById('edTime').value).toISOString(),comment:document.getElementById('edComment').value};if(s.row.dataType==='NUMBER')payload.numericValue=document.getElementById('edNumeric').value;else payload.value=document.getElementById('edValue').value;try{if(s.entry)await api(`/api/spire/patients/${encodeURIComponent(patientId)}/flowsheet-workspace/entries/${encodeURIComponent(s.entry.id)}`,{method:'PUT',body:JSON.stringify(payload)});else await api(`/api/spire/patients/${encodeURIComponent(patientId)}/flowsheet-workspace/entries`,{method:'POST',body:JSON.stringify({...payload,rowId:s.row.id})});toast(s.entry?'Your flowsheet entry was updated.':'Flowsheet entry filed.');state.selected=null;await load(true)}catch(e){toast(e.message,true)}}
function addColumn(d){const iso=new Date(d).toISOString();if(!state.columns.includes(iso))state.columns.push(iso);state.columns.sort((a,b)=>new Date(a)-new Date(b));renderGrid();requestAnimationFrame(()=>document.querySelector('.grid-wrap').scrollLeft=999999)}
function askTime(){const raw=prompt('Insert clinical event time (YYYY-MM-DD HH:MM)',localInput().replace('T',' '));if(!raw)return;const d=new Date(raw.replace(' ','T'));if(Number.isNaN(d.getTime()))return toast('Invalid time.',true);addColumn(d)}
function shiftHours(n){state.columns=state.columns.map(c=>{const d=new Date(c);d.setHours(d.getHours()+n);return d.toISOString()});renderGrid()}
document.getElementById('backSpire').onclick=()=>location.href=`/spire.html?patientId=${encodeURIComponent(patientId)}&tab=vitals`;document.getElementById('refresh').onclick=()=>load(true);document.getElementById('currentColumn').onclick=()=>addColumn(roundMinute());document.getElementById('insertColumn').onclick=askTime;document.getElementById('addHour').onclick=()=>{const d=baseDate();d.setHours(d.getHours()+1,0,0,0);addColumn(d)};document.getElementById('prevHour').onclick=()=>shiftHours(-1);document.getElementById('nextHour').onclick=()=>shiftHours(1);document.getElementById('today').onclick=()=>{state.columns=makeInitialColumns([]);load(true)};document.getElementById('goDateButton').onclick=()=>{const v=document.getElementById('goDate').value;if(!v)return;const d=new Date(v+'T12:00:00');state.columns=[];for(let h=8;h<=20;h+=2){const x=new Date(d);x.setHours(h,0,0,0);state.columns.push(x.toISOString())}load(true)};document.getElementById('lastFiled').onclick=()=>{const e=(state.data?.entries||[]).slice().sort((a,b)=>new Date(b.recordedAt)-new Date(a.recordedAt))[0];if(e){addColumn(e.recordedAt);selectCell(e.rowId,e.recordedAt,e.id)}else toast('No filed entries in this period.')};document.getElementById('graph').onclick=()=>{const s=state.selected;if(!s)return toast('Select a flowsheet row first.');const vals=(state.data?.entries||[]).filter(e=>e.rowId===s.row.id&&e.numericValue!=null);alert(vals.length?`${s.row.name} trend\n`+vals.map(e=>`${new Date(e.recordedAt).toLocaleString()}: ${e.numericValue} ${e.unit||''}`).join('\n'):'No numeric trend values for this row.')};document.getElementById('valuesBy').onclick=()=>{state.valuesBy=state.valuesBy==='value'?'comment':'value';toast(`Grid now displays ${state.valuesBy}.`);renderGrid()};document.getElementById('legend').onclick=()=>alert('Blue cell = available to chart\nFilled blue = documented value\nGreen underline/dot = entry you own and may edit\nOther users’ entries are read-only\nClinical event time may differ from the time you are entering the documentation.');document.getElementById('rowSearch').oninput=renderGrid;
load(false);
})();
</script>
</body>
</html>
