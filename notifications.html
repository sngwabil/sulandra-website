<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Notifications | Sulandra Health</title><link rel="icon" href="/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#edf3f7;color:#173b52}.top{display:flex;align-items:center;gap:14px;padding:11px 18px;background:#fff;border-bottom:1px solid #d5e1e8;position:sticky;top:0;z-index:40}.top img{width:220px;max-width:42vw}.top .spacer{flex:1}.top a{color:#075985;text-decoration:none;font-weight:900}.shell{width:min(1100px,calc(100% - 22px));margin:16px auto 50px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}.hero h1{margin:0;color:#0b4265;font-size:29px}.hero p{margin:5px 0;color:#667b88}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:900;cursor:pointer;text-decoration:none}.btn.primary{background:#0b6ea8;color:#fff}.btn.success{border-color:#45845a;background:#eff9f2;color:#306a43}.btn.warn{border-color:#ad792c;color:#7d5717}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border:1px solid #d5e1e8;border-radius:10px;padding:10px}.stat span{display:block;font-size:9px;text-transform:uppercase;font-weight:900;color:#7e8e98}.stat strong{font-size:21px;color:#23526c}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar select{border:1px solid #c8d6df;border-radius:8px;padding:8px;background:#fff}.list{display:grid;gap:8px}.item{background:#fff;border:1px solid #d4e1e8;border-radius:12px;box-shadow:0 7px 20px rgba(18,56,80,.05);padding:12px}.item.read{opacity:.76}.item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.item h2{margin:0;color:#174a69;font-size:15px}.item p{margin:5px 0 0;color:#5f7685;font-size:12px;line-height:1.45}.meta{font-size:10px;color:#788b98;margin-top:5px}.priority{display:inline-flex;padding:3px 6px;border-radius:999px;font-size:8px;font-weight:950;background:#edf3f7;color:#536c7d}.priority.HIGH{background:#fff0d0;color:#835b0c}.priority.URGENT,.priority.CRITICAL{background:#fde9e7;color:#92372f}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.empty{padding:34px;text-align:center;color:#718491}.notice{padding:10px 12px;border-radius:9px;background:#eef8fc;border:1px solid #c8e1ed;color:#42667a;margin-bottom:10px;font-size:12px}@media(max-width:600px){.summary{grid-template-columns:1fr}.top a{display:none}.hero{flex-direction:column}}</style></head><body><header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><a href="/my-work.html">My Work</a><a href="/employee-portal.html">Employee Portal</a></header><main class="shell"><div class="hero"><div><h1>Notifications</h1><p>Durable operational work notifications for the selected Sulandra company.</p></div><button id="refresh" class="btn primary">Refresh</button></div><div id="company" class="notice">Loading company…</div><div id="summary" class="summary"></div><div class="toolbar"><select id="status"><option value="OPEN">Open</option><option value="READ">Read</option><option value="">All</option><option value="COMPLETED">Completed</option><option value="DISMISSED">Dismissed</option></select><select id="module"><option value="">All modules</option><option>SCLS</option><option>HOME_HEALTH</option><option>CLIENT_INTAKE</option><option>WORKFORCE</option></select></div><div id="list" class="list"><div class="empty">Loading notifications…</div></div></main><script src="/assets/sulandra-entity-context.js?v=20260810-notifications-1"></script><script>(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEYS=['sulandra:employee:access-token','sulandra_token','token','accessToken'];const token=()=>KEYS.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(String(v)).toLocaleString():'—';let rows=[];async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',headers:{Accept:'application/json',Authorization:`Bearer ${token()}`,...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||p.message||`Request failed (${r.status})`);return p.data??p}function renderSummary(s){$('summary').innerHTML=`<div class="stat"><span>Total</span><strong>${Number(s.total||0)}</strong></div><div class="stat"><span>Open / Read</span><strong>${Number(s.open||0)}</strong></div><div class="stat"><span>Urgent / Critical</span><strong>${Number(s.urgent||0)}</strong></div>`}function render(){ $('list').innerHTML=rows.length?rows.map(n=>`<article class="item ${n.status==='READ'?'read':''}"><div class="item-head"><div><span class="priority ${esc(n.priority)}">${esc(n.priority)}</span><h2>${esc(n.title)}</h2></div><span class="priority">${esc(String(n.status).replaceAll('_',' '))}</span></div>${n.message?`<p>${esc(n.message)}</p>`:''}<div class="meta">${esc(String(n.module).replaceAll('_',' '))} · Created ${esc(fmt(n.createdAt))}${n.dueAt?` · Due ${esc(fmt(n.dueAt))}`:''}</div><div class="actions">${n.actionPath?`<a class="btn primary" href="${esc(n.actionPath)}" data-open="${esc(n.id)}">Open Work</a>`:''}${n.status==='OPEN'?`<button class="btn" data-action="READ" data-id="${esc(n.id)}">Mark Read</button>`:''}${n.status==='READ'?`<button class="btn" data-action="UNREAD" data-id="${esc(n.id)}">Mark Unread</button>`:''}${['OPEN','READ'].includes(n.status)?`<button class="btn success" data-action="COMPLETE" data-id="${esc(n.id)}">Complete</button><button class="btn warn" data-action="DISMISS" data-id="${esc(n.id)}">Dismiss</button>`:''}</div></article>`).join(''):'<div class="empty">No notifications match this view.</div>';}async function load(){const qs=new URLSearchParams();if($('status').value)qs.set('status',$('status').value);if($('module').value)qs.set('module',$('module').value);const [data,summary]=await Promise.all([api(`/api/work/notifications?${qs}`),api('/api/work/notifications/summary')]);rows=data;render();renderSummary(summary);const ctx=window.SulandraEntityContext?.get?.();$('company').innerHTML=`Current company: <strong>${esc(ctx?.selectedEntity?.displayName||'selected company')}</strong>. Notifications are scoped by company, employee assignment and authorized role.`;}async function act(id,action){let comment=null;if(action==='DISMISS')comment=prompt('Dismissal note (optional):')||null;if(action==='COMPLETE')comment=prompt('Completion note (optional):')||null;try{await api(`/api/work/notifications/${encodeURIComponent(id)}/action`,{method:'POST',body:JSON.stringify({action,comment})});await load()}catch(e){alert(e.message)}}document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b)act(b.dataset.id,b.dataset.action);const o=e.target.closest('[data-open]');if(o)api(`/api/work/notifications/${encodeURIComponent(o.dataset.open)}/action`,{method:'POST',body:JSON.stringify({action:'READ'})}).catch(()=>{})});$('refresh').onclick=load;$('status').onchange=load;$('module').onchange=load;window.addEventListener('sulandra:entity-context-changed',()=>location.reload());(async()=>{if(!token()){location.href='/employee-login.html?returnTo=/notifications.html';return}await window.SulandraEntityContext?.ready;try{await load()}catch(e){$('list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}})()})();</script></body></html>
