<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>SPIRE Admission History | Sulandra Health</title><link rel="icon" href="/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;background:#edf3f7;color:#15384f;font-family:"Segoe UI",Arial,sans-serif}button{font:inherit;cursor:pointer}.top{display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid #d5e1e8;padding:11px 18px;position:sticky;top:0;z-index:20}.top img{width:210px;max-width:42vw}.top .spacer{flex:1}.top a{color:#075985;font-weight:900;text-decoration:none}.wrap{width:min(1100px,calc(100% - 24px));margin:18px auto 50px}.hero,.card{background:#fff;border:1px solid #d4e0e8;border-radius:15px;box-shadow:0 9px 28px rgba(18,56,80,.06)}.hero{padding:18px 20px;margin-bottom:13px}.eyebrow{font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.09em;color:#0b74aa}.hero h1{margin:5px 0;color:#0b4265}.hero p{margin:5px 0;color:#677b88;line-height:1.5}.admission{margin-bottom:13px}.card-head{padding:14px 16px;border-bottom:1px solid #e1e8ec;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.card-head h2{margin:0;color:#174a69;font-size:19px}.meta{font-size:11px;color:#758895;margin-top:4px}.company{display:inline-flex;padding:5px 8px;border-radius:999px;background:#e7f4fa;border:1px solid #bfdeeb;color:#2e6380;font-size:10px;font-weight:950}.card-body{padding:15px}.section-group{font-size:10px;font-weight:950;text-transform:uppercase;letter-spacing:.08em;color:#788a95;margin:15px 0 7px}.section{border:1px solid #dde6eb;border-radius:10px;margin:7px 0;overflow:hidden}.section summary{list-style:none;cursor:pointer;padding:11px 12px;font-weight:900;color:#2e566e;background:#fafcfd}.section summary::-webkit-details-marker{display:none}.section summary:after{content:'＋';float:right;color:#66808f}.section[open] summary:after{content:'−'}.payload{padding:12px;border-top:1px solid #e3e9ed;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.value{background:#f7fafb;border:1px solid #e1e8ec;border-radius:8px;padding:9px}.value span{display:block;font-size:10px;font-weight:950;text-transform:uppercase;color:#758995;letter-spacing:.04em}.value div{white-space:pre-wrap;line-height:1.45;color:#34566b;margin-top:4px;word-break:break-word}.documents,.signatures{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.item{border:1px solid #dce6eb;border-radius:10px;padding:10px}.item strong{color:#28546e}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:8px;padding:7px 10px;font-weight:900;margin-top:8px}.empty{text-align:center;padding:38px;color:#708491}.error{padding:12px;background:#fff0ef;border:1px solid #efb5b0;color:#8c302a;border-radius:10px}.notice{padding:10px 12px;background:#eef8fc;border:1px solid #c9e1ed;color:#416679;border-radius:9px;font-size:12px;margin-bottom:12px}@media(max-width:700px){.payload,.documents,.signatures{grid-template-columns:1fr}.top a{display:none}.card-head{flex-direction:column}}</style></head><body><header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><a id="backChart" href="/spire.html">Back to SPIRE</a><a href="/client-intake.html">Client Intake</a></header><main class="wrap" id="app"><section class="hero"><div class="empty">Loading approved admission history…</div></section></main><script src="/assets/sulandra-entity-context.js?v=20260809-company-scope-1"></script><script>(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEYS=['sulandra:employee:access-token','sulandra_token','token','accessToken'];const token=()=>KEYS.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';const patientId=new URL(location.href).searchParams.get('patientId')||'';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(String(v)).toLocaleString():'—';const label=v=>String(v||'').replaceAll('_',' ').replace(/\b\w/g,c=>c.toUpperCase());async function api(path){const r=await fetch(API+path,{cache:'no-store',headers:{Accept:'application/json',Authorization:`Bearer ${token()}`}});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||p.message||`Request failed (${r.status})`);return p.data??p;}function payloadHtml(p){const entries=Object.entries(p&&typeof p==='object'?p:{}).filter(([,v])=>v!==''&&v!==null&&v!==undefined&&v!==false);return entries.length?entries.map(([k,v])=>`<div class="value"><span>${esc(label(k.replace(/([a-z])([A-Z])/g,'$1 $2')))}</span><div>${esc(Array.isArray(v)?v.join(', '):typeof v==='object'?JSON.stringify(v,null,2):v===true?'Yes':v)}</div></div>`).join(''):'<div class="empty">No response recorded.</div>';}function admissionHtml(a){let group='';const sections=(a.sections||[]).map(s=>{const head=s.sectionGroup!==group?`<div class="section-group">${esc(s.sectionGroup)}</div>`:'';group=s.sectionGroup;return `${head}<details class="section"><summary>${esc(s.sectionTitle)}</summary><div class="payload">${payloadHtml(s.payload)}</div></details>`;}).join('');const docs=(a.attachments||[]).map(x=>`<div class="item"><strong>${esc(x.title||label(x.documentType))}</strong><div class="meta">${esc(x.originalFileName)} · ${Math.round(Number(x.sizeBytes||0)/1024)} KB · ${esc(fmt(x.createdAt))}</div><button class="btn" data-download="${esc(a.id)}:${esc(x.id)}">Download Original</button></div>`).join('')||'<div class="empty">No intake documents retained.</div>';const sigs=(a.signatures||[]).map(x=>`<div class="item"><strong>${esc(label(x.signatureType))}</strong><div class="meta">${esc(x.signerName)}${x.signerRelationship?` · ${esc(x.signerRelationship)}`:''} · ${esc(fmt(x.signedAt))}</div><div style="margin-top:7px;line-height:1.45">${esc(x.attestation||'')}</div></div>`).join('')||'<div class="empty">No intake signatures retained.</div>';return `<section class="card admission"><div class="card-head"><div><span class="company">${esc(a.companyName)}</span><h2>${esc(a.serviceType||a.programCode||'Approved Admission')}</h2><div class="meta">Approved ${esc(fmt(a.approvedAt))}${a.referralSource?` · Referral: ${esc(a.referralSource)}`:''}</div></div><div class="meta">Source: ${esc(a.companyCode)}</div></div><div class="card-body">${a.reviewNotes?`<div class="notice"><strong>Admission review:</strong> ${esc(a.reviewNotes)}</div>`:''}${sections}<div class="section-group">Original Intake Documents</div><div class="documents">${docs}</div><div class="section-group">Acknowledgments & Signatures</div><div class="signatures">${sigs}</div></div></section>`;}async function download(caseId,attachmentId){try{const r=await fetch(`${API}/api/spire/patients/${encodeURIComponent(patientId)}/admission-history/${encodeURIComponent(caseId)}/attachments/${encodeURIComponent(attachmentId)}/download`,{cache:'no-store',headers:{Authorization:`Bearer ${token()}`}});if(!r.ok){const p=await r.json().catch(()=>({}));throw new Error(p.error||p.message||`Download failed (${r.status})`);}const blob=await r.blob(),cd=r.headers.get('content-disposition')||'',m=cd.match(/filename="([^"]+)"/i),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=m?.[1]||'admission-document';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}catch(e){alert(e.message);}}async function init(){if(!token()){location.href=`/employee-login.html?returnTo=${encodeURIComponent(location.pathname+location.search)}`;return;}if(!patientId){$('app').innerHTML='<section class="hero"><div class="error">A SPIRE patient ID is required.</div></section>';return;}$('backChart').href=`/spire.html?patientId=${encodeURIComponent(patientId)}`;await window.SulandraEntityContext?.ready;try{const data=await api(`/api/spire/patients/${encodeURIComponent(patientId)}/admission-history`);$('app').innerHTML=`<section class="hero"><div class="eyebrow">Shared SPIRE Chart</div><h1>Admission History</h1><p>Approved admission packets from Sulandra companies are shown read-only with their source company preserved. Current clinical documentation remains governed by your selected company and assigned chart access.</p></section>${data.admissions?.length?data.admissions.map(admissionHtml).join(''):'<section class="card"><div class="empty">No approved digital intake admissions are linked to this patient yet.</div></section>'}`;document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>{const [c,a]=b.dataset.download.split(':');download(c,a);});}catch(e){$('app').innerHTML=`<section class="hero"><div class="error">${esc(e.message)}</div></section>`;}}init();})();</script></body></html>
