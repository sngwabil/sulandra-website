<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Workforce Administration | Sulandra Health</title><link rel="icon" href="/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#edf3f7;color:#173b52}button,input,select,textarea{font:inherit}.top{display:flex;align-items:center;gap:14px;padding:11px 18px;background:#fff;border-bottom:1px solid #d5e1e8;position:sticky;top:0;z-index:40}.top img{width:220px;max-width:42vw}.top .spacer{flex:1}.top a{color:#075985;text-decoration:none;font-weight:900}.shell{width:min(1220px,calc(100% - 22px));margin:16px auto 50px}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:13px}.hero h1{margin:0;color:#0b4265;font-size:29px}.hero p{margin:5px 0;color:#667b88}.company{padding:5px 9px;border-radius:999px;background:#eef8fc;border:1px solid #c8e1ed;color:#42667a;font-size:11px;font-weight:900}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.tab{border:1px solid #cad9e1;background:#fff;color:#567083;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900;cursor:pointer}.tab.active{background:#0b6ea8;color:#fff;border-color:#0b6ea8}.panel{display:none}.panel.active{display:block}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{border:1px solid #c8d6df;border-radius:8px;padding:8px 9px;background:#fff}.card{background:#fff;border:1px solid #d4e1e8;border-radius:15px;box-shadow:0 9px 28px rgba(18,56,80,.06);margin-bottom:11px;overflow:hidden}.card-head{padding:13px 15px;border-bottom:1px solid #e3e9ed;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.card-head h2{margin:0;color:#174a69;font-size:17px}.card-head p{margin:4px 0 0;color:#718391;font-size:11px}.card-body{padding:15px}.status{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:950;background:#edf3f7;color:#536c7d}.status.SUBMITTED{background:#e8f1ff;color:#2e5f9a}.status.APPROVED,.status.PAID{background:#e4f7ea;color:#29633d}.status.REJECTED,.status.CHANGES_REQUESTED,.status.VOID{background:#fff0d0;color:#835b0c}.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.fact{background:#f8fbfc;border:1px solid #dee8ec;border-radius:8px;padding:8px}.fact span{display:block;font-size:9px;font-weight:900;text-transform:uppercase;color:#7f8f99}.fact strong{display:block;color:#28516a;font-size:12px;margin-top:3px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:900;cursor:pointer}.btn.primary{background:#0b6ea8;color:#fff}.btn.success{border-color:#45845a;background:#eff9f2;color:#306a43}.btn.warn{border-color:#ae792c;color:#7c5716}.btn.danger{border-color:#b5534b;color:#92362f}.tablewrap{overflow:auto;margin-top:10px}.table{width:100%;border-collapse:collapse;font-size:11px}.table th{background:#f1f5f7;text-align:left;color:#587080;padding:7px;border:1px solid #dce4e8}.table td{padding:7px;border:1px solid #e2e8eb}.empty{padding:32px;text-align:center;color:#718491}.error{display:none;padding:10px 12px;background:#fff0ef;border:1px solid #efb4af;color:#8b302a;border-radius:9px;margin-bottom:10px}.error.show{display:block}@media(max-width:800px){.facts{grid-template-columns:1fr 1fr}}@media(max-width:520px){.facts{grid-template-columns:1fr}.top a{display:none}.hero{flex-direction:column}}</style></head><body><header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><a href="/workforce.html">Employee Workforce</a><a href="/admin.html#dashboard">Admin Console</a></header><main class="shell"><div class="hero"><div><h1>Workforce Administration</h1><p>Review timesheets, payroll readiness and employee document submissions for the selected company.</p></div><span id="company" class="company">Loading company…</span></div><div class="tabs"><button class="tab active" data-tab="timesheets">Timesheets</button><button class="tab" data-tab="documents">Employee Documents</button></div><section id="timesheets" class="panel active"><div class="toolbar"><select id="sheetStatus"><option value="">All statuses</option><option>SUBMITTED</option><option>APPROVED</option><option>REJECTED</option><option>PAID</option><option>DRAFT</option><option>VOID</option></select><input id="sheetUser" placeholder="Filter by employee User ID"><button id="refreshSheets" class="btn">Refresh</button></div><div id="sheetError" class="error"></div><div id="sheetList"><div class="empty">Loading timesheets…</div></div></section><section id="documents" class="panel"><div class="toolbar"><select id="docStatus"><option value="">All statuses</option><option>SUBMITTED</option><option>APPROVED</option><option>CHANGES_REQUESTED</option><option>REJECTED</option><option>EXPIRED</option><option>ARCHIVED</option></select><input id="docUser" placeholder="Filter by employee User ID"><button id="refreshDocs" class="btn">Refresh</button></div><div id="docError" class="error"></div><div id="docList"><div class="empty">Loading documents…</div></div></section></main><script src="/assets/sulandra-entity-context.js?v=20260809-company-scope-1"></script><script>(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEYS=['sulandra:employee:access-token','sulandra_token','token','accessToken'];const token=()=>KEYS.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(String(v)).toLocaleString():'—';let sheets=[],docs=[];async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',headers:{Accept:'application/json',...(token()?{Authorization:`Bearer ${token()}`} : {}),...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||p.message||`Request failed (${r.status})`);return p.data??p}function activate(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===tab));tab==='timesheets'?loadSheets():loadDocs()}function sheetCard(s){const lines=Array.isArray(s.lines)?s.lines:[];return `<article class="card"><div class="card-head"><div><h2>Week ending ${esc(String(s.weekEnding).slice(0,10))}</h2><p>Employee ${esc(s.userId)} · Updated ${esc(fmt(s.updatedAt))}</p></div><span class="status ${esc(s.status)}">${esc(s.status)}</span></div><div class="card-body"><div class="facts"><div class="fact"><span>Total Hours</span><strong>${Number(s.totalHours||0).toFixed(2)}</strong></div><div class="fact"><span>Mileage</span><strong>${Number(s.totalMileage||0).toFixed(2)}</strong></div><div class="fact"><span>Submitted</span><strong>${esc(fmt(s.submittedAt))}</strong></div><div class="fact"><span>Reviewed By</span><strong>${esc(s.reviewedById||'—')}</strong></div></div>${s.notes?`<p>${esc(s.notes)}</p>`:''}${s.reviewNotes?`<p><strong>Review:</strong> ${esc(s.reviewNotes)}</p>`:''}<div class="tablewrap"><table class="table"><thead><tr><th>Date</th><th>Pay Code</th><th>Hours</th><th>Mileage</th><th>Client</th><th>Description</th></tr></thead><tbody>${lines.map(l=>`<tr><td>${esc(String(l.workDate).slice(0,10))}</td><td>${esc(l.payCode)}</td><td>${esc(l.hours)}</td><td>${esc(l.mileage)}</td><td>${esc(l.clientId||'—')}</td><td>${esc(l.description||'')}</td></tr>`).join('')}</tbody></table></div><div class="actions">${s.status==='SUBMITTED'?`<button class="btn success" data-sheet-action="APPROVE" data-id="${esc(s.id)}">Approve</button><button class="btn danger" data-sheet-action="REJECT" data-id="${esc(s.id)}">Reject</button>`:''}${s.status==='APPROVED'?`<button class="btn primary" data-sheet-action="MARK_PAID" data-id="${esc(s.id)}">Mark Paid</button><button class="btn danger" data-sheet-action="REJECT" data-id="${esc(s.id)}">Return / Reject</button>`:''}${!['PAID','VOID'].includes(s.status)?`<button class="btn warn" data-sheet-action="VOID" data-id="${esc(s.id)}">Void</button>`:''}</div></div></article>`}function renderSheets(){$('sheetList').innerHTML=sheets.length?sheets.map(sheetCard).join(''):'<div class="empty">No timesheets match this filter.</div>'}async function loadSheets(){const error=$('sheetError');error.classList.remove('show');try{const qs=new URLSearchParams();if($('sheetStatus').value)qs.set('status',$('sheetStatus').value);if($('sheetUser').value.trim())qs.set('userId',$('sheetUser').value.trim());sheets=await api(`/api/admin/workforce/timesheets?${qs}`);renderSheets()}catch(e){error.textContent=e.message;error.classList.add('show')}}async function sheetAction(id,action){let notes=null;if(['REJECT','VOID'].includes(action)){notes=prompt(`${action==='REJECT'?'Rejection / correction instructions':'Void reason'}:`);if(!notes)return}try{await api(`/api/admin/workforce/timesheets/${encodeURIComponent(id)}/status`,{method:'POST',body:JSON.stringify({action,notes})});await loadSheets()}catch(e){alert(e.message)}}function docCard(d){return `<article class="card"><div class="card-head"><div><h2>${esc(d.title||d.documentType)}</h2><p>Employee ${esc(d.userId)} · ${esc(d.originalFileName)} · ${esc(fmt(d.submittedAt))}</p></div><span class="status ${esc(d.status)}">${esc(String(d.status).replaceAll('_',' '))}</span></div><div class="card-body"><div class="facts"><div class="fact"><span>Type</span><strong>${esc(d.documentType)}</strong></div><div class="fact"><span>Effective</span><strong>${esc(d.effectiveDate?String(d.effectiveDate).slice(0,10):'—')}</strong></div><div class="fact"><span>Expiration</span><strong>${esc(d.expirationDate?String(d.expirationDate).slice(0,10):'—')}</strong></div><div class="fact"><span>SHA-256</span><strong>${esc(String(d.sha256||'').slice(0,16))}…</strong></div></div>${d.notes?`<p>${esc(d.notes)}</p>`:''}${d.reviewNotes?`<p><strong>Review:</strong> ${esc(d.reviewNotes)}</p>`:''}<div class="actions"><button class="btn" data-doc-download="${esc(d.id)}">Download</button>${['SUBMITTED','CHANGES_REQUESTED'].includes(d.status)?`<button class="btn success" data-doc-action="APPROVE" data-id="${esc(d.id)}">Approve</button><button class="btn warn" data-doc-action="REQUEST_CHANGES" data-id="${esc(d.id)}">Request Changes</button><button class="btn danger" data-doc-action="REJECT" data-id="${esc(d.id)}">Reject</button>`:''}${d.status==='APPROVED'?`<button class="btn warn" data-doc-action="ARCHIVE" data-id="${esc(d.id)}">Archive</button>`:''}</div></div></article>`}function renderDocs(){$('docList').innerHTML=docs.length?docs.map(docCard).join(''):'<div class="empty">No employee documents match this filter.</div>'}async function loadDocs(){const error=$('docError');error.classList.remove('show');try{const qs=new URLSearchParams();if($('docStatus').value)qs.set('status',$('docStatus').value);if($('docUser').value.trim())qs.set('userId',$('docUser').value.trim());docs=await api(`/api/admin/workforce/documents?${qs}`);renderDocs()}catch(e){error.textContent=e.message;error.classList.add('show')}}async function docAction(id,action){let notes=null;if(['REQUEST_CHANGES','REJECT'].includes(action)){notes=prompt(action==='REQUEST_CHANGES'?'What needs to be corrected?':'Reason for rejection:');if(!notes)return}try{await api(`/api/admin/workforce/documents/${encodeURIComponent(id)}/status`,{method:'POST',body:JSON.stringify({action,notes})});await loadDocs()}catch(e){alert(e.message)}}async function download(id){const r=await fetch(`${API}/api/admin/workforce/documents/${encodeURIComponent(id)}/download`,{headers:{Authorization:`Bearer ${token()}`},cache:'no-store'});if(!r.ok){const p=await r.json().catch(()=>({}));return alert(p.error||p.message||'Download failed')}const blob=await r.blob(),cd=r.headers.get('content-disposition')||'',m=cd.match(/filename="([^"]+)"/i),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=m?.[1]||'employee-document';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>activate(b.dataset.tab));document.addEventListener('click',e=>{const sa=e.target.closest('[data-sheet-action]');if(sa)sheetAction(sa.dataset.id,sa.dataset.sheetAction);const da=e.target.closest('[data-doc-action]');if(da)docAction(da.dataset.id,da.dataset.docAction);const dl=e.target.closest('[data-doc-download]');if(dl)download(dl.dataset.docDownload)});$('refreshSheets').onclick=loadSheets;$('refreshDocs').onclick=loadDocs;$('sheetStatus').onchange=loadSheets;$('docStatus').onchange=loadDocs;window.addEventListener('sulandra:entity-context-changed',()=>location.reload());(async()=>{if(!token()){location.href='/employee-login.html?returnTo=/workforce-admin.html';return}await window.SulandraEntityContext?.ready;try{const ctx=await api('/api/workforce/context');$('company').textContent=ctx.company.displayName;await Promise.all([loadSheets(),loadDocs()])}catch(e){$('sheetError').textContent=e.message;$('sheetError').classList.add('show')}})()})();</script></body></html>
