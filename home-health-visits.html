<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>My Home Health Visits | Sulandra Health</title><link rel="icon" href="/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#edf3f7;color:#173b52}button,input,textarea{font:inherit}.top{display:flex;align-items:center;gap:14px;padding:11px 17px;background:#fff;border-bottom:1px solid #d5e1e8;position:sticky;top:0;z-index:30}.top img{width:215px;max-width:45vw}.top .spacer{flex:1}.top a{font-weight:900;color:#075985;text-decoration:none}.shell{width:min(1200px,calc(100% - 22px));margin:15px auto 48px}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:12px}.hero h1{margin:0;color:#0b4265;font-size:29px}.hero p{margin:5px 0;color:#687c89}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:900;text-decoration:none;cursor:pointer}.btn.primary{background:#0b6ea8;color:#fff}.btn.success{border-color:#43845a;background:#eff9f2;color:#2f6a43}.btn.warn{border-color:#ae792c;color:#7b5617}.btn.danger{border-color:#b5524b;color:#92362f}.btn:disabled{opacity:.5;cursor:not-allowed}.banner{padding:11px 13px;border-radius:10px;border:1px solid #c9dfeb;background:#eff8fc;color:#42677c;margin-bottom:12px;font-size:12px;line-height:1.45}.banner.warn{background:#fff6e1;border-color:#ead095;color:#74510e}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.stat{background:#fff;border:1px solid #d5e1e8;border-radius:11px;padding:11px}.stat span{display:block;font-size:10px;text-transform:uppercase;font-weight:950;color:#7b8c97}.stat strong{display:block;font-size:23px;color:#174b69;margin-top:3px}.visits{display:grid;gap:10px}.visit{background:#fff;border:1px solid #d4e1e8;border-radius:14px;box-shadow:0 8px 25px rgba(17,55,79,.06);overflow:hidden}.visit-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 15px;border-bottom:1px solid #e2e9ed}.visit-head h2{margin:0;color:#174a69;font-size:19px}.visit-head p{margin:4px 0 0;font-size:11px;color:#708490}.visit-body{padding:14px}.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.fact{border:1px solid #e0e8ed;background:#f9fbfc;border-radius:8px;padding:8px}.fact span{display:block;font-size:9px;text-transform:uppercase;font-weight:900;color:#84919a}.fact strong{display:block;font-size:12px;color:#2c536b;margin-top:3px}.status{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:950;background:#edf3f7;color:#536c7d}.status.IN_PROGRESS{background:#fff0cb;color:#80580c}.status.COMPLETED{background:#e4f7ea;color:#28623d}.status.MISSED,.status.CANCELLED{background:#fde9e7;color:#92362f}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.empty{padding:35px;text-align:center;color:#748692}.error{display:none;padding:10px 12px;background:#fff0ef;border:1px solid #efb4af;color:#8b302a;border-radius:9px;margin-bottom:10px}.error.show{display:block}dialog{width:min(820px,calc(100vw - 20px));border:0;border-radius:15px;padding:0;box-shadow:0 30px 90px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(8,28,42,.55)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #e2e8ec}.modal-head h2{margin:0;color:#0b4265}.modal-body{padding:16px;max-height:78vh;overflow:auto}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:4px}.field.wide{grid-column:1/-1}.field label{font-size:11px;font-weight:900;color:#506b7d}.field input,.field textarea{width:100%;border:1px solid #c8d6df;border-radius:8px;padding:9px}.field textarea{min-height:95px;resize:vertical}.vitals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}.facts{grid-template-columns:1fr 1fr}.vitals{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid,.facts{grid-template-columns:1fr}.field.wide{grid-column:auto}.top a{display:none}.hero{flex-direction:column}}</style></head><body><header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><a href="/home-health.html">Home Health Operations</a><a href="/employee-portal.html">Employee Portal</a></header><main class="shell"><div class="hero"><div><h1>My Home Health Visits</h1><p>Assigned visits, patient details, start-of-visit status and signed clinical documentation.</p></div><button id="refresh" class="btn">Refresh</button></div><div id="context" class="banner">Checking Home Health staff access…</div><div id="summary" class="summary"></div><div id="visits" class="visits"><div class="empty">Loading assigned visits…</div></div></main><dialog id="completeDialog"><div class="modal-head"><h2 id="completeTitle">Complete Home Health Visit</h2><button class="btn" data-close="completeDialog">Close</button></div><div class="modal-body"><div id="completeError" class="error"></div><div class="grid"><div class="field wide"><label>Subjective / Patient Report</label><textarea id="cSubjective"></textarea></div><div class="field wide"><label>Assessment *</label><textarea id="cAssessment"></textarea></div><div class="field wide"><label>Skilled Interventions *</label><textarea id="cInterventions"></textarea></div><div class="field wide"><label>Response to Care</label><textarea id="cResponse"></textarea></div><div class="field wide"><label>Education / Teach-Back</label><textarea id="cEducation"></textarea></div><div class="field wide"><label>Care Coordination</label><textarea id="cCoordination"></textarea></div><div class="field wide"><label>Skilled Need Statement</label><textarea id="cSkilled"></textarea></div><div class="field wide"><label>Homebound Statement</label><textarea id="cHomebound"></textarea></div><div class="field wide"><label>Physician / Provider Notification</label><textarea id="cProvider"></textarea></div><div class="field wide"><label>Plan for Next Visit</label><textarea id="cNext"></textarea></div><div class="field"><label>Caregiver Present</label><input id="cCaregiver"></div><label><input id="cPatientPresent" type="checkbox" checked> Patient present</label></div><h3>Vitals (optional)</h3><div class="vitals"><div class="field"><label>Temp °F</label><input id="vTemp" type="number" step="0.1"></div><div class="field"><label>Pulse</label><input id="vPulse" type="number"></div><div class="field"><label>Resp</label><input id="vResp" type="number"></div><div class="field"><label>SpO₂</label><input id="vSpo2" type="number" step="0.1"></div><div class="field"><label>Systolic</label><input id="vSys" type="number"></div><div class="field"><label>Diastolic</label><input id="vDia" type="number"></div><div class="field"><label>Weight lb</label><input id="vWeight" type="number" step="0.1"></div><div class="field"><label>Oxygen</label><input id="vOxygen"></div></div><div class="field wide" style="margin-top:10px"><label>Signature Attestation *</label><textarea id="cAttestation">I attest that this documentation accurately reflects the care and services I personally provided during this Home Health visit.</textarea></div><div class="modal-actions"><button id="completeVisit" class="btn success">Sign & Complete Visit</button></div></div></dialog><script src="/assets/sulandra-entity-context.js?v=20260809-company-scope-1"></script><script>(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEYS=['sulandra:employee:access-token','sulandra_token','token','accessToken'];const token=()=>KEYS.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';const state={context:null,visits:[],visit:null};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(String(v)).toLocaleString():'—';async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',headers:{Accept:'application/json',...(token()?{Authorization:`Bearer ${token()}`} : {}),...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||p.message||`Request failed (${r.status})`);return p.data??p}function name(v){return [v.preferredName||v.firstName,v.lastName].filter(Boolean).join(' ')||'Patient'}function render(){const rows=state.visits;const today=new Date().toDateString();const scheduled=rows.filter(v=>['SCHEDULED','CONFIRMED'].includes(v.status)).length,inProgress=rows.filter(v=>v.status==='IN_PROGRESS').length,completed=rows.filter(v=>v.status==='COMPLETED').length,todayCount=rows.filter(v=>new Date(v.scheduledStart).toDateString()===today).length;$('summary').innerHTML=`<div class="stat"><span>Assigned Visits</span><strong>${rows.length}</strong></div><div class="stat"><span>Today</span><strong>${todayCount}</strong></div><div class="stat"><span>Ready / Scheduled</span><strong>${scheduled}</strong></div><div class="stat"><span>In Progress</span><strong>${inProgress}</strong></div>`;$('visits').innerHTML=rows.length?rows.map(v=>`<section class="visit"><div class="visit-head"><div><h2>${esc(name(v))}</h2><p>${esc(v.episodeNumber||'')} · MRN ${esc(v.medicalRecordNumber||'—')}</p></div><span class="status ${esc(v.status)}">${esc(String(v.status).replaceAll('_',' '))}</span></div><div class="visit-body"><div class="facts"><div class="fact"><span>Discipline</span><strong>${esc(v.discipline)}</strong></div><div class="fact"><span>Visit Type</span><strong>${esc(v.visitType)}</strong></div><div class="fact"><span>Scheduled</span><strong>${esc(fmt(v.scheduledStart))}</strong></div><div class="fact"><span>Address</span><strong>${esc(v.locationAddress||'Not entered')}</strong></div><div class="fact"><span>EVV</span><strong>${v.evvRequired?'Required':'Not required'}</strong></div><div class="fact"><span>Actual Start</span><strong>${esc(fmt(v.actualStart))}</strong></div></div><div class="actions">${['SCHEDULED','CONFIRMED'].includes(v.status)?`<button class="btn primary" data-start="${esc(v.id)}">Start Visit</button>`:''}${v.status==='IN_PROGRESS'?`<button class="btn success" data-complete="${esc(v.id)}">Complete Documentation</button>`:''}${['SCHEDULED','CONFIRMED','IN_PROGRESS'].includes(v.status)?`<button class="btn danger" data-missed="${esc(v.id)}">Missed Visit</button>`:''}${v.encounterId?`<a class="btn" href="/spire.html?patientId=${encodeURIComponent(v.patientId)}">Open SPIRE Chart</a>`:''}</div></div></section>`).join(''):'<div class="empty">No assigned Home Health visits in the current date window.</div>'}async function load(){state.context=await api('/api/home-health/context');const profile=state.context.staffProfile;$('context').className=`banner ${state.context.company.operational?'':'warn'}`;$('context').innerHTML=`<strong>${esc(state.context.company.displayName)}</strong> · Role ${esc(state.context.role)}${profile?` · Home Health discipline ${esc(profile.discipline)}`:''}${state.context.company.operational?'':' · PRE-LAUNCH — operational visits remain blocked'}`;const from=new Date(Date.now()-2*86400000).toISOString(),to=new Date(Date.now()+14*86400000).toISOString();state.visits=await api(`/api/home-health/my-visits?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`);render()}async function start(id){try{await api(`/api/home-health/visits/${encodeURIComponent(id)}/start`,{method:'POST',body:JSON.stringify({patientPresent:true})});await load()}catch(e){alert(e.message)}}function openComplete(id){state.visit=state.visits.find(v=>String(v.id)===String(id));if(!state.visit)return;$('completeTitle').textContent=`Complete ${name(state.visit)} · ${state.visit.discipline} ${state.visit.visitType}`;$('completeError').classList.remove('show');['cSubjective','cAssessment','cInterventions','cResponse','cEducation','cCoordination','cSkilled','cHomebound','cProvider','cNext','cCaregiver','vTemp','vPulse','vResp','vSpo2','vSys','vDia','vWeight','vOxygen'].forEach(id=>$(id).value='');$('cPatientPresent').checked=true;$('completeDialog').showModal()}const num=id=>$(id).value===''?null:Number($(id).value);async function complete(){const error=$('completeError');error.classList.remove('show');if(!$('cAssessment').value.trim()||!$('cInterventions').value.trim()||$('cAttestation').value.trim().length<10){error.textContent='Assessment, interventions and signature attestation are required.';error.classList.add('show');return}try{await api(`/api/home-health/visits/${encodeURIComponent(state.visit.id)}/complete`,{method:'POST',body:JSON.stringify({patientPresent:$('cPatientPresent').checked,caregiverPresent:$('cCaregiver').value||null,subjective:$('cSubjective').value||null,assessment:$('cAssessment').value,interventions:$('cInterventions').value,response:$('cResponse').value||null,education:$('cEducation').value||null,careCoordination:$('cCoordination').value||null,skilledNeedStatement:$('cSkilled').value||null,homeboundStatement:$('cHomebound').value||null,physicianNotification:$('cProvider').value||null,planNextVisit:$('cNext').value||null,signatureAttestation:$('cAttestation').value,vitals:{temperature:num('vTemp'),pulse:num('vPulse'),respirations:num('vResp'),spo2:num('vSpo2'),systolic:num('vSys'),diastolic:num('vDia'),weight:num('vWeight'),oxygen:$('vOxygen').value||null}})});$('completeDialog').close();await load()}catch(e){error.textContent=e.message;error.classList.add('show')}}async function missed(id){const reason=prompt('Reason this visit was missed / unable to be completed:');if(!reason)return;try{await api(`/api/home-health/visits/${encodeURIComponent(id)}/missed`,{method:'POST',body:JSON.stringify({reason})});await load()}catch(e){alert(e.message)}}document.addEventListener('click',e=>{const s=e.target.closest('[data-start]');if(s)start(s.dataset.start);const c=e.target.closest('[data-complete]');if(c)openComplete(c.dataset.complete);const m=e.target.closest('[data-missed]');if(m)missed(m.dataset.missed);const close=e.target.closest('[data-close]');if(close)$(close.dataset.close)?.close()});$('completeVisit').onclick=complete;$('refresh').onclick=load;window.addEventListener('sulandra:entity-context-changed',()=>location.reload());(async()=>{if(!token()){location.href='/employee-login.html?returnTo=/home-health-visits.html';return}await window.SulandraEntityContext?.ready;try{await load()}catch(e){$('visits').innerHTML=`<div class="empty">${esc(e.message)}</div>`}})()})();</script></body></html>
