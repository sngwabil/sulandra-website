<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>My Shift | SPIRE</title><link rel="icon" href="/favicon.ico"><style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#edf3f7;color:#173b52}button,input{font:inherit}.top{display:flex;align-items:center;gap:14px;padding:11px 17px;background:#fff;border-bottom:1px solid #d5e1e8;position:sticky;top:0;z-index:30}.top img{width:215px;max-width:45vw}.top .spacer{flex:1}.top a{font-weight:900;color:#075985;text-decoration:none}.shell{width:min(1250px,calc(100% - 22px));margin:15px auto 48px}.hero{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;margin-bottom:12px}.hero h1{margin:0;color:#0b4265;font-size:29px}.hero p{margin:5px 0;color:#687c89}.refresh{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer}.banner{padding:11px 13px;border-radius:10px;border:1px solid #c9dfeb;background:#eff8fc;color:#42677c;margin-bottom:12px;font-size:12px;line-height:1.45}.banner.good{background:#e8f8ed;border-color:#addabd;color:#2c6742}.banner.warn{background:#fff6e1;border-color:#ead095;color:#74510e}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.stat{background:#fff;border:1px solid #d5e1e8;border-radius:11px;padding:11px;box-shadow:0 5px 16px rgba(18,56,80,.04)}.stat span{display:block;font-size:10px;text-transform:uppercase;font-weight:950;color:#7b8c97}.stat strong{display:block;font-size:23px;color:#174b69;margin-top:3px}.clients{display:grid;gap:12px}.client{background:#fff;border:1px solid #d4e1e8;border-radius:14px;box-shadow:0 8px 25px rgba(17,55,79,.06);overflow:hidden}.client-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 15px;border-bottom:1px solid #e2e9ed}.client-head h2{margin:0;color:#174a69;font-size:19px}.client-head p{margin:4px 0 0;font-size:11px;color:#708490}.client-body{padding:14px}.grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:11px}.panel{border:1px solid #dce5ea;border-radius:10px;overflow:hidden;background:#fbfdfe}.panel h3{margin:0;padding:9px 10px;background:#f4f8fa;border-bottom:1px solid #e1e8ec;font-size:12px;color:#496778}.panel-body{padding:10px}.alert{padding:7px 8px;border-radius:7px;margin:5px 0;background:#fff4e1;border:1px solid #ecd39a;color:#765317;font-size:11px}.alert.critical{background:#fdeceb;border-color:#efbbb7;color:#8a332d}.med{border-bottom:1px solid #edf1f3;padding:7px 0}.med:last-child{border-bottom:0}.med strong{font-size:12px;color:#2c526a}.med small{display:block;color:#748691;line-height:1.4}.due{display:inline-flex;padding:2px 6px;border-radius:999px;font-size:9px;font-weight:950;margin-left:5px;background:#e9f2f7;color:#47677a}.due.now{background:#fff0cb;color:#80580c}.due.late{background:#fde9e7;color:#92362f}.due.done{background:#e4f7ea;color:#28623d}.vitals{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.vital{background:#fff;border:1px solid #e0e8ed;border-radius:8px;padding:7px}.vital span{display:block;font-size:9px;text-transform:uppercase;font-weight:900;color:#84919a}.vital strong{font-size:13px;color:#2c536b}.task{border-bottom:1px solid #edf1f3;padding:7px 0;font-size:11px;color:#4e6879}.task:last-child{border-bottom:0}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:900;text-decoration:none;cursor:pointer}.btn.primary{background:#0b6ea8;color:#fff}.btn.success{border-color:#43845a;background:#eff9f2;color:#2f6a43}.empty{padding:32px;text-align:center;color:#748692}.loading{opacity:.55;pointer-events:none}.error{display:none;padding:10px 12px;background:#fff0ef;border:1px solid #efb4af;color:#8b302a;border-radius:9px;margin-bottom:10px}.error.show{display:block}dialog{width:min(700px,calc(100vw - 20px));border:0;border-radius:15px;padding:0;box-shadow:0 30px 90px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(8,28,42,.55)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #e2e8ec}.modal-head h2{margin:0;color:#0b4265}.modal-body{padding:16px}.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:11px;font-weight:900;color:#506b7d}.field input{width:100%;border:1px solid #c8d6df;border-radius:8px;padding:9px}.field.wide{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}@media(max-width:900px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.form-grid{grid-template-columns:1fr 1fr}.field.wide{grid-column:1/-1}.top a{display:none}.hero{flex-direction:column}.client-head{flex-direction:column}}
</style></head><body><header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><a href="/spire.html">SPIRE Chart</a><a href="/employee-portal.html">Employee Portal</a></header><main class="shell"><div class="hero"><div><h1>My Shift</h1><p>Assigned clients, medication windows, alerts, vitals and bedside documentation.</p></div><button id="refresh" class="refresh">Refresh Shift</button></div><div id="medAuth" class="banner">Checking medication authorization…</div><div id="summary" class="summary"></div><div id="clients" class="clients"><div class="empty">Loading assigned clients…</div></div></main>
<dialog id="vitalDialog"><div class="modal-head"><h2 id="vitalTitle">Record Vitals</h2><button class="btn" data-close="vitalDialog">Close</button></div><div class="modal-body"><div id="vitalError" class="error"></div><div class="form-grid"><div class="field"><label>Temperature °F</label><input id="vTemp" type="number" step="0.1"></div><div class="field"><label>Pulse</label><input id="vPulse" type="number"></div><div class="field"><label>Respirations</label><input id="vResp" type="number"></div><div class="field"><label>Systolic BP</label><input id="vSys" type="number"></div><div class="field"><label>Diastolic BP</label><input id="vDia" type="number"></div><div class="field"><label>SpO₂ %</label><input id="vSpo2" type="number" step="0.1"></div><div class="field"><label>Weight lb</label><input id="vWeight" type="number" step="0.1"></div><div class="field"><label>Oxygen</label><input id="vOxygen" placeholder="Room air / 2 L NC"></div></div><div class="modal-actions"><button id="saveVitals" class="btn primary">Record Vitals</button></div></div></dialog>
<script src="/assets/sulandra-entity-context.js?v=20260809-company-scope-1"></script><script>
(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEYS=['sulandra:employee:access-token','sulandra_token','token','accessToken'];const token=()=>KEYS.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';const state={data:null,patient:null};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=v=>Array.isArray(v)?v:[];const fmt=v=>v?new Date(String(v)).toLocaleString():'—';async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',headers:{Accept:'application/json',...(token()?{Authorization:`Bearer ${token()}`} : {}),...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||p.message||`Request failed (${r.status})`);return p.data??p}
function scheduleState(schedule,administrations){const raw=String(schedule?.scheduledTime||'');const m=raw.match(/(\d{1,2}):(\d{2})/);if(!m)return{label:raw||'Scheduled',className:''};const now=new Date(),due=new Date();due.setHours(Number(m[1]),Number(m[2]),0,0);const before=Number(schedule.windowBeforeMinutes??30),after=Number(schedule.windowAfterMinutes??30),done=arr(administrations).some(a=>{if(!a.scheduledFor)return false;const d=new Date(a.scheduledFor);return Math.abs(d.getTime()-due.getTime())<6*3600000&&['GIVEN','REFUSED','HELD','NOT_GIVEN','MISSED'].includes(String(a.status))});if(done)return{label:`${raw} documented`,className:'done'};const diff=(now-due)/60000;if(diff>after)return{label:`${raw} overdue`,className:'late'};if(diff>=-before&&diff<=after)return{label:`${raw} due now`,className:'now'};return{label:raw,className:''}}
function meds(p){const rows=[];arr(p.medications).forEach(m=>{const schedules=arr(m.schedules);if(schedules.length)schedules.forEach(s=>rows.push({med:m,s,state:scheduleState(s,m.administrations)}));else rows.push({med:m,s:null,state:{label:Array.isArray(m.dueTimes)?m.dueTimes.join(', '):String(m.dueTimes||m.frequency||'Active'),className:''}})});return rows.sort((a,b)=>['late','now',''].indexOf(a.state.className)-['late','now',''].indexOf(b.state.className))}
function latestVitals(v){if(!v)return'<div class="empty">No vitals recorded.</div>';return `<div class="vitals"><div class="vital"><span>Temp</span><strong>${esc(v.temperature??'—')} °F</strong></div><div class="vital"><span>Weight</span><strong>${esc(v.weight??'—')} lb</strong></div><div class="vital"><span>BP</span><strong>${esc(v.systolic??'—')}/${esc(v.diastolic??'—')}</strong></div><div class="vital"><span>Pulse</span><strong>${esc(v.pulse??'—')}</strong></div><div class="vital"><span>SpO₂</span><strong>${esc(v.spo2??'—')}%</strong></div><div class="vital"><span>Resp</span><strong>${esc(v.respirations??'—')}</strong></div></div><small style="display:block;margin-top:7px;color:#7b8c97">Last recorded ${esc(fmt(v.recordedAt))}</small>`}
function render(){const d=state.data,patients=arr(d?.patients),auth=d?.medicationAuthorization||{};const authBox=$('medAuth');authBox.className=`banner ${auth.authorized?'good':'warn'}`;authBox.innerHTML=auth.authorized?`<strong>Medication administration authorized.</strong> Basis: ${esc(String(auth.basis||'').replaceAll('_',' '))}. eMAR will still require patient assignment and the selected company context.`:`<strong>Medication administration is view-only for you.</strong> eMAR medication events are blocked until a licensed nursing role or current verified medication-administration qualification is present for this company.`;let late=0,now=0,tasks=0;patients.forEach(p=>{meds(p).forEach(x=>{if(x.state.className==='late')late++;if(x.state.className==='now')now++});tasks+=arr(p.dueAssessments).length});$('summary').innerHTML=`<div class="stat"><span>Assigned Clients</span><strong>${patients.length}</strong></div><div class="stat"><span>Meds Due Now</span><strong>${now}</strong></div><div class="stat"><span>Overdue Med Windows</span><strong>${late}</strong></div><div class="stat"><span>Assessments Due ≤24h</span><strong>${tasks}</strong></div>`;$('clients').innerHTML=patients.length?patients.map(p=>{const mr=meds(p),flags=arr(p.flags),assess=arr(p.dueAssessments);return `<section class="client"><div class="client-head"><div><h2>${esc([p.preferredName||p.firstName,p.lastName].filter(Boolean).join(' '))}</h2><p>MRN ${esc(p.medicalRecordNumber||'—')} · DOB ${esc(p.dateOfBirth?new Date(p.dateOfBirth).toLocaleDateString():'—')}</p></div><div class="actions"><a class="btn" href="/spire.html#patient=${encodeURIComponent(p.id)}">Open Chart</a><a class="btn ${auth.authorized?'primary':''}" href="/spire.html#patient=${encodeURIComponent(p.id)}&tab=mar">${auth.authorized?'Open eMAR':'View eMAR'}</a></div></div><div class="client-body"><div class="grid"><div class="panel"><h3>Alerts & Tasks</h3><div class="panel-body">${flags.length?flags.slice(0,6).map(f=>`<div class="alert ${String(f.severity).toUpperCase()==='CRITICAL'?'critical':''}"><strong>${esc(f.label)}</strong>${f.details?`<br>${esc(f.details)}`:''}</div>`).join(''):'<div class="task">No active chart flags.</div>'}${assess.map(x=>`<div class="task"><strong>${esc(x.templateTitle||'Assessment')}</strong><br>Due ${esc(fmt(x.dueAt))}${x.reason?` · ${esc(x.reason)}`:''}</div>`).join('')}</div></div><div class="panel"><h3>Medication Windows</h3><div class="panel-body">${mr.length?mr.slice(0,12).map(x=>`<div class="med"><strong>${esc(x.med.name)} ${esc(x.med.dose||'')} ${esc(x.med.route||'')}</strong><span class="due ${x.state.className}">${esc(x.state.label)}</span><small>${esc(x.med.instructions||x.med.frequency||'')}</small></div>`).join(''):'<div class="task">No active medication orders.</div>'}</div></div><div class="panel"><h3>Vitals / PCT Flowsheet</h3><div class="panel-body">${latestVitals(p.latestVitals)}<div class="actions"><button class="btn success" data-vitals="${esc(p.id)}" data-name="${esc([p.preferredName||p.firstName,p.lastName].filter(Boolean).join(' '))}">Record Vitals / Weight</button><a class="btn" href="/spire.html#patient=${encodeURIComponent(p.id)}&tab=flowsheets">Full Flowsheet</a></div></div></div></div></div></section>`}).join(''):'<div class="empty">No clients are assigned to you in the selected company.</div>';wire()}
function wire(){document.querySelectorAll('[data-vitals]').forEach(b=>b.onclick=()=>{state.patient={id:b.dataset.vitals,name:b.dataset.name};$('vitalTitle').textContent=`Record Vitals — ${b.dataset.name}`;['vTemp','vPulse','vResp','vSys','vDia','vSpo2','vWeight','vOxygen'].forEach(id=>$(id).value='');$('vitalError').classList.remove('show');$('vitalDialog').showModal()})}
$('saveVitals').onclick=async()=>{const box=$('vitalError'),b=$('saveVitals');box.classList.remove('show');b.disabled=true;try{const n=id=>$(id).value===''?null:Number($(id).value);await api(`/api/spire/patients/${encodeURIComponent(state.patient.id)}/vitals`,{method:'POST',body:JSON.stringify({temperature:n('vTemp'),pulse:n('vPulse'),respirations:n('vResp'),systolic:n('vSys'),diastolic:n('vDia'),spo2:n('vSpo2'),weight:n('vWeight'),oxygen:$('vOxygen').value||null})});$('vitalDialog').close();await load()}catch(e){box.textContent=e.message;box.classList.add('show')}finally{b.disabled=false}};document.addEventListener('click',e=>{const c=e.target.closest('[data-close]');if(c)$(c.dataset.close)?.close()});async function load(){$('clients').classList.add('loading');try{state.data=await api('/api/spire/my-shift');render()}catch(e){$('clients').innerHTML=`<div class="empty">${esc(e.message)}</div>`}finally{$('clients').classList.remove('loading')}}$('refresh').onclick=load;window.addEventListener('sulandra:entity-context-changed',()=>location.reload());(async()=>{if(!token()){location.href='/employee-login.html?returnTo=/spire-shift.html';return}await window.SulandraEntityContext?.ready;await load()})()})();
</script></body></html>
