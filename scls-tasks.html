<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>SCLS Task Board | Sulandra Health</title><link rel="icon" href="/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#edf3f7;color:#173b52}button,input,select,textarea{font:inherit}.top{display:flex;align-items:center;gap:14px;padding:11px 18px;background:#fff;border-bottom:1px solid #d5e1e8;position:sticky;top:0;z-index:40}.top img{width:220px;max-width:42vw}.top .spacer{flex:1}.top a{color:#075985;text-decoration:none;font-weight:900}.shell{width:min(1220px,calc(100% - 22px));margin:16px auto 50px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}.hero h1{margin:0;color:#0b4265;font-size:29px}.hero p{margin:5px 0;color:#667b88}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar select,.toolbar input{border:1px solid #c8d6df;border-radius:8px;padding:8px 9px;background:#fff}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:900;cursor:pointer;text-decoration:none}.btn.primary{background:#0b6ea8;color:#fff}.btn.success{border-color:#45845a;background:#eff9f2;color:#306a43}.btn.warn{border-color:#ad792c;color:#7d5717}.btn.danger{border-color:#b5524a;color:#94362f}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border:1px solid #d5e1e8;border-radius:10px;padding:10px}.stat span{display:block;font-size:9px;text-transform:uppercase;font-weight:900;color:#7e8e98}.stat strong{font-size:21px;color:#23526c}.tasks{display:grid;gap:9px}.task{background:#fff;border:1px solid #d4e1e8;border-radius:13px;box-shadow:0 7px 20px rgba(18,56,80,.05);overflow:hidden}.task-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid #e4eaee}.task-head h2{margin:0;color:#174a69;font-size:16px}.task-head p{margin:4px 0 0;color:#718491;font-size:11px}.task-body{padding:13px}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.fact{border:1px solid #e0e8ed;background:#f9fbfc;border-radius:8px;padding:7px}.fact span{display:block;font-size:8px;text-transform:uppercase;font-weight:900;color:#84919a}.fact strong{font-size:11px;color:#2c536b}.status{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:950;background:#edf3f7;color:#536c7d}.status.OPEN{background:#e8f1ff;color:#2e5f9a}.status.IN_PROGRESS{background:#fff0d0;color:#835b0c}.status.COMPLETED{background:#e4f7ea;color:#29633d}.status.CANCELLED{background:#fde9e7;color:#92372f}.priority.URGENT{color:#9b332d}.priority.HIGH{color:#855d12}.note{white-space:pre-wrap;line-height:1.45;background:#f8fafb;border:1px solid #e1e8ec;border-radius:8px;padding:9px;color:#4a6373;margin-top:8px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.events{margin-top:9px;border-top:1px solid #e7ecef;padding-top:7px}.event{font-size:10px;color:#607886;padding:4px 0}.empty{padding:34px;text-align:center;color:#718491}.error{display:none;padding:10px 12px;background:#fff0ef;border:1px solid #efb4af;color:#8b302a;border-radius:9px;margin-bottom:10px}.error.show{display:block}dialog{width:min(720px,calc(100vw - 22px));border:0;border-radius:16px;padding:0;box-shadow:0 30px 90px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(8,28,42,.55)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #e2e8ec}.modal-head h2{margin:0;color:#0b4265}.modal-body{padding:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{display:flex;flex-direction:column;gap:4px}.field.wide{grid-column:1/-1}.field label{font-size:11px;font-weight:900;color:#506b7d}.field input,.field select,.field textarea{width:100%;border:1px solid #c8d6df;border-radius:8px;padding:9px}.field textarea{min-height:90px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}@media(max-width:750px){.summary,.facts{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.field.wide{grid-column:auto}}@media(max-width:480px){.summary,.facts{grid-template-columns:1fr}.top a{display:none}.hero{flex-direction:column}}</style></head><body><header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><a href="/scls-residential.html">Residential</a><a href="/spire-shift.html">My Shift</a><a href="/employee-portal.html">Employee Portal</a></header><main class="shell"><div class="hero"><div><h1>SCLS Task Board</h1><p>House and resident tasks with assignment, due dates, completion and immutable task history.</p></div><button id="newTask" class="btn primary">+ Task</button></div><div class="toolbar"><select id="homeFilter"><option value="">All accessible homes</option></select><select id="statusFilter"><option value="">All statuses</option><option value="OPEN">Open</option><option value="IN_PROGRESS">In Progress</option><option value="COMPLETED">Completed</option><option value="CANCELLED">Cancelled</option></select><label><input id="mineOnly" type="checkbox"> My assigned tasks</label><button id="refresh" class="btn">Refresh</button></div><div id="summary" class="summary"></div><div id="error" class="error"></div><div id="tasks" class="tasks"><div class="empty">Loading tasks…</div></div></main><dialog id="taskDialog"><form id="taskForm"><div class="modal-head"><h2>Create SCLS Task</h2><button type="button" class="btn" data-close="taskDialog">Close</button></div><div class="modal-body"><div id="taskError" class="error"></div><div class="grid"><div class="field"><label>Home</label><select id="taskHome"><option value="">No house</option></select></div><div class="field"><label>Resident</label><select id="taskClient"><option value="">No resident</option></select></div><div class="field"><label>Task Type</label><select id="taskType"><option>DAILY_CARE</option><option>APPOINTMENT</option><option>MEDICATION_FOLLOW_UP</option><option>HEALTH_MONITORING</option><option>ISP_GOAL</option><option>DOCUMENTATION</option><option>HOUSE_OPERATION</option><option>TRAINING</option><option>OTHER</option></select></div><div class="field"><label>Priority</label><select id="taskPriority"><option>ROUTINE</option><option>HIGH</option><option>URGENT</option></select></div><div class="field wide"><label>Title</label><input id="taskTitle" required></div><div class="field wide"><label>Instructions</label><textarea id="taskInstructions"></textarea></div><div class="field"><label>Due Date / Time</label><input id="taskDue" type="datetime-local"></div><div class="field"><label>Assign Employee User ID</label><input id="taskAssignee"></div></div><div class="modal-actions"><button class="btn primary" type="submit">Create Task</button></div></div></form></dialog><script src="/assets/sulandra-entity-context.js?v=20260810-tasks-1"></script><script src="/assets/employee-directory-enhancer.js?v=20260810-2"></script><script>(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEYS=['sulandra:employee:access-token','sulandra_token','token','accessToken'];const token=()=>KEYS.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(String(v)).toLocaleString():'—';const state={homes:[],tasks:[],patients:[]};async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',headers:{Accept:'application/json',...(token()?{Authorization:`Bearer ${token()}`} : {}),...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||p.message||`Request failed (${r.status})`);return p.data??p}function person(t){return [t.preferredName||t.firstName,t.lastName].filter(Boolean).join(' ')||'House-wide'}function render(){const rows=state.tasks,open=rows.filter(t=>t.status==='OPEN').length,progress=rows.filter(t=>t.status==='IN_PROGRESS').length,urgent=rows.filter(t=>t.priority==='URGENT'&&!['COMPLETED','CANCELLED'].includes(t.status)).length,due=rows.filter(t=>t.dueAt&&!['COMPLETED','CANCELLED'].includes(t.status)&&new Date(t.dueAt)<new Date()).length;$('summary').innerHTML=`<div class="stat"><span>Open</span><strong>${open}</strong></div><div class="stat"><span>In Progress</span><strong>${progress}</strong></div><div class="stat"><span>Urgent</span><strong>${urgent}</strong></div><div class="stat"><span>Past Due</span><strong>${due}</strong></div>`;$('tasks').innerHTML=rows.length?rows.map(t=>`<article class="task"><div class="task-head"><div><h2>${esc(t.title)}</h2><p>${esc(t.homeName||'No house')} · ${esc(person(t))}</p></div><span class="status ${esc(t.status)}">${esc(String(t.status).replaceAll('_',' '))}</span></div><div class="task-body"><div class="facts"><div class="fact"><span>Type</span><strong>${esc(t.taskType)}</strong></div><div class="fact"><span>Priority</span><strong class="priority ${esc(t.priority)}">${esc(t.priority)}</strong></div><div class="fact"><span>Due</span><strong>${esc(fmt(t.dueAt))}</strong></div><div class="fact"><span>Assigned To</span><strong>${esc(t.assignedUserId||'Unassigned')}</strong></div></div>${t.instructions?`<div class="note">${esc(t.instructions)}</div>`:''}<div class="actions">${t.status==='OPEN'?`<button class="btn primary" data-action="START" data-id="${esc(t.id)}">Start</button>`:''}${['OPEN','IN_PROGRESS'].includes(t.status)?`<button class="btn success" data-action="COMPLETE" data-id="${esc(t.id)}">Complete</button><button class="btn danger" data-action="CANCEL" data-id="${esc(t.id)}">Cancel</button>`:''}${['COMPLETED','CANCELLED'].includes(t.status)?`<button class="btn warn" data-action="REOPEN" data-id="${esc(t.id)}">Reopen</button>`:''}<button class="btn" data-action="ASSIGN" data-id="${esc(t.id)}">Assign</button><button class="btn" data-action="COMMENT" data-id="${esc(t.id)}">Comment</button>${t.clientId?`<a class="btn" href="/spire.html?patientId=${encodeURIComponent(t.clientId)}">Chart</a>`:''}</div>${Array.isArray(t.events)&&t.events.length?`<div class="events"><strong style="font-size:10px">Recent history</strong>${t.events.slice(0,5).map(e=>`<div class="event">${esc(String(e.eventType).replaceAll('_',' '))} · ${esc(fmt(e.createdAt))} · ${esc(e.actorUserId)}${e.comment?` — ${esc(e.comment)}`:''}</div>`).join('')}</div>`:''}</div></article>`).join(''):'<div class="empty">No tasks match this view.</div>'}async function load(){const qs=new URLSearchParams(),home=$('homeFilter').value,status=$('statusFilter').value;if(home)qs.set('homeId',home);if(status)qs.set('status',status);if($('mineOnly').checked)qs.set('mine','true');[state.tasks,state.homes]=await Promise.all([api(`/api/scls/tasks?${qs}`),api('/api/scls/residential/homes')]);$('homeFilter').innerHTML='<option value="">All accessible homes</option>'+state.homes.map(h=>`<option value="${esc(h.id)}" ${home===String(h.id)?'selected':''}>${esc(h.name)}</option>`).join('');render()}async function openCreate(){try{state.patients=await api('/api/spire/patients')}catch{state.patients=[]}$('taskForm').reset();$('taskHome').innerHTML='<option value="">No house</option>'+state.homes.map(h=>`<option value="${esc(h.id)}">${esc(h.name)}</option>`).join('');$('taskClient').innerHTML='<option value="">No resident</option>'+state.patients.map(p=>`<option value="${esc(p.id)}">${esc(p.name||[p.firstName,p.lastName].filter(Boolean).join(' '))} · ${esc(p.medicalRecordNumber||'')}</option>`).join('');$('taskDialog').showModal()}async function action(id,action){let comment=null,assignedUserId=null;if(action==='COMMENT'){comment=prompt('Comment:');if(!comment)return}if(action==='CANCEL'){comment=prompt('Cancellation reason:');if(!comment)return}if(action==='REOPEN')comment=prompt('Reason for reopening (optional):')||null;if(action==='COMPLETE')comment=prompt('Completion note (optional):')||null;if(action==='ASSIGN'){assignedUserId=prompt('Employee User ID to assign:');if(!assignedUserId)return;comment=prompt('Assignment note (optional):')||null}try{await api(`/api/scls/tasks/${encodeURIComponent(id)}/action`,{method:'POST',body:JSON.stringify({action,comment,assignedUserId})});await load()}catch(e){alert(e.message)}}document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a)action(a.dataset.id,a.dataset.action);const close=e.target.closest('[data-close]');if(close)$(close.dataset.close)?.close()});$('newTask').onclick=openCreate;$('refresh').onclick=load;$('homeFilter').onchange=load;$('statusFilter').onchange=load;$('mineOnly').onchange=load;$('taskForm').onsubmit=async e=>{e.preventDefault();const error=$('taskError');error.classList.remove('show');const local=$('taskDue').value;try{await api('/api/scls/tasks',{method:'POST',body:JSON.stringify({homeId:$('taskHome').value||null,clientId:$('taskClient').value||null,taskType:$('taskType').value,title:$('taskTitle').value,instructions:$('taskInstructions').value||null,priority:$('taskPriority').value,dueAt:local?new Date(local).toISOString():null,assignedUserId:$('taskAssignee').value||null})});$('taskDialog').close();await load()}catch(err){error.textContent=err.message;error.classList.add('show')}};window.addEventListener('sulandra:entity-context-changed',()=>location.reload());(async()=>{if(!token()){location.href='/employee-login.html?returnTo=/scls-tasks.html';return}await window.SulandraEntityContext?.ready;try{await load()}catch(e){$('error').textContent=e.message;$('error').classList.add('show')}})()})();</script></body></html>
