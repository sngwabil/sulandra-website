<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>SCLS Residential Operations | Sulandra Health</title><link rel="icon" href="/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#edf3f7;color:#173b52}button,input,select,textarea{font:inherit}.top{display:flex;align-items:center;gap:14px;padding:11px 18px;background:#fff;border-bottom:1px solid #d5e1e8;position:sticky;top:0;z-index:40}.top img{width:220px;max-width:42vw}.top .spacer{flex:1}.top a{color:#075985;text-decoration:none;font-weight:900}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 65px)}.rail{background:#f9fbfc;border-right:1px solid #d4e1e8;padding:14px;overflow:auto}.rail h2{margin:0 0 9px;color:#0b4265;font-size:17px}.filter{width:100%;border:1px solid #c8d6df;border-radius:9px;padding:9px 10px;margin-bottom:8px}.house{width:100%;text-align:left;border:1px solid #d8e3e9;background:#fff;border-radius:11px;padding:11px;margin:6px 0;color:#2b4e63}.house.active{background:#e7f5fb;border-color:#0b75ad}.house strong{display:block;color:#0b4265}.house small{display:block;color:#708491;margin-top:3px}.main{padding:18px;min-width:0}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:13px}.hero h1{margin:0;color:#0b4265;font-size:29px}.hero p{margin:5px 0;color:#667b88}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer;text-decoration:none}.btn.primary{background:#0b6ea8;color:#fff}.btn.success{border-color:#45845a;background:#eff9f2;color:#306a43}.btn.warn{border-color:#ad792c;color:#7d5717}.btn.danger{border-color:#b5524a;color:#94362f}.btn:disabled{opacity:.48;cursor:not-allowed}.status{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:950;background:#edf3f7;color:#536c7d}.status.CRITICAL{background:#fde9e7;color:#92372f}.status.HIGH,.status.WATCH{background:#fff0d0;color:#835b0c}.status.ACTIVE,.status.SIGNED{background:#e4f7ea;color:#29633d}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}.stat{background:#fff;border:1px solid #d5e1e8;border-radius:11px;padding:11px}.stat span{display:block;font-size:10px;text-transform:uppercase;font-weight:950;color:#7b8c97}.stat strong{display:block;font-size:22px;color:#174b69;margin-top:3px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tab{border:1px solid #cad9e1;background:#fff;color:#567083;border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;cursor:pointer}.tab.active{background:#0b6ea8;color:#fff;border-color:#0b6ea8}.card{background:#fff;border:1px solid #d4e1e8;border-radius:15px;box-shadow:0 9px 28px rgba(18,56,80,.06);margin-bottom:12px;overflow:hidden}.card-head{padding:13px 15px;border-bottom:1px solid #e3e9ed;display:flex;align-items:center;justify-content:space-between;gap:10px}.card-head h2{margin:0;color:#174a69;font-size:18px}.card-body{padding:15px}.resident-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.resident{border:1px solid #dce6eb;border-radius:12px;background:#fbfdfe;overflow:hidden}.resident-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:11px;border-bottom:1px solid #e3eaee}.resident-head h3{margin:0;color:#174a69;font-size:16px}.resident-head small{display:block;color:#738692;margin-top:3px}.resident-body{padding:11px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.fact{background:#fff;border:1px solid #e0e8ed;border-radius:8px;padding:7px}.fact span{display:block;font-size:8px;text-transform:uppercase;font-weight:900;color:#84919a}.fact strong{font-size:11px;color:#2c536b;display:block;margin-top:3px}.alerts{margin-top:7px}.alert{padding:7px 8px;border-radius:7px;margin:4px 0;background:#fff5e6;border:1px solid #edd5a5;color:#775418;font-size:10px}.alert.CRITICAL{background:#fdeceb;border-color:#efbbb7;color:#8a332d}.med{padding:6px 0;border-bottom:1px solid #edf1f3;font-size:10px}.med:last-child{border:0}.med strong{color:#2c526a}.pill{display:inline-flex;padding:2px 5px;border-radius:999px;font-size:8px;font-weight:950;margin-left:4px;background:#e9f2f7;color:#47677a}.pill.now{background:#fff0cb;color:#80580c}.pill.late{background:#fde9e7;color:#92362f}.pill.done{background:#e4f7ea;color:#28623d}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.subcard{border:1px solid #dce6eb;border-radius:10px;padding:10px;margin:7px 0;background:#fbfdfe}.subcard strong{color:#214e68}.subcard small{display:block;color:#738692;margin-top:3px}.handoff{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field{display:flex;flex-direction:column;gap:4px}.field.wide{grid-column:1/-1}.field label{font-size:11px;font-weight:900;color:#506b7d}.field input,.field select,.field textarea{width:100%;border:1px solid #c8d6df;border-radius:8px;padding:9px;background:#fff}.field textarea{min-height:90px;resize:vertical;line-height:1.4}.empty{padding:32px;text-align:center;color:#718491}.note{white-space:pre-wrap;line-height:1.45;background:#f8fafb;border:1px solid #e1e8ec;border-radius:8px;padding:9px;color:#4a6373}.error{display:none;padding:10px 12px;background:#fff0ef;border:1px solid #efb4af;color:#8b302a;border-radius:9px;margin-bottom:10px}.error.show{display:block}dialog{width:min(760px,calc(100vw - 22px));border:0;border-radius:16px;padding:0;box-shadow:0 30px 90px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(8,28,42,.55)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #e2e8ec}.modal-head h2{margin:0;color:#0b4265}.modal-body{padding:16px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}@media(max-width:1000px){.layout{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid #d4e1e8;max-height:330px}.resident-grid{grid-template-columns:1fr}}@media(max-width:620px){.main{padding:11px}.summary,.facts,.grid,.handoff{grid-template-columns:1fr 1fr}.field.wide{grid-column:1/-1}.top a{display:none}.hero{flex-direction:column}}@media(max-width:460px){.summary,.facts,.grid,.handoff{grid-template-columns:1fr}.field.wide{grid-column:auto}}</style></head><body><header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><a href="/spire-shift.html">My Shift</a><a href="/client-intake.html">Client Intake</a><a href="/spire-admin.html">SPIRE Admin</a></header><div class="layout"><aside class="rail"><button id="newHouse" class="btn primary" style="width:100%;margin-bottom:9px">+ SCLS Home</button><input id="houseSearch" class="filter" placeholder="Search homes"><h2>Residential Homes</h2><div id="houseList"><div class="empty">Loading…</div></div></aside><main id="main" class="main"><div class="empty">Choose an SCLS home.</div></main></div>
<dialog id="houseDialog"><form id="houseForm"><div class="modal-head"><h2>Create SCLS Home</h2><button class="btn" type="button" data-close="houseDialog">Close</button></div><div class="modal-body"><div id="houseError" class="error"></div><div class="grid"><div class="field"><label>Home Name</label><input id="hName" required></div><div class="field"><label>Home Type</label><select id="hType"><option>GROUP_HOME</option><option>SHARED_LIVING</option><option>SUPPORTED_LIVING</option><option>RESPITE</option><option>OTHER</option></select></div><div class="field wide"><label>Address</label><input id="hAddress"></div><div class="field"><label>House Phone</label><input id="hPhone"></div><div class="field"><label>Capacity</label><input id="hCapacity" type="number" min="1" max="100"></div><div class="field"><label>Manager User ID</label><input id="hManager"></div><div class="field"><label>Timezone</label><input id="hTimezone" value="America/New_York"></div><div class="field wide"><label>Emergency Instructions</label><textarea id="hEmergency"></textarea></div><div class="field wide"><label>House Notes</label><textarea id="hNotes"></textarea></div></div><div class="modal-actions"><button class="btn primary" type="submit">Create Home</button></div></div></form></dialog>

<script src="/assets/sulandra-entity-context.js?v=20260810-scls-1"></script><script src="/assets/employee-directory-enhancer.js?v=20260810-1"></script><script>(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEYS=['sulandra:employee:access-token','sulandra_token','token','accessToken'];const token=()=>KEYS.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(String(v)).toLocaleString():'—';const date=v=>v?new Date(String(v)).toLocaleDateString():'—';const arr=v=>Array.isArray(v)?v:[];const state={context:null,homes:[],homeId:'',detail:null,tab:'residents',patients:[]};async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',headers:{Accept:'application/json',...(token()?{Authorization:`Bearer ${token()}`} : {}),...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(p.error||p.message||`Request failed (${r.status})`);e.details=p.details||p;throw e}return p.data??p}function name(p){return [p.preferredName||p.firstName,p.lastName].filter(Boolean).join(' ')||'Resident'}function scheduleState(s,events){const raw=String(s?.scheduledTime||'');const m=raw.match(/(\d{1,2}):(\d{2})/);if(!m)return{label:raw||'Scheduled',cls:''};const now=new Date(),due=new Date();due.setHours(Number(m[1]),Number(m[2]),0,0);const done=arr(events).some(e=>{const d=new Date(e.scheduledFor||e.administeredAt||0);return !Number.isNaN(d.getTime())&&Math.abs(d.getTime()-due.getTime())<6*3600000&&['GIVEN','REFUSED','HELD','NOT_GIVEN','MISSED'].includes(String(e.status))});if(done)return{label:`${raw} documented`,cls:'done'};const diff=(now-due)/60000,b=Number(s.windowBeforeMinutes??30),a=Number(s.windowAfterMinutes??30);if(diff>a)return{label:`${raw} overdue`,cls:'late'};if(diff>=-b&&diff<=a)return{label:`${raw} due`,cls:'now'};return{label:raw,cls:''}}function medRows(p){const out=[];arr(p.medications).forEach(m=>{const schedules=arr(m.schedules);if(schedules.length)schedules.forEach(s=>out.push({m,state:scheduleState(s,m.administrations)}));else out.push({m,state:{label:Array.isArray(m.dueTimes)?m.dueTimes.join(', '):m.frequency||'Active',cls:''}})});return out}function renderHomes(){const q=$('houseSearch').value.trim().toLowerCase(),rows=state.homes.filter(h=>!q||JSON.stringify(h).toLowerCase().includes(q));$('houseList').innerHTML=rows.length?rows.map(h=>`<button class="house ${String(h.id)===state.homeId?'active':''}" data-house="${esc(h.id)}"><strong>${esc(h.name)}</strong><small>${esc(h.homeType||'GROUP HOME')} · ${Number(h.residentCount||0)}/${h.capacity||'—'} residents</small><small>${Number(h.staffCount||0)} staff assigned · ${Number(h.openTaskCount||0)} open tasks</small></button>`).join(''):'<div class="empty">No SCLS homes match this view.</div>'}function summary(){const d=state.detail,res=d?.residents||[];let due=0,late=0,flags=0;res.forEach(p=>{medRows(p).forEach(x=>{if(x.state.cls==='now')due++;if(x.state.cls==='late')late++});flags+=arr(p.flags).filter(f=>['HIGH','CRITICAL'].includes(String(f.severity))).length});return `<div class="summary"><div class="stat"><span>Residents</span><strong>${res.length}</strong></div><div class="stat"><span>Meds Due</span><strong>${due}</strong></div><div class="stat"><span>Overdue Windows</span><strong>${late}</strong></div><div class="stat"><span>High Alerts</span><strong>${flags}</strong></div></div>`}function tabs(){return `<div class="tabs">${[['residents','Residents'],['staff','Staff'],['tasks','Tasks & Appointments'],['handoff','Shift Handoff'],['log','House Log']].map(([k,t])=>`<button class="tab ${state.tab===k?'active':''}" data-tab="${k}">${t}</button>`).join('')}</div>`}function latestVitals(v){if(!v)return'No vitals';return `Temp ${v.temperature??'—'} · Wt ${v.weight??'—'} lb · BP ${v.systolic??'—'}/${v.diastolic??'—'} · SpO₂ ${v.spo2??'—'}%`}function residentsHtml(){const d=state.detail,rows=d.residents||[];return `<section class="card"><div class="card-head"><h2>Resident Roster</h2>${state.context.elevated?'<button id="addResident" class="btn primary">+ Place Resident</button>':''}</div><div class="card-body"><div class="resident-grid">${rows.length?rows.map(p=>{const meds=medRows(p);return `<article class="resident"><div class="resident-head"><div><h3>${esc(name(p))}</h3><small>MRN ${esc(p.medicalRecordNumber||'—')} · Room ${esc(p.placement?.roomLabel||'—')}${p.placement?.bedLabel?` · Bed ${esc(p.placement.bedLabel)}`:''}</small></div><span class="status ${esc(p.carePlan?.status||'')}">${esc(p.carePlan?.status||'No ISP')}</span></div><div class="resident-body"><div class="facts"><div class="fact"><span>Latest Vitals</span><strong>${esc(latestVitals(p.latestVitals))}</strong></div><div class="fact"><span>Assessments ≤24h</span><strong>${arr(p.dueAssessments).length}</strong></div><div class="fact"><span>ISP Review</span><strong>${esc(p.carePlan?.annualReviewDate?date(p.carePlan.annualReviewDate):'—')}</strong></div></div><div class="alerts">${arr(p.flags).slice(0,5).map(f=>`<div class="alert ${esc(f.severity)}"><strong>${esc(f.label)}</strong>${f.details?`<br>${esc(f.details)}`:''}</div>`).join('')}</div><div style="margin-top:7px"><strong style="font-size:10px;color:#506b7d">Medication windows</strong>${meds.length?meds.slice(0,10).map(x=>`<div class="med"><strong>${esc(x.m.name)} ${esc(x.m.dose||'')} ${esc(x.m.route||'')}</strong><span class="pill ${x.state.cls}">${esc(x.state.label)}</span></div>`).join(''):'<div class="med">No active medication orders.</div>'}</div><div class="actions"><a class="btn" href="/spire.html?patientId=${encodeURIComponent(p.id)}">Chart</a><a class="btn primary" href="/spire.html?patientId=${encodeURIComponent(p.id)}#mar">eMAR</a><a class="btn" href="/spire.html?patientId=${encodeURIComponent(p.id)}#flowsheets">Flowsheets</a>${state.context.elevated?`<button class="btn danger" data-end-resident="${esc(p.id)}">End Placement</button>`:''}</div></div></article>`}).join(''):'<div class="empty">No residents currently placed in this home.</div>'}</div></div></section>`}function staffHtml(){const rows=state.detail.staff||[];return `<section class="card"><div class="card-head"><h2>Assigned House Staff</h2>${state.context.elevated?'<button id="addStaff" class="btn primary">+ Assign Staff</button>':''}</div><div class="card-body">${rows.length?rows.map(s=>`<div class="subcard"><strong>${esc(s.userId)}</strong><small>Assigned ${esc(fmt(s.assignedAt))}${s.assignedByUserId?` · by ${esc(s.assignedByUserId)}`:''}</small>${state.context.elevated?`<div class="actions"><button class="btn danger" data-remove-staff="${esc(s.userId)}">Remove Assignment</button></div>`:''}</div>`).join(''):'<div class="empty">No staff assigned to this home.</div>'}</div></section>`}function tasksHtml(){const d=state.detail;return `<section class="card"><div class="card-head"><h2>Open Tasks</h2></div><div class="card-body">${d.tasks?.length?d.tasks.map(t=>`<div class="subcard"><span class="status ${esc(t.priority)}">${esc(t.priority)}</span><strong>${esc(t.title)}</strong><small>${esc(t.taskType)} · Due ${esc(fmt(t.dueAt))} · ${esc(t.status)}</small>${t.instructions?`<div class="note">${esc(t.instructions)}</div>`:''}</div>`).join(''):'<div class="empty">No open house/resident tasks.</div>'}</div></section><section class="card"><div class="card-head"><h2>Appointments & Transportation — Next 7 Days</h2></div><div class="card-body">${d.appointments?.length?d.appointments.map(a=>`<div class="subcard"><strong>${esc([a.preferredName||a.firstName,a.lastName].filter(Boolean).join(' '))} · ${esc(a.appointmentType||'Appointment')}</strong><small>${esc(fmt(a.startsAt))} · ${esc(a.locationId||'Location not entered')} · ${esc(a.status)}</small></div>`).join(''):'<div class="empty">No upcoming appointments.</div>'}</div></section>`}function handoffHtml(){const rows=state.detail.handoffs||[],now=new Date().toISOString().slice(0,16);return `<section class="card"><div class="card-head"><h2>New Shift Handoff</h2></div><div class="card-body"><div id="handoffError" class="error"></div><div class="handoff"><div class="field"><label>Shift</label><select id="hoType"><option>DAY</option><option>EVENING</option><option>NIGHT</option><option>CUSTOM</option></select></div><div class="field"><label>Shift Start</label><input id="hoStart" type="datetime-local" value="${now}"></div><div class="field wide"><label>Staffing Summary</label><textarea id="hoStaff"></textarea></div><div class="field wide"><label>Resident Summary</label><textarea id="hoResidents"></textarea></div><div class="field wide"><label>Medication Exceptions / PRNs / Refusals</label><textarea id="hoMeds"></textarea></div><div class="field wide"><label>Health Changes</label><textarea id="hoHealth"></textarea></div><div class="field wide"><label>Behavior / Safety Changes</label><textarea id="hoBehavior"></textarea></div><div class="field wide"><label>Appointments / Transportation</label><textarea id="hoAppointments"></textarea></div><div class="field wide"><label>Unfinished Tasks</label><textarea id="hoTasks"></textarea></div><div class="field wide"><label>House / Environment</label><textarea id="hoEnvironment"></textarea></div><div class="field wide"><label>Follow-Up Required</label><textarea id="hoFollow"></textarea></div><div class="field wide"><label>Signature Attestation</label><textarea id="hoAttestation">I attest that this handoff accurately reflects the condition, needs, events and unfinished work known to me at the end of this shift.</textarea></div></div><div class="actions"><button class="btn" data-save-handoff="DRAFT">Save Draft</button><button class="btn success" data-save-handoff="SIGNED">Sign Handoff</button></div></div></section><section class="card"><div class="card-head"><h2>Recent Handoffs</h2></div><div class="card-body">${rows.length?rows.map(h=>`<div class="subcard"><span class="status ${esc(h.status)}">${esc(h.status)}</span><strong>${esc(h.shiftType)} · ${esc(fmt(h.shiftStart))}</strong><small>Created by ${esc(h.createdByUserId)}${h.signedByUserId?` · Signed by ${esc(h.signedByUserId)} ${esc(fmt(h.signedAt))}`:''}</small>${h.followUpRequired?`<div class="note"><strong>Follow-up:</strong> ${esc(h.followUpRequired)}</div>`:''}</div>`).join(''):'<div class="empty">No shift handoffs yet.</div>'}</div></section>`}function logHtml(){const rows=state.detail.logs||[];return `<section class="card"><div class="card-head"><h2>Add House Log Event</h2></div><div class="card-body"><div id="logError" class="error"></div><div class="grid"><div class="field"><label>Event Type</label><select id="logType">${['SHIFT_NOTE','HOUSE_ACTIVITY','APPOINTMENT','TRANSPORTATION','HEALTH_CHANGE','BEHAVIOR_SAFETY','MEDICATION_EXCEPTION','MAINTENANCE','STAFFING','EMERGENCY','OTHER'].map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field"><label>Severity</label><select id="logSeverity"><option>INFO</option><option>WATCH</option><option>HIGH</option><option>CRITICAL</option></select></div><div class="field wide"><label>Title</label><input id="logTitle"></div><div class="field"><label>Resident (optional)</label><select id="logResident"><option value="">House-wide</option>${(state.detail.residents||[]).map(p=>`<option value="${esc(p.id)}">${esc(name(p))}</option>`).join('')}</select></div><div class="field"><label>Follow-Up Owner User ID</label><input id="logOwner"></div><div class="field wide"><label>Details</label><textarea id="logDetails"></textarea></div><label><input id="logFollow" type="checkbox"> Requires follow-up</label></div><div class="actions"><button id="saveLog" class="btn primary">Add House Log</button></div></div></section><section class="card"><div class="card-head"><h2>House Log Timeline</h2></div><div class="card-body">${rows.length?rows.map(l=>`<div class="subcard"><span class="status ${esc(l.severity)}">${esc(l.severity)}</span><strong>${esc(l.title)}</strong><small>${esc(String(l.eventType).replaceAll('_',' '))} · ${esc(fmt(l.occurredAt))} · by ${esc(l.createdByUserId)}</small><div class="note">${esc(l.details)}</div>${l.requiresFollowUp?`<small><strong>Follow-up required${l.followUpOwnerUserId?` — ${esc(l.followUpOwnerUserId)}`:''}</strong></small>`:''}</div>`).join(''):'<div class="empty">No house log events yet.</div>'}</div></section>`}function renderDetail(){if(!state.detail){$('main').innerHTML='<div class="empty">Choose an SCLS home.</div>';return}const h=state.detail.home;$('main').innerHTML=`<div class="hero"><div><h1>${esc(h.name)}</h1><p>${esc(h.address||'Address not entered')} · ${esc(h.phone||'No house phone')} · ${esc(h.homeType||'GROUP HOME')}</p></div><button id="refreshHome" class="btn">Refresh</button></div>${summary()}${tabs()}<div id="tabBody">${state.tab==='residents'?residentsHtml():state.tab==='staff'?staffHtml():state.tab==='tasks'?tasksHtml():state.tab==='handoff'?handoffHtml():logHtml()}</div>`;wireDetail()}function wireDetail(){$('refreshHome').onclick=()=>openHome(state.homeId);document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;renderDetail()});$('addResident')?.addEventListener('click',openResidentDialog);$('addStaff')?.addEventListener('click',()=>{$('staffForm').reset();$('staffDialog').showModal()});document.querySelectorAll('[data-end-resident]').forEach(b=>b.onclick=()=>endResident(b.dataset.endResident));document.querySelectorAll('[data-remove-staff]').forEach(b=>b.onclick=()=>removeStaff(b.dataset.removeStaff));document.querySelectorAll('[data-save-handoff]').forEach(b=>b.onclick=()=>saveHandoff(b.dataset.saveHandoff));$('saveLog')?.addEventListener('click',saveLog)}async function load(){state.context=await api('/api/scls/residential/context');state.homes=await api('/api/scls/residential/homes');try{state.patients=await api('/api/spire/patients')}catch{state.patients=[]}renderHomes();if(!state.homeId&&state.homes[0])await openHome(state.homes[0].id)}async function openHome(id){state.homeId=String(id);renderHomes();try{state.detail=await api(`/api/scls/residential/homes/${encodeURIComponent(id)}`);renderDetail()}catch(e){$('main').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}function openResidentDialog(){const current=new Set((state.detail.residents||[]).map(x=>String(x.id)));$('residentPatient').innerHTML='<option value="">Choose client…</option>'+state.patients.filter(p=>!current.has(String(p.id))).map(p=>`<option value="${esc(p.id)}">${esc(p.name||name(p))} · MRN ${esc(p.medicalRecordNumber||'—')}</option>`).join('');$('residentForm').reset();$('residentPrimary').checked=true;$('residentDialog').showModal()}async function endResident(id){const reason=prompt('Placement end / transfer reason:');if(reason===null)return;try{await api(`/api/scls/residential/homes/${encodeURIComponent(state.homeId)}/residents/${encodeURIComponent(id)}/end`,{method:'POST',body:JSON.stringify({reason:reason||null})});await load();await openHome(state.homeId)}catch(e){alert(e.message)}}async function removeStaff(id){if(!confirm('Remove this employee from the house assignment?'))return;try{await api(`/api/scls/residential/homes/${encodeURIComponent(state.homeId)}/staff/${encodeURIComponent(id)}`,{method:'DELETE'});await openHome(state.homeId)}catch(e){alert(e.message)}}async function saveHandoff(status){const local=$('hoStart').value;const error=$('handoffError');error.classList.remove('show');try{await api(`/api/scls/residential/homes/${encodeURIComponent(state.homeId)}/handoffs`,{method:'POST',body:JSON.stringify({shiftType:$('hoType').value,shiftStart:new Date(local).toISOString(),status,staffingSummary:$('hoStaff').value||null,residentSummary:$('hoResidents').value||null,medicationExceptions:$('hoMeds').value||null,healthChanges:$('hoHealth').value||null,behaviorSafetyChanges:$('hoBehavior').value||null,appointmentsTransportation:$('hoAppointments').value||null,unfinishedTasks:$('hoTasks').value||null,houseEnvironment:$('hoEnvironment').value||null,followUpRequired:$('hoFollow').value||null,signatureAttestation:$('hoAttestation').value||null})});await openHome(state.homeId)}catch(e){error.textContent=e.message;error.classList.add('show')}}async function saveLog(){const error=$('logError');error.classList.remove('show');if(!$('logTitle').value.trim()||!$('logDetails').value.trim()){error.textContent='Title and details are required.';error.classList.add('show');return}try{await api(`/api/scls/residential/homes/${encodeURIComponent(state.homeId)}/logs`,{method:'POST',body:JSON.stringify({eventType:$('logType').value,severity:$('logSeverity').value,title:$('logTitle').value,details:$('logDetails').value,residentId:$('logResident').value||null,requiresFollowUp:$('logFollow').checked,followUpOwnerUserId:$('logOwner').value||null})});await openHome(state.homeId)}catch(e){error.textContent=e.message;error.classList.add('show')}}document.addEventListener('click',e=>{const h=e.target.closest('[data-house]');if(h)openHome(h.dataset.house);const close=e.target.closest('[data-close]');if(close)$(close.dataset.close)?.close()});$('houseSearch').oninput=renderHomes;$('newHouse').onclick=()=>{$('houseForm').reset();$('hTimezone').value='America/New_York';$('houseDialog').showModal()};$('houseForm').onsubmit=async e=>{e.preventDefault();const error=$('houseError');error.classList.remove('show');try{const data=await api('/api/scls/residential/homes',{method:'POST',body:JSON.stringify({name:$('hName').value,address:$('hAddress').value||null,homeType:$('hType').value,phone:$('hPhone').value||null,capacity:$('hCapacity').value?Number($('hCapacity').value):null,managerUserId:$('hManager').value||null,timezone:$('hTimezone').value||'America/New_York',emergencyInstructions:$('hEmergency').value||null,houseNotes:$('hNotes').value||null})});$('houseDialog').close();await load();await openHome(data.id)}catch(err){error.textContent=err.message;error.classList.add('show')}};$('residentForm').onsubmit=async e=>{e.preventDefault();const error=$('residentError');error.classList.remove('show');try{await api(`/api/scls/residential/homes/${encodeURIComponent(state.homeId)}/residents`,{method:'POST',body:JSON.stringify({patientId:$('residentPatient').value,roomLabel:$('residentRoom').value||null,bedLabel:$('residentBed').value||null,placementNotes:$('residentNotes').value||null,primary:$('residentPrimary').checked})});$('residentDialog').close();await load();await openHome(state.homeId)}catch(err){error.textContent=err.message;error.classList.add('show')}};$('staffForm').onsubmit=async e=>{e.preventDefault();const error=$('staffError');error.classList.remove('show');try{await api(`/api/scls/residential/homes/${encodeURIComponent(state.homeId)}/staff`,{method:'POST',body:JSON.stringify({userId:$('staffUserId').value})});$('staffDialog').close();await openHome(state.homeId)}catch(err){error.textContent=err.message;error.classList.add('show')}};window.addEventListener('sulandra:entity-context-changed',()=>location.reload());(async()=>{if(!token()){location.href='/employee-login.html?returnTo=/scls-residential.html';return}await window.SulandraEntityContext?.ready;try{await load()}catch(e){$('main').innerHTML=`<div class="empty">${esc(e.message)}</div>`}})()})();</script></body></html>
