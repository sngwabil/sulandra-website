<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sulandra IT Visual Guide</title><link rel="icon" href="/favicon-48x48.png"><style>
:root{--navy:#082f5b;--blue:#0b6fb8;--ink:#17324a;--muted:#60788d;--line:#d7e3ed;--bg:#f3f8fc;--ok:#176b43}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Segoe UI,Arial,sans-serif;color:var(--ink)}header{background:linear-gradient(135deg,#062a50,#0b6fb8);color:#fff;padding:20px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:25px}.wrap{max-width:1150px;margin:22px auto;padding:0 16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 26px rgba(8,47,91,.07)}.meta{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 18px}.pill{padding:5px 9px;background:#eaf4fb;border-radius:999px;font-size:12px;font-weight:800}.flow{display:grid;gap:0;margin-top:20px}.step{position:relative;border:2px solid #bdd7e9;border-radius:16px;padding:16px 18px 16px 66px;background:#fbfdff;min-height:96px}.step .num{position:absolute;left:17px;top:19px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--navy);color:#fff;font-weight:900}.step h3{margin:0 0 7px;color:var(--navy)}.target{display:inline-flex;margin-top:8px;padding:5px 9px;border-radius:8px;background:#e8f4ff;color:#075995;font-size:12px;font-weight:800}.arrow{height:52px;position:relative}.arrow:before{content:"";position:absolute;left:50%;top:6px;width:4px;height:31px;background:#0b6fb8;border-radius:4px}.arrow:after{content:"";position:absolute;left:calc(50% - 8px);top:28px;width:16px;height:16px;border-right:4px solid #0b6fb8;border-bottom:4px solid #0b6fb8;transform:rotate(45deg)}.status{padding:14px;border-left:4px solid var(--blue);background:#eef8ff;border-radius:10px;margin-bottom:15px}.btn{display:inline-flex;padding:10px 14px;border-radius:9px;background:#fff;color:var(--navy);text-decoration:none;font-weight:800}.loading{color:var(--muted)}.error{color:#9f2424;font-weight:700}@media(max-width:600px){.step{padding-left:58px}}
</style></head><body><header><div><h1>Sulandra IT Visual Guide</h1><div id="ticketHeader">Loading ticket…</div></div><a class="btn" href="/sia.html">Back to Ask SIA</a></header><main class="wrap"><div class="card"><div class="status"><strong>Follow the arrows in order.</strong> This guide belongs to your active IT ticket. When you finish, return to Ask SIA and tell it whether the steps worked, including your ticket number.</div><div id="guide" class="loading">Loading secure guide…</div></div></main><script>
(()=>{const API='https://sulandra-website-production-5fc4.up.railway.app';const token=()=>sessionStorage.getItem('sulandra:employee:access-token')||localStorage.getItem('sulandra:employee:access-token')||sessionStorage.getItem('sulandra:admin:access-token')||localStorage.getItem('sulandra:admin:access-token')||localStorage.getItem('token')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search),id=params.get('guide'),ticket=params.get('ticket')||'';document.getElementById('ticketHeader').textContent=ticket?`Ticket ${ticket}`:'Secure employee support';if(!token()){location.href='/employee-login.html?returnTo='+encodeURIComponent(location.pathname+location.search);return}if(!id){document.getElementById('guide').innerHTML='<p class="error">Guide ID is missing.</p>';return}fetch(`${API}/api/it-solutions/employee/guides/${encodeURIComponent(id)}`,{headers:{Accept:'application/json',Authorization:'Bearer '+token()}}).then(async r=>{const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||`Request failed (${r.status})`);return p.data?.guide||p.guide}).then(g=>{const steps=Array.isArray(g.steps)?g.steps:typeof g.steps==='string'?JSON.parse(g.steps):[];document.title=`${g.ticketNumber||ticket} | Sulandra IT Visual Guide`;document.getElementById('ticketHeader').textContent=`Ticket ${g.ticketNumber||ticket}`;document.getElementById('guide').className='';document.getElementById('guide').innerHTML=`<h2>${esc(g.title||'Visual instructions')}</h2><div class="meta"><span class="pill">${esc(g.ticketNumber||ticket)}</span><span class="pill">Secure employee guide</span></div><div class="flow">${steps.map((s,i)=>`${i?'<div class="arrow" aria-hidden="true"></div>':''}<section class="step"><span class="num">${i+1}</span><h3>${esc(s.label||`Step ${i+1}`)}</h3><div>${esc(s.instruction||'')}</div>${s.target?`<span class="target">→ Click / open: ${esc(s.target)}</span>`:''}</section>`).join('')}</div>`}).catch(e=>{document.getElementById('guide').className='error';document.getElementById('guide').textContent=e.message})})();
</script></body></html>
