visible_hostname sulandra-terminal-egress
http_port 3128
pid_filename /tmp/squid.pid
coredump_dir /tmp
cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr

acl CONNECT method CONNECT
acl Safe_ports port 1-65535

# The developer proxy is reachable only from the isolated terminal network.
# Permit arbitrary public destinations so package managers, git clients,
# downloaders and build tools are not tied to a brittle domain allowlist.
# Keep local/private/link-local destinations blocked to prevent the terminal
# from tunneling into the VPS control plane or cloud metadata endpoints.
acl localnet dst 10.0.0.0/8
acl localnet dst 100.64.0.0/10
acl localnet dst 127.0.0.0/8
acl localnet dst 169.254.0.0/16
acl localnet dst 172.16.0.0/12
acl localnet dst 192.168.0.0/16
acl localnet dst ::1
acl localnet dst fc00::/7
acl localnet dst fe80::/10

http_access deny !Safe_ports
http_access deny localnet
http_access allow all
