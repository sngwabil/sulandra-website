visible_hostname sulandra-terminal-egress
http_port 3128
pid_filename /tmp/squid.pid
coredump_dir /tmp
cache deny all
access_log stdio:/dev/stdout
cache_log /dev/stderr

acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# Explicit developer-service allowlist. Session containers remain on an
# internal Docker network and can reach the public Internet only through this
# proxy.
acl developer_domains dstdomain \
  .github.com \
  .githubusercontent.com \
  .githubassets.com \
  .npmjs.org \
  .npmjs.com \
  .pypi.org \
  .pythonhosted.org \
  .nodejs.org \
  .yarnpkg.com \
  .pnpm.io

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow developer_domains
http_access deny all
