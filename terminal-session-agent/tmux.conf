# Sulandra browser-terminal policy.
# Keep the outer xterm.js client on its primary buffer so browser scrollback
# remains available for ordinary PTY output. tmux remains the authoritative
# interactive history layer for long-running engineering sessions.
set -as terminal-overrides ',xterm-256color:smcup@:rmcup@'

# Native tmux mouse mode is required for reliable wheel/trackpad history.
# When enabled, tmux advertises terminal mouse tracking to xterm.js; the browser
# emits real mouse reports instead of synthesizing Up/Down cursor keys.
set -g mouse on

# Keep a very large native interactive scroll window. The complete transcript
# is also persisted outside tmux in /workspace/.sulandra-terminal-history, so
# output is not permanently discarded when this memory-safety window is exceeded.
set -g history-limit 1000000
