# Sulandra browser-terminal policy.
# Keep the outer xterm.js client on its primary buffer so browser scrollback
# remains available. Without this override tmux enters the alternate screen,
# where xterm's alternate-scroll mode can translate wheel events into cursor
# keys and leak ^[[A/^[[B into an interactive shell.
set -as terminal-overrides ',xterm-256color:smcup@:rmcup@'

# Browser wheel scrolling is owned by xterm.js unless an application inside
# the pane explicitly enables terminal mouse tracking.
set -g mouse off

# Preserve useful interactive history inside tmux as a second line of defense.
set -g history-limit 50000
