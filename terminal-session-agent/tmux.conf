# Sulandra browser-terminal policy.
# Keep the outer xterm.js client on its primary buffer so ordinary terminal
# output remains available through the browser's normal scrollback viewport.
set -as terminal-overrides ',xterm-256color:smcup@:rmcup@'

# xterm.js owns ordinary mouse-wheel and trackpad scrollback. Do not let tmux
# capture normal shell wheel events; this keeps scrolling local to the browser
# instead of translating it into PTY input or requiring tmux copy mode.
# Full-screen applications can still enable their own terminal mouse reporting.
set -g mouse off

# Retain a substantial server-side interactive backstop for this session.
# Keep this explicit so every newly-created tmux server inherits the expanded
# backend history ceiling even when dense long lines wrap across many rows.
set-option -g history-limit 100000
