<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Compliance Evidence | Sulandra Health</title><link rel="icon" href="/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#edf3f7;color:#173b52}.top{display:flex;align-items:center;gap:14px;padding:11px 18px;background:#fff;border-bottom:1px solid #d5e1e8;position:sticky;top:0;z-index:40}.top img{width:220px;max-width:42vw}.top .spacer{flex:1}.top a{color:#075985;text-decoration:none;font-weight:900}.layout{display:grid;grid-template-columns:330px 1fr;min-height:calc(100vh - 62px)}.rail{background:#f9fbfc;border-right:1px solid #d5e1e8;padding:14px;overflow:auto}.main{padding:17px;min-width:0}.rail h2,.main h1{margin:0;color:#0b4265}.filter{width:100%;border:1px solid #c8d6df;border-radius:8px;padding:9px;margin:9px 0}.item{border:1px solid #dbe5ea;background:#fff;border-radius:10px;padding:10px;margin:6px 0;cursor:pointer}.item.active{border-color:#0b6ea8;background:#eaf6fb}.item strong{display:block;color:#174a69;font-size:12px}.item small{display:block;color:#748793;margin-top:3px}.badge{display:inline-flex;padding:3px 6px;border-radius:999px;background:#edf3f7;font-size:8px;font-weight:950;color:#536c7d}.badge.ACTIVE{background:#e4f7ea;color:#29633d}.badge.EXPIRED,.badge.SUSPENDED{background:#fde9e7;color:#92372f}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:900;cursor:pointer}.btn.primary{background:#0b6ea8;color:#fff}.btn.danger{border-color:#b5524a;color:#94362f}.notice{padding:10px 12px;border-radius:9px;background:#eef8fc;border:1px solid #c8e1ed;color:#42667a;margin:10px 0;font-size:12px}.notice.good{background:#e9f8ee;border-color:#addbbd;color:#2b6540}.notice.warn{background:#fff7e7;border-color:#e8ce95;color:#73500f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border:1px solid #d4e1e8;border-radius:13px;overflow:hidden;box-shadow:0 6px 18px rgba(18,56,80,.05)}.head{padding:12px 14px;border-bottom:1px solid #e3eaee}.head h2{margin:0;color:#174a69;font-size:16px}.body{padding:12px}.evidence,.document{border:1px solid #dfe7ec;border-radius:9px;padding:9px;margin:6px 0}.evidence strong,.document strong{color:#2d566f;font-size:11px}.evidence small,.document small{display:block;color:#778995;margin-top:3px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.empty{padding:30px;text-align:center;color:#718491}.hero{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.hero p{margin:4px 0;color:#6b7f8c}.search-row{display:flex;gap:7px;margin-bottom:9px}.search-row input{flex:1;border:1px solid #c8d6df;border-radius:8px;padding:8px}dialog{width:min(650px,calc(100vw - 22px));border:0;border-radius:14px;padding:0;box-shadow:0 30px 90px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(8,28,42,.55)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid #e2e8ec}.modal-body{padding:15px}.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}.field label{font-size:11px;font-weight:900;color:#506b7d}.field select,.field textarea{border:1px solid #c8d6df;border-radius:8px;padding:9px}.field textarea{min-height:80px}@media(max-width:900px){.layout{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid #d5e1e8;max-height:330px}.grid{grid-template-columns:1fr}}@media(max-width:560px){.top a{display:none}.main{padding:11px}}</style></head><body><header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><a href="/company-compliance.html">Compliance</a><a href="/company-documents.html">Company Documents</a><a href="/admin.html#dashboard">Admin</a></header><div class="layout"><aside class="rail"><h2>Compliance Requirements</h2><input id="itemSearch" class="filter" placeholder="Search requirements"><select id="itemStatus" class="filter"><option value="">All statuses</option><option>PENDING_VERIFICATION</option><option>ACTIVE</option><option>RENEWAL_IN_PROGRESS</option><option>EXPIRED</option><option>SUSPENDED</option></select><div id="items"><div class="empty">Loading…</div></div></aside><main class="main"><div class="hero"><div><h1 id="title">Compliance Evidence</h1><p id="subtitle">Select a compliance requirement.</p></div><button id="refresh" class="btn">Refresh</button></div><div id="readiness"></div><div class="grid"><section class="card"><div class="head"><h2>Linked Evidence</h2></div><div id="evidence" class="body"><div class="empty">Choose a requirement.</div></div></section><section class="card"><div class="head"><h2>Official Company Documents</h2></div><div class="body"><div class="search-row"><input id="docSearch" placeholder="Search document title, file name, folder"><button id="docSearchBtn" class="btn">Search</button></div><div id="documents"><div class="empty">Choose a requirement to search documents.</div></div></div></section></div></main></div><dialog id="linkDialog"><div class="modal-head"><h2>Link Compliance Evidence</h2><button class="btn" data-close="linkDialog">Close</button></div><div class="modal-body"><div class="field"><label>Evidence Type</label><select id="evidenceType"><option>PRIMARY</option><option>SUPPORTING</option><option>RENEWAL</option><option>VERIFICATION</option><option>OTHER</option></select></div><div class="field"><label>Notes</label><textarea id="evidenceNotes" placeholder="What does this document prove for this requirement?"></textarea></div><button id="saveLink" class="btn primary">Link Document</button></div></dialog><script src="/assets/sulandra-entity-context.js?v=20260810-evidence-1"></script><script>(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEYS=['sulandra:employee:access-token','sulandra_token','token','accessToken'];const token=()=>KEYS.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(String(v)).toLocaleString():'—';const state={items:[],itemId:'',detail:null,documents:[],linkDocumentId:''};async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',headers:{Accept:'application/json',Authorization:`Bearer ${token()}`,...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||p.message||`Request failed (${r.status})`);return p.data??p}function itemTitle(i){return i.requirementName||i.title||'Compliance Requirement'}function renderItems(){const q=$('itemSearch').value.trim().toLowerCase(),status=$('itemStatus').value,rows=state.items.filter(i=>(!status||i.status===status)&&(!q||JSON.stringify(i).toLowerCase().includes(q)));$('items').innerHTML=rows.length?rows.map(i=>`<div class="item ${String(i.id)===state.itemId?'active':''}" data-item="${esc(i.id)}"><span class="badge ${esc(i.status)}">${esc(String(i.status).replaceAll('_',' '))}</span><strong>${esc(itemTitle(i))}</strong><small>${esc(i.category||'')} · ${esc(i.authority||'No authority listed')}</small></div>`).join(''):'<div class="empty">No requirements match.</div>'}function renderDetail(){if(!state.detail)return;const d=state.detail,i=d.item;$('title').textContent=itemTitle(i);$('subtitle').textContent=`${i.category||''} · ${i.authority||'No authority listed'}`;$('readiness').innerHTML=`<div class="notice ${d.verificationReady?'good':'warn'}"><strong>${d.verificationReady?'Evidence readiness satisfied':'Evidence required before activation'}</strong><br>${d.autoProjected?'This item is projected from a controlled operational credential record.':d.activeEvidenceCount?`${d.activeEvidenceCount} active evidence link(s) are attached.`:d.legacyLinkedDocumentId?'A legacy primary document is linked.':'Link official supporting evidence from Company Documents before verification/activation.'}</div>`;const rows=d.evidence||[];$('evidence').innerHTML=rows.length?rows.map(e=>`<div class="evidence"><span class="badge">${esc(e.evidenceType)}</span> ${e.removedAt?'<span class="badge">REMOVED</span>':''}<strong>${esc(e.documentTitleSnapshot||e.documentId)}</strong><small>Document ${esc(e.documentId)} · Added ${esc(fmt(e.addedAt))} by ${esc(e.addedByUserId)}</small>${e.notes?`<small>${esc(e.notes)}</small>`:''}${e.removedAt?`<small>Removed ${esc(fmt(e.removedAt))}: ${esc(e.removalReason||'')}</small>`:`<div class="actions"><button class="btn danger" data-remove="${esc(e.id)}">Remove Evidence</button></div>`}</div>`).join(''):'<div class="empty">No evidence is linked yet.</div>';document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeEvidence(b.dataset.remove))}function docTitle(d){return d.title||d.name||d.originalFileName||d.fileName||d.id}function renderDocs(){$('documents').innerHTML=state.documents.length?state.documents.map(d=>`<div class="document"><strong>${esc(docTitle(d))}</strong><small>${esc(d.folderName||d.folderPath||d.documentType||'Company Document')} · ${esc(d.originalFileName||d.fileName||'')}</small><div class="actions"><button class="btn primary" data-link="${esc(d.id)}">Link as Evidence</button></div></div>`).join(''):'<div class="empty">No matching company documents.</div>';document.querySelectorAll('[data-link]').forEach(b=>b.onclick=()=>{state.linkDocumentId=b.dataset.link;$('evidenceType').value='PRIMARY';$('evidenceNotes').value='';$('linkDialog').showModal()})}async function loadItems(){let data=await api('/api/company-compliance/items');state.items=Array.isArray(data)?data:(data.items||[]);renderItems();const requested=new URL(location.href).searchParams.get('itemId');if(!state.itemId&&(requested||state.items[0]?.id))await openItem(requested||state.items[0].id)}async function openItem(id){state.itemId=String(id);renderItems();state.detail=await api(`/api/company-compliance/items/${encodeURIComponent(id)}/evidence`);renderDetail();await searchDocs()}async function searchDocs(){if(!state.itemId)return;state.documents=await api(`/api/company-compliance/evidence-documents?q=${encodeURIComponent($('docSearch').value)}`);renderDocs()}async function removeEvidence(id){const reason=prompt('Reason for removing this evidence link:');if(!reason)return;try{await api(`/api/company-compliance/items/${encodeURIComponent(state.itemId)}/evidence/${encodeURIComponent(id)}/remove`,{method:'POST',body:JSON.stringify({reason})});await openItem(state.itemId)}catch(e){alert(e.message)}}document.addEventListener('click',e=>{const item=e.target.closest('[data-item]');if(item)openItem(item.dataset.item);const close=e.target.closest('[data-close]');if(close)$(close.dataset.close)?.close()});$('itemSearch').oninput=renderItems;$('itemStatus').onchange=renderItems;$('docSearchBtn').onclick=searchDocs;$('docSearch').onkeydown=e=>{if(e.key==='Enter')searchDocs()};$('refresh').onclick=()=>openItem(state.itemId);$('saveLink').onclick=async()=>{try{await api(`/api/company-compliance/items/${encodeURIComponent(state.itemId)}/evidence`,{method:'POST',body:JSON.stringify({documentId:state.linkDocumentId,evidenceType:$('evidenceType').value,notes:$('evidenceNotes').value||null})});$('linkDialog').close();await openItem(state.itemId)}catch(e){alert(e.message)}};window.addEventListener('sulandra:entity-context-changed',()=>location.reload());(async()=>{if(!token()){location.href='/employee-login.html?returnTo=/compliance-evidence.html';return}await window.SulandraEntityContext?.ready;try{await loadItems()}catch(e){$('items').innerHTML=`<div class="empty">${esc(e.message)}</div>`}})()})();</script></body></html>
