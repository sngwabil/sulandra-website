<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate"><title>Home Health Referral | Sulandra Health</title><link rel="icon" href="/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;background:#eef4f7;color:#183b52;font-family:"Segoe UI",Arial,sans-serif}button,input,select,textarea{font:inherit}.top{display:flex;align-items:center;gap:14px;padding:13px 19px;background:#fff;border-bottom:1px solid #d5e1e8}.top img{width:225px;max-width:50vw}.top .spacer{flex:1}.secure{font-size:12px;font-weight:900;color:#2d6b48}.banner{display:none;text-align:center;padding:9px 14px;font-weight:950}.banner.training{display:block;background:#7b2d25;color:#fff}.banner.operational{display:block;background:#eaf7ef;border-bottom:1px solid #add9bd;color:#27643e}.wrap{width:min(1080px,calc(100% - 24px));margin:16px auto 48px}.hero,.card{background:#fff;border:1px solid #d4e1e8;border-radius:15px;box-shadow:0 9px 27px rgba(17,55,79,.07)}.hero{padding:18px 20px;margin-bottom:12px}.eyebrow{font-size:11px;font-weight:950;text-transform:uppercase;letter-spacing:.09em;color:#0b73a8}.hero h1{margin:5px 0;color:#0b4265}.hero p{color:#657a88;line-height:1.5}.pill{display:inline-flex;padding:5px 8px;border:1px solid #c9dce7;background:#f3f9fc;border-radius:999px;font-size:11px;font-weight:900;margin:3px}.card{margin-bottom:11px;overflow:hidden}.head{padding:14px 17px;border-bottom:1px solid #e2e9ed}.head h2{margin:0;color:#174b69;font-size:19px}.head p{margin:4px 0 0;color:#6a7d89;font-size:12px}.body{padding:17px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.field{display:flex;flex-direction:column;gap:5px}.field.wide{grid-column:1/-1}.field label{font-size:12px;font-weight:900;color:#496678}.field input,.field select,.field textarea{width:100%;border:1px solid #c7d6df;border-radius:9px;padding:9px 10px}.field textarea{min-height:91px;resize:vertical;line-height:1.45}.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.check{display:flex;gap:8px;align-items:flex-start;border:1px solid #dbe5eb;border-radius:9px;padding:9px;background:#fafcfd}.order-line{border:1px solid #dce6eb;border-radius:10px;padding:11px;margin:8px 0;background:#fbfcfd}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;align-items:center}.actions .spacer{flex:1}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:8px;padding:8px 11px;font-weight:900;cursor:pointer}.btn.primary{background:#0b6ea8;color:#fff}.btn:disabled{opacity:.5;cursor:not-allowed}.notice{padding:10px 12px;border:1px solid #c9e1ed;background:#eef8fc;color:#42667a;border-radius:9px;margin-bottom:11px;font-size:12px;line-height:1.45}.notice.warn{background:#fff7e4;border-color:#ead095;color:#745212}.error{display:none;padding:10px 12px;border:1px solid #efb5b0;background:#fff0ef;color:#8c302a;border-radius:9px;margin-bottom:11px}.error.show{display:block}.sticky{position:sticky;bottom:0;background:rgba(255,255,255,.97);border:1px solid #d1dfe7;border-radius:11px;padding:10px 12px;box-shadow:0 -5px 20px rgba(20,58,82,.1);z-index:10}.success{text-align:center;padding:32px}.mark{width:62px;height:62px;border-radius:999px;background:#e4f7eb;color:#2a7045;display:grid;place-items:center;margin:0 auto 12px;font-size:30px;font-weight:950}.tracking{display:inline-block;padding:9px 12px;border:1px solid #bdd8c7;background:#f0faf3;border-radius:9px;font-weight:950;color:#27623e}.footer{text-align:center;color:#7b8c97;font-size:11px;line-height:1.5;margin-top:14px}@media(max-width:700px){.grid,.checks{grid-template-columns:1fr}.field.wide{grid-column:auto}.wrap{width:calc(100% - 14px);margin-top:8px}.secure{display:none}}</style></head><body><header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><span class="secure">🔒 Secure Referral Source Session</span></header><div class="banner" id="banner"></div><main class="wrap" id="app"><section class="hero"><p>Validating your secure referral invitation…</p></section></main><script>(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEY='sulandra:home-health:referral-token';const token=()=>sessionStorage.getItem(KEY)||'';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let session=null,result=null;async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',referrerPolicy:'no-referrer',headers:{Accept:'application/json',Authorization:`Bearer ${token()}`,...(options.body?{'Content-Type':'application/json'}:{})}});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||p.message||`Request failed (${r.status})`);return p.data??p;}const f=(id,label,type='text',required=false)=>`<div class="field"><label>${esc(label)}${required?' *':''}</label><input id="${id}" data-field type="${type}" ${required?'required':''}></div>`;const area=(id,label,required=false)=>`<div class="field wide"><label>${esc(label)}${required?' *':''}</label><textarea id="${id}" data-field ${required?'required':''}></textarea></div>`;function hero(){return `<section class="hero"><div class="eyebrow">${esc(session.companyName)}</div><h1>Secure Home Health Referral</h1><p>Referral source: <strong>${esc(session.sourceName)}</strong>. Complete the referral and attach supporting orders/records for review. This portal does not confirm service acceptance and must not be used for emergencies.</p><span class="pill">${esc(session.sourceType.replaceAll('_',' '))}</span><span class="pill">Expires ${esc(new Date(session.expiresAt).toLocaleDateString())}</span><span class="pill">${esc(session.submissionsRemaining)} submission(s) remaining</span></section>`;}function section(title,description,body){return `<section class="card"><div class="head"><h2>${esc(title)}</h2><p>${esc(description)}</p></div><div class="body"><div class="grid">${body}</div></div></section>`;}function render(){const training=session.purpose==='TRAINING_ONLY';$('app').innerHTML=hero()+`<div class="error" id="error"></div>${training?'<div class="notice warn"><strong>TRAINING ONLY:</strong> enter simulated patients only. Payer/member/Medicare/Medicaid/authorization identifiers are blocked.</div>':''}`+section('1. Patient & Home','Identity, residence, caregiver, language and payer information.',`${f('patientFirstName','First name','text',true)}${f('patientLastName','Last name','text',true)}${f('patientMiddleName','Middle name')}${f('patientDateOfBirth','Date of birth','date')}${f('patientSexAtBirth','Sex at birth')}${f('patientPhone','Patient phone','tel')}${f('patientEmail','Patient email','email')}${f('primaryLanguage','Primary language')}<label class="check field wide"><input id="interpreterNeeded" data-field type="checkbox"><span>Interpreter needed</span></label>${f('streetAddress','Home street address','text',true)}${f('city','City','text',true)}${f('state','State','text',true)}${f('postalCode','ZIP','text',true)}${f('caregiverName','Caregiver / support person')}${f('caregiverRelationship','Relationship')}${f('caregiverPhone','Caregiver phone','tel')}${training?'':`${f('payerName','Payer / plan')}${f('memberId','Member ID')}${f('medicareId','Medicare ID')}${f('medicaidId','Medicaid ID')}${f('authorizationNumber','Authorization number')}`}`)+section('2. Referral & Ordering Provider','Referring provider, facility, discharge/start-of-care readiness and order context.',`${f('externalReferralId','Facility referral / order number')}${selectPriority()}${f('referringProviderName','Referring / ordering provider','text',true)}${f('referringProviderNpi','Provider NPI')}${f('referringProviderPhone','Provider phone','tel')}${f('referringProviderFax','Provider fax')}${f('referringProviderEmail','Provider email','email')}${f('referringDepartment','Department / unit')}${f('hospitalFacility','Hospital / facility')}${f('hospitalUnit','Hospital unit')}${f('dischargeDate','Discharge date','date')}${f('requestedStartOfCareDate','Requested start of care','date')}${f('faceToFaceDate','Face-to-face date','date')}${f('faceToFaceStatus','Face-to-face status')}${f('homeboundStatus','Homebound status')}${area('homeboundRationale','Homebound rationale')}`)+section('3. Requested Disciplines & Orders','Select requested disciplines and enter each structured ordered service.',`${disciplineChecks()}${area('skilledNeed','Skilled need / reason for Home Health',true)}${area('orderSummary','Provider order summary',true)}<div class="field wide"><label>Structured discipline orders</label><div id="orderLines"></div><button class="btn" id="addOrderLine" type="button">+ Add Ordered Service</button></div>${area('specialInstructions','Special order instructions')}`)+section('4. Clinical Handoff','Information needed to safely review the referral and prepare intake/start-of-care.',`${f('primaryDiagnosis','Primary diagnosis')}${area('diagnoses','Other diagnoses')}${area('allergies','Allergies')}${area('medicationsSummary','Medication summary / reconciliation information')}${area('recentHospitalization','Recent hospitalization / course')}${area('woundCareNeeds','Wound / skin care needs')}${area('infusionNeeds','Infusion / IV needs')}${area('respiratoryNeeds','Respiratory / oxygen needs')}${area('dmeEquipment','DME / equipment')}${area('fallRisk','Falls / mobility risk')}${area('cognitiveBehavioralNeeds','Cognitive / behavioral needs')}${area('infectionPrecautions','Isolation / infection precautions')}${area('homeSafetyConcerns','Home safety concerns')}${area('socialDeterminants','Social / access barriers')}`)+section('5. Referral Source Attestation','Identify the person submitting this referral and confirm the information provided.',`${f('submitterName','Person submitting referral','text',true)}${f('submitterTitle','Title / role')}${f('submitterPhone','Submitter phone','tel',true)}${f('submitterEmail','Submitter email','email')}${area('submitterAttestation','Referral-source attestation',true)}${training?'<label class="check field wide"><input id="trainingAcknowledgment" data-field type="checkbox"><span><strong>Training data acknowledgment *</strong><br>I confirm this referral uses simulated people and contains no real patient or payer information.</span></label>':''}`)+`<div class="sticky actions"><span class="spacer"></span><button class="btn primary" id="submit">Securely Submit Referral</button></div><div class="footer">Use only information necessary to evaluate and coordinate Home Health services. For an emergency, use the appropriate emergency response system rather than this referral portal.</div>`;$('addOrderLine').onclick=()=>addOrderLine();$('submit').onclick=submit;}function selectPriority(){return `<div class="field"><label>Priority</label><select id="priority" data-field><option value="ROUTINE">Routine</option><option value="HIGH">High</option><option value="URGENT">Urgent</option></select></div>`;}function disciplineChecks(){return `<div class="field wide"><label>Requested disciplines *</label><div class="checks">${[['SN','Skilled Nursing'],['PT','Physical Therapy'],['OT','Occupational Therapy'],['ST','Speech Therapy'],['HHA','Home Health Aide'],['MSW','Medical Social Work'],['RT','Respiratory Therapy / Contracted'],['DIETITIAN','Dietitian'],['OTHER','Other']].map(([v,t])=>`<label class="check"><input data-discipline type="checkbox" value="${v}"><span>${t}</span></label>`).join('')}</div></div>`;}function addOrderLine(seed={}){const host=$('orderLines'),row=document.createElement('div');row.className='order-line';row.innerHTML=`<div class="grid"><div class="field"><label>Discipline</label><select data-line="discipline">${['SN','PT','OT','ST','HHA','MSW','RT','DIETITIAN','OTHER'].map(x=>`<option ${seed.discipline===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Service / order *</label><input data-line="service" value="${esc(seed.service||'')}"></div><div class="field"><label>Frequency</label><input data-line="frequency" value="${esc(seed.frequency||'')}"></div><div class="field"><label>Duration</label><input data-line="duration" value="${esc(seed.duration||'')}"></div><div class="field"><label>Start date</label><input data-line="startDate" type="date" value="${esc(seed.startDate||'')}"></div><div class="field wide"><label>Instructions</label><textarea data-line="instructions">${esc(seed.instructions||'')}</textarea></div></div><div class="actions"><button class="btn" data-remove type="button">Remove</button></div>`;host.appendChild(row);row.querySelector('[data-remove]').onclick=()=>row.remove();}function collect(){const d={};document.querySelectorAll('[data-field]').forEach(el=>d[el.id]=el.type==='checkbox'?el.checked:el.value||null);d.requestedDisciplines=[...document.querySelectorAll('[data-discipline]:checked')].map(x=>x.value);d.orderLines=[...document.querySelectorAll('.order-line')].map(row=>{const out={};row.querySelectorAll('[data-line]').forEach(el=>out[el.dataset.line]=el.value||null);return out;}).filter(x=>x.service);return d;}function validate(d){const missing=[];document.querySelectorAll('[required]').forEach(el=>{if(!String(el.value||'').trim())missing.push(el.previousElementSibling?.textContent?.replace('*','').trim()||el.id);});if(!d.requestedDisciplines.length)missing.push('Requested disciplines');if(session.purpose==='TRAINING_ONLY'&&!d.trainingAcknowledgment)missing.push('Training data acknowledgment');if(missing.length){const e=$('error');e.textContent=`Complete required items: ${missing.join(', ')}`;e.classList.add('show');e.scrollIntoView({behavior:'smooth',block:'center'});return false;}return true;}async function submit(){const d=collect();if(!validate(d))return;const b=$('submit');b.disabled=true;b.textContent='Submitting…';try{result=await api('/public/home-health/referrals',{method:'POST',body:JSON.stringify(d)});renderSuccess();}catch(e){const er=$('error');er.textContent=e.message;er.classList.add('show');er.scrollIntoView({behavior:'smooth'});b.disabled=false;b.textContent='Securely Submit Referral';}}function fileBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result||'').split(',').pop()||'');r.onerror=()=>reject(new Error('Unable to read file'));r.readAsDataURL(file);});}function renderSuccess(){$('app').innerHTML=hero()+`<section class="card"><div class="success"><div class="mark">✓</div><h2>${result.mode==='TRAINING_ONLY'?'Training Referral Received':'Referral Securely Received'}</h2><p>${esc(result.message||'Referral received for review.')}</p><div class="tracking">Tracking: ${esc(result.referralNumber)}</div><p>Attach signed referral/orders, face-to-face documentation, discharge summary, medication list, payer authorization or other supporting records.</p><div id="uploads"></div><button class="btn" id="addDoc">+ Add Document</button><div class="actions"><span class="spacer"></span><button class="btn primary" id="finish">Finish Secure Session</button></div></div></section>`;$('addDoc').onclick=addUpload;$('finish').onclick=()=>{sessionStorage.removeItem(KEY);$('app').innerHTML='<section class="hero"><div class="success"><div class="mark">✓</div><h2>Session Complete</h2><p>You may close this browser tab.</p></div></section>';};}function addUpload(){const row=document.createElement('div');row.className='order-line';row.innerHTML=`<div class="grid"><div class="field"><label>Document type</label><select data-u="type"><option>REFERRAL_ORDER</option><option>FACE_TO_FACE</option><option>DISCHARGE_SUMMARY</option><option>MEDICATION_LIST</option><option>INSURANCE_AUTHORIZATION</option><option>WOUND_RECORD</option><option>OTHER</option></select></div><div class="field"><label>File</label><input data-u="file" type="file"></div><div class="field wide"><label>Title</label><input data-u="title"></div></div><div class="actions"><button class="btn primary" data-upload>Upload</button></div><div class="error"></div>`;$('uploads').appendChild(row);row.querySelector('[data-upload]').onclick=async()=>{const file=row.querySelector('[data-u="file"]').files?.[0],button=row.querySelector('[data-upload]'),er=row.querySelector('.error');if(!file)return;if(file.size>25*1024*1024){er.textContent='Files may not exceed 25 MB.';er.classList.add('show');return;}button.disabled=true;button.textContent='Uploading…';try{await api(`/public/home-health/referrals/${encodeURIComponent(result.id)}/attachments`,{method:'POST',body:JSON.stringify({documentType:row.querySelector('[data-u="type"]').value,title:row.querySelector('[data-u="title"]').value||file.name,originalFileName:file.name,mimeType:file.type||'application/octet-stream',contentBase64:await fileBase64(file)})});row.innerHTML=`<div class="notice"><strong>✓ Uploaded:</strong> ${esc(file.name)}</div>`;}catch(e){er.textContent=e.message;er.classList.add('show');button.disabled=false;button.textContent='Upload';}};}async function init(){if(!token()){document.getElementById('app').innerHTML='<section class="hero"><div class="error show">A secure referral invitation is required.</div></section>';return;}try{session=await api('/public/home-health/referrals/session');const b=$('banner');b.className=`banner ${session.purpose==='TRAINING_ONLY'?'training':'operational'}`;b.textContent=session.purpose==='TRAINING_ONLY'?'TRAINING ONLY — USE SIMULATED PATIENTS — DO NOT ENTER REAL PATIENT OR PAYER INFORMATION':'SECURE OPERATIONAL HOME HEALTH REFERRAL';render();}catch(e){sessionStorage.removeItem(KEY);document.getElementById('app').innerHTML=`<section class="hero"><div class="error show">${esc(e.message)}</div></section>`;}}init();})();</script></body></html>
