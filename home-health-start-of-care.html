<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Home Health Start of Care | Sulandra Health</title><link rel="icon" href="/favicon.ico"><style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#edf3f7;color:#173b52}.top{display:flex;align-items:center;gap:14px;padding:11px 18px;background:#fff;border-bottom:1px solid #d5e1e8;position:sticky;top:0;z-index:40}.top img{width:220px;max-width:42vw}.top .spacer{flex:1}.top a{color:#075985;text-decoration:none;font-weight:900}.shell{width:min(1180px,calc(100% - 22px));margin:16px auto 50px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:12px}.hero h1{margin:0;color:#0b4265;font-size:29px}.hero p{margin:5px 0;color:#667b88}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:8px;padding:8px 10px;font-size:11px;font-weight:900;cursor:pointer;text-decoration:none}.btn.primary{background:#0b6ea8;color:#fff}.btn.success{border-color:#45845a;background:#eff9f2;color:#306a43}.btn:disabled{opacity:.5;cursor:not-allowed}.notice{padding:10px 12px;border-radius:9px;background:#eef8fc;border:1px solid #c8e1ed;color:#42667a;margin-bottom:10px;font-size:12px;line-height:1.45}.notice.warn{background:#fff7e4;border-color:#ead095;color:#74510e}.notice.danger{background:#fff0ef;border-color:#efb4af;color:#8b302a}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{background:#fff;border:1px solid #d5e1e8;border-radius:10px;padding:10px}.stat span{display:block;font-size:9px;text-transform:uppercase;font-weight:900;color:#7e8e98}.stat strong{font-size:21px;color:#23526c}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid #d4e1e8;border-radius:13px;box-shadow:0 7px 20px rgba(18,56,80,.05);overflow:hidden}.item-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid #e4eaee}.item-head h2{margin:0;color:#174a69;font-size:16px}.item-head p{margin:4px 0 0;color:#718491;font-size:11px}.item-body{padding:13px}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.fact{border:1px solid #e0e8ed;background:#f9fbfc;border-radius:8px;padding:7px}.fact span{display:block;font-size:8px;text-transform:uppercase;font-weight:900;color:#84919a}.fact strong{font-size:11px;color:#2c536b}.status{display:inline-flex;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:950;background:#edf3f7;color:#536c7d}.status.ready{background:#e4f7ea;color:#29633d}.status.blocked{background:#fde9e7;color:#92372f}.blockers{margin-top:9px;padding:9px 10px;border-radius:8px;background:#fff7e4;border:1px solid #ead095;color:#74510e;font-size:11px}.blockers ul{margin:5px 0 0;padding-left:18px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.empty{padding:34px;text-align:center;color:#718491}@media(max-width:760px){.summary,.facts{grid-template-columns:1fr 1fr}}@media(max-width:480px){.summary,.facts{grid-template-columns:1fr}.top a{display:none}.hero{flex-direction:column}}</style></head><body><header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><a href="/home-health-referrals.html">Referrals</a><a href="/home-health.html">Operations</a><a href="/company-compliance.html">Compliance</a><a href="/spire-admin.html">SPIRE Admin</a></header><main class="shell"><div class="hero"><div><h1>Home Health Start of Care</h1><p>Referral → approved Client Intake → Home Health episode, with duplicate, lifecycle and compliance gates.</p></div><button id="refresh" class="btn primary">Refresh</button></div><div id="company" class="notice">Loading Home Health readiness…</div><div id="compliance"></div><div id="summary" class="summary"></div><div id="list" class="list"><div class="empty">Loading accepted referrals…</div></div></main><script src="/assets/sulandra-entity-context.js?v=20260810-hh-soc-1"></script><script>(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEYS=['sulandra:employee:access-token','sulandra_token','token','accessToken'];const token=()=>KEYS.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=v=>v?new Date(String(v)).toLocaleDateString():'—';let data=null;async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',headers:{Accept:'application/json',Authorization:`Bearer ${token()}`,...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(p.error||p.message||`Request failed (${r.status})`);e.details=p.details||p.data||p;throw e}return p.data??p}function referralName(r){return [r.patientPreferredName||r.patientFirstName,r.patientLastName].filter(Boolean).join(' ')||[r.firstName,r.lastName].filter(Boolean).join(' ')||r.patientName||'Home Health Patient'}function render(){const items=data?.items||[],ready=items.filter(x=>x.ready).length,approved=items.filter(x=>String(x.intake?.status)==='APPROVED').length,existing=items.filter(x=>x.existingEpisode).length,blocked=items.length-ready;$('summary').innerHTML=`<div class="stat"><span>Accepted / Linked</span><strong>${items.length}</strong></div><div class="stat"><span>Approved Intake</span><strong>${approved}</strong></div><div class="stat"><span>Ready for Episode</span><strong>${ready}</strong></div><div class="stat"><span>Blocked / Existing</span><strong>${blocked}</strong></div>`;$('company').className=`notice ${data.company?.operational?'':'warn'}`;$('company').innerHTML=`<strong>${esc(data.company?.displayName||'Home Health')}</strong> · ${data.company?.operational?'Operational lifecycle active':'Pre-launch / lifecycle not fully active'} · Start of Care creates an episode only after an APPROVED Client Intake.`;const blockers=data.complianceBlockers||[];$('compliance').innerHTML=blockers.length?`<div class="notice danger"><strong>Company compliance is blocking Start of Care.</strong><ul>${blockers.map(b=>`<li>${esc(b.requirementName)} — ${esc(b.status)}${b.expirationDate?` · ${esc(date(b.expirationDate))}`:''}</li>`).join('')}</ul><div class="actions"><a class="btn" href="/company-compliance.html">Resolve Compliance</a></div></div>`:'';$('list').innerHTML=items.length?items.map(x=>{const r=x.referral||{},i=x.intake||{},existing=x.existingEpisode;return `<article class="item"><div class="item-head"><div><span class="status ${x.ready?'ready':'blocked'}">${x.ready?'READY':'BLOCKED'}</span><h2>${esc(referralName(r))}</h2><p>${esc(r.referralNumber||r.id||'Referral')} · Intake ${esc(i.id||r.intakeCaseId||'—')}</p></div><span class="status">${esc(String(i.status||'NO INTAKE').replaceAll('_',' '))}</span></div><div class="item-body"><div class="facts"><div class="fact"><span>Requested SOC</span><strong>${esc(date(r.requestedStartOfCareDate||r.requestedSocDate))}</strong></div><div class="fact"><span>Referral Status</span><strong>${esc(r.status||'—')}</strong></div><div class="fact"><span>Patient ID</span><strong>${esc(r.patientId||i.patientId||'—')}</strong></div><div class="fact"><span>Episode</span><strong>${esc(existing?.episodeNumber||existing?.id||'Not created')}</strong></div></div>${x.blockers?.length?`<div class="blockers"><strong>Cannot create episode yet:</strong><ul>${x.blockers.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>`:''}<div class="actions"><a class="btn" href="/home-health-referrals.html">Referral Inbox</a>${r.intakeCaseId?`<a class="btn" href="/client-intake.html?caseId=${encodeURIComponent(r.intakeCaseId)}">Client Intake</a>`:''}${r.patientId?`<a class="btn" href="/spire.html?patientId=${encodeURIComponent(r.patientId)}">SPIRE Chart</a>`:''}${existing?`<a class="btn success" href="/home-health.html">Open Episode</a>`:`<button class="btn success" data-start="${esc(r.id)}" ${x.ready?'':'disabled'}>Create Home Health Episode</button>`}</div></div></article>`}).join(''):'<div class="empty">No accepted/referral-linked Home Health cases are waiting for Start of Care.</div>';document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>startEpisode(b.dataset.start));}async function load(){try{data=await api('/api/home-health/start-of-care-ready');render()}catch(e){$('list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}async function startEpisode(id){if(!confirm('Create the Home Health episode from the approved referral and Client Intake?'))return;try{const result=await api(`/api/home-health/referrals/${encodeURIComponent(id)}/start-episode`,{method:'POST',body:'{}'});alert(`Home Health episode created${result.episode?.episodeNumber?`: ${result.episode.episodeNumber}`:''}.`);await load()}catch(e){const details=e.details?.missingRequiredColumns?.length?`\n\nRequired episode fields still needed: ${e.details.missingRequiredColumns.join(', ')}`:'';alert(e.message+details)}}$('refresh').onclick=load;window.addEventListener('sulandra:entity-context-changed',()=>location.reload());(async()=>{if(!token()){location.href='/employee-login.html?returnTo=/home-health-start-of-care.html';return}await window.SulandraEntityContext?.ready;await load()})()})();</script></body></html>
