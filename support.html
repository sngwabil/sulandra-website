<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sulandra Employee Support & Security</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#eef4f8;color:#0f172a}header{background:#0c4a6e;color:#fff;padding:22px 28px}header h1{margin:0;font-size:28px}header p{margin:6px 0 0;opacity:.9}.wrap{max-width:1180px;margin:28px auto;padding:0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{background:#fff;border:1px solid #dbe4ea;border-radius:16px;padding:20px;box-shadow:0 10px 28px rgba(15,23,42,.07)}h2{margin-top:0}label{display:block;font-weight:700;margin:12px 0 5px}input,select,textarea{width:100%;box-sizing:border-box;border:1px solid #cbd5e1;border-radius:9px;padding:10px}textarea{min-height:110px}button,.btn{display:inline-block;border:0;border-radius:9px;padding:10px 14px;font-weight:800;background:#075985;color:white;cursor:pointer;margin-top:10px}.danger{background:#b91c1c}.muted{color:#64748b;font-size:13px}.item{border-top:1px solid #e2e8f0;padding:12px 0}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#e0f2fe;color:#075985;font-size:12px;font-weight:800}.wide{grid-column:1/-1}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header><h1>Employee Support & Account Security</h1><p>Manage account security, review sessions, set up multifactor authentication, and request employee support.</p></header><main class="wrap"><div class="grid"><section class="card"><h2>Account Security</h2><div id="securitySummary" class="muted">Loading security status…</div><button id="setupMfa">Set up MFA</button><button id="revokeSessions" class="danger">Sign out other sessions</button><div id="mfaSetup" style="display:none;margin-top:14px"></div></section><section class="card"><h2>Request Support</h2><form id="supportForm"><label>Category</label><select name="category"><option>ACCOUNT</option><option>PASSWORD</option><option>MFA</option><option>PORTAL</option><option>DEVICE</option><option>NETWORK</option><option>SCHEDULING</option><option>PAYROLL</option><option>BENEFITS</option><option>DOCUMENTS</option><option>TRAINING</option><option>OTHER</option></select><label>Priority</label><select name="priority"><option>LOW</option><option selected>NORMAL</option><option>HIGH</option><option>URGENT</option></select><label>Subject</label><input name="subject" required maxlength="240"><label>Description</label><textarea name="description" required></textarea><button type="submit">Submit Support Request</button></form><div id="formStatus" class="muted"></div></section><section class="card wide"><h2>Active Sessions & Login History</h2><div id="sessions"></div><h3>Recent Login Activity</h3><div id="logins"></div></section><section class="card wide"><h2>My Support Requests</h2><div id="requests"></div></section></div></main><script src="/assets/support-app.js?v=20260807-1"></script></body></html>
