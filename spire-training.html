<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>SPIRE Training Sandbox | Sulandra Health</title><link rel="icon" href="/favicon.ico">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Segoe UI,Arial,sans-serif;background:#eef3f7;color:#18394f}button,input,select,textarea{font:inherit}.top{display:flex;align-items:center;gap:14px;padding:12px 18px;background:#fff;border-bottom:1px solid #d2e0e9;position:sticky;top:0;z-index:30}.top img{width:210px;max-width:40vw}.spacer{flex:1}.top a{color:#075985;text-decoration:none;font-weight:900}.training-banner{padding:10px 16px;text-align:center;background:#7a2a22;color:#fff;font-weight:950;letter-spacing:.04em}.shell{display:grid;grid-template-columns:310px 1fr;min-height:calc(100vh - 104px)}.rail{background:#f9fbfc;border-right:1px solid #d4e1e9;padding:17px;overflow:auto}.rail h2{margin:0 0 12px;color:#0b4265}.case{width:100%;border:1px solid #d3e0e8;background:#fff;border-radius:12px;padding:12px;margin:7px 0;text-align:left;cursor:pointer;color:#284d64}.case:hover{border-color:#8ec7e3}.case.active{border-color:#0b75ad;background:#e7f5fc}.case strong{display:block;color:#0b4265}.case small{display:block;color:#728590;margin-top:4px}.admin-box{margin-top:16px;padding:13px;border:1px solid #dbc68e;background:#fffaf0;border-radius:12px}.admin-box h3{margin:0 0 9px;color:#755313;font-size:14px}.admin-box select,.admin-box button{width:100%;margin-top:7px}.main{padding:20px;min-width:0}.headline{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.headline h1{margin:0;color:#0b4265;font-size:30px}.headline p{margin:5px 0;color:#667a88;line-height:1.5}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#fff1d4;color:#7d5712;border:1px solid #e8cf94;font-size:11px;font-weight:900}.grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px;margin-top:16px}.card{background:#fff;border:1px solid #d4e1e9;border-radius:14px;box-shadow:0 9px 28px rgba(18,56,81,.07);overflow:hidden}.card-head{padding:14px 16px;border-bottom:1px solid #e1e9ee;display:flex;justify-content:space-between;align-items:center;gap:10px}.card-head h2{margin:0;font-size:18px;color:#174a69}.card-body{padding:16px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fact{padding:11px;background:#f7fafc;border:1px solid #e0e8ed;border-radius:10px}.fact span{display:block;font-size:11px;text-transform:uppercase;font-weight:900;color:#718591}.fact strong{display:block;margin-top:4px;color:#254e67}.section{margin-top:15px}.section h3{margin:0 0 8px;font-size:14px;color:#416176}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:5px 8px;border-radius:999px;background:#edf6fa;border:1px solid #d5e7ef;font-size:12px}.med{padding:9px 10px;border-bottom:1px solid #edf1f4}.med:last-child{border-bottom:0}.entry-form{display:grid;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:12px;font-weight:900;color:#4d697a}.field input,.field select,.field textarea{border:1px solid #c8d7e0;border-radius:9px;padding:9px 10px}.field textarea{min-height:92px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:9px;padding:9px 12px;font-weight:900;cursor:pointer}.btn.primary{background:#0b6ea8;color:#fff}.btn.warn{border-color:#9b5c1f;color:#8c5015}.btn:disabled{opacity:.55}.timeline{display:grid;gap:9px}.entry{border:1px solid #dde7ec;border-radius:10px;padding:11px}.entry-head{display:flex;justify-content:space-between;gap:10px}.entry strong{color:#0b4265}.entry small{color:#718491}.payload{margin-top:7px;font-size:13px;color:#4e6675;white-space:pre-wrap;word-break:break-word}.empty{padding:42px 18px;text-align:center;color:#718491}.critical{background:#fff0ef;border:1px solid #edb5b0;color:#8b302b;padding:10px 12px;border-radius:9px;margin-bottom:12px;font-weight:800}.loading{opacity:.55;pointer-events:none}
    @media(max-width:950px){.shell{grid-template-columns:1fr}.rail{border-right:0;border-bottom:1px solid #d4e1e9;max-height:320px}.grid{grid-template-columns:1fr}.top a{display:none}}@media(max-width:600px){.main{padding:12px}.facts,.row{grid-template-columns:1fr}.headline{flex-direction:column}}
  </style>
</head>
<body>
<header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><a href="/spire.html">Live SPIRE</a><a href="/employee-portal.html">Employee Portal</a></header>
<div class="training-banner">TRAINING SANDBOX — ALL PEOPLE, MEDICATIONS, TRIPS AND DOCUMENTATION ON THIS PAGE ARE SIMULATED — NEVER BILL</div>
<div class="shell">
  <aside class="rail"><h2>Practice Cases</h2><div id="cases"><div class="empty">Loading training cases…</div></div><div class="admin-box" id="adminBox" hidden><h3>Training Administrator</h3><select id="employeeSelect"><option value="">Select employee…</option></select><button class="btn" id="assignCase" disabled>Assign selected case</button><button class="btn warn" id="resetCase" disabled>Reset all practice entries</button></div></aside>
  <main class="main" id="main"><div class="empty">Choose a practice case to open the training chart.</div></main>
</div>
<script src="/assets/sulandra-entity-context.js?v=20260809-company-scope-1"></script>
<script>
(() => {
  'use strict';
  const API='https://sulandra-website-production-5fc4.up.railway.app';const KEYS=['sulandra:employee:access-token','sulandra_token','token','accessToken'];const token=()=>KEYS.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';const state={cases:[],caseId:'',detail:null,admin:false,employees:[]};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const arr=v=>Array.isArray(v)?v:[];const fmt=v=>v?new Date(String(v)).toLocaleString():'—';
  async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',headers:{Accept:'application/json',...(token()?{Authorization:`Bearer ${token()}`} : {}),...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(p.error||p.message||`Request failed (${r.status})`);e.status=r.status;throw e;}return p.data??p;}
  const seed=()=>state.detail?.case?.seedData||{};const current=()=>state.cases.find(c=>String(c.id)===state.caseId)||state.detail?.case||null;
  function renderCases(){const host=$('cases');host.innerHTML=state.cases.length?state.cases.map(c=>`<button class="case ${String(c.id)===state.caseId?'active':''}" data-case="${esc(c.id)}"><strong>${esc(c.displayName)}</strong><small>${esc(c.scenarioCode)} · ${esc(c.scenarioType)}${c.assignedEmployees!=null?` · ${esc(c.assignedEmployees)} assigned`:''}</small></button>`).join(''):'<div class="empty">No practice cases are assigned yet.</div>';}
  function valueList(title,items){return arr(items).length?`<div class="section"><h3>${esc(title)}</h3><div class="chips">${arr(items).map(v=>`<span class="chip">${esc(typeof v==='string'?v:JSON.stringify(v))}</span>`).join('')}</div></div>`:'';}
  function renderChart(){const c=state.detail?.case;if(!c){$('main').innerHTML='<div class="empty">Choose a practice case to open the training chart.</div>';return;}const s=seed();const entries=arr(state.detail.entries);$('main').innerHTML=`<div class="headline"><div><span class="pill">${esc(c.scenarioCode)} · TRAINING ONLY</span><h1>${esc(c.displayName)}</h1><p>${esc(c.description)}</p></div><a class="btn" href="/spire.html">Return to Live SPIRE</a></div><div class="critical">${esc(s.banner||'TRAINING CHART — NOT A REAL CLIENT/PATIENT — DO NOT BILL')}</div><div class="grid"><div><section class="card"><div class="card-head"><h2>Practice Chart</h2><span class="pill">Billable: NO</span></div><div class="card-body"><div class="facts"><div class="fact"><span>Date of birth</span><strong>${esc(c.dateOfBirth?new Date(c.dateOfBirth).toLocaleDateString():'Training case')}</strong></div><div class="fact"><span>Scenario</span><strong>${esc(c.scenarioType)}</strong></div><div class="fact"><span>Mobility</span><strong>${esc(s.mobility||'See scenario')}</strong></div><div class="fact"><span>Communication / Oxygen</span><strong>${esc(s.communication||s.oxygen||'See scenario')}</strong></div></div>${valueList('Diagnoses',s.diagnoses)}${valueList('Allergies',s.allergies)}${valueList('Risks / Precautions',s.risks)}${valueList('Expected tasks',s.expectedTasks)}${arr(s.medications).length?`<div class="section"><h3>Practice Medications</h3><div class="card">${arr(s.medications).map(m=>`<div class="med"><strong>${esc(m.name)}</strong> · ${esc(m.dose)} ${esc(m.route||'')} <span class="chip">${esc(arr(m.schedule).join(', '))}</span></div>`).join('')}</div></div>`:''}${s.trip?`<div class="section"><h3>Practice Trip</h3><div class="fact"><strong>${esc(JSON.stringify(s.trip,null,2))}</strong></div></div>`:''}${valueList('Flowsheet rows',s.flowsheet)}${valueList('Safety checklist',s.safetyChecklist)}</div></section><section class="card" style="margin-top:16px"><div class="card-head"><h2>Practice Documentation History</h2><span class="pill">${entries.length} entries</span></div><div class="card-body"><div class="timeline">${entries.length?entries.map(e=>`<div class="entry"><div class="entry-head"><strong>${esc(e.entryType)}</strong><small>${esc(fmt(e.createdAt))}</small></div><div class="payload">${esc(formatPayload(e.payload))}</div></div>`).join(''):'<div class="empty">No practice documentation yet.</div>'}</div></div></section></div><aside><section class="card"><div class="card-head"><h2>Document Practice</h2></div><div class="card-body"><form id="entryForm" class="entry-form"><div class="field"><label>Entry type</label><select id="entryType"><option value="VITALS">Vitals / PCT flowsheet</option><option value="MAR">Medication administration</option><option value="PROGRESS_NOTE">Progress note</option><option value="ASSESSMENT">Assessment</option><option value="FLOWSHEET">Flowsheet</option><option value="INCIDENT">Incident</option><option value="TASK">Task completion</option><option value="TRANSPORT">Transport documentation</option><option value="COMMUNICATION">Communication</option></select></div><div id="entryFields"></div><button class="btn primary" type="submit">Sign training entry</button></form></div></section></aside></div>`;wireEntryForm();$('resetCase').disabled=!state.admin;}
  function formatPayload(p){if(!p||typeof p!=='object')return String(p||'');return Object.entries(p).map(([k,v])=>`${k}: ${Array.isArray(v)?v.join(', '):typeof v==='object'?JSON.stringify(v):v}`).join('\n');}
  function renderEntryFields(){const type=$('entryType')?.value||'VITALS';const host=$('entryFields');if(!host)return;if(type==='VITALS'||type==='FLOWSHEET'){host.innerHTML=`<div class="row"><div class="field"><label>Temperature °F</label><input id="fTemp" type="number" step="0.1"></div><div class="field"><label>Weight lb</label><input id="fWeight" type="number" step="0.1"></div></div><div class="row"><div class="field"><label>Blood pressure</label><input id="fBp" placeholder="120/80"></div><div class="field"><label>Pulse</label><input id="fPulse" type="number"></div></div><div class="row"><div class="field"><label>Respirations</label><input id="fResp" type="number"></div><div class="field"><label>SpO₂ %</label><input id="fSpo2" type="number"></div></div><div class="field"><label>Additional flowsheet observations</label><textarea id="fNote"></textarea></div>`;return;}if(type==='MAR'){const meds=arr(seed().medications);host.innerHTML=`<div class="field"><label>Medication</label><select id="fMedication">${meds.map(m=>`<option value="${esc(m.name)}">${esc(m.name)} — ${esc(m.dose)}</option>`).join('')||'<option>Practice medication</option>'}</select></div><div class="row"><div class="field"><label>Status</label><select id="fMarStatus"><option>GIVEN</option><option>REFUSED</option><option>HELD</option><option>MISSED</option><option>NOT_AVAILABLE</option></select></div><div class="field"><label>Administration time</label><input id="fTime" type="time"></div></div><div class="field"><label>Note / reason</label><textarea id="fNote"></textarea></div>`;return;}if(type==='TRANSPORT'){host.innerHTML=`<div class="field"><label>Trip status</label><select id="fTransport"><option>ARRIVED_FOR_PICKUP</option><option>RIDER_ON_BOARD</option><option>ARRIVED_DESTINATION</option><option>COMPLETED</option><option>NO_SHOW</option><option>INCIDENT</option></select></div><div class="field"><label>Safety / handoff note</label><textarea id="fNote" required></textarea></div>`;return;}host.innerHTML=`<div class="field"><label>Practice documentation</label><textarea id="fNote" required placeholder="Enter a complete training ${esc(type.toLowerCase().replaceAll('_',' '))}..."></textarea></div>`;}
  function payloadForType(){const type=$('entryType').value;if(type==='VITALS'||type==='FLOWSHEET')return{temperature:$('fTemp').value||null,weight:$('fWeight').value||null,bloodPressure:$('fBp').value||null,pulse:$('fPulse').value||null,respirations:$('fResp').value||null,spo2:$('fSpo2').value||null,note:$('fNote').value||null};if(type==='MAR')return{medication:$('fMedication').value,status:$('fMarStatus').value,administrationTime:$('fTime').value||null,note:$('fNote').value||null};if(type==='TRANSPORT')return{tripStatus:$('fTransport').value,note:$('fNote').value};return{note:$('fNote').value};}
  function wireEntryForm(){$('entryType').onchange=renderEntryFields;renderEntryFields();$('entryForm').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;button.textContent='Signing…';try{await api(`/api/spire/training/cases/${encodeURIComponent(state.caseId)}/entries`,{method:'POST',body:JSON.stringify({entryType:$('entryType').value,payload:payloadForType()})});await openCase(state.caseId);}catch(err){alert(err.message);}finally{button.disabled=false;button.textContent='Sign training entry';}};}
  async function openCase(id){state.caseId=String(id);renderCases();$('main').classList.add('loading');try{state.detail=await api(`/api/spire/training/cases/${encodeURIComponent(id)}`);renderChart();}catch(e){$('main').innerHTML=`<div class="empty">${esc(e.message)}</div>`;}finally{$('main').classList.remove('loading');}}
  async function load(){if(!token()){location.href='/employee-login.html?returnTo=/spire-training.html';return;}await window.SulandraEntityContext?.ready;try{let cases;try{cases=await api('/api/admin/spire/training/cases');state.admin=true;state.employees=await api('/api/admin/employments').catch(()=>[]);}catch(e){if(e.status!==403)throw e;cases=await api('/api/spire/training/cases');state.admin=false;}state.cases=arr(cases);$('adminBox').hidden=!state.admin;if(state.admin){$('employeeSelect').innerHTML='<option value="">Select employee…</option>'+arr(state.employees).filter(e=>['ACTIVE','LEAVE'].includes(String(e.status))).map(e=>`<option value="${esc(e.userId)}">${esc(e.email||e.userId)}${e.jobTitle?` — ${esc(e.jobTitle)}`:''}</option>`).join('');}renderCases();if(state.cases.length)await openCase(state.cases[0].id);}catch(e){$('cases').innerHTML=`<div class="empty">${esc(e.message)}</div>`;}}
  document.addEventListener('click',e=>{const c=e.target.closest('[data-case]');if(c)openCase(c.dataset.case);});$('employeeSelect').onchange=()=>{$('assignCase').disabled=!$('employeeSelect').value||!state.caseId;};$('assignCase').onclick=async()=>{if(!state.caseId||!$('employeeSelect').value)return;try{await api(`/api/admin/spire/training/cases/${encodeURIComponent(state.caseId)}/assignments`,{method:'POST',body:JSON.stringify({userId:$('employeeSelect').value,active:true})});alert('Training case assigned to the selected employee.');await load();}catch(e){alert(e.message);}};$('resetCase').onclick=async()=>{if(!state.caseId||!confirm('Reset all practice documentation for this training case? This does not affect any live clinical record.'))return;try{await api(`/api/admin/spire/training/cases/${encodeURIComponent(state.caseId)}/reset`,{method:'POST',body:'{}'});await openCase(state.caseId);}catch(e){alert(e.message);}};window.addEventListener('sulandra:entity-context-changed',()=>location.reload());load();
})();
</script>
</body>
</html>
