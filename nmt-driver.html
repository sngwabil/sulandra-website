<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>My NMT Trips | Sulandra Health</title><link rel="icon" href="/favicon.ico"><style>
*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",Arial,sans-serif;background:#edf3f7;color:#173b52}button,input,textarea{font:inherit}.top{display:flex;align-items:center;gap:14px;padding:12px 16px;background:#fff;border-bottom:1px solid #d5e1e8}.top img{width:210px;max-width:55vw}.top .spacer{flex:1}.top a{color:#075985;text-decoration:none;font-weight:900}.shell{width:min(900px,calc(100% - 18px));margin:15px auto 46px}.hero{margin-bottom:12px}.hero h1{margin:0;color:#0b4265}.hero p{margin:5px 0;color:#687c89}.notice{padding:10px 12px;border-radius:9px;background:#eef8fc;border:1px solid #c8e0ec;color:#42667a;font-size:12px;margin-bottom:11px}.trip{background:#fff;border:1px solid #d4e1e8;border-radius:14px;box-shadow:0 8px 24px rgba(17,55,79,.06);margin-bottom:12px;overflow:hidden}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:14px 15px;border-bottom:1px solid #e3e9ed}.head h2{margin:0;color:#174a69;font-size:19px}.body{padding:15px}.status{display:inline-flex;padding:4px 8px;border-radius:999px;background:#e9f2f7;color:#42647a;font-size:10px;font-weight:950}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.fact{border:1px solid #e0e8ed;background:#fafcfd;border-radius:9px;padding:9px}.fact span{display:block;font-size:10px;font-weight:950;text-transform:uppercase;color:#7a8b96}.fact strong{display:block;margin-top:4px;color:#29516a;word-break:break-word}.section{margin-top:12px}.section h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;color:#697f8d}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.btn{border:1px solid #0b6ea8;background:#fff;color:#0b6ea8;border-radius:9px;padding:10px 12px;font-weight:900;cursor:pointer}.btn.primary{background:#0b6ea8;color:#fff}.btn.success{border-color:#43845a;background:#eff9f2;color:#2e6b43}.btn.warn{border-color:#aa7629;color:#7c5516}.btn.danger{border-color:#b2544d;color:#91362f}.empty{padding:38px;text-align:center;color:#758792}.error{display:none;padding:10px 12px;background:#fff0ef;border:1px solid #efb4af;color:#8b312b;border-radius:9px;margin-bottom:10px}.error.show{display:block}dialog{width:min(620px,calc(100vw - 20px));border:0;border-radius:15px;padding:0;box-shadow:0 30px 90px rgba(0,0,0,.3)}dialog::backdrop{background:rgba(8,28,42,.55)}.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #e2e8ec}.modal-head h2{margin:0;color:#0b4265}.modal-body{padding:16px}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}.field label{font-size:12px;font-weight:900;color:#486579}.field input,.field textarea{width:100%;border:1px solid #c7d6df;border-radius:9px;padding:9px 10px}.field textarea{min-height:90px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:13px}@media(max-width:620px){.facts{grid-template-columns:1fr}.top a{display:none}.actions .btn{flex:1}}
</style></head><body>
<header class="top"><img src="/assets/mainlogo.png" alt="Sulandra Health"><span class="spacer"></span><a href="/employee-portal.html">Employee Portal</a></header><main class="shell"><div class="hero"><h1>My NMT Trips</h1><p>Assigned transportation trips and driver workflow.</p></div><div class="notice">Only trips linked to your NMT driver profile appear here. Status changes are recorded in the trip audit timeline.</div><div id="trips"><div class="empty">Loading assigned trips…</div></div></main>
<dialog id="statusDialog"><div class="modal-head"><h2 id="statusTitle">Update Trip</h2><button class="btn" data-close="statusDialog">Close</button></div><div class="modal-body"><div id="statusError" class="error"></div><div class="field"><label>Odometer (optional)</label><input id="odometer" type="number" min="0" step="0.1"></div><div class="field"><label>Notes / reason</label><textarea id="tripNotes"></textarea></div><div class="modal-actions"><button id="statusSubmit" class="btn primary">Save Status</button></div></div></dialog>
<script src="/assets/sulandra-entity-context.js?v=20260809-company-scope-1"></script><script>
(()=>{'use strict';const API='https://sulandra-website-production-5fc4.up.railway.app',KEYS=['sulandra:employee:access-token','sulandra_token','token','accessToken'];const token=()=>KEYS.map(k=>sessionStorage.getItem(k)||localStorage.getItem(k)).find(Boolean)||'';const state={trips:[],trip:null,nextStatus:''};const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=v=>v?new Date(String(v)).toLocaleString():'—';async function api(path,options={}){const r=await fetch(API+path,{...options,cache:'no-store',headers:{Accept:'application/json',...(token()?{Authorization:`Bearer ${token()}`} : {}),...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}});const p=await r.json().catch(()=>({}));if(!r.ok)throw new Error(p.error||p.message||`Request failed (${r.status})`);return p.data??p}
const transitions={SCHEDULED:['DISPATCHED','CANCELLED'],DISPATCHED:['EN_ROUTE_TO_PICKUP','CANCELLED'],EN_ROUTE_TO_PICKUP:['ARRIVED_PICKUP','CANCELLED'],ARRIVED_PICKUP:['RIDER_ON_BOARD','NO_SHOW','CANCELLED'],RIDER_ON_BOARD:['EN_ROUTE_TO_DESTINATION'],EN_ROUTE_TO_DESTINATION:['ARRIVED_DESTINATION'],ARRIVED_DESTINATION:['COMPLETED']};const labels={DISPATCHED:'Dispatch / Start Trip',EN_ROUTE_TO_PICKUP:'En Route to Pickup',ARRIVED_PICKUP:'Arrived at Pickup',RIDER_ON_BOARD:'Rider On Board',EN_ROUTE_TO_DESTINATION:'Depart Pickup',ARRIVED_DESTINATION:'Arrived at Destination',COMPLETED:'Complete Trip',NO_SHOW:'Rider No-Show',CANCELLED:'Cancel Trip'};
function address(prefix,t){return [t[`${prefix}Name`],t[`${prefix}UnitRoom`],t[`${prefix}Street`],t[`${prefix}City`],t[`${prefix}State`],t[`${prefix}PostalCode`]].filter(Boolean).join(' · ')}function render(){const host=$('trips');if(!state.trips.length){host.innerHTML='<div class="empty">No active trips are assigned to your driver profile.</div>';return}host.innerHTML=state.trips.map(t=>`<section class="trip"><div class="head"><div><h2>${esc(t.riderFirstName)} ${esc(t.riderLastName)}</h2><div class="meta">${esc(t.tripNumber)} · ${esc(fmt(t.scheduledPickupAt))}</div></div><span class="status">${esc(String(t.status).replaceAll('_',' '))}</span></div><div class="body"><div class="facts"><div class="fact"><span>Pickup</span><strong>${esc(address('pickup',t))}</strong></div><div class="fact"><span>Destination</span><strong>${esc(address('dropoff',t))}</strong></div><div class="fact"><span>Vehicle</span><strong>${esc(t.vehicleNumber||'Unassigned')}</strong></div><div class="fact"><span>Service Level</span><strong>${esc(t.serviceLevel||'—')}</strong></div></div><div class="section"><h3>Trip Actions</h3><div class="actions">${(transitions[t.status]||[]).map(s=>`<button class="btn ${s==='COMPLETED'?'success':s==='CANCELLED'||s==='NO_SHOW'?'danger':'primary'}" data-trip="${esc(t.id)}" data-status="${esc(s)}">${esc(labels[s]||s)}</button>`).join('')||'<span class="status">No further action</span>'}</div></div></div></section>`).join('');document.querySelectorAll('[data-trip][data-status]').forEach(b=>b.onclick=()=>openStatus(b.dataset.trip,b.dataset.status))}
function openStatus(id,status){state.trip=state.trips.find(t=>String(t.id)===String(id));state.nextStatus=status;$('statusTitle').textContent=labels[status]||status;$('odometer').value='';$('tripNotes').value='';$('statusError').classList.remove('show');$('statusDialog').showModal()}
$('statusSubmit').onclick=async()=>{const box=$('statusError'),b=$('statusSubmit');box.classList.remove('show');b.disabled=true;try{const notes=$('tripNotes').value||null,reason=['CANCELLED','NO_SHOW'].includes(state.nextStatus)?notes:null;await api(`/api/nmt/trips/${encodeURIComponent(state.trip.id)}/status`,{method:'POST',body:JSON.stringify({status:state.nextStatus,notes,reason,odometer:$('odometer').value?Number($('odometer').value):null})});$('statusDialog').close();await load()}catch(e){box.textContent=e.message;box.classList.add('show')}finally{b.disabled=false}};document.addEventListener('click',e=>{const c=e.target.closest('[data-close]');if(c)$(c.dataset.close)?.close()});async function load(){state.trips=await api('/api/nmt/my-trips');render()}window.addEventListener('sulandra:entity-context-changed',()=>location.reload());(async()=>{if(!token()){location.href='/employee-login.html?returnTo=/nmt-driver.html';return}await window.SulandraEntityContext?.ready;await load()})().catch(e=>{$('trips').innerHTML=`<div class="empty">${esc(e.message)}</div>`})})();
</script></body></html>
